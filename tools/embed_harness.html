<!doctype html><meta charset="utf-8"><title>embed harness</title>
<style>html,body{margin:0;background:#222}iframe{border:0;width:390px;height:844px;display:block}</style>
<iframe id="f"></iframe>
<script>
// Plays the app's part for tools/embed_win_check.js: loads lab/<page>.html as the shell does and records its messages.
window.__msgs = [];
addEventListener('message', e => {
  const d = e.data; if (!d || !d.fth) return;
  __msgs.push({ t: performance.now(), type: d.type, id: d.id, moves: d.moves, won: d.won });
  if (d.type === 'ready' && window.__tokens) e.source.postMessage({ fth: 1, cmd: 'tokens', vars: window.__tokens }, '*');
});
const q = new URLSearchParams(location.search);
document.getElementById('f').src = '../lab/' + q.get('page') + '.html?lvl=' + encodeURIComponent(q.get('lvl')) + '&embed=1&hud=' + (q.get('hud') || 'full');
</script>
