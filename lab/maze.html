<!doctype html>
<!--
  THE LAB MAZE (lab front end: the pure state graph, walked by a lab rat)

  What the player sees: a scientist's rat maze on a black lab bench, seen in a 3/4 view from someone leaning over it.
  A plywood base board holds dozens of little walled rooms (acrylic walls with visible height and soft shadows),
  joined by narrow corridors. A desk lamp, a clipboard and a pencil sit on the bench. A white lab rat sits in one room.
  Tap a door of its room (or the room behind it, or swipe / press an arrow key that way) and the rat scurries down the
  corridor to the next room. With the lab lights off you only see the rooms the rat has already been in, plus the
  doors of the room it is in now; switch the lights on to see the whole maze.

  Every room has a stable identity so it can be learned like a real place: a strip of five floor tiles (the five rim
  elements of that state, in rim order, in the LAB.ELEM colours), a wall tint and one object (plant, flask, books,
  mug, cactus, globe, duck, test tubes, clock, microscope), all chosen from the state itself. Rooms where the hole
  can be filled are goal rooms: a glowing pad on the floor, and the cheese sits on one of them.

  Two modes (the chip at the top left):
    Coins            Pac-Man: a coin in every room of the maze (goal rooms too), and a cheese bonus in every goal room:
                     10 + 10 x (best possible steps) - 5 x (extra steps taken), at least 10. Then the scientist's
                     gloved hand lifts the rat out and drops it into another room (one it has seen, or any room with
                     the lights on) for a new run, so the way to a fill gets learned from many starting points. The bar
                     shows coins banked, coins left, steps this run and the best possible from where the run began
                     (the true distance to a fill, a BFS in the maze with goal rooms terminal).
    Find the cheese  the cheese waits in a goal room exactly n steps from the start (n = the level's par; "Farther"
                     picks a deeper goal room if the maze has one). Its glow shows through the dark, the way does not.
                     Score: steps against the shortest route, stars as in the main game (par, par + 2).
  Rooms the rat has seen stay mapped (per level, in localStorage), so the coin round teaches the layout and the
  cheese round tests it. "Forget map and memory" in the mode menu clears it.

  The rat's memory (the route button on the right rail, M): every room remembers the fewest steps to a fill the player
  has actually found from it, over corridors actually walked: a Bellman fixed point (backwards BFS from the fills
  reached, won rooms terminal) over walked edges only, saved with the map. Shown as a gold number on the floor and a
  gold arrow at the door that leads that way.

  The self-training rat (the curve button, T): tabular Q-learning over rooms x doors. Reward -1 per corridor, a fill ends
  the episode, Q starts at 0 (optimistic), epsilon 0.2, alpha 0.5, episodes from random rooms that can reach a fill. A
  ghost rat walks the episodes (speed: slow, fast, max). The panel shows episodes and the share of rooms whose greedy
  door is a shortest-route door (one that lowers the true distance to a fill by one); arrows are blue when right,
  orange when not yet. It learns every room in a few hundred to a few thousand episodes (tidy-trap ~500, kempes-double
  ~1,000-1,700, deepest-pit ~2,000-4,300). But a table only memorises this one maze. The interesting question for the proof is
  whether a policy over FEATURES of the colouring (rim pattern, chain counts, locks, which chains touch the rim) can
  learn the same moves and carry them over to other maps; that is not built here.

  Mapping (faithful: the maze IS the puzzle's state graph):
    room                  = a legal colouring of the map up to renaming the elements (core.js canon), reachable
                            from the level start. Room 0 (the nest) is the level's start.
    door + corridor       = a Kempe swap of a non-web chain between the two colourings (swapping a chain twice
                            undoes it, so every corridor runs both ways). Web chains only rename, so they are not doors.
    goal room / cheese    = a won colouring (the rim uses <= 3 elements). The game never continues from a won
                            colouring, so goal rooms are dead ends: the rat only steps in and out (coins mode), or
                            stops there for good (the cheese).
    floor tiles           = the rim's five elements in that colouring (a won room shows only three).
    walking a corridor    = one g.swap(K): the page finds the chain K in g.chains whose swap leads to the target
                            room's colouring, so the hidden LAB.game() instance always holds the rat's room
                            (g.canon() === room key). Undo walks back along the last corridor (g.undo()).
                            Stepping into a goal room that is not the cheese does NOT touch g (the rat backs out,
                            the state never changes), so the app only ever sees a win at the cheese.
    "peek"                = a small inset with the actual map (g.pos, g.edges) in the current colouring, drawn in
                            the room's own tile colours.
  The maze is the state graph computed here from levels.js: a BFS from the start over Kempe swaps, not expanding
  won states. Small levels (<= 160 states, e.g. tidy-trap, round-and-round, archipelago, first-flip, spark) are
  shown whole; bigger ones are cut at radius par + 2 and at most 300 rooms (all edges between the kept rooms stay).

  Layout: a seeded force-directed layout of the state graph (BFS depth rings as the start, deterministic per level)
  is snapped onto a grid (start room at the centre cell, nearest free cell, then local moves and swaps that shorten
  the corridors). Corridors run through the streets between rooms: door -> street lane -> cross street lane -> door
  (an L through the streets), each street segment on its own lane where possible. Where two corridors cross, the one
  running east-west is drawn as a raised bridge over the other.

  Controls: tap a door / corridor / neighbouring room; keys 1-9 walk the numbered doors (clockwise from the top);
  an arrow key or swipe takes the only door within 60 degrees of that way, or, if there are several, highlights the
  nearest one, the same direction again cycles through them, Enter / Space / a tap walks the highlighted door;
  drag to pan, pinch or wheel to zoom, 0 or a double tap to recentre; U / Backspace undo, R restart, L lights,
  P peek. Embedding: ?embed=1 starts in cheese mode at par and calls LAB.done() after the celebration.
-->

<script>
(function () {
  'use strict';
  /*PURE*/
  function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---- the state graph: canonical colourings reachable from the start by non-web Kempe swaps ----
  function stateGraph(GAME, L, opt) {
    opt = opt || {};
    const Gr = GAME.graphs[L.g], n = Gr.n, hole = Gr.hole, rim = Gr.link.slice(), NC = Gr.ncol || 4, goal = Gr.goal || 3;
    const adj = Array.from({ length: n }, () => []);
    Gr.edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const canon = c => { const mp = {}; let s = '', k = 0; for (let u = 0; u < n; u++) { if (u === hole) continue; if (!(c[u] in mp)) mp[c[u]] = k++; s += mp[c[u]]; } return s; };
    const isWon = c => new Set(rim.map(x => c[x])).size <= goal;
    function chainsOf(c) {
      const out = [];
      for (let a = 0; a < NC; a++) for (let b = a + 1; b < NC; b++) {
        const seen = new Uint8Array(n), mine = [];
        for (let s = 0; s < n; s++) {
          if (s === hole || seen[s] || (c[s] !== a && c[s] !== b)) continue;
          const vs = [s]; seen[s] = 1;
          for (let i = 0; i < vs.length; i++) for (const w of adj[vs[i]]) if (w !== hole && !seen[w] && (c[w] === a || c[w] === b)) { seen[w] = 1; vs.push(w); }
          mine.push(vs);
        }
        if (mine.length > 1) mine.forEach(vs => out.push({ a, b, vs }));   // exactly one component = a web: only renames
      }
      return out;
    }
    const flip = (c, K) => { const d = c.slice(); K.vs.forEach(u => { d[u] = d[u] === K.a ? K.b : K.a; }); return d; };
    const start = L.start.slice(); start[hole] = -1;
    function bfs(R, cap) {
      const nodes = [], idx = new Map(); let truncated = false;
      const add = (c, d) => { const key = canon(c); idx.set(key, nodes.length); nodes.push({ key, c, d, won: isWon(c) }); };
      add(start, 0);
      for (let qi = 0; qi < nodes.length; qi++) {
        const N = nodes[qi]; if (N.won || N.d >= R) continue;
        for (const K of chainsOf(N.c)) {
          const d = flip(N.c, K), key = canon(d);
          if (idx.has(key)) continue;
          if (nodes.length >= cap) { truncated = true; continue; }
          add(d, N.d + 1);
        }
      }
      return { nodes, idx, truncated };
    }
    const WHOLE = opt.whole || 160, CAP = opt.cap || 300, R0 = opt.R != null ? opt.R : L.par + 2;
    let res = bfs(Infinity, WHOLE), whole = !res.truncated;
    if (!whole) res = bfs(R0, CAP);
    const { nodes, idx } = res, edges = [], nb = nodes.map(() => []), seen = new Set();
    nodes.forEach((N, i) => {   // the induced subgraph: every swap between two kept rooms is a corridor
      N.rimCols = rim.map(x => N.c[x]);
      if (N.won) return;
      for (const K of chainsOf(N.c)) {
        const j = idx.get(canon(flip(N.c, K)));
        if (j === undefined || j === i) continue;
        const pk = i < j ? i + ',' + j : j + ',' + i;
        if (seen.has(pk)) continue;
        seen.add(pk); nb[i].push({ to: j, e: edges.length }); nb[j].push({ to: i, e: edges.length }); edges.push([i, j]);
      }
    });
    return { n, hole, rim, NC, goal, adj, nodes, idx, edges, nb, whole, R: whole ? null : R0, canon, chainsOf, flip, isWon };
  }

  // ---- layout: force-directed, snapped to a grid, then polished by local moves ----
  function layoutMaze(SG, seed, init) {
    const N = SG.nodes.length, nb = SG.nb, R = rng(seed);
    let px = new Float64Array(N), py = new Float64Array(N), ang = new Float64Array(N);
    const byD = {}; SG.nodes.forEach((v, i) => { (byD[v.d] = byD[v.d] || []).push(i); });
    for (let i = 1; i < N; i++) {
      const d = SG.nodes[i].d, par = nb[i].map(x => x.to).filter(j => SG.nodes[j].d === d - 1).sort((a, b) => a - b)[0];
      if (d === 1 || par === undefined || par === 0) { const k = byD[d].indexOf(i); ang[i] = 2 * Math.PI * (k + R() * 0.5) / byD[d].length; }
      else ang[i] = ang[par] + (R() - 0.5) * 2.2 / d;
      px[i] = Math.cos(ang[i]) * d; py[i] = Math.sin(ang[i]) * d;
    }
    const fx = new Float64Array(N), fy = new Float64Array(N), IT = init ? 0 : N > 200 ? 220 : 300;
    if (init) { const P = init(SG, seed); px = P.x; py = P.y; const x0 = px[0], y0 = py[0]; for (let i = 0; i < N; i++) { px[i] -= x0; py[i] -= y0; } }
    for (let it = 0; it < IT; it++) {
      const temp = 0.5 * (1 - it / IT) + 0.02;
      fx.fill(0); fy.fill(0);
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        let dx = px[i] - px[j], dy = py[i] - py[j], d2 = dx * dx + dy * dy;
        if (d2 < 1e-6) { dx = (R() - 0.5) * 0.01; dy = (R() - 0.5) * 0.01; d2 = 1e-4; }
        if (d2 > 36) continue;
        const f = 1 / d2; fx[i] += dx * f; fy[i] += dy * f; fx[j] -= dx * f; fy[j] -= dy * f;
      }

  const stopP = el => el.addEventListener('pointerdown', ev => { ev.stopPropagation(); audioOn(); });
  ['lights', 'peek', 'undo', 'again', 'mode', 'memory', 'train', 'tSpeed', 'tStop'].forEach(id => stopP($(id)));
  $('memory').onclick = toggleMemory;
  $('train').onclick = () => (training ? stopTraining() : startTraining());
  $('tSpeed').onclick = () => { tSpeed = (tSpeed + 1) % 3; gstep = null; trainReadout(); };
  $('tStop').onclick = () => { if (tDoneAt) { $('trainBox').classList.remove('on'); cam.free = false; cam.z = zBase; return; } training ? stopTraining() : startTraining(); };
  $('lights').onclick = toggleLights; $('peek').onclick = togglePeek; $('undo').onclick = undo; $('again').onclick = () => { closeMenu(); restart(); };
  function closeMenu() { $('menu').classList.remove('on'); }
  $('mCoins').innerHTML = ICO.coin + 'Coins';
  $('mForget').innerHTML = ICO.erase + 'Forget';
  function menuCounts() {
    const deeper = wonDepths.find(d => d > cheeseN);
    $('mCheese').innerHTML = ICO.cheese + '<b>' + (cheeseN === undefined ? '-' : cheeseN) + '</b>';
    $('mFar').innerHTML = ICO.cheese2 + '<b>' + (deeper !== undefined ? deeper : '-') + '</b>';
    $('mFar').disabled = IN_APP || deeper === undefined;
    $('mCheese').setAttribute('aria-label', `Find the cheese, ${cheeseN} rooms from the nest`);
    $('mFar').setAttribute('aria-label', deeper !== undefined ? `Farther cheese, ${deeper} rooms from the nest` : 'No farther cheese');
  }
  menuCounts();
  $('mode').onclick = () => {
    const m = $('menu'); if (m.classList.contains('on')) return closeMenu();
    if (locked()) return;
    $('mCoins').classList.toggle('cur', mode === 'coins'); $('mCheese').classList.toggle('cur', mode === 'cheese');
    menuCounts();
    m.classList.add('on');
  };
  $('mCoins').onclick = () => setMode('coins');
  $('mCheese').onclick = () => setMode('cheese');
  $('mFar').onclick = farther;
  $('mForget').onclick = () => { if (locked()) return; mapped = new Set([0]); [...path.map(p => p.to), cur].forEach(i => mapped.add(i)); walked = new Set(); found = new Set(); recomputeMem(); save(); closeMenu(); hud(); toast('Map forgotten.'); };

  // ---------------------------------------------------------------- size
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    TOP = 50; zBase = clamp(Math.min(W / 1.3, (H - TOP) / 2.3), 80, 320); if (!winCam) cam.z = zBase;
  }
  addEventListener('resize', resize);
  resize();
  cam.x = rat.x; cam.y = rat.y;
  restart(true);
  toast(mode === 'coins' ? 'Grab the coins.' : 'Cheese ' + DC[0] + ' rooms away.');
  lastIn = now();
  g.on((_, info) => { if (!selfOp) extSync(info); });
  window.__maze = {
    g, M, state: () => ({ cur, key: NODES[cur].key, gcanon: g.canon(), steps, mode, cheese, cheeseN, finished, anim: !!anim, coins: coins.size, mapped: mapped.size, path: path.length }),
    walk, undo, restart, setMode, farther, startTraining, stopTraining, toggleMemory, dirPress, doorOrder: () => doorOrder(cur).map(x => ({ e: x.e, to: x.to })),
    doorsInDir: (dx, dy) => doorsInDir(dx, dy).map(x => x.e), trainer: () => trainer, run: () => ({ bank, runStart, runSteps, runs, best: DF[runStart], memKnown: mem.filter(x => x < Infinity).length, sel, memView, training, tDoneAt }), DF, setSpeed: v => { tSpeed = v; }, incident: () => incident(cur).map(x => ({ e: x.e, to: x.to })), toggleLights, togglePeek,
    finishAnim, NODES, routes, dbg: () => ({ cam, rat, cell: cell[cur] }), proj: (x, y) => [SX(x), SY(y)], cell,
    juice: () => ({ crumb, nibble: !!nibble, eggPaid, winT, tileFx: !!tileFx, flyouts: flyouts.length, firstInput, DC: DC[cur] }), idle: ms => { lastIn = now() - ms; }, crumbAt: () => crumb && [SX(crumb.x), SY(crumb.y)],
  };
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
