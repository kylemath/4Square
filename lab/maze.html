<!doctype html>
<!--
  THE LAB MAZE (lab front end: the pure state graph, walked by a lab rat)

  What the player sees: a scientist's rat maze on a black lab bench, seen in a 3/4 view from someone leaning over it.
  A plywood base board holds dozens of little walled rooms (acrylic walls with visible height and soft shadows),
  joined by narrow corridors. A desk lamp, a clipboard and a pencil sit on the bench. A white lab rat sits in one room.
  Tap a door of its room (or the room behind it, or swipe / press an arrow key that way) and the rat scurries down the
  corridor to the next room. With the lab lights off you only see the rooms the rat has already been in, plus the
  doors of the room it is in now; switch the lights on to see the whole maze.

  Every room has a stable identity so it can be learned like a real place: a strip of five floor tiles (the five rim
  elements of that state, in rim order, in the LAB.ELEM colours), a wall tint and one object (plant, flask, books,
  mug, cactus, globe, duck, test tubes, clock, microscope), all chosen from the state itself. Rooms where the hole
  can be filled are goal rooms: a glowing pad on the floor, and the cheese sits on one of them.

  Two modes (the chip at the top left):
    Coins            Pac-Man: a coin in every room of the maze (goal rooms too). Walking into a goal room grabs its
                     coin and the rat backs straight out again. Collect them all. Coins left and steps are shown.
    Find the cheese  the cheese waits in a goal room exactly n steps from the start (n = the level's par; "Farther"
                     picks a deeper goal room if the maze has one). Its glow shows through the dark, the way does not.
                     Score: steps against the shortest route, stars as in the main game (par, par + 2).
  Rooms the rat has seen stay mapped (per level, in localStorage), so the coin round teaches the layout and the
  cheese round tests it. "Forget map" in the mode menu clears it.

  Mapping (faithful: the maze IS the puzzle's state graph):
    room                  = a legal colouring of the map up to renaming the elements (core.js canon), reachable
                            from the level start. Room 0 (the nest) is the level's start.
    door + corridor       = a Kempe swap of a non-web chain between the two colourings (swapping a chain twice
                            undoes it, so every corridor runs both ways). Web chains only rename, so they are not doors.
    goal room / cheese    = a won colouring (the rim uses <= 3 elements). The game never continues from a won
                            colouring, so goal rooms are dead ends: the rat only steps in and out (coins mode), or
                            stops there for good (the cheese).
    floor tiles           = the rim's five elements in that colouring (a won room shows only three).
    walking a corridor    = one g.swap(K): the page finds the chain K in g.chains whose swap leads to the target
                            room's colouring, so the hidden LAB.game() instance always holds the rat's room
                            (g.canon() === room key). Undo walks back along the last corridor (g.undo()).
                            Stepping into a goal room that is not the cheese does NOT touch g (the rat backs out,
                            the state never changes), so the app only ever sees a win at the cheese.
    "peek"                = a small inset with the actual map (g.pos, g.edges) in the current colouring, drawn in
                            the room's own tile colours.
  The maze is the state graph computed here from levels.js: a BFS from the start over Kempe swaps, not expanding
  won states. Small levels (<= 160 states, e.g. tidy-trap, round-and-round, archipelago, first-flip, spark) are
  shown whole; bigger ones are cut at radius par + 2 and at most 300 rooms (all edges between the kept rooms stay).

  Layout: a seeded force-directed layout of the state graph (BFS depth rings as the start, deterministic per level)
  is snapped onto a grid (start room at the centre cell, nearest free cell, then local moves and swaps that shorten
  the corridors). Corridors run through the streets between rooms: door -> street lane -> cross street lane -> door
  (an L through the streets), each street segment on its own lane where possible. Where two corridors cross, the one
  running east-west is drawn as a raised bridge over the other.

  Controls: tap a door / corridor / neighbouring room; swipe; arrow keys (Tab picks a door, Enter walks it);
  drag to pan, pinch or wheel to zoom, 0 or a double tap to recentre; U / Backspace undo, R restart, L lights,
  P peek. Embedding: ?embed=1 starts in cheese mode at par and calls LAB.done() after the celebration.
-->

<script>
(function () {
  'use strict';
  /*PURE*/
  function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---- the state graph: canonical colourings reachable from the start by non-web Kempe swaps ----
  function stateGraph(GAME, L, opt) {
    opt = opt || {};
    const Gr = GAME.graphs[L.g], n = Gr.n, hole = Gr.hole, rim = Gr.link.slice(), NC = Gr.ncol || 4, goal = Gr.goal || 3;
    const adj = Array.from({ length: n }, () => []);
    Gr.edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    const canon = c => { const mp = {}; let s = '', k = 0; for (let u = 0; u < n; u++) { if (u === hole) continue; if (!(c[u] in mp)) mp[c[u]] = k++; s += mp[c[u]]; } return s; };
    const isWon = c => new Set(rim.map(x => c[x])).size <= goal;
    function chainsOf(c) {
      const out = [];
      for (let a = 0; a < NC; a++) for (let b = a + 1; b < NC; b++) {
        const seen = new Uint8Array(n), mine = [];
        for (let s = 0; s < n; s++) {
          if (s === hole || seen[s] || (c[s] !== a && c[s] !== b)) continue;
          const vs = [s]; seen[s] = 1;
          for (let i = 0; i < vs.length; i++) for (const w of adj[vs[i]]) if (w !== hole && !seen[w] && (c[w] === a || c[w] === b)) { seen[w] = 1; vs.push(w); }
          mine.push(vs);
        }
        if (mine.length > 1) mine.forEach(vs => out.push({ a, b, vs }));   // exactly one component = a web: only renames
      }
      return out;
    }
    const flip = (c, K) => { const d = c.slice(); K.vs.forEach(u => { d[u] = d[u] === K.a ? K.b : K.a; }); return d; };
    const start = L.start.slice(); start[hole] = -1;
    function bfs(R, cap) {
      const nodes = [], idx = new Map(); let truncated = false;
      const add = (c, d) => { const key = canon(c); idx.set(key, nodes.length); nodes.push({ key, c, d, won: isWon(c) }); };
      add(start, 0);
      for (let qi = 0; qi < nodes.length; qi++) {
        const N = nodes[qi]; if (N.won || N.d >= R) continue;
        for (const K of chainsOf(N.c)) {
          const d = flip(N.c, K), key = canon(d);
          if (idx.has(key)) continue;
          if (nodes.length >= cap) { truncated = true; continue; }
          add(d, N.d + 1);
        }
      }
      return { nodes, idx, truncated };
    }
    const WHOLE = opt.whole || 160, CAP = opt.cap || 300, R0 = opt.R != null ? opt.R : L.par + 2;
    let res = bfs(Infinity, WHOLE), whole = !res.truncated;
    if (!whole) res = bfs(R0, CAP);
    const { nodes, idx } = res, edges = [], nb = nodes.map(() => []), seen = new Set();
    nodes.forEach((N, i) => {   // the induced subgraph: every swap between two kept rooms is a corridor
      N.rimCols = rim.map(x => N.c[x]);
      if (N.won) return;
      for (const K of chainsOf(N.c)) {
        const j = idx.get(canon(flip(N.c, K)));
        if (j === undefined || j === i) continue;
        const pk = i < j ? i + ',' + j : j + ',' + i;
        if (seen.has(pk)) continue;
        seen.add(pk); nb[i].push({ to: j, e: edges.length }); nb[j].push({ to: i, e: edges.length }); edges.push([i, j]);
      }
    });
    return { n, hole, rim, NC, goal, adj, nodes, idx, edges, nb, whole, R: whole ? null : R0, canon, chainsOf, flip, isWon };
  }

  // ---- layout: force-directed, snapped to a grid, then polished by local moves ----
  function layoutMaze(SG, seed, init) {
    const N = SG.nodes.length, nb = SG.nb, R = rng(seed);
    let px = new Float64Array(N), py = new Float64Array(N), ang = new Float64Array(N);
    const byD = {}; SG.nodes.forEach((v, i) => { (byD[v.d] = byD[v.d] || []).push(i); });
    for (let i = 1; i < N; i++) {
      const d = SG.nodes[i].d, par = nb[i].map(x => x.to).filter(j => SG.nodes[j].d === d - 1).sort((a, b) => a - b)[0];
      if (d === 1 || par === undefined || par === 0) { const k = byD[d].indexOf(i); ang[i] = 2 * Math.PI * (k + R() * 0.5) / byD[d].length; }
      else ang[i] = ang[par] + (R() - 0.5) * 2.2 / d;
      px[i] = Math.cos(ang[i]) * d; py[i] = Math.sin(ang[i]) * d;
    }
    const fx = new Float64Array(N), fy = new Float64Array(N), IT = init ? 0 : N > 200 ? 220 : 300;
    if (init) { const P = init(SG, seed); px = P.x; py = P.y; const x0 = px[0], y0 = py[0]; for (let i = 0; i < N; i++) { px[i] -= x0; py[i] -= y0; } }
    for (let it = 0; it < IT; it++) {
      const temp = 0.5 * (1 - it / IT) + 0.02;
      fx.fill(0); fy.fill(0);
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        let dx = px[i] - px[j], dy = py[i] - py[j], d2 = dx * dx + dy * dy;
        if (d2 < 1e-6) { dx = (R() - 0.5) * 0.01; dy = (R() - 0.5) * 0.01; d2 = 1e-4; }
        if (d2 > 36) continue;
        const f = 1 / d2; fx[i] += dx * f; fy[i] += dy * f; fx[j] -= dx * f; fy[j] -= dy * f;
      }
      SG.edges.forEach(([a, b]) => { const dx = px[a] - px[b], dy = py[a] - py[b], d = Math.sqrt(dx * dx + dy * dy) || 1e-3, f = d * 0.9; fx[a] -= dx / d * f; fy[a] -= dy / d * f; fx[b] += dx / d * f; fy[b] += dy / d * f; });
      for (let i = 0; i < N; i++) { fx[i] -= px[i] * 0.03; fy[i] -= py[i] * 0.03; }
      for (let i = 1; i < N; i++) { const l = Math.hypot(fx[i], fy[i]) || 1, s = Math.min(l, temp) / l; px[i] += fx[i] * s; py[i] += fy[i] * s; }
      px[0] = py[0] = 0;   // the nest stays in the middle
    }
    let tot = 0; SG.edges.forEach(([a, b]) => { tot += Math.hypot(px[a] - px[b], py[a] - py[b]); });
    const sc = SG.edges.length ? 1.45 / (tot / SG.edges.length) : 1;
    const cell = new Array(N), occ = new Map(), K = (x, y) => x + ',' + y;
    const order = [...Array(N).keys()].sort((a, b) => (a === 0 ? -1 : b === 0 ? 1 : Math.hypot(px[a], py[a]) - Math.hypot(px[b], py[b])));
    for (const i of order) {
      const tx = px[i] * sc, ty = py[i] * sc, cx = Math.round(tx), cy = Math.round(ty);
      for (let r = 0; r < 60; r++) {
        let best = null, bd = Infinity;
        for (let x = cx - r; x <= cx + r; x++) for (let y = cy - r; y <= cy + r; y++) {
          if (Math.max(Math.abs(x - cx), Math.abs(y - cy)) !== r || occ.has(K(x, y))) continue;
          const d = Math.hypot(x - tx, y - ty); if (d < bd) { bd = d; best = [x, y]; }
        }
        if (best) { cell[i] = best; occ.set(K(best[0], best[1]), i); break; }
      }
    }
    const ec = (p, q) => { const m = Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]); return m === 1 ? 1 : m + 1.6 + (p[0] === q[0] || p[1] === q[1] ? 0.6 : 0); };
    const cost = v => { let s = 0.04 * Math.max(Math.abs(cell[v][0]), Math.abs(cell[v][1])); for (const { to } of nb[v]) s += ec(cell[v], cell[to]); return s; };
    for (let pass = 0; pass < 10; pass++) {
      let moved = 0;
      for (let v = 1; v < N; v++) {
        const cand = new Map(), push = (x, y) => cand.set(K(x, y), [x, y]);
        for (const { to } of nb[v]) { const [x, y] = cell[to]; push(x + 1, y); push(x - 1, y); push(x, y + 1); push(x, y - 1); }
        const [vx, vy] = cell[v]; for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (dx || dy) push(vx + dx, vy + dy);
        for (const [, c] of cand) {
          const w = occ.get(K(c[0], c[1]));
          if (w === 0 || w === v) continue;
          const old = cell[v];
          if (w === undefined) {
            const before = cost(v); cell[v] = c; const after = cost(v);
            if (after < before - 1e-9) { occ.delete(K(old[0], old[1])); occ.set(K(c[0], c[1]), v); moved++; } else cell[v] = old;
          } else {
            const before = cost(v) + cost(w); cell[v] = c; cell[w] = old; const after = cost(v) + cost(w);
            if (after < before - 1e-9) { occ.set(K(c[0], c[1]), v); occ.set(K(old[0], old[1]), w); moved++; } else { cell[w] = c; cell[v] = old; }
          }
        }
      }
      if (!moved) break;
    }
    return cell;
  }

  // ---- corridors: door -> street lane -> cross-street lane -> door ----
  const RH = 0.25, SIDE_N = 0, SIDE_E = 1, SIDE_S = 2, SIDE_W = 3;
  function routeMaze(SG, cell) {
    const N = SG.nodes.length, load = cell.map(() => [0, 0, 0, 0]), sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
    const order = SG.edges.map((e, i) => i).sort((p, q) => {
      const m = i => { const [a, b] = SG.edges[i]; return Math.abs(cell[a][0] - cell[b][0]) + Math.abs(cell[a][1] - cell[b][1]); };
      return m(p) - m(q) || p - q;
    });
    const R = new Array(SG.edges.length);
    for (const ei of order) {
      let [a, b] = SG.edges[ei];
      if (SG.nodes[b].d < SG.nodes[a].d) [a, b] = [b, a];   // a: the end nearer the nest
      const A = cell[a], B = cell[b], dx = B[0] - A[0], dy = B[1] - A[1];
      let r;
      if (Math.abs(dx) + Math.abs(dy) === 1) {
        r = dx ? { kind: 'adjH', sx: dx, sy: 0, sideA: dx > 0 ? SIDE_E : SIDE_W, sideB: dx > 0 ? SIDE_W : SIDE_E }
               : { kind: 'adjV', sx: 0, sy: dy, sideA: dy > 0 ? SIDE_S : SIDE_N, sideB: dy > 0 ? SIDE_N : SIDE_S };

    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity; P.forEach(([px, py]) => { a0 = Math.min(a0, px); a1 = Math.max(a1, px); b0 = Math.min(b0, py); b1 = Math.max(b1, py); });
    const s = Math.min((Wp - 30) / (a1 - a0 || 1), (Hp - 30) / (b1 - b0 || 1)), ox = Wp / 2 - (a0 + a1) / 2 * s, oy = Hp / 2 - (b0 + b1) / 2 * s;
    const X = u => ox + P[u][0] * s, Y = u => oy + P[u][1] * s, rim = new Set(g.rim), k = Wp / 256;
    x.strokeStyle = 'rgba(90,70,40,.45)'; x.lineWidth = 2 * k; x.beginPath(); g.edges.forEach(([u, v]) => { x.moveTo(X(u), Y(u)); x.lineTo(X(v), Y(v)); }); x.stroke();
    const r = (g.n > 26 ? 6 : 8) * k;
    for (let u = 0; u < g.n; u++) {
      if (u === g.hole) { x.setLineDash([3 * k, 3 * k]); x.strokeStyle = '#5a4a32'; x.lineWidth = 2 * k; x.fillStyle = '#fffaf0'; x.beginPath(); x.arc(X(u), Y(u), r + 2, 0, 7); x.fill(); x.stroke(); x.setLineDash([]); continue; }
      x.fillStyle = ELEM[perm[g.col[u]]].hex; x.strokeStyle = rim.has(u) ? '#2a2016' : 'rgba(40,30,20,.5)'; x.lineWidth = (rim.has(u) ? 3 : 1.2) * k;
      x.beginPath(); x.arc(X(u), Y(u), r, 0, 7); x.fill(); x.stroke();
    }
  }

  // ---------------------------------------------------------------- moves
  function walkDur(len) { return RM ? 120 : clamp(len * 260, 380, 1500); }
  function startAnim(r, from, back, done) {
    const pts = walkPts(r, from), len = polyLen(pts);
    const end = back ? pts[0] : pts[pts.length - 1];
    anim = { r, pts, len, back, t0: now(), dur: back ? walkDur(len * 0.55) * 2 : walkDur(len), done: () => { rat.x = end[0]; rat.y = end[1]; done(); } };
  }
  function finishAnim() { if (anim) { const f = anim.done; anim = null; f(); } }
  function walk(e) {
    if (anim || finished || e < 0) return;
    const r = routes[e]; if (r.a !== cur && r.b !== cur) return;
    const j = r.a === cur ? r.b : r.a, v = NODES[j];
    sel = -1; cam.free = false;
    if (v.won && !(mode === 'cheese' && j === cheese)) {
      // a goal room without the cheese: the rat pops in and backs out; the puzzle state never changes
      steps += 2;
      const first = !mapped.has(j);
      startAnim(r, cur, true, () => {
        mapped.add(j);
        if (mode === 'coins') { coins.add(j); toast(first ? 'The hole is filled here! Coin grabbed; it is a dead end, so back out.' : 'Dead end: the hole is filled here.'); }
        else toast('The hole is filled here, but no cheese.');
        save(); hud(); checkCoins();
      });
      hud(); return;
    }
    const K = chainTo(j);
    if (!K) { console.error('maze: no chain from', NODES[cur].key, 'to', v.key); return; }
    const from = cur;
    g.swap(K);
    path.push({ e, from, to: j });
    steps++;
    startAnim(r, from, false, () => {
      cur = j; mapped.add(j); if (mode === 'coins') coins.add(j);
      save(); hud();
      if (mode === 'cheese' && j === cheese) win(); else checkCoins();
    });
    hud();
  }
  function undo() {
    if (anim || finished) return;
    if (!path.length) { toast('Back at the nest.'); return; }
    const last = path.pop();
    g.undo();
    steps += mode === 'coins' ? 1 : -1;
    sel = -1; cam.free = false;
    startAnim(routes[last.e], last.to, false, () => { cur = last.from; hud(); });
    hud();
  }
  function restart(silent) {
    anim = null; finished = false; path = []; steps = 0; cur = 0; coins = new Set([0]); sel = -1; cam.free = false;
    g.reset(); rat.x = cell[0][0]; rat.y = cell[0][1] + REST; rat.a = Math.PI / 2;
    $('card').classList.remove('on'); fx = [];
    hud();
    if (!silent) toast(mode === 'coins' ? `Grab all ${NN} coins.` : cheese < 0 ? 'No cheese in this maze.' : `The cheese is ${cheeseN} rooms away. Shortest route wins.`);
  }
  function setMode(m) { mode = m; save(); closeMenu(); restart(); }
  function checkCoins() {
    if (mode !== 'coins' || coins.size < NN || finished || window.__mazeNoEnd) return;
    finished = true; hud(); burst(W / 2, H / 2, 90);
    card('All ' + NN + ' coins!', '', `You explored the whole maze in ${steps} steps. The map is yours: now find the cheese.`,
      [['Find the cheese', () => setMode('cheese')], ['Again', () => restart(), true]]);
  }
  function win() {
    finished = true; hud();
    const n = cheeseN, st = steps <= n ? 3 : steps <= n + 2 ? 2 : 1;
    burst(SX(rat.x), SY(rat.y), 120);
    const stars = '★'.repeat(st) + '<i>' + '★'.repeat(3 - st) + '</i>';
    const deeper = wonDepths.find(d => d > cheeseN);
    const btns = [['Again', () => restart()]];
    if (deeper !== undefined && !IN_APP) btns.push(['Farther', () => farther(), true]);
    setTimeout(() => card('Cheese!', IN_APP ? '' : stars, `${steps} step${steps === 1 ? '' : 's'}; the shortest route is ${n}.` + (st === 3 ? ' Perfect run.' : ''), IN_APP ? [] : btns), RM ? 100 : 700);
    if (LAB.embedded) setTimeout(LAB.done, 2200);
  }
  function farther() {
    const deeper = wonDepths.find(d => d > cheeseN);
    cheeseN = deeper !== undefined ? deeper : wonDepths[0];
    pickCheese(); mode = 'cheese'; save(); closeMenu(); restart();
  }
  function card(h, stars, p, btns) {
    $('cardH').textContent = h; $('cardS').innerHTML = stars; $('cardS').style.display = stars ? '' : 'none'; $('cardP').textContent = p;
    const B = $('cardB'); B.innerHTML = '';
    btns.forEach(([t, fn, alt]) => { const b = document.createElement('button'); b.textContent = t; if (alt) b.className = 'alt'; b.onclick = fn; B.appendChild(b); });
    $('card').classList.add('on');
  }

  // ---------------------------------------------------------------- input
  function doorDir(i, r) { const p = doorPt(r, r.a === i ? 'a' : 'b'); return [p[0] - cell[i][0], p[1] - cell[i][1]]; }
  function bestInDir(dx, dy) {
    let best = -1, bs = 0.35;
    for (const { e, r, to } of incident(cur)) {
      const dd = doorDir(cur, r), l1 = Math.hypot(...dd) || 1, o = [cell[to][0] - cell[cur][0], cell[to][1] - cell[cur][1]], l2 = Math.hypot(...o) || 1;
      const s = (dd[0] * dx + dd[1] * dy) / l1 + 0.35 * (o[0] * dx + o[1] * dy) / l2;
      if (s > bs) { bs = s; best = e; }
    }
    return best;
  }
  function hitEdge(px, py) {
    const w = toWorld(px, py), tol = Math.max(0.1, 16 / cam.z);
    let best = -1, bd = tol;
    for (const { e, r, to } of incident(cur)) {
      const P = walkPts(r, cur).slice(1);
      const known = corrKnown(r);
      const Q = known ? P : polyCut(P, 0.5);
      for (let k = 1; k < Q.length; k++) { const d = segDist(w.x, w.y, Q[k - 1], Q[k]); if (d < bd) { bd = d; best = e; } }
      if (isLit(to) && Math.abs(w.x - cell[to][0]) < RH + 0.05 && Math.abs(w.y - cell[to][1]) < RH + 0.05) { best = e; bd = 0; }
    }
    return best;
  }
  const ptrs = new Map(); let gest = null, lastTap = 0;
  cv.addEventListener('pointerdown', ev => {
    cv.focus({ preventScroll: true }); closeMenu();
    cv.setPointerCapture(ev.pointerId);
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (ptrs.size === 1) gest = { x0: ev.clientX, y0: ev.clientY, t0: now(), cx: cam.x, cy: cam.y, moved: false, pinch: false };
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; gest = { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y), z0: cam.z, moved: true }; }
  });
  cv.addEventListener('pointermove', ev => {
    if (!ptrs.has(ev.pointerId) || !gest) return;
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (gest.pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; cam.z = clamp(gest.z0 * Math.hypot(a.x - b.x, a.y - b.y) / (gest.d0 || 1), 12, 220); return; }
    if (gest.pinch) return;
    const dx = ev.clientX - gest.x0, dy = ev.clientY - gest.y0;
    if (!gest.moved && Math.hypot(dx, dy) > 8) gest.moved = true;
    if (gest.moved) { cam.free = true; cam.x = gest.cx - dx / cam.z; cam.y = gest.cy - dy / (cam.z * KY); }
  });
  function endPtr(ev) {
    if (!ptrs.has(ev.pointerId)) return;
    ptrs.delete(ev.pointerId);
    if (!gest || ptrs.size) return;
    const G = gest; gest = null;
    if (G.pinch) return;
    const dx = ev.clientX - G.x0, dy = ev.clientY - G.y0, dt = now() - G.t0, dist = Math.hypot(dx, dy);
    if (G.moved && dt < 280 && dist > 30) {   // a flick: walk that way, undo the pan
      cam.x = G.cx; cam.y = G.cy; cam.free = false;
      const e = bestInDir(dx / dist, dy / dist / KY);
      if (e >= 0) walk(e); return;
    }
    if (G.moved) return;
    const e = hitEdge(ev.clientX, ev.clientY);
    if (e >= 0) { walk(e); return; }
    if (now() - lastTap < 320) { recentre(); lastTap = 0; return; }
    lastTap = now();
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', ev => { ptrs.delete(ev.pointerId); gest = null; });
  cv.addEventListener('wheel', ev => { ev.preventDefault(); cam.z = clamp(cam.z * Math.exp(-ev.deltaY * 0.0015), 12, 220); }, { passive: false });
  function recentre() {   // toggles between the rat's close-up and the whole board
    if (Math.abs(cam.z - zBase) > 1 || cam.free) { cam.free = false; cam.z = zBase; return; }
    cam.free = true; cam.z = clamp(Math.min((W - 20) / (BX1 - BX0 + 1.2), (H - TOP - 20) / ((BY1 - BY0 + 1.4) * KY)), 12, zBase);
    cam.x = (BX0 + BX1) / 2 + 0.2; cam.y = (BY0 + BY1) / 2 - 0.2;
  }
  addEventListener('keydown', ev => {
    if (ev.target && ev.target.tagName === 'BUTTON' && (ev.key === 'Enter' || ev.key === ' ')) return;
    const k = ev.key, dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
    if ($('card').classList.contains('on')) { if (k === 'Enter') { const b = $('cardB').querySelector('button'); if (b) b.click(); } return; }
    if (dirs[k]) { ev.preventDefault(); const e = bestInDir(...dirs[k]); if (e >= 0) walk(e); else toast('No door that way.', 900); return; }
    if (k === 'Tab') { ev.preventDefault(); const L2 = incident(cur); if (!L2.length) return; const i = L2.findIndex(x => x.e === sel); sel = L2[(i + (ev.shiftKey ? L2.length - 1 : 1)) % L2.length].e; return; }
    if ((k === 'Enter' || k === ' ') && sel >= 0) { ev.preventDefault(); walk(sel); return; }
    if (k === 'u' || k === 'z' || k === 'Backspace') { ev.preventDefault(); undo(); }
    else if (k === 'r') restart();
    else if (k === 'l') toggleLights();
    else if (k === 'p') togglePeek();
    else if (k === '0') recentre();
    else if (k === '+' || k === '=') cam.z = clamp(cam.z * 1.2, 24, 200);
    else if (k === '-') cam.z = clamp(cam.z / 1.2, 24, 200);
  });
  function toggleLights() { lights = !lights; hud(); toast(lights ? 'Lab lights on: the whole maze.' : 'Lights off: only rooms you have seen.', 1400); }
  function togglePeek() { peek = !peek; hud(); }
  const stopP = el => el.addEventListener('pointerdown', ev => ev.stopPropagation());
  ['lights', 'peek', 'undo', 'again', 'mode'].forEach(id => stopP($(id)));
  $('lights').onclick = toggleLights; $('peek').onclick = togglePeek; $('undo').onclick = undo; $('again').onclick = () => { closeMenu(); restart(); };
  function closeMenu() { $('menu').classList.remove('on'); }
  $('mode').onclick = () => {
    const m = $('menu'); if (m.classList.contains('on')) return closeMenu();
    $('mCoins').classList.toggle('cur', mode === 'coins'); $('mCheese').classList.toggle('cur', mode === 'cheese');
    const deeper = wonDepths.find(d => d > cheeseN);
    $('mFar').disabled = IN_APP || deeper === undefined;
    $('mFar').querySelector('small').textContent = deeper !== undefined ? `Cheese ${deeper} rooms from the nest` : 'No deeper goal room in this maze';
    $('mCheese').querySelector('small').textContent = `Cheese ${cheeseN} rooms from the nest`;
    m.classList.add('on');
  };
  $('mCoins').onclick = () => setMode('coins');
  $('mCheese').onclick = () => setMode('cheese');
  $('mFar').onclick = farther;
  $('mForget').onclick = () => { mapped = new Set([0]); [...path.map(p => p.to), cur].forEach(i => mapped.add(i)); save(); closeMenu(); toast('Map forgotten.'); };

  // ---------------------------------------------------------------- size
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    TOP = 44; zBase = clamp(Math.min(W / 3.4, (H - TOP) / 4.6), 64, 170); cam.z = zBase;
  }
  addEventListener('resize', resize);
  resize();
  cam.x = rat.x; cam.y = rat.y;
  restart(true);
  toast(mode === 'coins' ? `Lab rat, ${NN} rooms. Tap a door to walk; every corridor is one swap. Grab all the coins.` : `The cheese is ${cheeseN} rooms away. Find the shortest route.`, 3600);
  window.__maze = {
    g, M, state: () => ({ cur, key: NODES[cur].key, gcanon: g.canon(), steps, mode, cheese, cheeseN, finished, anim: !!anim, coins: coins.size, mapped: mapped.size, path: path.length }),
    walk, undo, restart, setMode, farther, incident: () => incident(cur).map(x => ({ e: x.e, to: x.to })), toggleLights, togglePeek,
    finishAnim, NODES, routes, dbg: () => ({ cam, rat, cell: cell[cur] }), proj: (x, y) => [SX(x), SY(y)], cell,
  };
  requestAnimationFrame(draw);
})();
</script>
