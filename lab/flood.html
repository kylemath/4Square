<!doctype html>
<!--
  FLOOD: a hyper-casual "paint the map" front end for the Fill the Hole lab.

  What the player sees: a white board of chunky, extruded, rounded territory plates. Every plate is painted by one of
  four paint teams (the 4 elements: red fire, blue water, yellow air, green earth). In the middle sits an unpainted,
  striped GOLDEN territory (the hole). Five little flags stand on its border, one per bordering territory (the rim),
  each flying that territory's paint. A big counter at the top (and on the gold plate) says how many DIFFERENT paints
  fly on those flags: 4. The gold can only be claimed when that number is 3.

  What the player does (one thumb): tap a territory A (it lifts), then tap a neighbouring territory B of another paint,
  or drag from A onto B. While B is hovered or pressed, the zone that will flood pulses and every plate in it shows a
  dot of the paint it is about to become; the gold plate shows the counter it would have (e.g. "->3").
  On release, the paint-bucket move fires.

  Exact mapping onto the math:
    zone  K = g.chainAt(A, g.col[B])   (the {col[A], col[B]} Kempe chain through A; B is in it since A~B)
    move  g.swap(K)                     (every plate in K trades its paint for the other paint of the pair)
  The swap is animated as a wave: plates are splatted in BFS order of graph distance from A inside K, each splat
  entering from the border shared with the plate that reached it, with droplet particles.
  If K.web is true (the only {a,b} chain on the map: swapping just renames two paints), the move is a dud: the paint
  splashes halfway in, slides back off and g.swap is NOT called.
  Counter = g.rimCount() (shown per-plate as the wave lands). Win = g.won(): a giant bucket pours paint g.free() onto
  the gold territory, confetti, then a tap anywhere calls g.reset(). Tiny undo (g.undo) / restart (g.reset) buttons.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>

  .flag .pen { transform-box: fill-box; transform-origin: 0 50%; animation: wave 1.1s ease-in-out infinite alternate; }

  #hole.shake { animation: shake .32s; }
  #hdig { font: 700 24px Fredoka, system-ui, sans-serif; paint-order: stroke; stroke: #b07800; stroke-width: 2.2; fill: #fff; stroke-linejoin: round; }
  #hpv { font: 700 10px Fredoka, system-ui, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
  @keyframes pop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }

  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  @keyframes dot { from { transform: scale(.75); } to { transform: scale(1.15); } }

  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
                     70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
  @media (prefers-reduced-motion: reduce) {

    #num.pop, #tgt.ok, .pot, .flag.pop .pen, .rg.shake, #hole.shake { animation: none; }
  }
</style>
</head>
<body>
<div id="app">

  </div>
  <svg id="bd" xmlns="http://www.w3.org/2000/svg" viewBox="-1.1 -1.1 2.2 2.26" preserveAspectRatio="xMidYMid meet"></svg>

</div>

  function paint(u, e) {
    shown[u] = e; const r = R[u]; if (!r) return;
    r.tp.setAttribute('fill', `url(#gr${e})`); r.sd.setAttribute('fill', E[e].dark);

  }
  let lastCount = null;
  function hud() {
    const cols = [...new Set(g.rim.map(r => shown[r]))].sort(), k = cols.length, d = $('drops');
    d.innerHTML = cols.map(e => `<svg viewBox="0 0 24 24"><path d="${ICON[1]}" fill="${E[e].hex}" stroke="#fff" stroke-width="2"/></svg>`).join('');
    const num = $('num');
    if (lastCount !== k) { num.textContent = k; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); }
    lastCount = k;
    $('tgt').classList.toggle('ok', k <= g.goal);
    if (!won) hdig.textContent = k;
  }
  function renderAll() {
    for (let u = 0; u < N; u++) if (u !== H) { paint(u, g.col[u]); R[u].sp.setAttribute('r', 0); }
    shown = g.col.slice(); hud(); marks();
  }
  function marks() {
    for (let u = 0; u < N; u++) {
      if (u === H) continue; const c = R[u].grp.classList;
      c.toggle('sel', u === sel); c.toggle('cand', sel != null && valid(sel, u) && !won);
      c.toggle('zone', !!zone && zone.K.set.has(u));
      if (zone && zone.K.set.has(u)) { const [a, b] = zone.K.pair; R[u].pv.setAttribute('fill', E[g.col[u] === a ? b : a].hex); }
    }
    if (sel != null) layer.insertBefore(R[sel].grp, hole);
    drawPots();   // lifted plate on top (hole stays above)
    if (zone && !won) {
      const p = g.preview(zone.K), cur = g.rimCount();
      hpv.textContent = zone.K.web ? '=' + cur : '→' + p.rimCount;
      hpv.setAttribute('fill', zone.K.web || p.rimCount === cur ? '#8a7aa8' : p.rimCount < cur ? '#2fae5f' : '#e2443a');
    } else hpv.textContent = '';
  }

  // ---------------------------------------------------------------- tweens + particles
  const T = []; let raf = 0, flushing = false;
  const now = () => performance.now();
  function tw(delay, dur, fn, end, start) { T.push({ t0: now() + delay, dur: Math.max(dur, 1), fn, end, start, st: false }); kick(); }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }
  function step(t, p) { if (!t.st) { t.st = true; t.start && t.start(); } t.fn && t.fn(p); }
  function loop(ts) {
    raf = 0; const tnow = now();
    for (let i = 0; i < T.length; i++) {
      const t = T[i]; if (tnow < t.t0) continue;
      const p = Math.min(1, (tnow - t.t0) / t.dur); step(t, p);
      if (p >= 1) { T.splice(i--, 1); t.end && t.end(); }
    }
    drawFx();
    if (T.length || P.length) kick();
  }
  function flush() {
    if (!T.length) return; flushing = true;
    while (T.length) { T.sort((a, b) => a.t0 - b.t0); const t = T.shift(); step(t, 1); t.end && t.end(); }
    flushing = false;
  }
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeBack = p => { const s = 1.7; p -= 1; return p * p * ((s + 1) * p + s) + 1; };

  const P = []; let dpr = 1;
  function sizeFx() { dpr = Math.min(2, window.devicePixelRatio || 1); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }
  sizeFx(); addEventListener('resize', sizeFx);
  function toScreen(x, y) { const m = svg.getScreenCTM(); return [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f, m.a]; }
  function droplets(x, y, col, n, power) {
    if (RM || flushing) return; const [sx, sy, sc] = toScreen(x, y);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.25 + Math.random() * 0.75) * sc * power;
      P.push({ x: sx, y: sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sc * 0.6 * power, r: sc * (0.012 + Math.random() * 0.02), c: col, life: 0, ttl: 0.5 + Math.random() * 0.4, g: sc * 3.2 });
    }
    kick();
  }
  function confetti(n) {
    if (RM) return; const cols = ['#ef5a3c', '#3d8fe8', '#ffd84a', '#4caf50', '#ff6fb5', '#ffffff', '#9b6cff'];
    for (let i = 0; i < n; i++) P.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6, vx: (Math.random() - .5) * 120, vy: 80 + Math.random() * 160,
      r: 4 + Math.random() * 5, c: cols[i % cols.length], life: 0, ttl: 3.5, g: 60, rot: Math.random() * 6, vr: (Math.random() - .5) * 12, conf: true });
    kick();
  }
  let lastT = 0;
  function drawFx() {
    const t = now(), dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 0.016); lastT = t;
    cx2.setTransform(dpr, 0, 0, dpr, 0, 0); cx2.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = 0; i < P.length; i++) {
      const p = P[i]; p.life += dt; if (p.life > p.ttl || p.y > innerHeight + 40) { P.splice(i--, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; const k = 1 - p.life / p.ttl;
      cx2.fillStyle = p.c;
      if (p.conf) { p.rot += p.vr * dt; cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.rot); cx2.globalAlpha = Math.min(1, k * 2); cx2.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); cx2.restore(); }
      else { cx2.globalAlpha = 1; cx2.beginPath(); cx2.arc(p.x, p.y, p.r * (0.4 + 0.6 * k), 0, 7); cx2.fill(); }
    }
    cx2.globalAlpha = 1;
  }

  // ---------------------------------------------------------------- sound
  let ac = null;
  function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } }
  function tone(f, dur, type, vol, slide, delay) {
    if (!ac || flushing) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), v = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * (slide || 1), t + dur);
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sPick = () => tone(620, 0.08, 'triangle', 0.1, 1.5);
  const sSplat = d => tone(260 * Math.pow(2, d / 5), 0.14, 'triangle', 0.13, 1.9);
  const sDud = () => { tone(300, 0.22, 'square', 0.05, 0.5); tone(200, 0.25, 'triangle', 0.08, 0.6, 0.1); };
  const sNope = () => tone(180, 0.12, 'triangle', 0.08, 0.7);
  const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.28, 'triangle', 0.12, 1.01, i * 0.09));
  const sPour = () => tone(140, 0.7, 'sawtooth', 0.03, 2.5);

  // ---------------------------------------------------------------- moves
  function toast(text, x, y) {
    const t = $('toast'), [sx, sy] = toScreen(x, y);
    t.textContent = text; t.style.left = sx + 'px'; t.style.top = sy + 'px';
    t.classList.remove('go'); void t.offsetWidth; t.classList.add('go');
  }
  function shake(node) { node.classList.remove('shake'); requestAnimationFrame(() => node.classList.add('shake')); setTimeout(() => node.classList.remove('shake'), 400); }

  function flood(A, e) {
    const K = chainFor(A, e); if (!K) return;
    const [a, b] = K.pair, dud = K.web, order = waveOrder(K, A), from = g.col.slice();
    const start = selPt || C[A];
    sel = null; zone = null; marks();
    if (!dud) { g.swap(K); if (g.won()) pouring = true; }
    const maxD = order.reduce((m, o) => Math.max(m, o.d), 0);
    order.forEach(o => {
      const u = o.u, ne = from[u] === a ? b : a, entry = o.from == null ? start : sharedMid(o.from, u), Rr = reach(cells[u], entry), sp = R[u].sp;
      tw(o.d * STEP, dud ? SPL * 1.9 : SPL, p => {
        const k = dud ? (p < 0.45 ? easeOut(p / 0.45) * 0.55 : 0.55 * (1 - easeOut((p - 0.45) / 0.55))) : easeOut(p);
        sp.setAttribute('r', (Rr * k).toFixed(4));
      }, () => { sp.setAttribute('r', 0); if (!dud) paint(u, ne); }, () => {
        sp.setAttribute('cx', entry[0]); sp.setAttribute('cy', entry[1]); sp.setAttribute('fill', `url(#gr${ne})`);
        droplets(entry[0], entry[1], E[ne].hex, dud ? 3 : 7, dud ? 0.6 : 1); dud ? (o.d === 0 && sDud()) : sSplat(o.d);
      });
    });
    tw((maxD) * STEP + SPL * (dud ? 1.9 : 1), 1, null, () => {
      if (dud) toast('slid off!', C[A][0], C[A][1] - 0.1);
      else if (g.won()) pour();
    });
  }

  function bucketShape(parent, e) {
    const bk = el('g', {}, parent);
    el('path', { d: 'M-0.13 -0.1 Q0 -0.3 0.13 -0.1', fill: 'none', stroke: '#6b5a8a', 'stroke-width': 0.018, 'stroke-linecap': 'round' }, bk);
    el('path', { d: 'M-0.14 -0.1 L0.14 -0.1 L0.11 0.14 Q0 0.17 -0.11 0.14 Z', fill: '#e9e4f7', stroke: '#fff', 'stroke-width': 0.01 }, bk);
    el('path', { d: 'M-0.14 -0.1 L0.14 -0.1 L0.13 -0.02 L-0.13 -0.02 Z', fill: '#cfc6ea' }, bk);
    el('ellipse', { cx: 0, cy: -0.1, rx: 0.14, ry: 0.04, fill: E[e].hex, stroke: '#fff', 'stroke-width': 0.012 }, bk);
    el('path', { d: 'M-0.08 0.0 L-0.07 0.11', stroke: '#fff', 'stroke-width': 0.02, 'stroke-linecap': 'round', opacity: 0.7 }, bk);
    return bk;
  }
  function pour() {
    won = true; pouring = true; const e = g.free(), hx = hc[0], hy = hc[1];
    marks(); hpv.textContent = '';
    $('cue').innerHTML = 'Pour it in!';
    const bx = hx - 0.06, by = hy - 0.5;
    const wrap = el('g', {}, top), bk = bucketShape(wrap, e);
    const stream = el('rect', { x: hx - 0.035, y: by + 0.02, width: 0.07, height: 0, rx: 0.035, fill: E[e].hex }, top);
    top.insertBefore(stream, wrap);
    tw(0, RM ? 1 : 420, p => { const k = easeBack(p); wrap.setAttribute('transform', `translate(${bx} ${by - 1.2 * (1 - k)}) rotate(0)`); }, null, () => tone(400, 0.15, 'triangle', 0.08, 1.6));
    tw(RM ? 0 : 450, RM ? 1 : 300, p => wrap.setAttribute('transform', `translate(${bx} ${by}) rotate(${(115 * easeOut(p)).toFixed(1)})`), null, sPour);
    const sy0 = by + 0.04, len = hy - sy0;
    tw(RM ? 0 : 680, RM ? 1 : 220, p => { stream.setAttribute('y', sy0); stream.setAttribute('height', (len * p).toFixed(4)); });
    tw(RM ? 0 : 860, RM ? 1 : 650, p => hsp.setAttribute('r', (reach(cells[H], hc) * easeOut(p)).toFixed(4)), () => {
      htop.setAttribute('fill', `url(#gr${e})`); hstr.setAttribute('opacity', 0); hsp.setAttribute('r', 0);
    }, () => {
      hsp.setAttribute('cx', hx); hsp.setAttribute('cy', hy); hsp.setAttribute('fill', `url(#gr${e})`);
      droplets(hx, hy, E[e].hex, 26, 1.8); hdig.textContent = '';
    });
    tw(RM ? 0 : 1250, RM ? 1 : 380, p => { const k = easeOut(p); stream.setAttribute('y', sy0 + len * k); stream.setAttribute('height', (len * (1 - k)).toFixed(4));
      wrap.setAttribute('transform', `translate(${bx + 1.4 * k * k} ${by - 0.5 * k}) rotate(${115 - 60 * k})`); });
    tw(RM ? 0 : 1520, RM ? 1 : 500, p => { hicon.setAttribute('opacity', easeOut(p)); }, () => {
      top.innerHTML = ''; pouring = false;
      const cue = $('cue'); cue.textContent = 'Gold claimed! Tap to paint again'; cue.classList.add('win');
    }, () => {
      hicon.setAttribute('d', ICON[e]); hicon.setAttribute('fill', e === 2 ? 'none' : '#fff'); hicon.setAttribute('stroke', '#fff');
      hicon.setAttribute('stroke-width', e === 2 ? 2.6 : e === 3 ? 1.4 : 0); hicon.setAttribute('stroke-linecap', 'round');
      sWin(); confetti(140); droplets(hx, hy, '#ffd84a', 20, 2.2);
    });
  }
  function restart() {
    flush(); won = false; pouring = false; sel = null; zone = null; top.innerHTML = '';
    g.reset(); renderAll();
    htop.setAttribute('fill', 'url(#gold)'); hstr.setAttribute('opacity', 1); hicon.setAttribute('opacity', 0); hsp.setAttribute('r', 0);
    const cue = $('cue'); cue.classList.remove('win'); cue.innerHTML = 'Leave only <b>3 paints</b> on the gold flags';
  }

  // ---------------------------------------------------------------- input
  function boardPt(ev) { const m = svg.getScreenCTM().inverse(); return [m.a * ev.clientX + m.c * ev.clientY + m.e, m.b * ev.clientX + m.d * ev.clientY + m.f]; }
  let down = null;   // {id, start, moved, toggle}
  function targetAt(p) {   // what is under the finger while A is selected: a paint pot or a valid neighbour -> {e, key}
    if (sel == null) return null;
    for (const t of pots) if (Math.hypot(p[0] - t.x, p[1] - t.y) < 0.1) return { e: t.e, key: 'p' + t.e };
    const v = regionAt(p[0], p[1]);
    return valid(sel, v) ? { e: g.col[v], key: 'r' + v } : null;
  }
  function setZone(t) {
    const K = t ? chainFor(sel, t.e) : null;
    if (zone && K && zone.key === t.key) return;
    if (!K && !zone) return;
    zone = K ? { K, e: t.e, key: t.key } : null; marks();
  }
  svg.addEventListener('pointerdown', ev => {
    audio(); if (pouring) return;
    if (won) { restart(); return; }
    flush(); if (won || pouring) return;
    const p = boardPt(ev), t = targetAt(p), u = regionAt(p[0], p[1]);
    down = { id: ev.pointerId, start: t ? t.key : u, moved: false, toggle: false };
    try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
    if (t) { setZone(t); return; }
    if (u == null) { sel = null; zone = null; marks(); return; }
    if (u === H) { shake(hole); sNope(); toast(g.rimCount() + ' paints: need 3', hc[0], hc[1] - 0.2); return; }
    if (sel === u) { down.toggle = true; return; }
    sel = u; selPt = p; zone = null; marks(); sPick();
  });
  svg.addEventListener('pointermove', ev => {
    if (won || pouring || sel == null) return;
    const p = boardPt(ev), t = targetAt(p), u = regionAt(p[0], p[1]);
    if (down && (t ? t.key : u) !== down.start) down.moved = true;
    setZone(t);
  });
  function up(ev) {
    if (!down || ev.pointerId !== down.id) return;
    const d = down; down = null; if (won || pouring || sel == null) return;
    const p = boardPt(ev), t = targetAt(p), v = regionAt(p[0], p[1]);
    if (zone && t && t.key === zone.key) { flood(sel, zone.e); return; }
    if (d.toggle && v === sel) { sel = null; zone = null; marks(); return; }
    if (d.moved && !t && v != null && v !== sel && v !== H) { shake(R[sel].grp); sNope(); }
    if (ev.pointerType !== 'mouse') { zone = null; marks(); }
  }
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', () => { down = null; zone = null; marks(); });
  svg.addEventListener('pointerleave', ev => { if (!down && zone) { zone = null; marks(); } });
  $('undo').addEventListener('click', () => {
    audio(); if (pouring) return; flush();
    if (won) { won = false; top.innerHTML = ''; htop.setAttribute('fill', 'url(#gold)'); hstr.setAttribute('opacity', 1); hicon.setAttribute('opacity', 0);
      const cue = $('cue'); cue.classList.remove('win'); cue.innerHTML = 'Leave only <b>3 paints</b> on the gold flags'; }
    if (!g.history.length) { sNope(); return; }
    g.undo(); sel = null; zone = null; renderAll(); tone(500, 0.1, 'triangle', 0.08, 0.6);
  });
  $('again').addEventListener('click', () => { audio(); if (pouring) return; restart(); tone(700, 0.1, 'triangle', 0.08, 0.6); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => hud());
  renderAll();
})();
</script>
</body>
</html>
