<!doctype html>
<!--
  RIM WORD (lab front end: the puzzle as a word ladder, the map never shown until you win)

  What the player sees: five wooden letter tiles spelling a non-word, a rack of tiles that belong to the player
  (their letters, like a small Scrabble rack), a flip counter against par, and a ladder of the words so far.
  Drag or tap a rack tile onto any square. The rack only offers letters that still have a way to a word. If the
  square you chose is not the next swap, the spelling walks along the chart until that letter is on a state that
  is closer to a word, then the rack is dealt again. Undo puts the letter back. Spell a real word and you win,
  with stars for doing it in par; then the map underneath is revealed.

  Mapping (every flip is exactly one g.swap(K)):
    the five-letter string        = the current colouring, up to renaming the elements (core.js canon)
    one rack tile played          = a walk of Kempe swaps along edges that get closer to a word, ending on a
                                    charted spelling that carries the letter you played. A square that is not the
                                    next swap is not rejected: the walk continues until the tree has that letter.
                                    Edges that step farther from every word are not offered and not walked.
    a real English word           = a fill (the rim down to three elements); every other state is a word-like
                                    non-word, and a state two or more swaps from a fill is never one letter from any
                                    common word, so the letters give no false scent
    par                           = the fewest swaps to a fill. The words are charted for every state within R swaps
                                    of the start (R = par + 1 where the search found labels, else par); at a state R
                                    swaps out the page says the chart ends there and only the charted flips show
  The labels come from tools/word_graph.js (lab/rimword-data.js), which searches for strings with those properties.
  Look and juice (SKIN-SPEC 0, 14): chunky wooden tiles, a rack that bobs, a ghost finger until the first touch, rotateY
  flip waves with a clack and a rising tone, LAB.at at the played square, a 3.6 s win (burst, gold hop wave, letter
  confetti) before LAB.done(). Egg 'hidden-word' (SKIN-SPEC 15): the ring of tiles, read either way round, hides a
  three-letter animal (palindromes never occur in the charts) -> a mirror shimmer and LAB.egg('hidden-word', 120), once a level.
  Changes made outside the page (the shell's undo/reset, a test swapping on the game object) are followed through g.on.
  The page keeps a LAB.game() instance in step (each flip finds the chain whose swap gives the next colouring), so it
  embeds and reports like every other front end.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rim Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3ead8; --ink: #3a2a1a; --dim: #8a7458; --wood: #e9c58f; --wood2: #d7a964; --edge: #a8763a; --pin: #b9ab95;
    --good: #2f8f4e; --bad: #b5452f; --card: #fffaf0; --line: #e0d2b8; --gold: #ffcf3a; --glow: #ffd96a;
    --ctl: var(--sk-ctl, #fffaf0); --ctl-ink: var(--sk-ctl-ink, #3a2a1a); --ctl-edge: var(--sk-ctl-edge, #a8763a); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 600 15px/1.35 Nunito, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(120% 80% at 50% 0%, #fbf5e9 0%, var(--bg) 60%, #e8dcc3 100%) fixed; overflow-x: hidden; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 28px; min-height: 100%; display: flex; flex-direction: column; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  header h1 { flex: 1; margin: 0; font: 900 1.2rem/1.1 Fraunces, Georgia, serif; letter-spacing: .01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1 small { display: block; font: 800 .74rem Nunito, sans-serif; color: var(--dim); letter-spacing: .02em; }
  select, button { font: inherit; color: var(--ink); }
  select { order: 5; flex: 1 1 100%; min-width: 0; background: var(--ctl); color: var(--ctl-ink); border: 2.5px solid var(--ctl-ink); border-radius: 12px; padding: 5px 6px; box-shadow: 0 3px 0 var(--ctl-edge); font-weight: 800; }
  /* chunky 3D controls, wearing the skin tokens */
  .ctl { width: 42px; height: 40px; border-radius: 13px; border: 2.5px solid var(--ctl-ink); background: var(--ctl); color: var(--ctl-ink); cursor: pointer;
    display: grid; place-items: center; padding: 0; box-shadow: inset 0 3px 0 #ffffffaa, 0 4px 0 var(--ctl-edge), 0 6px 8px #3a2a1a33; transition: transform .08s, box-shadow .08s; }
  .ctl svg { width: 22px; height: 22px; }
  .ctl:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 3px 0 #ffffffaa, 0 1px 0 var(--ctl-edge); }
  .ctl:disabled { opacity: .4; cursor: default; box-shadow: 0 2px 0 var(--ctl-edge); }
  .ctl.nudge { animation: nudge .6s ease-in-out 2; }
  @keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateY(-5px) rotate(-8deg); } 60% { transform: translateY(0) rotate(6deg); } }

  /* flips / par: a flip icon and two numbers */
  #budget { margin: 14px auto 2px; display: inline-flex; align-self: center; align-items: center; gap: 8px; font-variant-numeric: tabular-nums;
    background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 8px; box-shadow: 0 4px 0 var(--ink); }
  #budget svg { width: 26px; height: 26px; }
  #budget b { font: 900 1.45rem/1 Fraunces, Georgia, serif; }
  #budget span { font: 900 1rem Nunito, sans-serif; color: var(--dim); }
  #budget .stars { letter-spacing: .06em; color: #e0a92a; font-size: 1.05rem; -webkit-text-stroke: .6px var(--ink); }
  #budget.bump { animation: bump .45s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.22) translateY(-3px); } 100% { transform: scale(1); } }

  /* the five rim tiles */
  #stage { position: relative; margin: 26px auto 8px; }
  #board { position: relative; display: flex; gap: clamp(6px, 2.2vw, 12px); justify-content: center; z-index: 1; }
  .tile { position: relative; width: clamp(54px, 16.4vw, 82px); aspect-ratio: 1; perspective: 520px; cursor: pointer; outline: none; }
  .face { position: absolute; inset: 0; border-radius: 15px; display: grid; place-items: center; border: 3px solid var(--ink);
    background:
      radial-gradient(42% 34% at 26% 20%, #fff8e6 0%, #fff8e600 100%),
      repeating-linear-gradient(98deg, #a8763a00 0 8px, #a8763a1c 8px 10px, #a8763a00 10px 17px),
      linear-gradient(160deg, #f8dcaa 0%, var(--wood) 42%, var(--wood2) 100%);
    box-shadow: inset 0 3px 0 #fff6df, inset 0 -6px 0 var(--edge), 0 6px 0 var(--ink), 0 10px 12px #6b4a2040;
    font: 900 clamp(30px, 10vw, 50px)/1 Fraunces, Georgia, serif; text-transform: uppercase; color: #3b2612; text-shadow: 0 2px 0 #fff2d0aa;
    transition: transform .14s cubic-bezier(.3, 1.6, .5, 1), box-shadow .14s, filter .2s; transform-style: preserve-3d; backface-visibility: hidden; }
  .tile.quiet .face { filter: saturate(.8) brightness(.97); }
  .tile.aim .face { box-shadow: inset 0 3px 0 #fff6df, inset 0 -6px 0 var(--edge), 0 6px 0 var(--ink), 0 0 0 4px #ffd96a88, 0 10px 14px #6b4a2040; }
  .tile.hot .face { animation: hot .9s ease-in-out infinite alternate; }
  @keyframes hot { from { box-shadow: inset 0 3px 0 #fff6df, inset 0 -6px 0 var(--edge), 0 6px 0 var(--ink), 0 0 0 3px #ffd96a, 0 0 10px 3px #ffd96a99; }
    to { box-shadow: inset 0 3px 0 #fff6df, inset 0 -6px 0 var(--edge), 0 6px 0 var(--ink), 0 0 0 6px #ffcf3a, 0 0 22px 8px #ffd96acc; transform: translateY(-3px); } }
  .tile:focus-visible .face { box-shadow: inset 0 3px 0 #fff6df, inset 0 -6px 0 var(--edge), 0 6px 0 var(--ink), 0 0 0 4px #3d8fe8; }
  .tile.flip .face { animation: flip .5s cubic-bezier(.4, 0, .3, 1.4) both; }
  @keyframes flip { 0% { transform: rotateY(0) scale(1); } 45% { transform: rotateY(90deg) scale(1.06); filter: brightness(1.3); }
    80% { transform: rotateY(0) scale(1.14) translateY(-6px); } 100% { transform: rotateY(0) scale(1); } }
  .tile.ripple .face { animation: ripple .42s ease-out both; }
  @keyframes ripple { 0% { transform: rotateY(0); } 40% { transform: rotateY(28deg) translateY(-4px) scale(1.05); } 100% { transform: rotateY(0); } }
  .tile.wob .face, .opt.wob { animation: wob .42s ease-in-out; }
  @keyframes wob { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 45% { transform: rotate(7deg); } 70% { transform: rotate(-4deg); } }
  .tile.shim .face::after { content: ''; position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
    background: linear-gradient(110deg, #fff0 30%, #fffbe9cc 48%, #e6f3ffaa 52%, #fff0 70%) no-repeat; background-size: 250% 100%; animation: shim 1.3s ease-in-out 2; }
  @keyframes shim { from { background-position: 130% 0; } to { background-position: -130% 0; } }
  .tile.gold .face { background: radial-gradient(42% 34% at 26% 20%, #fffbe6 0%, #fffbe600 100%), linear-gradient(160deg, #fff0a8 0%, var(--gold) 45%, #e59a1a 100%);
    box-shadow: inset 0 3px 0 #fffbe0, inset 0 -6px 0 #b86f12, 0 6px 0 var(--ink), 0 0 0 4px #fff3b0, 0 0 26px 8px #ffcf3acc; color: #5a3306; }
  .tile.hop .face { animation: hop .7s cubic-bezier(.3, 1.5, .5, 1) 3 both; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-26px) scale(1.08) rotate(-4deg); } 70% { transform: translateY(0) scale(1.06, .92); } }
  .fly { position: fixed; z-index: 30; pointer-events: none; font: 900 34px/1 Fraunces, Georgia, serif; text-transform: uppercase; color: #3b2612;
    -webkit-text-stroke: 1px var(--ink); transform: translate(-50%, -50%); }
  .conf { position: fixed; z-index: 30; pointer-events: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; transform: translate(-50%, -50%);
    border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 900 18px/1 Fraunces, Georgia, serif; text-transform: uppercase; color: #3b2612; }
  #burst { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; pointer-events: none; z-index: 0; opacity: 0;
    background: radial-gradient(circle, #fff7c2 0%, #ffcf3a 40%, #ffcf3a00 70%); }
  #burst.on { animation: burst 1.2s ease-out both; }
  @keyframes burst { 0% { opacity: 1; transform: scale(1); } 60% { opacity: .9; } 100% { opacity: 0; transform: scale(70); } }
  #rays { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px; pointer-events: none; z-index: 0; opacity: 0;
    background: repeating-conic-gradient(#ffd96a66 0 10deg, #ffd96a00 10deg 22deg); border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 20%, #0000 68%); mask: radial-gradient(circle, #000 20%, #0000 68%); }
  #rays.on { animation: rays 3.2s ease-out both; }
  @keyframes rays { 0% { opacity: 0; transform: scale(.3) rotate(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1) rotate(70deg); } }

  /* the rack: your tiles, alive */
  #rack { position: relative; margin: 18px auto 0; width: 100%; max-width: 420px; border: 3px solid var(--ink); border-radius: 20px; padding: 12px 10px 14px;
    background: repeating-linear-gradient(92deg, #8a623000 0 14px, #8a62301a 14px 16px), linear-gradient(#e7c99a, #b8884e);
    box-shadow: inset 0 3px 0 #fff1d0, inset 0 -7px 0 #8a6230, 0 6px 0 var(--ink), 0 10px 16px #6b4a2033; }
  #rack .tag, #ladder .tag { position: absolute; top: -13px; left: 14px; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px;
    background: var(--card); border: 2.5px solid var(--ink); border-radius: 9px; box-shadow: 0 2px 0 var(--ink); }
  .tag svg { width: 16px; height: 16px; }
  #tray { min-height: clamp(58px, 16vw, 74px); display: flex; align-items: center; justify-content: center; gap: 9px; flex-wrap: wrap; margin: 0; }
  .opt { position: relative; width: clamp(44px, 13vw, 60px); aspect-ratio: 1; border-radius: 12px; border: 3px solid var(--ink); cursor: pointer; touch-action: none; padding: 0;
    background: radial-gradient(42% 34% at 26% 22%, #ffffff 0%, #ffffff00 100%), linear-gradient(160deg, #fff7e6, #f0d6a8);
    box-shadow: inset 0 -5px 0 #c99a55, 0 4px 0 var(--ink), 0 0 0 0 #ffd96a00;
    font: 900 clamp(22px, 7vw, 32px)/1 Fraunces, Georgia, serif; text-transform: uppercase; color: #5b3a16;
    animation: deal .32s cubic-bezier(.3, 1.6, .5, 1) both, bob 1.8s ease-in-out .35s infinite; animation-delay: var(--dl, 0s), calc(var(--dl, 0s) + .35s); }
  .opt.dealt { animation: bob 1.8s ease-in-out infinite; animation-delay: var(--dl, 0s); }
  .opt:hover { filter: brightness(1.05); }
  .opt:focus-visible { outline: 3px solid #3d8fe8; outline-offset: 2px; }
  @keyframes deal { from { transform: translateY(14px) scale(.5); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); box-shadow: inset 0 -5px 0 #c99a55, 0 4px 0 var(--ink), 0 0 0 0 #ffd96a00; }
    50% { transform: translateY(-4px); box-shadow: inset 0 -5px 0 #c99a55, 0 8px 0 var(--ink), 0 0 10px 3px #ffd96aaa; } }
  .opt.lift, .opt.sel { animation: none; transform: translateY(-14px) scale(1.1); z-index: 2;
    box-shadow: inset 0 -5px 0 #c99a55, 0 0 0 4px var(--gold), 0 14px 0 #3a2a1a55, 0 0 18px 6px #ffd96acc; }
  .opt.wob { animation: wob .42s ease-in-out; }
  #ghost { position: fixed; z-index: 20; margin: 0; pointer-events: none; transform: translate(-50%, -60%) scale(1.15) rotate(-6deg); animation: none; box-shadow: inset 0 -5px 0 #c99a55, 0 14px 12px #3a2a1a55, 0 0 0 4px var(--gold); }

  /* ghost finger: shows the first move until the first touch */
  #finger { position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; width: 56px; height: 64px; opacity: 0; }
  #finger svg { width: 100%; height: 100%; filter: drop-shadow(3px 4px 0 #3a2a1a55); }
  #finger .ft { position: absolute; left: -12px; top: -14px; width: 40px; height: 40px; border-radius: 9px; border: 3px solid var(--ink); display: grid; place-items: center;
    background: linear-gradient(160deg, #fff7e6, #f0d6a8); font: 900 22px/1 Fraunces, Georgia, serif; text-transform: uppercase; color: #5b3a16; opacity: .85; }
  #finger svg { position: absolute; left: 4px; top: 4px; }

  /* the ladder of words */
  #ladder { position: relative; margin: 22px auto 0; width: 100%; max-width: 360px; background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 16px 12px 10px; box-shadow: 0 5px 0 var(--ink); }
  #ladder ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
  #ladder li { display: flex; align-items: center; gap: 8px; font: 800 1.05rem/1.25 Fraunces, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; }
  #ladder li em { font-style: normal; }
  #ladder li span { font: 900 .72rem Nunito, sans-serif; color: var(--dim); letter-spacing: 0; width: 1.4em; text-align: right; }
  #ladder li b.ch { color: var(--bad); text-decoration: underline 2px; text-underline-offset: 3px; }
  #ladder li.win { color: var(--good); }
  #ladder li.win b.ch { color: var(--good); }
  #ladder li.pop { animation: rung .5s cubic-bezier(.3, 1.8, .5, 1) both; transform-origin: left center; }
  @keyframes rung { 0% { transform: scale(.4) translateX(-10px); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

  #reveal { display: none; position: relative; margin: 22px auto 0; width: 100%; max-width: 420px; background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 12px; box-shadow: 0 5px 0 var(--ink); }
  #reveal.on { display: block; }
  #reveal canvas { width: 100%; aspect-ratio: 1; display: block; }
  #win { position: fixed; inset: 0; display: none; place-items: center; background: #3a2a1a55; z-index: 40; padding: 16px; }
  #win.on { display: grid; }
  #win > div { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 18px 22px; text-align: center; max-width: 320px; box-shadow: 0 6px 0 var(--ink), 0 20px 40px #0004;
    animation: deal .4s cubic-bezier(.3, 1.6, .5, 1) both; }
  #win h3 { margin: 0 0 4px; font: 900 2rem Fraunces, Georgia, serif; text-transform: uppercase; letter-spacing: .1em; color: var(--good); }
  #win p { margin: 4px 0 14px; font: 900 1.2rem Nunito, sans-serif; color: #e0a92a; -webkit-text-stroke: .6px var(--ink); display: flex; gap: 8px; justify-content: center; align-items: center; }
  #win p small { color: var(--ink); -webkit-text-stroke: 0; font-size: 1rem; }
  #win .row { display: flex; gap: 12px; justify-content: center; }
  body.app header h1, body.app #lvl, body.app #budget .stars, body.app #win { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .tile.flip .face, .tile.ripple .face, .tile.hop .face, .tile.hot .face, .opt, #rays.on, .tile.shim .face::after, #ladder li.pop, #budget.bump { animation: none !important; }
    .face { transition: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flip" viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="14" rx="2.5" fill="#e9c58f" stroke="#3a2a1a" stroke-width="2"/><rect x="9" y="3" width="11" height="14" rx="2.5" fill="#fff7e6" stroke="#3a2a1a" stroke-width="2"/><path d="M12 10.5a3 3 0 0 1 5-1.6M17 8v1.6h-1.6" fill="none" stroke="#3a2a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-again" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.2-5.1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M18.5 3v4.4H14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rack" viewBox="0 0 24 24"><rect x="2" y="8" width="8" height="9" rx="2" fill="#fff7e6" stroke="#3a2a1a" stroke-width="2"/><rect x="12" y="6" width="8" height="9" rx="2" fill="#e9c58f" stroke="#3a2a1a" stroke-width="2"/><rect x="1" y="18" width="22" height="3" rx="1.5" fill="#b8884e" stroke="#3a2a1a" stroke-width="1.6"/></symbol>
  <symbol id="i-ladder" viewBox="0 0 24 24"><path d="M7 2v20M17 2v20" stroke="#3a2a1a" stroke-width="2.6" stroke-linecap="round"/><path d="M7 6h10M7 11h10M7 16h10" stroke="#a8763a" stroke-width="2.6" stroke-linecap="round"/></symbol>

  <symbol id="i-hand" viewBox="0 0 40 46"><path d="M14 4.5c0-2 3.6-2 3.6 0v15.5l1-.1v-3.4c0-2 3.4-2 3.4 0v3.6l.9.1v-2.4c0-2 3.3-2 3.3 0v3.1l.8.2v-1.4c0-1.9 3.1-1.9 3.1 0v8.6c0 7.6-4.3 12.3-10.6 12.3-5 0-7.5-2.7-10-7.2l-4.6-8.3c-1-1.8 1.6-3.6 3-2l3.1 3.6z" fill="#fff" stroke="#3a2a1a" stroke-width="2.4" stroke-linejoin="round"/></symbol>

<main>

    <h1 id="title">Rim Word<small id="sub"></small></h1>
    <select id="lvl" aria-label="Level"></select>
    <button class="ctl" id="undo" aria-label="Undo" title="Undo"><svg aria-hidden="true"><use href="#i-undo"/></svg></button>

<script>
(function () {
  'use strict';

    g.edges.forEach(([a, b]) => { x.beginPath(); x.moveTo(px(a), py(a)); x.lineTo(px(b), py(b)); x.stroke(); });
    const ch = new Set();
    g.history.forEach((h, k) => { const next = k + 1 < g.history.length ? g.history[k + 1] : g.col; h.forEach((c, u) => { if (u !== g.hole && c !== next[u]) ch.add(u); }); });
    for (let u = 0; u < g.n; u++) {
      const r = u === g.hole ? 16 : g.rim.includes(u) ? 13 : 10;
      x.beginPath(); x.arc(px(u), py(u), r, 0, 7);
      if (u === g.hole) { const f = g.free(); x.fillStyle = f >= 0 ? LAB.ELEM[f].hex : '#fff'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#3a2a1a'; x.stroke(); continue; }
      x.fillStyle = LAB.ELEM[g.col[u]].hex; x.fill();
      x.lineWidth = ch.has(u) ? 4 : 1.5; x.strokeStyle = ch.has(u) ? '#3a2a1a' : '#00000055'; x.stroke();
    }
    $('reveal').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
  }

  // ---- sound: WebAudio synth, created on the first gesture; silent (never throwing) without it
  let AC = null;
  function audio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (_) { AC = null; } return AC; }
  function tone(f, t, dur, type, vol) {
    if (!AC) return;
    try {
      const o = AC.createOscillator(), gn = AC.createGain(); o.type = type || 'triangle'; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  }
  let noise = null;
  function clack(delay, step) {   // a wooden clack plus a rising tone
    if (!AC) return;
    try {
      const t = AC.currentTime + (delay || 0) / 1000;
      if (!noise) { noise = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }
      const src = AC.createBufferSource(), bp = AC.createBiquadFilter(), gn = AC.createGain();
      src.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = 1400 + 90 * (step || 0); bp.Q.value = 4; gn.gain.value = 0.5;
      src.connect(bp).connect(gn).connect(AC.destination); src.start(t);
      tone(170, t, 0.08, 'sine', 0.14);
      tone(392 * Math.pow(2, (step || 0) / 12), t + 0.02, 0.22, 'triangle', 0.09);
    } catch (_) {}
  }
  function tick(step) { if (AC) tone(660 * Math.pow(2, (step || 0) / 12), AC.currentTime, 0.06, 'square', 0.03); }
  function thud() { if (AC) { tone(140, AC.currentTime, 0.14, 'sine', 0.16); tone(110, AC.currentTime + 0.07, 0.14, 'sine', 0.12); } }
  function shimmer() { if (AC) [1319, 1568, 1976, 2637].forEach((f, k) => tone(f, AC.currentTime + k * 0.07, 0.35, 'sine', 0.035)); }
  function fanfare() { if (AC) [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, k) => tone(f, AC.currentTime + k * (k < 4 ? 0.1 : 0.14), 0.4, 'triangle', 0.1)); }

  window.RIMWORD_PAGE = { load, play: playLetter, hand, state: () => ({ path: path.slice(), word: D.w[cur()], done, hand: hand().map(t => t.ch), canon: g.canon(), col: D.col[cur()], egg: eggHit }) };
  // inside the app a missing chart must not silently play another level: the shell falls back to Islands
  if (LAB.embedded) {
    const L = want && window.GAME.levels.find(l => l.id === want || String(l.num) === want);
    if (!L || !RW[L.id]) throw new Error('Rim Word has no word chart for this level');
    load(L.id);
  } else load(pickId());
})();
</script>
