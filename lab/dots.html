<!doctype html>
<!--
  DOTS: Fill the Hole as a connect-the-dots game (Two Dots feel).

  What the player sees: off-white paper, a faint triangular lattice, and one flat coloured dot per region, every dot
  sitting on a lattice site. Every graph edge is drawn as a thin faint line between two dots (the drawing is checked to
  be honest: no crossings, no line passes under a foreign dot), so "connected" on screen means "neighbours" in the map.
  The hole is the big empty ring in the middle; the rim regions are the 5 larger dots around it. The goal is told in
  dots, not numbers: inside the empty ring sit four little "seed" dots, one per colour. The ring may only take a colour
  that none of its neighbours (the 5 big dots) has, so every seed a neighbour already has is shown as a faint hollow
  ghost; a seed no neighbour has is drawn full and breathing (that is g.free()). At the start all four are ghosts.
  No words on screen: the empty ring breathes slowly (it is the thing to fill), a seed that frees up bounces in, a rim
  dot whose colour leaves the rim sends a small dot of it flying into its seed, and an armed winning chain makes the
  ring glow in the colour it will take (that is "let go"). A dud chain (K.web) just wobbles.

  What the player does: press a dot and drag a single line from dot to dot along the faint lines. The line must
  alternate two colours. The first two dots fix the pair {a, b}; from then on the whole two-colour chain lights up and
  pulses ahead of your finger (you can see where to go) and every other dot fades back. Release (after at least 2 dots),
  or trace every dot of the chain, and the WHOLE chain swaps colours with ripples.

  Exact mapping onto the puzzle:
    press dot u, step to a lattice-line neighbour v      ->  K = g.chainAt(u, g.col[v])   (the {col u, col v} chain)
    every further step must go to a neighbour of the last dot that lies in K (i.e. has one of the two colours);
    stepping back onto the previous dot undoes the step; any other step shakes the line and is ignored.
    the pulsing dots are exactly K.vs; release with >= 2 traced dots, or covering all of K.vs  ->  g.swap(K)
    (the whole chain, not just the traced dots). A chain with K.web is a dud: the dots wobble, nothing changes.
    while a chain is armed, every dot of K gets a thin outer ring in the colour it will turn into, the rest fade, and
    the seeds in the ring show g.preview(K): a seed that would be freed pops up full and the ring glows in its colour.
    Idle hint: after a few quiet seconds (and at once when the empty ring is tapped) a ghost fingertip traces the first
    step of a chain of g.good() while the whole chain glimmers (at most 3 times per quiet stretch; any touch stops it).
    (A one-dot chain, whose neighbours all have other colours, cannot be traced in this gesture; the hint never uses one.)
  Juice (SKIN-SPEC 14, kept calm): the pressed dot glows at once and its candidate chains ring softly; each traced dot
    plays the next note of a rising pentatonic line; the swap flips as a wave from the first dot (50 ms a step), each
    dot with a soft pop; LAB.at(x, y) is called at the last dot so the shell's coins fly from there. All sound goes
    through one warm low-pass (lo-fi).
  Snake run (egg 'snake-run', skins/dots.js): a swap whose line went through EVERY dot of its chain (3 or more dots,
    reaching a colouring not seen before on this level) grows a streak: x2, x3, ... up to x6, each paying streak x 100
    points through LAB.egg, at most 1,800 a level. A small "xN" drifts up from the last dot and fades into the paper.
    A partial swap of a chain that one line could have covered ends the streak; small chains, chains no single line
    covers, revisits, undo and reset leave it alone. The streak carries over to the next level (sessionStorage, 15 min).
  Idle egg 'lava': ~26 s without a touch, the dots start to drift slowly like a lava lamp; any touch settles them.
  Win: g.won() -> the ring fills with g.free() in a small burst, two slow washes of that colour roll out over the board,
    every dot swells as they pass, a slow pentatonic drift over a warm pad (about 3.6 s), then LAB.done(). The skin's
    win flow is 'fade', so the shell fades the board into the next level. Standalone: tap afterwards to play again.
  Tiny glyphs bottom-left / bottom-right: undo (g.undo) and restart (g.reset).
-->

  const fixed = new Set([H, ...g.border]), rimIx = new Map(rim.map((r, i) => [r, i])), IT = 250;

      for (const w of g.adj[u]) {

        if (d < 2 * REST) { const f = REST * REST * 0.4 / (d * d); fx += f * dx / d; fy += f * dy / d; }

// </layout>

// <gesture>  (pure: one step of the traced line; also run by the node smoke test)
// path: dots traced so far; K: the chain fixed by the first two dots (or null); v: the dot under the finger.
function traceStep(g, path, K, v) {

  if (path.length >= 2 && v === path[path.length - 2]) return { type: 'back' };
  if (v === g.hole || path.includes(v)) return { type: 'none' };
  if (!g.adj[last].includes(v)) return { type: 'bad', why: 'far' };
  if (!K) { const K2 = g.chainAt(last, g.col[v]); return K2 ? { type: 'start', K: K2 } : { type: 'bad', why: 'none' }; }

// <snake>  (pure: can this chain be traced end to end in one line? also run by the node smoke test)
// A full snake is a line through every dot of the chain, each step along a drawn line, so the chain's own lines must

    for (const w of nb.get(u)) if (!seen.has(w)) { seen.add(w); if (dfs(w, k + 1)) return true; seen.delete(w); }
    return false; };

  for (const s of starts) { seen.clear(); seen.add(s); if (dfs(s, 1)) return true; if (budget < 0) return false; }
  return false;
}
// The snake-run rule: a swap whose line went through every dot of a chain of 3 or more, reaching a colouring not seen
// before on this level, grows the streak; it pays streak x 100 points (x2 first, up to x6) through LAB.egg, at most
// SNAKE_CAP points a level. A partial swap of a chain that COULD have been snaked ends the streak; anything else

        const s = new Set(pv.col.filter((c, i) => RIM.has(i))); let f = 0; while (s.has(f)) f++;

    }

    flyers = flyers.filter(f => t - f.t0 < 600);

      const k = (t - f.t0) / 600; if (k < 0) continue;
      const [sx, sy] = seedPos(f.e), m = ease(k), lift = Math.sin(Math.PI * k) * U * 0.5;
      cx.fillStyle = COL[f.e]; cx.globalAlpha = 0.9 * (1 - k * 0.4);

    }

    for (const r of ripples) {
      const k = (t - r.t0) / 650; if (k < 0) continue;

      cx.strokeStyle = COL[r.c]; cx.globalAlpha = (1 - k) * 0.6; cx.lineWidth = Math.max(1.5, base * 0.28 * (1 - k));

      const tip = drag.path[drag.path.length - 1], [gx, gy] = sp(tip), base = RIM.has(tip) ? RIMDOT : DOT;
      glow(gx, gy, base * 3, COL[g.col[tip]], 0.42 * Math.min(1, (t - drag.t0) / 40 + 0.5));

        if (C.web || C.size < 2) continue;

          if (u === drag.path[0]) continue;
          const [x, y] = sp(u), b2 = RIM.has(u) ? RIMDOT : DOT, to = g.col[u] === C.pair[0] ? C.pair[1] : C.pair[0];
          cx.strokeStyle = COL[to]; cx.globalAlpha = 0.32 + (rm ? 0 : 0.12 * Math.sin(t / 180)); cx.lineWidth = 1.4; circle(x, y, b2 * 1.5); cx.stroke(); cx.globalAlpha = 1;

      const tip = drag.path[drag.path.length - 1], [tx, ty] = sp(tip);

        if (drag.path.includes(u)) continue;

    if (preK && !preK.web) for (const u of preK.vs) {
      const [x, y] = sp(u), base = RIM.has(u) ? RIMDOT : DOT, to = g.col[u] === preK.pair[0] ? preK.pair[1] : preK.pair[0];
      cx.strokeStyle = COL[to]; cx.globalAlpha = K ? 0.9 : 0.6; cx.lineWidth = Math.max(1.6, base * 0.3); circle(x, y, base * 1.6); cx.stroke(); cx.globalAlpha = 1;
    }

      const k = (t - glimmer.t0) / 1500;
      if (k > 1) glimmer = null;

        const [x, y] = sp(u), base = RIM.has(u) ? RIMDOT : DOT, a = Math.sin(Math.PI * k);

      if (rep >= HINT_REPS) ghostDone();
      else {
        const [x1, y1] = sp(ghost.u), [x2, y2] = sp(ghost.v), m = rm ? 1 : ease(Math.max(0, Math.min(1, (k - 0.15) / 0.5)));
        const a = rm ? 1 : k < 0.1 ? k / 0.1 : k > 0.85 ? (1 - k) / 0.15 : 1, x = x1 + (x2 - x1) * m, y = y1 + (y2 - y1) * m;
        for (const u of ghost.K.vs) { const [gx, gy] = sp(u), base = RIM.has(u) ? RIMDOT : DOT; cx.strokeStyle = INK; cx.globalAlpha = a * 0.35; cx.lineWidth = 1.2; circle(gx, gy, base * (1.5 + 0.25 * Math.sin(t / 110))); cx.stroke(); }

    if (drag) {
      const sh = rm ? 0 : Math.exp(-(t - drag.shakeT) / 90) * Math.sin((t - drag.shakeT) / 18) * U * 0.14;
      cx.save(); cx.translate(sh, 0);

        const [x1, y1] = sp(P[i]), [x2, y2] = sp(P[i + 1]), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
