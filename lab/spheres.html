<!doctype html>
<!--
  Spheres: a remake of the very first test of Fill the Hole, the plain graph drawn as a ball-and-stick model.

  What the player sees: every region of the map is a glossy toy marble in its element colour (fire, water, air, earth;
  thick dark outline, top-left highlight, offset drop shadow), and every pair of neighbouring regions is joined by a
  chunky stick, so the picture is the triangulation itself, laid out as one big triangle (the 3 far "border" regions
  g.border sit at the corners; everything else starts from the planar drawing g.pos mapped affinely into the triangle,
  then is spread out by a planarity-preserving relaxation). The hole is a hollow glass sphere with a "?". Its 5
  neighbours (the rim) are joined by a glowing ring of sticks. The goal indicator at the top is a glass bubble ringed by
  5 little marbles (the rim's colours, live) with a big number (how many elements the rim uses; the goal is g.goal).
  When an element leaves the rim the bubble bounces and a marble of that colour flies out. No words on screen.

  What the player does, and how it maps to the puzzle:
    - Press a sphere: it swells at once and its candidate chains (one per neighbouring element) glow softly.
    - Trace: press a sphere u and drag along a stick onto a neighbour v of a different element. That picks the chain
      g.chainAt(u, col[v]). The chain pulses in its two colours; keep dragging through its spheres (a rising glassy
      chime per sphere). Releasing once every sphere has been traced swaps it (g.swap(K)), calling LAB.at() at the
      release point; the spheres flip in a wave from that point, 30-60 ms apart, each with a pop.
    - Tap-tap: tap sphere u (dashed halo), then a sphere v of another element in u's chain with it: selects the chain.
      With a chain selected, tapping any sphere of it swaps it.
    - Duds (a web chain, a drag off the chain or onto the hole): the spheres jiggle on their sticks. Never a text error.
    - Tapping the glass hole flashes a hint chain (g.good()). Undo / restart are the two chunky corner buttons.
    - A ghost finger drags from a sphere along a stick until the first touch.
  Win: the glass hole fills with g.free() in a burst, then a light show runs out along the sticks (about 3.6 s), then
  LAB.done(). Standalone, a tap after that plays again (g.reset()); embedded, the page idles (the shell owns next).
  Easter egg 'cradle': 5 taps on the glass hole within ~3 s swing the rim spheres like a Newton's cradle, with clicks,
  and post LAB.egg('cradle', 60) once per level.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Spheres</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --dim: #8b949e; --line: #30363d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; overscroll-behavior: none; }
  body { background: radial-gradient(120% 90% at 50% 10%, #1d2638 0%, var(--bg) 62%); background-color: var(--bg);
    color: var(--fg); font: 600 14px/1.2 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .tb { position: fixed; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 4px); width: 48px; height: 46px; border-radius: 15px;
    border: 2.5px solid #05070b; background: var(--sk-ctl, #161b22); color: var(--sk-ctl-ink, #c9d1d9);
    box-shadow: 0 5px 0 var(--sk-ctl-edge, #8b9bb3), 0 7px 0 #05070b, 0 10px 14px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.14);
    font: 900 22px/1 ui-rounded, system-ui, sans-serif; display: grid; place-items: center;
    cursor: pointer; padding: 0; touch-action: manipulation; transition: transform .07s, box-shadow .07s; }
  .tb:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sk-ctl-edge, #8b9bb3), 0 3px 0 #05070b, 0 4px 6px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.1); }
  .tb:focus-visible { outline: 3px solid #ffe066; outline-offset: 3px; }
  #undo { left: 12px; } #reset { right: 12px; }
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Ball-and-stick puzzle board"></canvas>
<div id="sr" class="sr" aria-live="polite"></div>
<button class="tb" id="undo" aria-label="Undo">&#8630;</button>
<button class="tb" id="reset" aria-label="Restart">&#10227;</button>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>
'use strict';
// ---------- pure helpers (no DOM; smoke-tested in node) ----------
// Layout: g.pos is already a planar straight-line drawing whose outer face is the border triangle. Map it affinely
// onto the triangle apex (0.5,0), (1,1), (0,1), then spread the spheres by random hill-climbing on an inverse-power
// repulsion (sphere-sphere and sphere-stick), rejecting any move that flips an inner face (so it stays planar).
function buildLayout(g, its = 120) {
  const n = g.n, C = [[0.5, 0.0], [1.0, 1.0], [0.0, 1.0]], B = g.border;
  const P = Array.from({ length: n }, () => [0.5, 0.66]);
  if (!B || B.length !== 3) { // not a triangulation: just fit g.pos into the unit box
    const xs = g.pos.map(p => p[0]), ys = g.pos.map(p => p[1]), x0 = Math.min(...xs), y0 = Math.min(...ys);
    const s = 1 / Math.max(Math.max(...xs) - x0, Math.max(...ys) - y0, 1e-9);
    return g.pos.map(([x, y]) => [0.5 + (x - (x0 + Math.max(...xs)) / 2) * s, 0.5 + (y - (y0 + Math.max(...ys)) / 2) * s]);
  }

  const [a, b, c] = B.map(x => g.pos[x]), det = (b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1]);
  for (let u = 0; u < n; u++) { const p = g.pos[u];
    const l1 = ((p[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (p[1] - a[1])) / det, l2 = ((b[0] - a[0]) * (p[1] - a[1]) - (p[0] - a[0]) * (b[1] - a[1])) / det, l0 = 1 - l1 - l2;
    P[u] = [l0 * C[0][0] + l1 * C[1][0] + l2 * C[2][0], l0 * C[0][1] + l1 * C[1][1] + l2 * C[2][1]]; }
  const fixed = new Set(B), key = (x, y) => x < y ? x * 1000 + y : y * 1000 + x;
  // inner faces, from the rotation system; their orientation must never flip (keeps the drawing planar)
  const faces = [], seen = new Set([B.slice().sort((x, y) => x - y).join()]);
  for (let u = 0; u < n; u++) { const r = g.rot[u]; for (let i = 0; i < r.length; i++) { const p = r[i], q = r[(i + 1) % r.length];
    if (!g.adj[p].includes(q)) continue; const k = [u, p, q].sort((x, y) => x - y).join(); if (seen.has(k)) continue; seen.add(k); faces.push([u, p, q]); } }
  const area = f => { const [A, Bq, Cq] = f.map(x => P[x]); return (Bq[0] - A[0]) * (Cq[1] - A[1]) - (Bq[1] - A[1]) * (Cq[0] - A[0]); };
  const sg = faces.map(f => Math.sign(area(f)));
  const inc = Array.from({ length: n }, () => []); faces.forEach((f, i) => f.forEach(x => inc[x].push(i)));
  const segD2 = (p, q, r) => { const dx = r[0] - q[0], dy = r[1] - q[1], L = dx * dx + dy * dy; let t = ((p[0] - q[0]) * dx + (p[1] - q[1]) * dy) / L; t = Math.max(0, Math.min(1, t));
    const x = q[0] + t * dx - p[0], y = q[1] + t * dy - p[1]; return x * x + y * y; };
  // energy felt by u: inverse-power repulsion from every other sphere and from sticks not touching u (and u's sticks from spheres)
  const local = u => { let e = 0; const p = P[u];
    for (let v = 0; v < n; v++) if (v !== u) { const d2 = (p[0] - P[v][0]) ** 2 + (p[1] - P[v][1]) ** 2 + 1e-12; e += 1 / (d2 * d2); }
    for (const [x, y] of g.edges) { if (x === u || y === u) { const o = x === u ? y : x; for (let v = 0; v < n; v++) if (v !== u && v !== o) { const d2 = segD2(P[v], p, P[o]) + 1e-12; e += 0.5 / (d2 * d2); } }
      else { const d2 = segD2(p, P[x], P[y]) + 1e-12; e += 0.5 / (d2 * d2); } }
    return e; };
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let it = 0; it < its; it++) {
    const step = 0.06 * (1 - it / its) + 0.004;
    for (let u = 0; u < n; u++) {
      if (fixed.has(u)) continue;
      const old = P[u], e0 = local(u);
      for (let k = 0; k < 4; k++) {
        const ang = rnd() * 6.2832, s = step * (0.3 + rnd());
        P[u] = [old[0] + Math.cos(ang) * s, old[1] + Math.sin(ang) * s];
        if (inc[u].every(i => area(faces[i]) * sg[i] > 1e-4) && local(u) < e0) break;
        P[u] = old;
      }
    }
  }

}
// what a gesture from sphere u onto sphere v means: the {col[u], col[v]} chain through u, if it reaches v
function chainFor(g, u, v) {
  if (u == null || v == null || u === v || u === g.hole || v === g.hole) return null;
  if (g.col[u] === g.col[v]) return null;
  const K = g.chainAt(u, g.col[v]);
  return K && K.set.has(v) ? K : null;
}
// ripple order: BFS depth inside the chain from the sphere the player started on
function rippleDepth(g, K, from) {
  const d = {}; const s = K.set.has(from) ? from : K.vs[0]; d[s] = 0; let fr = [s];
  while (fr.length) { const nx = []; for (const u of fr) for (const v of g.adj[u]) if (K.set.has(v) && d[v] === undefined) { d[v] = d[u] + 1; nx.push(v); } fr = nx; }
  return d;
}
if (typeof document === 'undefined') { module.exports = { buildLayout, chainFor, rippleDepth }; } else (function () {
// A filler test (?filler=1) hands over one combined graph: the level's core plus the filler drawn around it.
// The positions are already the picture, so the layout keeps them instead of pulling the map into a fresh triangle.
(function installFiller() {
  const q = new URLSearchParams(location.search);
  if (q.get('filler') !== '1' || !window.GAME) return;
  let spec = null;
  try { spec = JSON.parse(sessionStorage.getItem('spheres-filler-play') || 'null'); } catch (e) { spec = null; }
  if (!spec || !spec.edges || !spec.col || spec.hole == null) return;
  const key = 'filler-play';
  GAME.graphs[key] = { name: spec.name || 'filler', n: spec.n, hole: spec.hole, link: spec.link, pos: spec.pos, edges: spec.edges, ncol: 4, goal: 3 };
  const level = { id: key, num: 'filler', g: key, title: spec.title || 'Filler', start: spec.col };
  const at = GAME.levels.findIndex(l => l.id === key);
  if (at >= 0) GAME.levels[at] = level; else GAME.levels.push(level);
  if (window.LAYOUT) LAYOUT[key] = { border: [], arcs: {}, centre: spec.pos, cells: null };
})();
// ---------- page ----------
const g = LAB.game();
const E = LAB.ELEM, ICONS = LAB.ICON.map(p => new Path2D(p));
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), srEl = document.getElementById('sr');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const L = buildLayout(g);
let W = 0, H = 0, DPR = 1, S = [], R = 12, stick = 4, IND = { x: 0, y: 0 };
const TOP = 92;

function fit() {
  DPR = Math.min(3, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const top = TOP, bot = 66, side = 10;
  let pad = Math.max(14, Math.min(W, H) * 0.06);
  for (let pass = 0; pass < 2; pass++) {
    const bw = W - 2 * (side + pad), bh = H - top - bot - 2 * pad;
    let tw, th;
    if (bh > bw * 0.866) { tw = bw; th = Math.min(bh, bw * 1.4); } else { th = bh; tw = Math.min(bw, th / 0.866 * 1.18); }
    const ox = (W - tw) / 2, oy = top + pad + (bh - th) / 2;
    S = L.map(([x, y]) => [ox + x * tw, oy + y * th]);
    const ls = g.edges.map(([a, b]) => Math.hypot(S[a][0] - S[b][0], S[a][1] - S[b][1])).sort((a, b) => a - b);
    const med = ls[ls.length >> 1], mn = ls[0];
    R = Math.max(7, Math.min(med * 0.36, mn * 0.46, 30));
    stick = Math.max(3, R * 0.4);
    pad = R + 8;
  }
  IND = { x: W / 2, y: 48 };
}

// ---------- colour helpers ----------
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return 'rgb(' + A.map((x, i) => Math.round(x + (B[i] - x) * t)).join(',') + ')'; };
const rgba = (h, a) => 'rgba(' + hexRgb(h).join(',') + ',' + a + ')';
const INK = '#06080d';

// ---------- sound (AudioContext made on the first gesture; never throws) ----------
let AC = null;
function audio() { if (AC) { try { if (AC.state === 'suspended') AC.resume(); } catch (e) {} return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
function tone(f, dur = 0.12, type = 'sine', gain = 0.08, when = 0) {
  if (!AC) return;
  try {
    const t = AC.currentTime + Math.max(0, when), o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(gain, t + 0.008); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const chime = (f, when = 0) => { tone(f, 0.32, 'sine', 0.05, when); tone(f * 2.76, 0.14, 'sine', 0.018, when); tone(f * 5.4, 0.06, 'sine', 0.008, when); };
const pop = (f, when = 0) => { tone(f, 0.07, 'triangle', 0.05, when); tone(f * 3, 0.025, 'square', 0.012, when); };
const click = (when = 0) => { tone(2400, 0.03, 'square', 0.025, when); tone(1200, 0.05, 'triangle', 0.03, when); };
const bonk = () => { tone(170, 0.18, 'sine', 0.07); tone(120, 0.22, 'triangle', 0.04, 0.03); };
const PENTA = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093];
const pent = i => PENTA[Math.max(0, Math.min(PENTA.length - 1, i))];

// ---------- state ----------
let sel = null;      // { K, anchor, traced: Set }
let pend = null;     // a tapped sphere waiting for its partner
let drag = null;     // { start, cur, K, bad }
let press = null;    // { u, t0, cands: [K] } while a finger is down on a sphere
let anim = null;     // swap wave { t0, delay: {u: ms}, old, K, end }
let winT = 0, hint = null, wob = {}, touched = false, parts = [], lastT = 0, burstDone = false;
let cradle = null, holeTaps = [], eggSent = false;
const WIN_MS = RM ? 1500 : 3600;
const now = () => performance.now();
const ind = { cols: null, n: -1, t0: -1e9 }, lsHit = {};
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

// BFS distance from the hole over the whole graph: the win light show runs out along the sticks in this order
const HD = (() => { const d = new Array(g.n).fill(-1); d[g.hole] = 0; let fr = [g.hole];
  while (fr.length) { const nx = []; for (const u of fr) for (const v of g.adj[u]) if (d[v] < 0) { d[v] = d[u] + 1; nx.push(v); } fr = nx; }
  return d; })();
const HDMAX = Math.max(1, ...HD);

function say() {
  if (g.won()) { const f = g.free(); srEl.textContent = 'Solved. The hole is ' + (f >= 0 ? E[f].name : '') + '.'; return; }
  srEl.textContent = 'The ring uses ' + new Set(g.rimColours()).size + ' elements; goal ' + g.goal + '.';
}
function wobble(u, delay = 0) {
  if (u == null) return; const o = g.adj[u].filter(v => v !== g.hole), v = o.length ? o[(Math.random() * o.length) | 0] : u;
  const dx = S[v][0] - S[u][0], dy = S[v][1] - S[u][1], l = Math.hypot(dx, dy) || 1;
  wob[u] = { t0: now() + delay, dx: dx / l, dy: dy / l };
}

// ---------- gestures ----------
function hit(x, y, tight) {
  let best = null, bd = Infinity; const lim = tight ? R * 1.05 : Math.max(R * 1.35, 22);
  for (let u = 0; u < g.n; u++) { const d = Math.hypot(S[u][0] - x, S[u][1] - y); if (d < bd) { bd = d; best = u; } }
  return bd <= lim ? best : null;
}
function candidates(u) {
  const out = [], seen = new Set();
  for (const v of g.adj[u]) { if (v === g.hole) continue; const c = g.col[v]; if (c === g.col[u] || seen.has(c)) continue; seen.add(c);
    const K = g.chainAt(u, c); if (K && K.size > 1) out.push(K); }
  return out;
}
function select(K, anchor, traced) {
  sel = { K, anchor, traced: new Set(traced) }; pend = null; press = null;
  if (K.web) { K.vs.forEach((u, i) => wobble(u, i * 12)); bonk(); }
  else { chime(pent(0)); chime(pent(1), 0.05); }

}
function doSwap(K, from, x, y) {
  if (K.web) { K.vs.forEach((u, i) => wobble(u, i * 15)); bonk(); sel = null; say(); return; }
  const old = {}; K.vs.forEach(u => { old[u] = g.col[u]; });
  // the wave: spheres flip in order of distance from the touch point, 30-60 ms apart
  if (x == null) { x = S[from][0]; y = S[from][1]; }
  const order = K.vs.slice().sort((a, b) => Math.hypot(S[a][0] - x, S[a][1] - y) - Math.hypot(S[b][0] - x, S[b][1] - y));

function tap(u, x, y) {

  if (u === g.hole) {
    wobble(u); const t = now(); holeTaps = holeTaps.filter(s => t - s < 3000); holeTaps.push(t);

  }
  if (sel && sel.K.set.has(u)) { doSwap(sel.K, u, x, y); return; }

}
// easter egg: Newton's cradle on the rim
function startCradle() {

  if (AC) { click(0); for (let i = 1; i <= 4; i++) click(i * 0.25 * (RM ? 0.6 : 1)); }

let doneSent = false;
function armDone() {
  if (!LAB.embedded || doneSent || !g.won()) return;
  doneSent = true;
  setTimeout(() => { // doSwap assigns winT after g.swap returns, so read it on the next turn
    setTimeout(() => { if (g.won()) LAB.done(); else doneSent = false; }, Math.max(500, (winT || 0) - now() + WIN_MS));
  }, 0);
}
cv.addEventListener('pointerdown', e => {
  audio(); e.preventDefault(); touched = true;
  if (g.won()) { if (!LAB.embedded && now() > winT + WIN_MS) g.reset(); return; }
  const u = hit(e.clientX, e.clientY);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { id: e.pointerId, start: u, cur: u, K: null, bad: null };
  if (u != null && u !== g.hole) { press = { u, t0: now(), cands: candidates(u) }; pop(pent(3)); }
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || drag.start == null || drag.start === g.hole || g.won()) return;
  const v = hit(e.clientX, e.clientY, true);
  if (v == null || v === drag.cur) return;
  if (!drag.K) {
    if (!g.adj[drag.cur].includes(v)) return;              // passing over, not along a stick
    const K = chainFor(g, drag.start, v);
    if (!K) { if (drag.bad !== v) { drag.bad = v; wobble(v); tone(180, 0.08, 'sine', 0.04); } return; }
    drag.K = K; drag.cur = v; select(K, drag.start, [drag.start, v]);
    return;
  }
  if (drag.K.set.has(v)) {
    if (!sel.traced.has(v)) { sel.traced.add(v); chime(pent(sel.traced.size)); }
    drag.cur = v;
  } else if (g.adj[drag.cur].includes(v) && drag.bad !== v) { drag.bad = v; wobble(v); tone(180, 0.08, 'sine', 0.04); }
});
function up(e) {
  if (!drag || drag.id !== e.pointerId) return;
  const d = drag; drag = null; press = null;
  if (g.won()) return;
  if (d.K) { if (sel && sel.K === d.K && sel.traced.size === d.K.size) doSwap(d.K, d.cur, e.clientX, e.clientY); return; }
  if (d.start === g.hole || d.start == null || hit(e.clientX, e.clientY) === d.start) tap(d.start, e.clientX, e.clientY);
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', e => { if (drag && drag.id === e.pointerId) { drag = null; press = null; } });
document.getElementById('undo').addEventListener('click', () => { audio(); touched = true; if (g.won() && LAB.embedded) return; if (!g.won() || now() > winT + WIN_MS) g.undo(); });

g.on((_, info) => {

window.PLAYLAB = { get won() { return !!(winT && now() > winT); } };

// ---------- particles ----------
function spark(x, y, c, n, sp = 1) {
  if (RM) n = Math.min(n, 2);

    parts.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, t0: now(), life: 600 + Math.random() * 500, c, s: 2 + Math.random() * 3 }); }
}
function star(x, y, s) {
  ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * 0.32 : s; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); ctx.fill();
}
function drawParts(t, dt) {
  parts = parts.filter(p => t - p.t0 < p.life);
  for (const p of parts) {
    const k = (t - p.t0) / p.life; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += (p.k === 'ball' ? 0.32 : 0.04) * dt / 16;

}

// ---------- drawing ----------
function marble(x, y, r, c, glow, sx = 1) {

  gr.addColorStop(0, mix(e.pastel, '#ffffff', 0.5 + 0.4 * glow)); gr.addColorStop(0.28, glow > 0.01 ? mix(e.neon, '#ffffff', glow * 0.3) : e.neon);

  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-r * 0.12, -r * 0.6, r * 0.07, 0, 7); ctx.fill();

}
function dropShadow(x, y, r) { ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.beginPath(); ctx.arc(x + r * 0.16, y + r * 0.26, r * 1.02, 0, 7); ctx.fill(); }
function glass(x, y, r, t) {

  gr.addColorStop(0, 'rgba(225,236,255,.30)'); gr.addColorStop(0.7, 'rgba(110,130,170,.16)'); gr.addColorStop(1, 'rgba(190,210,245,.45)');
  ctx.fillStyle = '#121826'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();

    const k = RM ? 1 : Math.min(1, (t - winT) / 600), f = g.free();

  }

  ctx.strokeStyle = 'rgba(200,220,255,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r - r * 0.12, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - r * 0.46, r * 0.22, r * 0.12, -0.6, 0, 7); ctx.fill();

function stickLine(a, b, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function dispCol(u, t) {

// the goal indicator: a glass bubble, the 5 rim colours round it as little marbles, and the count in the middle
function indicator(t, won) {

    ind.t0 = t;

  const gg = ctx.createRadialGradient(-br * 0.3, -br * 0.35, 1, 0, 0, br);
  if (f >= 0) { gg.addColorStop(0, E[f].pastel); gg.addColorStop(0.6, E[f].hex); gg.addColorStop(1, E[f].dark); }
  else { gg.addColorStop(0, 'rgba(225,236,255,.4)'); gg.addColorStop(0.7, 'rgba(60,76,110,.9)'); gg.addColorStop(1, 'rgba(150,175,220,.9)'); }

  ctx.font = `900 ${Math.round(24 * s)}px ui-rounded, "SF Pro Rounded", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.strokeText(String(n), 0, 1.5);
  ctx.fillStyle = n <= g.goal ? '#ffe066' : '#ffffff'; ctx.fillText(String(n), 0, 1.5);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-br * 0.42, -br * 0.5, br * 0.22, br * 0.11, -0.6, 0, 7); ctx.fill();

}
// ghost finger: from a sphere of a useful chain along a stick onto its partner, until the first touch
const GHOST = (() => { const K = g.good()[0]; if (!K) return null;
  for (const u of K.vs) for (const v of g.adj[u]) if (K.set.has(v) && g.col[v] !== g.col[u]) return [u, v]; return null; })();
function ghost(t, P) {

  const x = P[u][0] + (P[v][0] - P[u][0]) * m, y = P[u][1] + (P[v][1] - P[u][1]) * m;
  ctx.save(); ctx.globalAlpha = a * 0.92;

    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, R * (1.15 + 0.15 * Math.sin(t / 90)), 0, 7); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(-4, 4, 14, 34, 7); ctx.roundRect(-6, 24, 30, 26, 11); ctx.fill();
  ctx.fillStyle = '#f4f6fb'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(-7, 0, 14, 34, 7); ctx.roundRect(-9, 20, 30, 26, 11); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4f6fb'; ctx.fillRect(-5.5, 19, 11, 6);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(-2, 6, 2, 4, 0, 0, 7); ctx.fill();

}

function frame() {
  const t = now(), dt = Math.min(50, lastT ? t - lastT : 16); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ctx.lineCap = 'round';
  if (anim && t > anim.t0 + anim.end + 600) anim = null;
  if (hint && t > hint.t0 + 1800) hint = null;
  if (cradle && t > cradle.t0 + (RM ? 600 : 1050)) cradle = null;
  const h = g.hole, rimSet = new Set(g.rim), won = !!(winT && t > winT), wt = won ? t - winT : 0;
  // positions: jiggles on the sticks, the cradle swing
  const P = S.map((p, u) => { const w = wob[u]; if (w === undefined || t < w.t0) return p; const k = (t - w.t0) / 420; if (k > 1 || RM) { delete wob[u]; return p; }
    const d = Math.sin(k * 30) * R * 0.24 * (1 - k); return [p[0] + w.dx * d, p[1] + w.dy * d]; });
  if (cradle) {
    const k = (t - cradle.t0) / (RM ? 600 : 1050), rim = g.rim, m = rim.length, seg = Math.min(3, Math.floor(k * 4)), q = k * 4 - seg;
    const end = seg % 2 ? rim[m - 1] : rim[0], nb = seg % 2 ? rim[m - 2] : rim[1];
    const sw = Math.sin(q * Math.PI) * R * (RM ? 0.5 : 1.1);
    const dx = S[end][0] - S[nb][0], dy = S[end][1] - S[nb][1], l = Math.hypot(dx, dy) || 1;
    const ox = S[end][0] - S[h][0], oy = S[end][1] - S[h][1], ol = Math.hypot(ox, oy) || 1;
    P[end] = [S[end][0] + dx / l * sw + ox / ol * sw * 0.35, S[end][1] + dy / l * sw + oy / ol * sw * 0.35];
    if (q < 0.12) for (let i = 1; i < m - 1; i++) { const u = rim[i]; P[u] = [S[u][0] + Math.sin(t / 8) * 1.2, S[u][1]]; }

  for (const [a, b] of g.edges) if (a !== h && b !== h) stickLine(P[a], P[b], stick + 3, 'rgba(0,0,0,.3)');

  for (const [a, b] of g.edges) {

    stickLine(P[a], P[b], stick, ls > 0.05 ? mix('#3d4760', E[g.col[a]].neon, Math.min(1, ls)) : '#3d4760');
    ctx.save(); ctx.translate(0, -stick * 0.2); stickLine(P[a], P[b], stick * 0.32, 'rgba(190,205,235,.42)'); ctx.restore();
  }

  for (const v of g.adj[h]) stickLine(P[h], P[v], Math.max(1.4, stick * 0.35), won ? rgba(E[g.free()].neon, 0.85) : 'rgba(170,195,235,.45)');
  ctx.setLineDash([]);
  // the rim ring
  const pulse = RM ? 0.5 : 0.5 + 0.5 * Math.sin(t / 420);
  ctx.save(); ctx.shadowColor = won ? E[g.free()].neon : 'rgba(140,190,255,.9)'; ctx.shadowBlur = 10 + 6 * pulse;
  for (let i = 0; i < g.rim.length; i++) { const a = g.rim[i], b = g.rim[(i + 1) % g.rim.length]; if (!g.adj[a].includes(b)) continue;
    stickLine(P[a], P[b], stick * 1.25, won ? rgba(E[g.free()].neon, 0.95) : `rgba(165,205,255,${0.55 + 0.25 * pulse})`); }

    for (const [a, b] of g.edges) { if (!K.set.has(a) || !K.set.has(b)) continue; ctx.shadowColor = E[g.col[b]].neon;
      const gr = ctx.createLinearGradient(P[a][0], P[a][1], P[b][0], P[b][1]); gr.addColorStop(0, E[g.col[a]].neon); gr.addColorStop(1, E[g.col[b]].neon);

addEventListener('resize', fit);
fit(); say(); requestAnimationFrame(frame);
window.SPHERES = { g, screen: () => S, radius: () => R };   // for debugging / smoke tests
