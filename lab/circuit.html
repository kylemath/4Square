<!doctype html>
<!--
  CIRCUIT: Fill the Hole, inverted. You don't paint the map; the map is already painted. You wire it.

  What the player sees: a printed circuit board. Every region of the map is an LED soldered in place, glowing in
  its element colour (fire / water / air / earth). Every pair of neighbouring regions is joined by a gold copper
  trace. The three far "border" regions sit on the board's left, right and bottom edges, and their mutual traces
  run round the board perimeter as rails. In the middle, where the hole is, sits an empty IC socket (U1) with 5 input pins wired to the 5 rim LEDs;
  each input wire carries its LED's colour, and a chip readout shows how many colours arrive (4). The socket only
  powers up when its inputs carry at most 3 colours (the 4 -> 3 meter in the header says the same).

  What the player does: CONNECT. Press an LED and drag along one of its traces to a neighbouring LED (or tap one LED
  then tap a neighbour): a jumper wire snaps onto that trace with a solder spark. The two LEDs you joined have two
  colours, a and b, and the jumper closes the whole bi-colour circuit that runs through them: every LED reachable
  from the joint by hopping only between a- and b-coloured LEDs. That circuit is drawn live (two-colour current
  dashes on its traces, rings on its LEDs, everything else dims) BEFORE you commit, and the meter shows what the
  socket would see. Then throw the power switch (or tap an LED on the live circuit): current runs out from the
  joint and every LED on the circuit swaps its two colours as the current reaches it.

  Exact mapping onto the puzzle:
    jumper from LED u to adjacent LED v        ->  K = g.chainAt(u, g.col[v])   (the {col u, col v} Kempe chain
                                                   through u; it contains v; the hole/socket is never an LED)
    the circuit that lights up                 ->  K.vs (LEDs) and the traces between them
    throwing the power switch                  ->  g.swap(K); flow order = BFS depth from the joint inside K
    a circuit that is the board's only {a,b}   ->  K.web: the breaker trips, nothing changes (swapping it would
      network                                      only rename two colours everywhere)
    socket input meter                         ->  g.rimCount() (preview: g.preview(K).rimCount)
    socket powers up                           ->  g.won(); its colour is g.free()
  Undo / restart are g.undo() / g.reset(). No rule is re-implemented here; all state goes through lab/core.js.
-->

  EL.forEach((e, i) => { const rg = mk('radialGradient', { id: 'h' + i }, defs); mk('stop', { offset: 0, 'stop-color': e.neon, 'stop-opacity': 0.75 }, rg); mk('stop', { offset: 0.45, 'stop-color': e.neon, 'stop-opacity': 0.22 }, rg); mk('stop', { offset: 1, 'stop-color': e.neon, 'stop-opacity': 0 }, rg); });
  const glow = mk('filter', { id: 'gl', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs); mk('feGaussianBlur', { stdDeviation: 2.2 }, glow);
  mk('rect', { x: 0, y: 0, width: q(W), height: q(H), fill: 'url(#bgg)' }, svg);
  mk('rect', { x: 0, y: 0, width: q(W), height: q(H), fill: 'url(#mask)', opacity: 0.8 }, svg);
  const m = LAY.m * H, tw = Math.max(2, R * 0.28);
  mk('rect', { x: q(m * 0.35), y: q(m * 0.35), width: q(W - m * 0.7), height: q(H - m * 0.7), rx: 8, fill: 'none', stroke: '#1d6b4a', 'stroke-width': 1, 'stroke-dasharray': '1 4' }, svg);
  const sx = q(m + 10), sy = q(H - m - 8);
  const sl = mk('text', { x: sx, y: sy, class: 'silk' }, svg); sl.textContent = 'FTH-' + g.num + ' · ' + (g.n - 1) + ' LED · U1';
  gTr = mk('g', {}, svg); gIn = mk('g', {}, svg); gHi = mk('g', {}, svg); gJ = mk('g', {}, svg); gSock = mk('g', {}, svg); gLed = mk('g', {}, svg); gFx = mk('g', {}, svg);
  trEl.clear();
  // perimeter rails between the three corner LEDs
  const [tl, tr] = LAY.top, bt = LAY.bot, c = Math.min(m * 0.8, 14), X0 = q(m), X1 = q(W - m), Y0 = q(m), Y1 = q(H - m);
  const rails = [[tl, tr, 'M' + X0 + ' ' + q(P[tl][1]) + 'V' + q(m + c) + 'Q' + X0 + ' ' + Y0 + ' ' + q(m + c) + ' ' + Y0 + 'H' + q(W - m - c) + 'Q' + X1 + ' ' + Y0 + ' ' + X1 + ' ' + q(m + c) + 'V' + q(P[tr][1])],
    [tr, bt, 'M' + X1 + ' ' + q(P[tr][1]) + 'V' + q(H - m - c) + 'Q' + X1 + ' ' + Y1 + ' ' + q(W - m - c) + ' ' + Y1 + 'H' + q(P[bt][0])],
    [tl, bt, 'M' + X0 + ' ' + q(P[tl][1]) + 'V' + q(H - m - c) + 'Q' + X0 + ' ' + Y1 + ' ' + q(m + c) + ' ' + Y1 + 'H' + q(P[bt][0])]];
  const isRail = new Map(rails.map(r => [ek(r[0], r[1]), r[2]]));
  g.edges.forEach(([a, b]) => {
    if (a === g.hole || b === g.hole) return;
    const d = isRail.get(ek(a, b)) || ('M' + q(P[a][0]) + ' ' + q(P[a][1]) + 'L' + q(P[b][0]) + ' ' + q(P[b][1]));
    mk('path', { d, class: 'trb', 'stroke-width': q(tw + 2.5), transform: 'translate(0.8 1.2)' }, gTr);
    const e = mk('path', { d, class: 'tr', 'stroke-width': q(tw) }, gTr); e.dataset.d = d; trEl.set(ek(a, b), e);
    if (!isRail.has(ek(a, b))) { const mx = (P[a][0] + P[b][0]) / 2, my = (P[a][1] + P[b][1]) / 2; mk('circle', { cx: q(mx), cy: q(my), r: q(tw * 0.9), fill: '#05231a', stroke: 'var(--gold)', 'stroke-width': q(tw * 0.55) }, gTr); }
  });
  // socket at the hole, with 5 input wires to the rim
  const h = P[g.hole], S = R * 1.35; inEls = [];
  g.rim.forEach(x => { const e = mk('path', { d: 'M' + q(P[x][0]) + ' ' + q(P[x][1]) + 'L' + q(h[0]) + ' ' + q(h[1]), class: 'in', 'stroke-width': q(Math.max(1.6, tw * 0.75)) }, gIn); inEls.push(e); });
  sock = { g: mk('g', { transform: 'translate(' + q(h[0]) + ' ' + q(h[1]) + ')' }, gSock) };
  sock.halo = mk('circle', { r: q(S * 3.4), fill: 'url(#h0)', opacity: 0 }, sock.g);
  for (let i = -2; i <= 2; i++) { mk('rect', { x: q(-S - 4), y: q(i * S * 0.36 - 1.2), width: q(S * 2 + 8), height: 2.4, fill: '#b9bec4' }, sock.g); }
  sock.body = mk('rect', { x: q(-S), y: q(-S), width: q(S * 2), height: q(S * 2), rx: 3, fill: '#111614', stroke: '#3a4a42', 'stroke-width': 1.2 }, sock.g);
  mk('circle', { cx: q(-S * 0.62), cy: q(-S * 0.62), r: q(S * 0.12), fill: '#2c3631' }, sock.g);
  sock.num = mk('text', { y: q(S * 0.38), 'text-anchor': 'middle', fill: '#ff4a3d', 'font-size': q(S * 1.05), 'font-weight': 800, 'font-family': 'ui-monospace,Menlo,Consolas,monospace', filter: 'url(#gl)' }, sock.g);
  sock.num2 = mk('text', { y: q(S * 0.38), 'text-anchor': 'middle', fill: '#ffb0a8', 'font-size': q(S * 1.05), 'font-weight': 800, 'font-family': 'ui-monospace,Menlo,Consolas,monospace' }, sock.g);
  sock.icon = mk('path', { opacity: 0 }, sock.g);
  const lb = mk('text', { y: q(S + 10), 'text-anchor': 'middle', class: 'silk' }, sock.g); lb.textContent = 'U1';
  // LEDs

    const G = mk('g', { class: 'led', transform: 'translate(' + q(P[u][0]) + ' ' + q(P[u][1]) + ')' }, gLed);
    const o = { g: G };

    o.inner = mk('g', {}, G);
    o.body = mk('circle', { r: q(R), stroke: 'rgba(0,0,0,.45)', 'stroke-width': 1.2 }, o.inner);
    mk('ellipse', { cx: q(-R * 0.3), cy: q(-R * 0.38), rx: q(R * 0.38), ry: q(R * 0.24), fill: '#fff', opacity: 0.45 }, o.inner);
    o.icon = mk('path', { transform: 'translate(' + q(-R * 0.62) + ' ' + q(-R * 0.6) + ') scale(' + (R * 1.24 / 24).toFixed(3) + ')' }, o.inner);

  }
  // win ripple delays: hop distance from the socket

  trEl.forEach((e, k) => { const [a, b] = k.split('-').map(Number); e.style.transitionDelay = RM ? '0s' : (Math.min(hd[a], hd[b]) * 0.12) + 's'; });
  render();
}

// ---------- state ----------
let sel = null;            // probed LED (tap-tap connecting)
let drag = null;           // { u, id, x, y, moved, v, K }
let armed = null;          // { K, u, v } a soldered, live circuit waiting for power
let anim = null;           // { t0, dep, old, K, trip, end }
let wonShown = false;

const colAt = u => {
  if (anim && !anim.trip && anim.dep.has(u) && performance.now() < anim.t0 + anim.dep.get(u) * STEP + 60) return anim.old[u];
  return g.col[u];
};
const iconAttrs = (o, e) => { o.setAttribute('d', ICON[e]); if (e === 2) { o.setAttribute('fill', 'none'); o.setAttribute('stroke', EL[e].dark); o.setAttribute('stroke-width', 2.6); o.setAttribute('stroke-linecap', 'round'); } else { o.setAttribute('fill', EL[e].dark); o.setAttribute('stroke', 'none'); } };

function currentCircuit() { if (anim) return { K: anim.K }; return drag && drag.K ? { K: drag.K, u: drag.u, v: drag.v } : armed; }

function render() {
  if (!ledG.length) return;
  const cc = currentCircuit(), K = cc && cc.K;
  for (let u = 0; u < g.n; u++) {
    const o = ledG[u]; if (!o) continue; const e = colAt(u);
    if (o.e !== e) { o.e = e; o.body.setAttribute('fill', EL[e].hex); o.halo.setAttribute('fill', 'url(#h' + e + ')'); iconAttrs(o.icon, e); }
    const inK = K && K.set.has(u), probe = sel != null && (u === sel || g.adj[sel].includes(u));
    o.g.classList.toggle('dim', !!(K ? !inK : (sel != null && !probe)));
    o.ring.setAttribute('opacity', (inK || u === sel) ? 0.9 : (!K && probe) ? 0.5 : 0);
    o.ring.setAttribute('stroke', K ? (K.web ? '#ffb36b' : '#fff') : '#ffe9a3');
  }
  // socket inputs
  g.rim.forEach((x, i) => { const e = colAt(x); inEls[i].setAttribute('stroke', EL[e].neon); });
  const live = g.won() && !anim;
  const rimNow = new Set(g.rim.map(colAt));
  sock.num.textContent = sock.num2.textContent = live ? '' : String(rimNow.size);
  if (live) {
    const f = g.free(); sock.body.setAttribute('fill', EL[f].hex); sock.halo.setAttribute('fill', 'url(#h' + f + ')'); sock.halo.setAttribute('opacity', 1);
    sock.icon.setAttribute('transform', 'translate(' + q(-R * 0.85) + ' ' + q(-R * 0.85) + ') scale(' + (R * 1.7 / 24).toFixed(3) + ')'); iconAttrs(sock.icon, f); sock.icon.setAttribute('opacity', 1);
  } else { sock.body.setAttribute('fill', '#111614'); sock.halo.setAttribute('opacity', 0); sock.icon.setAttribute('opacity', 0); }
  // circuit preview: bi-colour current on every trace inside K

  if (K) {
    const [a, b] = K.pair, tw = Math.max(2, R * 0.28);
    trEl.forEach((el, k) => {
      const [x, y] = k.split('-').map(Number); if (!K.set.has(x) || !K.set.has(y)) return;
      const d = el.dataset.d;

      mk('path', { d, class: 'cur', stroke: EL[a].neon, 'stroke-width': q(tw * 1.3) }, gHi);
      mk('path', { d, class: 'cur d', stroke: EL[b].neon, 'stroke-width': q(tw * 1.3) }, gHi);
    });
  }

  const jw = Math.max(2.5, R * 0.3);
  if (drag && drag.moved) {

  } else if (armed) {
    const s = P[armed.u], e = P[armed.v], mx = (s[0] + e[0]) / 2, my = (s[1] + e[1]) / 2, dx = e[0] - s[0], dy = e[1] - s[1], L = Math.hypot(dx, dy) || 1, k = Math.min(L * 0.35, R * 1.6);

    mk('path', { d: path, stroke: '#e9eef2', 'stroke-width': q(jw), fill: 'none', 'stroke-linecap': 'round' }, gJ);
    [s, e].forEach(p => mk('circle', { cx: q(p[0] + (cx - p[0]) * 0.22), cy: q(p[1] + (cy - p[1]) * 0.22), r: q(jw * 0.95), fill: '#cfd5da', stroke: '#7d868d', 'stroke-width': 1 }, gJ));
  }

  pips.forEach((p, i) => { p.classList.toggle('on', pvSet ? pvSet.has(i) : rimNow.has(i)); p.classList.toggle('gone', !!(pvSet && rimNow.has(i) && !pvSet.has(i))); });
  $('mnum').textContent = shown; $('mnum').classList.toggle('ok', shown <= g.goal);

// ---------- fx ----------
let fxRun = false; const sparks = [];
function spark(x, y, n, col) {
  if (RM) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120; sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, t: 0, life: 0.25 + Math.random() * 0.3, c: col || (Math.random() < 0.5 ? '#fff6c8' : '#ffd36b'), el: mk('circle', { r: 1.6 + Math.random() * 1.4, fill: col || '#fff3c4' }, gFx) }); }
  loop();
}
let lastT = 0;
function loop() { if (fxRun) return; fxRun = true; lastT = performance.now(); requestAnimationFrame(tick); }
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.t += dt; s.vy += 260 * dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.t > s.life) { s.el.remove(); sparks.splice(i, 1); continue; } s.el.setAttribute('cx', q(s.x)); s.el.setAttribute('cy', q(s.y)); s.el.setAttribute('opacity', (1 - s.t / s.life).toFixed(2)); }
  if (anim) stepAnim(now);
  if (sparks.length || anim) requestAnimationFrame(tick); else fxRun = false;
}
function stepAnim(now) {
  const el = now - anim.t0;
  anim.dep.forEach((d, u) => { if (!anim.done.has(u) && el >= d * STEP) { anim.done.add(u); const o = ledG[u]; if (!anim.trip) { o.inner.classList.remove('pop'); void o.inner.getBoundingClientRect(); o.inner.classList.add('pop'); if (!RM && Math.random() < 0.7) spark(P[u][0], P[u][1], 3, EL[g.col[u]].neon); if (!anim.blips.has(d)) { anim.blips.add(d); SND.blip(d); } } } });
  render();
  if (el >= anim.end) {
    const a = anim; anim = null;
    if (a.trip) { svg.classList.remove('shake'); swEl.classList.remove('on'); }
    else { swEl.classList.remove('on'); if (g.won()) winMoment(); }
    render();
  }
}

// ---------- actions ----------
function solder(u, v) {
  const K = circuitFor(g, u, v); if (!K) return fizzle(u);
  armed = { K, u, v }; sel = null; SND.snap();
  spark((P[u][0] + P[v][0]) / 2, (P[u][1] + P[v][1]) / 2, 12); render();
}
function fizzle(u) { SND.fizz(); if (u != null && ledG[u] && !RM) { const o = ledG[u].g; o.classList.remove('shake'); void o.getBoundingClientRect(); o.classList.add('shake'); setTimeout(() => o.classList.remove('shake'), 600); } }
function fire() {
  if (!armed || anim || g.won()) { swEl.classList.remove('nudge'); void swEl.offsetWidth; swEl.classList.add('nudge'); SND.fizz(); return; }
  const { K, u, v } = armed, dep = flowDepth(g, K, u, v), maxD = Math.max(...dep.values());
  swEl.classList.add('on');
  if (K.web) {
    // the breaker trips: the loop is the whole board's {a,b} network, swapping it would only rename colours
    anim = { t0: performance.now(), dep, old: g.col.slice(), K, trip: true, end: RM ? 300 : 650, done: new Set(), blips: new Set() };
    SND.hum(); setTimeout(() => { SND.trip(); brkEl.classList.remove('trip'); void brkEl.offsetWidth; brkEl.classList.add('trip'); if (!RM) svg.classList.add('shake'); spark(P[u][0], P[u][1], 16, '#ff7a52'); }, RM ? 0 : 300);
    armed = null; setTimeout(() => { brkEl.classList.remove('trip'); }, 900);
    loop(); render(); return;
  }
  SND.hum();
  const old = g.col.slice(); armed = null;
  anim = { t0: performance.now(), dep, old, K, trip: false, end: maxD * STEP + 200, done: new Set(), blips: new Set(), keepK: K };
  g.swap(K);
  loop(); render();
}
function winMoment() {
  wonShown = true; SND.win(); svg.classList.add('live'); winEl.classList.add('show');
  const h = P[g.hole]; spark(h[0], h[1], 40, EL[g.free()].neon); spark(h[0], h[1], 20);
  ledG.forEach(o => { if (o && !RM) { o.inner.classList.remove('pop'); void o.inner.getBoundingClientRect(); o.inner.classList.add('pop'); } });
}
g.on((_, info) => {
  if (info.type !== 'swap') { anim = null; armed = null; sel = null; drag = null; wonShown = false; svg.classList.remove('live'); winEl.classList.remove('show'); swEl.classList.remove('on'); }
  render();
});


// ---------- input ----------
function pt(e) { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function hit(x, y, reach) {
  let best = null, bd = Infinity;
  for (let u = 0; u < g.n; u++) { if (u === g.hole) continue; const d = Math.hypot(P[u][0] - x, P[u][1] - y); if (d < bd) { bd = d; best = u; } }
  return bd <= (reach || Math.max(R * 1.7, 24)) ? best : null;
}
function aim(u, x, y) {
  // which trace out of u is the finger pulling along? (or which neighbour is it on)
  const on = hit(x, y, R * 1.3); if (on != null && on !== u && g.adj[u].includes(on)) return on;
  const dx = x - P[u][0], dy = y - P[u][1], L = Math.hypot(dx, dy); if (L < R * 1.1) return null;
  let best = null, bc = 0.8;
  g.adj[u].forEach(v => { if (v === g.hole) return; const vx = P[v][0] - P[u][0], vy = P[v][1] - P[u][1], c = (vx * dx + vy * dy) / (Math.hypot(vx, vy) * L); if (c > bc) { bc = c; best = v; } });
  return best;
}
svg.addEventListener('pointerdown', e => {
  audio(); e.preventDefault();
  if (g.won() && !anim) { if (wonShown) g.reset(); return; }
  if (anim || drag) return;
  const [x, y] = pt(e), u = hit(x, y);
  if (u == null) {
    const h = P[g.hole]; if (Math.hypot(x - h[0], y - h[1]) < R * 1.8) { fizzle(null); cueEl._c = ''; cueEl.innerHTML = 'U1 takes no jumper: wire the <b>LEDs</b> so its inputs drop to 3'; return; }
    if (sel != null || armed) { sel = null; armed = null; render(); } return;
  }
  drag = { u, id: e.pointerId, x, y, moved: false, v: null, K: null, x0: x, y0: y };
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
});
svg.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const [x, y] = pt(e); drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.x0, y - drag.y0) > Math.max(8, R * 0.7)) { drag.moved = true; sel = null; }
  if (!drag.moved) return;
  const v = aim(drag.u, x, y);
  if (v !== drag.v) { drag.v = v; drag.K = v == null ? null : circuitFor(g, drag.u, v); if (v != null) SND.probe(); }
  render();
});
function up(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.moved) { if (d.v != null) solder(d.u, d.v); else { fizzle(d.u); render(); } return; }
  const u = d.u;
  if (armed && armed.K.set.has(u) && sel == null) { fire(); return; }
  if (sel != null && sel !== u && g.adj[sel].includes(u)) { solder(sel, u); return; }
  if (sel === u) { sel = null; render(); return; }
  sel = u; armed = null; SND.probe(); render();
}
svg.addEventListener('pointerup', up);
svg.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) { drag = null; render(); } });
swEl.addEventListener('click', () => { audio(); if (g.won() && !anim) { g.reset(); return; } fire(); });
$('undo').addEventListener('click', () => { audio(); if (!anim) g.undo(); });
$('rst').addEventListener('click', () => { audio(); g.reset(); });
winEl.addEventListener('click', () => g.reset());
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 80); });
build();
</script>
