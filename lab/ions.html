<!doctype html>
<!--
  ION CHANNELS (lab front end, round 3: a sibling of Petting Zoo's "pens" representation, in a living cell)

  What the player sees: a dark, softly glowing cell split into four membrane chambers (Tide, Ember, Amber, Iris: four
  hues, four internal textures, four particle shapes: round, triangle, square, diamond). Every map region except the
  hole is an ion drifting with Brownian motion inside its chamber; the chamber it lives in is its element, and an ion
  always takes its chamber's colour and shape. The map is never drawn. The hidden relation: two ions that are
  neighbours on the map repel each other (like charges) and can never share a chamber (the legal colouring). It is only
  shown when it matters: while you hold an ion, faint field lines run from it to every ion it repels.

  The signal (the hole) is a large five-armed molecule waiting at a receptor in the outer membrane. It is repelled by
  five ions (g.rim), which carry a small white star; the tip of each of its five arms shows the shape and colour of the
  chamber that ion is in right now (so 2+1+1+1 at the start, and the goal is two pairs and a single, 2+2+1). Each chamber
  has a receptor badge: a bright open ring when none of the five are inside, a dim disc with a count when blocked.
  Goal: free one chamber. g.won() is exactly "some chamber holds none of the five", and g.free() is that chamber: a
  channel opens from the receptor into it, the signal travels down and docks with a bioluminescent pulse.

  The move (one gesture = exactly one g.swap(K), or nothing): drag/flick ion u from chamber A into chamber B (or tap u,
  then tap chamber B). K = g.chainAt(u, B), the {A, B} chain through u.

  Attraction and repulsion (round 4: the chain made physical). While you hold u over chamber B, K "links up": its
  members are pulled out of their Brownian drift by spring-dampers along the map edges inside K (only edges with both
  ends in K), zipping up one BFS layer at a time from u. They bulge out of their membranes (which become a weak elastic
  tether) and form a glowing snake of alternating colours, A B A B ... (a tree in general; every bond joins an A ion to
  a B ion). Bonds are underdamped springs: they overshoot, sag into a curve when slack and thin out when stretched;
  members also repel each other a little so the tree spreads out. Ions that are NOT in K but are map neighbours of a
  member are repelled (a small push and faint dashed field lines ending in a shield arc), and they never join: you can
  see where the snake is closed off (a neighbour in a third or fourth chamber pushes back but stays out). If K holds two
  or more of the starred rim ions (K.rimHits >= 2), the bonds of the tree that join them glow gold, so you see both
  arms of the signal flip together (a "lock"). Without a hover (holding u in its own chamber) the old field lines from u
  to every ion it repels are shown instead.

  The shape (round 5: topology at a glance). chainShape() studies H, the map edges between members of K: its cycle count
  E - V + 1, a short cycle basis (the shortest cycle through each loop edge, kept when independent over GF(2)), and
  its tails (what peels away leaf by leaf before only loops remain). H is bipartite (two alternating kinds), so every
  loop has even length. A stress layout of H (classical-MDS start, then stress majorization on graph distances) gives
  every member a target point; while the snake is linked these targets are hung from the held ion, swung round
  (12 rotations x 2 reflections) to fit the cell around the finger with the least movement, and pull the members
  with target springs on top of the bond springs. So a path lies as a LINE, a tree as a branched line, one cycle as a
  RING, a cycle with tails as a "6", two cycles as an "8" (two rings sharing a member or an edge, or joined by a bar),
  more as beaded rings. Every basis loop gets a faint tinted fill, and a caption names the shape: "line of 5",
  "ring of 6", "6: ring of 4 + tail of 3", "8: rings of 4 and 6", "3 rings of 6, 6, 8" (plus the lock or web note).

  The chameleon flip: on release g.swap(K) is called at once (so the embed report is immediate) and the colour change
  runs down the snake like a wave over chameleon skin: from u outward along the bonds, BFS layer by layer, each ion's
  new colour and shape wiping across it in the direction the wave arrived from, with a bright front travelling along
  every bond. When the wave has reached the tips the snake folds
  and pairs off: a maximum matching of H (augmenting paths) pulls each matched pair into a tight two-ion domino (one
  of each kind, drawn in a dark capsule), the other bonds let go, and any member left unmatched gets a dashed ring. It
  holds for about 0.6 s with a caption ("3 pairs + 1 left over", or "4 pairs, even") and the count of each kind
  ("4 Amber · 3 Tide"), so odd and even chains read at a glance. Only then do the bonds relax (their rest length grows, their strength fades)
  and the members drift home to their new chambers, pulled in by their membranes. A lone ion that repels nobody in B
  just flips and moves (single-region chain), so every chain is reachable by moving any one of its members. If K.web is
  true (chambers A and B would exchange all their ions, which changes nothing) g.swap is NOT called: the snake forms
  (dimmer bonds), then sags under its own weight and falls back into the same equilibrium. With prefers-reduced-motion
  the snake forms at once, the flip is instant (no wave) and the dominoes appear without folding. Undo (g.undo) and
  restart (g.reset) are the two small glass buttons; they stream wrong-chambered ions home through membrane channels. After a win, a tap restarts (standalone only).
-->
<html lang="en">

<body>
<canvas id="c" aria-label="Ion channels"></canvas>
<div id="ui"><button id="undo" title="Undo" aria-label="Undo">&#8630;</button><button id="again" title="Start over" aria-label="Start over">&#8634;</button></div>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- pure helpers (also used by the node smoke test)
  const KIND = [
    { name: 'Tide', col: '#3ef0b4', rgb: [62, 240, 180], deep: '#0d4a3c' },
    { name: 'Ember', col: '#ff5f8f', rgb: [255, 95, 143], deep: '#4d1028' },
    { name: 'Amber', col: '#ffbd3a', rgb: [255, 189, 58], deep: '#4a3208' },
    { name: 'Iris', col: '#8f93ff', rgb: [143, 147, 255], deep: '#1d1f5a' },
  ];

  // chambers as a 2x2 cell (1xNC when very wide, 2+1 for 3), under the receptor band; ion radius from capacity
  function layoutCell(W, H, NC, cap) {
    const wide = W > H * 1.25;
    const gh = Math.round(Math.max(76, Math.min(150, wide ? H * 0.22 : H * 0.18)));
    const pad = Math.max(10, Math.min(20, W * 0.035)), gap = Math.max(8, Math.min(18, W * 0.03));
    const top = gh + 8, ah = Math.max(40, H - top - pad), aw = W - 2 * pad;
    const cols = (wide && aw / ah > 2.3) ? NC : Math.min(2, NC), rows = Math.ceil(NC / cols);
    const ch = [];
    for (let k = 0; k < NC; k++) {
      const r = Math.floor(k / cols), inRow = Math.min(cols, NC - r * cols), c = k - r * cols;
      const cw = (aw - (inRow - 1) * gap) / inRow, chh = (ah - (rows - 1) * gap) / rows;
      const x = pad + c * (cw + gap), y = top + r * (chh + gap);
      ch.push({ k, x, y, w: cw, h: chh, cx: x + cw / 2, cy: y + chh / 2, rx: Math.max(12, cw / 2 - 3), ry: Math.max(12, chh / 2 - 3) });
    }
    const area = Math.min(...ch.map(c => Math.PI * c.rx * c.ry));
    const r = Math.max(4, Math.min(18, Math.sqrt(0.45 * area / Math.max(1, cap)) / 2.6));
    return { W, H, gh, pad, top, aw, ah, ch, r };
  }

  // the two ends of the channel between chambers A and B (on A's membrane, on B's membrane)
  function pores(L, A, B) {
    const a = L.ch[A], b = L.ch[B], dx = b.cx - a.cx, dy = b.cy - a.cy, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const ta = 1 / Math.hypot(ux / a.rx, uy / a.ry), tb = 1 / Math.hypot(ux / b.rx, uy / b.ry);
    return [[a.cx + ux * ta, a.cy + uy * ta], [b.cx - ux * tb, b.cy - uy * tb]];
  }

  // the cascade: the members of chain K in BFS layers from the ion that was moved
  function cascade(g, K, u) {
    const seen = new Set([u]), layers = [[u]];
    let front = [u];
    while (front.length) {
      const nx = [];
      for (const v of front) for (const w of g.adj[v]) if (K.set.has(w) && !seen.has(w)) { seen.add(w); nx.push(w); }
      if (nx.length) layers.push(nx);
      front = nx;
    }
    return layers;
  }

  // gesture -> chain: moving ion u into chamber B means chain g.chainAt(u, B); nothing when B is its own chamber
  function moveFor(g, u, B) {
    if (u === g.hole || B == null || B < 0 || B >= g.NC || B === g.col[u]) return null;
    const K = g.chainAt(u, B);
    if (!K) return null;
    return { K, web: K.web, from: g.col[u], to: B, layers: cascade(g, K, u) };
  }

  // which chamber does a release at (x, y) mean? Inside or nearest; a swipe that stays in its own chamber but
  // clearly points at another one counts for that one (forgiving flicks on a small tile).
  function chamberFor(L, x, y, from, dx, dy) {
    if (y < L.gh - 6) return null;
    let best = null, bd = Infinity;
    L.ch.forEach(p => {
      const ex = Math.max(p.x - x, 0, x - p.x - p.w), ey = Math.max(p.y - y, 0, y - p.y - p.h), d = Math.hypot(ex, ey);
      if (d < bd) { bd = d; best = p.k; }
    });
    const len = Math.hypot(dx || 0, dy || 0);
    if (best === from && from != null && len > Math.max(28, L.r * 2)) {
      const P = L.ch[from]; let bc = 0.5, alt = null;
      L.ch.forEach(q => {
        if (q.k === from) return;
        const vx = q.cx - P.cx, vy = q.cy - P.cy, c = (vx * dx + vy * dy) / (Math.hypot(vx, vy) * len);
        if (c > bc) { bc = c; alt = q.k; }
      });
      if (alt != null) return alt;
    }
    return best;
  }

  // the shape of a chain. H = the map edges between members of K (vs[0] is the ion that was moved). Returns the cycle
  // count (E - V + 1), a short cycle basis (every cycle has even length: H is bipartite), the tails (what is left
  // after peeling leaves until only loops remain), a kind (line, tree, ring, six, eight, beads), a caption, a maximum
  // matching (the dominoes) and a stress layout in units of one bond.
  function chainShape(vs, pairs) {
    const n = vs.length, idx = new Map(vs.map((v, i) => [v, i])), nb = Array.from({ length: n }, () => []);
    const E = pairs.map(([a, b]) => [idx.get(a), idx.get(b)]);
    E.forEach(([a, b], k) => { nb[a].push([b, k]); nb[b].push([a, k]); });
    let comps = 0; const seen = new Array(n).fill(false);
    for (let s = 0; s < n; s++) { if (seen[s]) continue; comps++; seen[s] = true; const st = [s]; while (st.length) { const v = st.pop(); for (const [w] of nb[v]) if (!seen[w]) { seen[w] = true; st.push(w); } } }
    const cyc = E.length - n + comps, deg0 = nb.map(x => x.length);
    // peel leaves: what remains is the 2-core (the loops and the bars between them); the rest are tails
    const deg = deg0.slice(), gone = new Array(n).fill(false), q = [];
    deg.forEach((d, i) => { if (d <= 1) q.push(i); });
    while (q.length) { const v = q.pop(); if (gone[v]) continue; gone[v] = true; for (const [w] of nb[v]) if (!gone[w] && --deg[w] <= 1) q.push(w); }
    const tails = [];
    if (cyc > 0) {
      const tseen = new Array(n).fill(false);
      for (let s = 0; s < n; s++) {
        if (!gone[s] || tseen[s]) continue;
        let c = 0; const st = [s]; tseen[s] = true;
        while (st.length) { const v = st.pop(); c++; for (const [w] of nb[v]) if (gone[w] && !tseen[w]) { tseen[w] = true; st.push(w); } }
        tails.push(c);
      }
      tails.sort((a, b) => b - a);
    }
    // a short cycle basis: for every loop edge, the shortest cycle through it; keep the independent ones (over GF(2)),
    // shortest first
    const cand = [], keys = new Set();
    E.forEach(([a, b], k) => {
      if (gone[a] || gone[b]) return;
      const prev = new Map([[a, -1]]), pe = new Map(); let fr = [a];
      while (fr.length && !prev.has(b)) {
        const nx = [];
        for (const v of fr) for (const [w, kk] of nb[v]) if (kk !== k && !gone[w] && !prev.has(w)) { prev.set(w, v); pe.set(w, kk); nx.push(w); }
        fr = nx;
      }
      if (!prev.has(b)) return;
      const cv = [], es = [k]; let x = b;
      while (x !== a) { cv.push(x); es.push(pe.get(x)); x = prev.get(x); }
      cv.push(a);
      let mask = 0n; es.forEach(e => { mask |= 1n << BigInt(e); });
      const key = mask.toString(36); if (keys.has(key)) return; keys.add(key);
      cand.push({ cv, mask });
    });
    cand.sort((x, y) => x.cv.length - y.cv.length);
    const rows = new Map(), cycles = [];
    for (const c of cand) {
      if (cycles.length >= cyc) break;
      let m = c.mask;
      while (m) {
        const top = m.toString(2).length - 1;
        if (rows.has(top)) m ^= rows.get(top); else { rows.set(top, m); cycles.push(c.cv.map(i => vs[i])); break; }
      }
    }
    const lens = cycles.map(c => c.length), tl = tails.length ? ' + ' + (tails.length === 1 ? 'tail of ' + tails[0] : 'tails of ' + tails.join(', ')) : '';
    let kind, text;
    if (cyc <= 0) {
      kind = Math.max(0, ...deg0) <= 2 ? 'line' : 'tree';
      text = n === 1 ? 'a single ion' : kind === 'line' ? 'line of ' + n : 'branched line of ' + n;
    } else if (cyc === 1) { kind = tails.length ? 'six' : 'ring'; text = kind === 'ring' ? 'ring of ' + n : '6: ring of ' + lens[0] + tl; }
    else if (cyc === 2) { kind = 'eight'; text = '8: rings of ' + lens[0] + ' and ' + lens[1] + tl; }
    else { kind = 'beads'; text = cyc + ' rings of ' + lens.join(', ') + tl; }
    // maximum matching (H is bipartite: the two kinds), by augmenting paths
    const side = new Array(n).fill(-1); side[0] = 0;
    { const st = [0]; while (st.length) { const v = st.pop(); for (const [w] of nb[v]) if (side[w] < 0) { side[w] = 1 - side[v]; st.push(w); } } }
    const mate = new Array(n).fill(-1);
    const aug = (v, vis) => { for (const [w] of nb[v]) { if (vis[w]) continue; vis[w] = true; if (mate[w] < 0 || aug(mate[w], vis)) { mate[w] = v; mate[v] = w; return true; } } return false; };
    for (let v = 0; v < n; v++) if (side[v] === 0 && mate[v] < 0) aug(v, new Array(n).fill(false));
    const match = [], single = [];
    for (let v = 0; v < n; v++) { if (mate[v] < 0) single.push(vs[v]); else if (v < mate[v]) match.push([vs[v], vs[mate[v]]]); }
    const count = [0, 0]; side.forEach(s => { count[Math.max(0, s)]++; });
    // stress layout (graph distance = target distance), started on a circle in DFS order so loops open up untwisted
    const D = Array.from({ length: n }, (_, s) => { const d = new Array(n).fill(Infinity); d[s] = 0; let fr = [s]; while (fr.length) { const nx = []; for (const v of fr) for (const [w] of nb[v]) if (d[w] === Infinity) { d[w] = d[v] + 1; nx.push(w); } fr = nx; } return d; });
    // start from classical MDS (top two eigenvectors of the double-centred squared distances, by power iteration):
    // untwisted, so loops open up as rings
    const Dm = D.map(r => r.map(d => d === Infinity ? n : d)), B = Dm.map(r => r.map(d => -.5 * d * d));
    const rm = B.map(r => r.reduce((a, b) => a + b, 0) / n), gm = rm.reduce((a, b) => a + b, 0) / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) B[i][j] += gm - rm[i] - rm[j];
    const eig = (prev) => {
      let v = Array.from({ length: n }, (_, i) => Math.sin(i * 1.7 + prev.length * 2.3 + 1)), lam = 0;
      for (let it = 0; it < 120; it++) {
        prev.forEach(([u]) => { const d = v.reduce((a, x, i) => a + x * u[i], 0); v = v.map((x, i) => x - d * u[i]); });
        const w = B.map(r => r.reduce((a, x, j) => a + x * v[j], 0)), nr = Math.hypot(...w) || 1;
        lam = nr; v = w.map(x => x / nr);
      }
      return [v, lam];
    };
    const e1 = eig([]), e2 = eig([e1]);
    const X = e1[0].map(x => x * Math.sqrt(e1[1])), Y = e2[0].map(y => y * Math.sqrt(Math.max(1e-6, e2[1])));
    for (let i = 0; i < n; i++) { X[i] += 1e-3 * Math.sin(i * 3.1); Y[i] += 1e-3 * Math.cos(i * 2.7); }
    for (let it = 0; it < (n > 1 ? 160 : 0); it++) for (let i = 0; i < n; i++) {
      let sx = 0, sy = 0, sw = 0;
      for (let j = 0; j < n; j++) {
        if (i === j || D[i][j] === Infinity) continue;
        const w = 1 / (D[i][j] * D[i][j]), dx = X[i] - X[j], dy = Y[i] - Y[j], d = Math.hypot(dx, dy) || 1e-3;
        sx += w * (X[j] + D[i][j] * dx / d); sy += w * (Y[j] + D[i][j] * dy / d); sw += w;
      }
      if (sw) { X[i] = sx / sw; Y[i] = sy / sw; }
    }
    const lay = new Map(vs.map((v, i) => [v, [X[i], Y[i]]]));
    return { n, edges: E.length, cyc, cycles, tails, kind, text, match, single, count, side: new Map(vs.map((v, i) => [v, side[i]])), lay };
  }

  window.IONS = { KIND, layoutCell, pores, cascade, moveFor, chamberFor, chainShape };
  if (window.IONS_TEST) return;

  // ---------------------------------------------------------------- the cell
  const g = LAB.game();
  const HUD = new URLSearchParams(location.search).get('hud'); // 'full'/'compact': the app already shows title and stars; this page draws neither
  const NC = g.NC, hole = g.hole, rimSet = new Set(g.rim), NR = g.rim.length;
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const FONT = "Quicksand, 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  const now = () => performance.now();
  const rgba = (k, a) => `rgba(${KIND[k].rgb[0]},${KIND[k].rgb[1]},${KIND[k].rgb[2]},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  const TAU = Math.PI * 2;

  // unit glyph paths (radius about 1)
  function glyph(c, k, s) {
    c.beginPath();
    if (k === 0) c.arc(0, 0, s, 0, TAU);
    else if (k === 1) { c.moveTo(0, -1.2 * s); c.lineTo(1.1 * s, .75 * s); c.lineTo(-1.1 * s, .75 * s); c.closePath(); }
    else if (k === 2) { const q = .86 * s, rr = .25 * s; c.moveTo(-q + rr, -q); c.arcTo(q, -q, q, q, rr); c.arcTo(q, q, -q, q, rr); c.arcTo(-q, q, -q, -q, rr); c.arcTo(-q, -q, q, -q, rr); c.closePath(); }
    else { c.moveTo(0, -1.22 * s); c.lineTo(1.0 * s, 0); c.lineTo(0, 1.22 * s); c.lineTo(-1.0 * s, 0); c.closePath(); }
  }
  function star(c, x, y, s, pts) {
    c.beginPath();
    for (let i = 0; i < 2 * pts; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? s * .42 : s; c[i ? 'lineTo' : 'moveTo'](x + rr * Math.cos(a), y + rr * Math.sin(a)); }
    c.closePath();
  }

  // pre-rendered sprites: a soft glow and a crisp core per kind (drawn scaled each frame)
  const SP = 128, SC = SP / 2 / 2.6; // sprite px, core radius inside the sprite
  const glowSpr = [], coreSpr = [];
  for (let k = 0; k < 4; k++) {
    const a = document.createElement('canvas'); a.width = a.height = SP; const c = a.getContext('2d');
    const gr = c.createRadialGradient(SP / 2, SP / 2, 0, SP / 2, SP / 2, SP / 2);
    gr.addColorStop(0, rgba(k, .75)); gr.addColorStop(.3, rgba(k, .28)); gr.addColorStop(.6, rgba(k, .08)); gr.addColorStop(1, rgba(k, 0));
    c.fillStyle = gr; c.fillRect(0, 0, SP, SP); glowSpr.push(a);
    const b = document.createElement('canvas'); b.width = b.height = SP; const d = b.getContext('2d');
    d.translate(SP / 2, SP / 2);
    const cg = d.createRadialGradient(-SC * .35, -SC * .4, SC * .1, 0, 0, SC * 1.25);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(.35, KIND[k].col); cg.addColorStop(1, KIND[k].deep);
    glyph(d, k, SC); d.fillStyle = cg; d.fill();
    d.lineWidth = SC * .1; d.strokeStyle = 'rgba(255,255,255,.75)'; d.stroke();
    coreSpr.push(b);
  }

  // ---- state
  const P = []; // ions: { v, x, y, vx, vy, s, tr, px, py }
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let v = 0; v < g.n; v++) if (v !== hole) P[v] = { v, x: 0, y: 0, vx: 0, vy: 0, s: .85 + rnd() * .3, tr: null, ph: rnd() * TAU };
  const disp = g.col.slice(); // the chamber each ion is SHOWN in (lags g.col while a cascade plays)
  let L = null, bg = null, dpr = 1, R = 10;
  const chan = new Map(); // open channels 'A-B' -> { A, B, t0, t1 }
  const rings = [], notes = [];
  let winTok = 0, held = null, sel = null, busy = false, won = false, hoverCh = null, hope = false;
  const mol = { x: 0, y: 0, R: 10, hx: 0, hy: 0, hR: 10, phase: 'wait', t0: 0, path: null, F: -1 };

  // ---- the snake: chain K linking up along its map edges while you hold an ion over another chamber

    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d * w / 2, ny = dx / d * w / 2;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(a[0] + nx, a[1] + ny); ctx.lineTo(b[0] + nx, b[1] + ny); ctx.moveTo(a[0] - nx, a[1] - ny); ctx.lineTo(b[0] - nx, b[1] - ny); ctx.stroke();
    // flowing sparks along the tube
    ctx.fillStyle = `rgba(230,250,255,${(.5 * alpha).toFixed(3)})`;
    for (let i = 0; i < 4; i++) { const f = ((t * .0012 + i / 4) % 1); ctx.beginPath(); ctx.arc(a[0] + dx * f, a[1] + dy * f, 1.4, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawMolecule(t, x, y, Rm, glowBoost) {
    const br = 1 + (RM ? 0 : .04 * Math.sin(t * (hope ? .012 : .003))), rot = RM ? 0 : t * .00015;
    const hueA = (t * .02) % 360;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    let gr = ctx.createRadialGradient(x, y, 0, x, y, Rm * 3.2);
    const a0 = (hope ? .5 : .28) + (glowBoost || 0);
    gr.addColorStop(0, `hsla(${hueA},90%,85%,${a0})`); gr.addColorStop(.4, `hsla(${hueA + 60},90%,70%,${a0 * .3})`); gr.addColorStop(1, 'hsla(0,0%,100%,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, Rm * 3.2, 0, TAU); ctx.fill();
    ctx.restore();
    // arms
    const tips = [];
    for (let i = 0; i < NR; i++) { const a = -Math.PI / 2 + i * TAU / NR + rot; tips.push([x + Math.cos(a) * Rm * 2.35 * br, y + Math.sin(a) * Rm * 2.35 * br, a]); }
    ctx.strokeStyle = 'rgba(235,245,255,.55)'; ctx.lineWidth = Math.max(1.2, Rm * .14); ctx.lineCap = 'round';
    tips.forEach(([tx, ty, a]) => { ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * Rm * .8, y + Math.sin(a) * Rm * .8); ctx.quadraticCurveTo(x + Math.cos(a + .25) * Rm * 1.6, y + Math.sin(a + .25) * Rm * 1.6, tx, ty); ctx.stroke(); });
    // ring core
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = rot * 2 + i * TAU / 6; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * Rm * br, y + Math.sin(a) * Rm * br); }
    ctx.closePath();
    gr = ctx.createRadialGradient(x - Rm * .3, y - Rm * .3, 0, x, y, Rm * 1.1);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(.6, `hsl(${hueA},70%,82%)`); gr.addColorStop(1, `hsl(${hueA + 70},60%,55%)`);
    ctx.fillStyle = gr; ctx.fill(); ctx.lineWidth = Math.max(1, Rm * .08); ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; star(ctx, x, y, Rm * .45, 5); ctx.fill();
    return tips;
  }

  function drawBand(t) {
    const gh = L.gh;
    if (mol.phase === 'wait' || mol.phase === 'travel') {
      // receptor cup in the outer membrane
      ctx.strokeStyle = 'rgba(150,230,255,.5)'; ctx.lineWidth = 2;
      const cy = L.top - L.pad * .55;
      ctx.beginPath(); ctx.moveTo(mol.hx - mol.hR * 1.3, cy); ctx.quadraticCurveTo(mol.hx, cy - mol.hR * 1.0, mol.hx + mol.hR * 1.3, cy); ctx.stroke();
    }
    if (mol.phase === 'wait') {
      const tips = drawMolecule(t, mol.x, mol.y, mol.R, 0);
      const mr = Math.max(6, mol.R * .5);
      g.rim.forEach((v, i) => {
        const [tx, ty] = tips[i], k = disp[v], G = mr * 2.6, lit = (held === v || sel === v);
        ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(glowSpr[k], tx - G * (lit ? 1.6 : 1.1), ty - G * (lit ? 1.6 : 1.1), G * (lit ? 3.2 : 2.2), G * (lit ? 3.2 : 2.2)); ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(coreSpr[k], tx - G, ty - G, G * 2, G * 2);
      });
    }
    // goal line
    const x0 = mol.hx + mol.hR * 3.1, x1 = L.W - 44, w = x1 - x0;
    if (w > 60) {
      let l1, l2;
      if (won) { l1 = mol.phase === 'docked' ? 'Signal received' : 'A channel opens…'; l2 = mol.phase === 'docked' && !busy && !LAB.embedded ? 'tap to play again' : ''; }
      else { l1 = 'Free a chamber for the signal'; l2 = g.goal >= NC - 1 ? 'none of its ' + NR + ' ✦ ions may be inside' : 'the ' + NR + ' ✦ ions may use only ' + g.goal + ' chambers'; }
      let f1 = Math.max(10, Math.min(20, gh * .17)); ctx.font = `700 ${f1}px ${FONT}`;
      while (f1 > 9 && ctx.measureText(l1).width > w) { f1 -= .5; ctx.font = `700 ${f1}px ${FONT}`; }
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillStyle = won ? '#fff6c8' : '#d8f3ff';
      ctx.fillText(l1, x0, gh * (l2 ? .4 : .5));
      if (l2) {
        let f2 = Math.max(9, f1 * .72); ctx.font = `500 ${f2}px ${FONT}`;
        while (f2 > 8 && ctx.measureText(l2).width > w) { f2 -= .5; ctx.font = `500 ${f2}px ${FONT}`; }
        if (ctx.measureText(l2).width <= w) { ctx.fillStyle = 'rgba(190,225,240,.7)'; ctx.fillText(l2, x0, gh * .4 + f1 * .5 + f2 * .85); }
      }
    }
  }

  function drawBadge(C, t) {
    const n = rivalsIn(C.k), a = -Math.PI * .28, x = C.cx + Math.cos(a) * C.rx * .99, y = C.cy + Math.sin(a) * C.ry * .99;
    const b = Math.max(9, Math.min(16, R * .95));
    if (mol.phase === 'docked' && C.k === mol.F) return;
    ctx.beginPath(); ctx.arc(x, y, b, 0, TAU);
    if (n === 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(x, y, 0, x, y, b * 2.4); gr.addColorStop(0, 'rgba(255,250,220,.6)'); gr.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, b * 2.4, 0, TAU); ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(x, y, b, 0, TAU); ctx.fillStyle = '#0a1a22'; ctx.fill();
      ctx.lineWidth = 2.2; ctx.strokeStyle = '#fff6c8'; ctx.stroke();
      ctx.fillStyle = '#fff6c8'; star(ctx, x, y, b * .6, 5); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(8,14,20,.9)'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(C.k, .45); ctx.stroke();
      ctx.fillStyle = 'rgba(220,235,245,.85)'; star(ctx, x - b * .32, y, b * .38, 5); ctx.fill();
      ctx.font = `700 ${b * 1.05}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n, x + b * .38, y + b * .05);
    }
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(bg, 0, 0, L.W, L.H);
    // chamber membranes
    L.ch.forEach(C => {
      const hot = hoverCh === C.k, home = mol.phase === 'docked' && mol.F === C.k;
      ctx.globalCompositeOperation = 'lighter';
      if (hot || home) { membrane(C, t, 0); ctx.fillStyle = rgba(C.k, hot ? .1 + .05 * Math.sin(t * .01) : .08); ctx.fill(); }
      membrane(C, t, 0); ctx.lineWidth = hot ? 9 : 6; ctx.strokeStyle = rgba(C.k, hot ? .22 : .1); ctx.stroke();
      ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(C.k, hot ? .95 : .55);
      membrane(C, t, -2.2 / C.rx); ctx.stroke(); membrane(C, t, 2.2 / C.rx); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    });
    // open channels
    for (const [key, c] of chan) {
      if (t > c.t1 + 300) { chan.delete(key); continue; }
      const al = Math.max(0, Math.min(1, (t - c.t0) / 200, (c.t1 + 300 - t) / 300));
      if (al > 0) { const [pa, pb] = pores(L, c.A, c.B); bezierTube(pa, pb, Math.max(10, R * 2.6), c.A, c.B, al, t); }
    }
    // receptor channel on a win
    if (mol.path && (mol.phase === 'travel' || mol.phase === 'docked')) {
      const al = mol.phase === 'travel' ? Math.min(1, (t - mol.t0) / 300) : Math.max(0, 1 - (t - mol.t0) / 1200);
      if (al > 0) for (let i = 0; i < mol.path.length - 2; i++) bezierTube(mol.path[i], mol.path[i + 1], Math.max(14, mol.hR * 1.8), mol.F, mol.F, al, t);
    }
    // field lines from the held / selected ion to everyone it repels (until a hovered chamber turns them into a snake)
    const focus = held != null ? held : sel;
    if (focus != null && !S) {
      const p = P[focus];
      ctx.setLineDash([3, 6]); ctx.lineDashOffset = -t * .03; ctx.lineWidth = 1.4;
      g.adj[focus].forEach(w => {
        const q = w === hole ? { x: mol.x, y: mol.y } : P[w], dx = q.x - p.x, dy = q.y - p.y;
        const gr = ctx.createLinearGradient(p.x, p.y, q.x, q.y);
        gr.addColorStop(0, rgba(disp[focus], .7)); gr.addColorStop(1, w === hole ? 'rgba(255,250,220,.8)' : rgba(disp[w], .7));
        ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo((p.x + q.x) / 2 - dy * .18, (p.y + q.y) / 2 + dx * .18, q.x, q.y); ctx.stroke();
      });
      ctx.setLineDash([]);
    }
    // ion glows and streaks (snake members glow brighter as they link, and flare as they flip)
    ctx.globalCompositeOperation = 'lighter';
    const rep = focus != null && !S ? new Set(g.adj[focus]) : null;
    P.forEach(p => {
      if (!p) return;
      const k = disp[p.v], lk = S ? linkOf(S, p.v, t) : 0;
      const boost = (rep && rep.has(p.v)) ? 1.5 : (p.v === focus ? 1.7 : 1 + .45 * lk), s = R * p.s * 2.6 * boost;
      ctx.drawImage(glowSpr[k], p.x - s, p.y - s, s * 2, s * 2);
      if (p.fl != null) { const e = (t - p.fl) / FLIP_MS; if (e < 1) { const G = R * p.s * 2.6 * (1.4 + 1.6 * e); ctx.globalAlpha = 1 - e; ctx.drawImage(glowSpr[k], p.x - G, p.y - G, G * 2, G * 2); ctx.globalAlpha = 1; } }
      if (p.tr && p.px != null) { ctx.strokeStyle = rgba(k, .45); ctx.lineWidth = R * .9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.px - (p.x - p.px) * 3, p.py - (p.y - p.py) * 3); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    });
    ctx.globalCompositeOperation = 'source-over';
    // the snake: bonds between members, field lines to the outsiders
    ghosts.forEach(gh => drawSnake(gh.s, t, Math.max(0, 1 - (t - gh.t0) / gh.dur)));
    if (S) drawSnake(S, t, 1);
    ctx.globalCompositeOperation = 'lighter';
    // win pulses
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i], f = (t - r.t0) / r.dur; if (f < 0) continue; if (f >= 1) { rings.splice(i, 1); continue; }
      const rad = R * 2 + f * Math.max(L.W, L.H) * .8;
      ctx.strokeStyle = `rgba(255,250,215,${((1 - f) * .55).toFixed(3)})`; ctx.lineWidth = 10 * (1 - f) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
      ctx.strokeStyle = rgba(r.k, (1 - f) * .35); ctx.lineWidth = 24 * (1 - f); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    // ion cores
    P.forEach(p => {
      if (!p) return;
      const lift = p.v === held ? 1.2 : 1;
      drawIon(p, lift, t);
      if (rimSet.has(p.v)) {
        const lockd = S && !S.web && S.phase === 'form' && S.rims.length >= 2 && linkOf(S, p.v, t) > .5;
        ctx.fillStyle = lockd ? '#ffe08a' : '#ffffff';
        star(ctx, p.x + R * p.s * .8, p.y - R * p.s * .8, Math.max(2.6, R * (lockd ? .62 + .08 * Math.sin(t * .01) : .42)), 5); ctx.fill();
      }
    });
    // win: the signal travels the channel / sits docked
    if (mol.phase === 'travel') {
      const f = Math.min(1, (t - mol.t0) / mol.dur), e = ease(f), pts = mol.path;
      const seg = [], tot = []; let T = 0;
      for (let i = 0; i < pts.length - 1; i++) { const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(d); T += d; tot.push(T); }
      let at = e * T, i = 0; while (i < seg.length - 1 && at > tot[i]) i++;
      const s0 = i ? tot[i - 1] : 0, q = seg[i] ? (at - s0) / seg[i] : 1;
      mol.x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * q; mol.y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * q;
      mol.R = mol.hR + (R * 2 - mol.hR) * e;
      drawMolecule(t, mol.x, mol.y, mol.R, .2);
    } else if (mol.phase === 'docked') {
      const f = Math.min(1, (t - mol.t0) / 600);
      drawMolecule(t, mol.x, mol.y, mol.R, .5 * (1 - f) + .15);
    }
    L.ch.forEach(C => drawBadge(C, t));
    snakeCaption(t);
    drawBand(t);
    // floating notes ("equilibrium")
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i], f = (t - n.t0) / n.dur; if (f < 0) continue; if (f >= 1) { notes.splice(i, 1); continue; }
      ctx.font = `700 ${Math.max(11, R * .9)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(220,240,255,${(Math.sin(Math.PI * f) * .9).toFixed(3)})`; ctx.fillText('≈ ' + n.text, n.x, n.y - f * R * 2);
    }
  }

  let last = now();
  function frame() {
    const t = now();
    const dt = Math.min(.033, Math.max(0, (t - last) / 1000)); last = t;
    if (L.r !== R) R += (L.r - R) * Math.min(1, dt * 4);
    snakeTick(t); transits(t);
    if (S) { physics(dt / 2, t); physics(dt / 2, t); } else physics(dt, t); // springs get two substeps
    draw(t);
    requestAnimationFrame(frame);
  }

  // ---- input (pointer events: drag, swipe or flick; or tap an ion then tap a chamber)
  let down = null;
  function pt(e) { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  function ionAt(x, y) {
    let best = null, bd = Math.max(R * 1.8, 22);
    P.forEach(p => { if (!p || p.tr) return; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p.v; } });
    return best;
  }
  cv.addEventListener('pointerdown', e => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; } }
    else if (ac.state === 'suspended') ac.resume();
    if (won && !busy) { if (!LAB.embedded) restart(); return; }   // in the app the shell owns the next step
    if (busy || won) return;
    const [x, y] = pt(e), u = ionAt(x, y);
    if (u == null) {
      if (sel != null) { const B = chamberFor(L, x, y, null, 0, 0); if (B != null && B !== disp[sel]) { doMove(sel, B); return; } }
      sel = null; return;
    }
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    down = { u, x0: x, y0: y, moved: false, hist: [[x, y, now()]], wasSel: sel === u };
    held = u; sel = null; hoverCh = null; sfx.pick();
    P[u].vx = P[u].vy = 0;
  });
  cv.addEventListener('pointermove', e => {
    if (!down) return;
    const [x, y] = pt(e), p = P[down.u];
    if (!down.moved && Math.hypot(x - down.x0, y - down.y0) > 8) down.moved = true;
    if (!down.moved) return;
    const h0 = down.hist[down.hist.length - 1], hdt = Math.max(.008, (now() - h0[2]) / 1000);
    p.vx = p.vx * .5 + (x - h0[0]) / hdt * .5; p.vy = p.vy * .5 + (y - h0[1]) / hdt * .5; // carried on release
    p.x = x; p.y = y - R * .3;
    down.hist.push([x, y, now()]); if (down.hist.length > 6) down.hist.shift();
    let B = chamberFor(L, x, y, disp[down.u], x - down.x0, y - down.y0);
    if (B === disp[down.u]) B = null;
    if (B !== hoverCh) {
      hoverCh = B; const m = B != null ? moveFor(g, down.u, B) : null; hope = !!(m && !m.web && g.preview(m.K).won);
      dropSnake(); if (m) S = makeSnake(m, down.u); // the would-be chain links up
    }
  });
  function release(e, cancel) {
    if (!down) return;
    const d = down; down = null; hoverCh = null; hope = false;
    const [x, y] = pt(e);
    if (cancel) { held = null; dropSnake(); return; }
    if (!d.moved) { held = null; dropSnake(); sel = d.wasSel ? null : d.u; return; }
    const from = disp[d.u];
    let B = chamberFor(L, x, y, from, x - d.x0, y - d.y0);
    if (B === from) {
      const h = d.hist, h0 = h[0], dt = Math.max(30, h[h.length - 1][2] - h0[2]);
      let px = (x - h0[0]) / dt * 140, py = (y - h0[1]) / dt * 140; const pl = Math.hypot(px, py), cap = Math.max(60, R * 4);
      if (pl > cap) { px *= cap / pl; py *= cap / pl; }
      B = chamberFor(L, x + px, y + py, from, x - d.x0 + px, y - d.y0 + py);
    }
    doMove(d.u, B);
  }
  cv.addEventListener('pointerup', e => release(e, false));
  cv.addEventListener('pointercancel', e => release(e, true));

  document.getElementById('undo').onclick = () => { if (!busy && !won) g.undo(); };
  document.getElementById('again').onclick = () => { if (won && LAB.embedded) return; if (!busy || won) restart(); };
  window.PLAYLAB = { win, get won() { return won; } };   // test hook (tools/embed_win_check.js)

  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 80); });
  relayout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
