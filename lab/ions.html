<!doctype html>
<!--
  ION CHANNELS (lab front end, round 3: a sibling of Petting Zoo's "pens" representation, in a living cell)

  What the player sees: a dark, softly glowing cell split into four membrane chambers (Tide, Ember, Amber, Iris: four
  hues, four internal textures, four particle shapes: round, triangle, square, diamond). Every map region except the
  hole is an ion drifting with Brownian motion inside its chamber; the chamber it lives in is its element, and an ion
  always takes its chamber's colour and shape. The map is never drawn. The hidden relation: two ions that are
  neighbours on the map repel each other (like charges) and can never share a chamber (the legal colouring). It is only
  shown when it matters: while you hold an ion, faint field lines run from it to every ion it repels.

  The signal (the hole) is a large five-armed molecule waiting at a receptor in the outer membrane. It is repelled by
  five ions (g.rim), which carry a small white star; the tip of each of its five arms shows the shape and colour of the
  chamber that ion is in right now (so 2+1+1+1 at the start, and the goal is two pairs and a single, 2+2+1). Each chamber
  has a receptor badge: a bright open ring when none of the five are inside, a dim disc with a count when blocked.
  Goal: free one chamber. g.won() is exactly "some chamber holds none of the five", and g.free() is that chamber: a
  channel opens from the receptor into it, the signal travels down and docks with a bioluminescent pulse.

  The move (one gesture = exactly one g.swap(K), or nothing): drag/flick ion u from chamber A into chamber B (or tap u,
  then tap chamber B). K = g.chainAt(u, B), the {A, B} chain through u. A channel opens between A and B; u streams
  through it, the ions in B that repel u are pushed out through the same channel into A, the ions in A that repel those
  are pushed into B, and so on: the members of K cross one BFS layer at a time (from u), each changing colour and shape
  as it passes the middle of the channel, then they settle back into Brownian jitter. A lone ion that repels nobody in
  B just moves (single-region chain), so every chain is reachable by moving any one of its members. If K.web is true
  (chambers A and B would exchange all their ions, which changes nothing) g.swap is NOT called: the channel opens, both
  chambers surge towards it, and the system relaxes back to the same equilibrium. Undo (g.undo) and restart (g.reset)
  are the two small glass buttons; after a win, a tap restarts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ion Channels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03070d; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  #ui { position: fixed; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  #ui button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(160, 220, 255, .35);
    background: rgba(20, 40, 60, .55); color: #bfe8ff; font: 700 15px/1 system-ui, sans-serif; padding: 0; cursor: pointer;
    box-shadow: 0 0 10px rgba(90, 200, 255, .18), inset 0 0 6px rgba(160, 230, 255, .15); }
  #ui button:active { transform: scale(.92); }
</style>
</head>
<body>
<canvas id="c" aria-label="Ion channels"></canvas>
<div id="ui"><button id="undo" title="Undo" aria-label="Undo">&#8630;</button><button id="again" title="Start over" aria-label="Start over">&#8634;</button></div>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- pure helpers (also used by the node smoke test)
  const KIND = [
    { name: 'Tide', col: '#3ef0b4', rgb: [62, 240, 180], deep: '#0d4a3c' },
    { name: 'Ember', col: '#ff5f8f', rgb: [255, 95, 143], deep: '#4d1028' },
    { name: 'Amber', col: '#ffbd3a', rgb: [255, 189, 58], deep: '#4a3208' },
    { name: 'Iris', col: '#8f93ff', rgb: [143, 147, 255], deep: '#1d1f5a' },
  ];

  // chambers as a 2x2 cell (1xNC when very wide, 2+1 for 3), under the receptor band; ion radius from capacity
  function layoutCell(W, H, NC, cap) {
    const wide = W > H * 1.25;
    const gh = Math.round(Math.max(76, Math.min(150, wide ? H * 0.22 : H * 0.18)));
    const pad = Math.max(10, Math.min(20, W * 0.035)), gap = Math.max(8, Math.min(18, W * 0.03));
    const top = gh + 8, ah = Math.max(40, H - top - pad), aw = W - 2 * pad;
    const cols = (wide && aw / ah > 2.3) ? NC : Math.min(2, NC), rows = Math.ceil(NC / cols);
    const ch = [];
    for (let k = 0; k < NC; k++) {
      const r = Math.floor(k / cols), inRow = Math.min(cols, NC - r * cols), c = k - r * cols;
      const cw = (aw - (inRow - 1) * gap) / inRow, chh = (ah - (rows - 1) * gap) / rows;
      const x = pad + c * (cw + gap), y = top + r * (chh + gap);
      ch.push({ k, x, y, w: cw, h: chh, cx: x + cw / 2, cy: y + chh / 2, rx: Math.max(12, cw / 2 - 3), ry: Math.max(12, chh / 2 - 3) });
    }
    const area = Math.min(...ch.map(c => Math.PI * c.rx * c.ry));
    const r = Math.max(4, Math.min(18, Math.sqrt(0.45 * area / Math.max(1, cap)) / 2.6));
    return { W, H, gh, pad, top, aw, ah, ch, r };
  }

  // the two ends of the channel between chambers A and B (on A's membrane, on B's membrane)
  function pores(L, A, B) {
    const a = L.ch[A], b = L.ch[B], dx = b.cx - a.cx, dy = b.cy - a.cy, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const ta = 1 / Math.hypot(ux / a.rx, uy / a.ry), tb = 1 / Math.hypot(ux / b.rx, uy / b.ry);
    return [[a.cx + ux * ta, a.cy + uy * ta], [b.cx - ux * tb, b.cy - uy * tb]];
  }

  // the cascade: the members of chain K in BFS layers from the ion that was moved
  function cascade(g, K, u) {
    const seen = new Set([u]), layers = [[u]];
    let front = [u];
    while (front.length) {
      const nx = [];
      for (const v of front) for (const w of g.adj[v]) if (K.set.has(w) && !seen.has(w)) { seen.add(w); nx.push(w); }
      if (nx.length) layers.push(nx);
      front = nx;
    }
    return layers;
  }

  // gesture -> chain: moving ion u into chamber B means chain g.chainAt(u, B); nothing when B is its own chamber
  function moveFor(g, u, B) {
    if (u === g.hole || B == null || B < 0 || B >= g.NC || B === g.col[u]) return null;
    const K = g.chainAt(u, B);
    if (!K) return null;
    return { K, web: K.web, from: g.col[u], to: B, layers: cascade(g, K, u) };
  }

  // which chamber does a release at (x, y) mean? Inside or nearest; a swipe that stays in its own chamber but
  // clearly points at another one counts for that one (forgiving flicks on a small tile).
  function chamberFor(L, x, y, from, dx, dy) {
    if (y < L.gh - 6) return null;
    let best = null, bd = Infinity;
    L.ch.forEach(p => {
      const ex = Math.max(p.x - x, 0, x - p.x - p.w), ey = Math.max(p.y - y, 0, y - p.y - p.h), d = Math.hypot(ex, ey);
      if (d < bd) { bd = d; best = p.k; }
    });
    const len = Math.hypot(dx || 0, dy || 0);
    if (best === from && from != null && len > Math.max(28, L.r * 2)) {
      const P = L.ch[from]; let bc = 0.5, alt = null;
      L.ch.forEach(q => {
        if (q.k === from) return;
        const vx = q.cx - P.cx, vy = q.cy - P.cy, c = (vx * dx + vy * dy) / (Math.hypot(vx, vy) * len);
        if (c > bc) { bc = c; alt = q.k; }
      });
      if (alt != null) return alt;
    }
    return best;
  }

  window.IONS = { KIND, layoutCell, pores, cascade, moveFor, chamberFor };
  if (window.IONS_TEST) return;

  // ---------------------------------------------------------------- the cell
  const g = LAB.game();
  const NC = g.NC, hole = g.hole, rimSet = new Set(g.rim), NR = g.rim.length;
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const FONT = "Quicksand, 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  const now = () => performance.now();
  const rgba = (k, a) => `rgba(${KIND[k].rgb[0]},${KIND[k].rgb[1]},${KIND[k].rgb[2]},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  const TAU = Math.PI * 2;

  // unit glyph paths (radius about 1)
  function glyph(c, k, s) {
    c.beginPath();
    if (k === 0) c.arc(0, 0, s, 0, TAU);
    else if (k === 1) { c.moveTo(0, -1.2 * s); c.lineTo(1.1 * s, .75 * s); c.lineTo(-1.1 * s, .75 * s); c.closePath(); }
    else if (k === 2) { const q = .86 * s, rr = .25 * s; c.moveTo(-q + rr, -q); c.arcTo(q, -q, q, q, rr); c.arcTo(q, q, -q, q, rr); c.arcTo(-q, q, -q, -q, rr); c.arcTo(-q, -q, q, -q, rr); c.closePath(); }
    else { c.moveTo(0, -1.22 * s); c.lineTo(1.0 * s, 0); c.lineTo(0, 1.22 * s); c.lineTo(-1.0 * s, 0); c.closePath(); }
  }
  function star(c, x, y, s, pts) {
    c.beginPath();
    for (let i = 0; i < 2 * pts; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? s * .42 : s; c[i ? 'lineTo' : 'moveTo'](x + rr * Math.cos(a), y + rr * Math.sin(a)); }
    c.closePath();
  }

  // pre-rendered sprites: a soft glow and a crisp core per kind (drawn scaled each frame)
  const SP = 128, SC = SP / 2 / 2.6; // sprite px, core radius inside the sprite
  const glowSpr = [], coreSpr = [];
  for (let k = 0; k < 4; k++) {
    const a = document.createElement('canvas'); a.width = a.height = SP; const c = a.getContext('2d');
    const gr = c.createRadialGradient(SP / 2, SP / 2, 0, SP / 2, SP / 2, SP / 2);
    gr.addColorStop(0, rgba(k, .75)); gr.addColorStop(.3, rgba(k, .28)); gr.addColorStop(.6, rgba(k, .08)); gr.addColorStop(1, rgba(k, 0));
    c.fillStyle = gr; c.fillRect(0, 0, SP, SP); glowSpr.push(a);
    const b = document.createElement('canvas'); b.width = b.height = SP; const d = b.getContext('2d');
    d.translate(SP / 2, SP / 2);
    const cg = d.createRadialGradient(-SC * .35, -SC * .4, SC * .1, 0, 0, SC * 1.25);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(.35, KIND[k].col); cg.addColorStop(1, KIND[k].deep);
    glyph(d, k, SC); d.fillStyle = cg; d.fill();
    d.lineWidth = SC * .1; d.strokeStyle = 'rgba(255,255,255,.75)'; d.stroke();
    coreSpr.push(b);
  }

  // ---- state
  const P = []; // ions: { v, x, y, vx, vy, s, tr, px, py }
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let v = 0; v < g.n; v++) if (v !== hole) P[v] = { v, x: 0, y: 0, vx: 0, vy: 0, s: .85 + rnd() * .3, tr: null, ph: rnd() * TAU };
  const disp = g.col.slice(); // the chamber each ion is SHOWN in (lags g.col while a cascade plays)
  let L = null, bg = null, dpr = 1, R = 10;
  const chan = new Map(); // open channels 'A-B' -> { A, B, t0, t1 }
  const pulses = [], rings = [], notes = [];
  let winTok = 0, held = null, sel = null, busy = false, won = false, hoverCh = null, hope = false;
  const mol = { x: 0, y: 0, R: 10, hx: 0, hy: 0, hR: 10, phase: 'wait', t0: 0, path: null, F: -1 };

  function counts() { const c = new Array(NC).fill(0); for (let v = 0; v < g.n; v++) if (v !== hole) c[disp[v]]++; return c; }
  function capacity() { return Math.max(Math.max(...counts()) + 1, Math.ceil((g.n - 1) / NC) + 2); }
  function rivalsIn(k) { return g.rim.filter(v => disp[v] === k).length; }
  function scatter(v) {
    const C = L.ch[disp[v]], a = rnd() * TAU, d = Math.sqrt(rnd()) * .6;
    P[v].x = C.cx + Math.cos(a) * d * (C.rx - R); P[v].y = C.cy + Math.sin(a) * d * (C.ry - R);
  }

  function relayout() {
    const W = innerWidth, H = innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    L = layoutCell(W, H, NC, capacity()); R = L.r;
    mol.hR = L.gh * .15; mol.hx = Math.max(L.gh * .5, mol.hR * 2.6); mol.hy = L.gh * .5;
    if (mol.phase === 'wait') { mol.x = mol.hx; mol.y = mol.hy; mol.R = mol.hR; }
    else { const C = L.ch[mol.F]; mol.x = C.cx; mol.y = C.cy; mol.R = R * 2; mol.phase = 'docked'; mol.path = null; }
    for (let v = 0; v < g.n; v++) if (v !== hole) { P[v].tr = null; scatter(v); }
    drawBg();
  }

  // ---- static background: deep cytoplasm, outer membrane, chamber fills and textures
  function drawBg() {
    bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
    const c = bg.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = L.W, H = L.H;
    let gr = c.createRadialGradient(W * .5, H * .55, 0, W * .5, H * .55, Math.max(W, H) * .8);
    gr.addColorStop(0, '#0b1a24'); gr.addColorStop(.6, '#060d16'); gr.addColorStop(1, '#020509');
    c.fillStyle = gr; c.fillRect(0, 0, W, H);
    let s = 3;
    const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < (W * H) / 900; i++) { c.fillStyle = `rgba(150,210,255,${(rr() * .08).toFixed(3)})`; c.beginPath(); c.arc(rr() * W, rr() * H, rr() * 1.6 + .3, 0, TAU); c.fill(); }
    // outer cell membrane (a bilayer) with the receptor cup under the signal
    const ox = L.pad * .45, oy = L.top - L.pad * .55, ow = W - ox * 2, oh = H - oy - L.pad * .45, orr = Math.min(40, ow * .12);
    const round = (d) => { c.beginPath(); c.roundRect ? c.roundRect(ox - d, oy - d, ow + 2 * d, oh + 2 * d, orr + d) : c.rect(ox - d, oy - d, ow + 2 * d, oh + 2 * d); };
    c.fillStyle = 'rgba(40,90,110,.10)'; round(0); c.fill();
    c.lineWidth = 7; c.strokeStyle = 'rgba(110,200,230,.07)'; round(0); c.stroke();
    c.lineWidth = 1.1; c.strokeStyle = 'rgba(140,220,245,.32)'; round(-2.5); c.stroke(); round(2.5); c.stroke();
    // chambers
    L.ch.forEach(C => {
      const k = C.k;
      c.save(); c.beginPath(); c.ellipse(C.cx, C.cy, C.rx, C.ry, 0, 0, TAU); c.clip();
      gr = c.createRadialGradient(C.cx, C.cy - C.ry * .2, 0, C.cx, C.cy, Math.max(C.rx, C.ry));
      gr.addColorStop(0, rgba(k, .16)); gr.addColorStop(.75, rgba(k, .06)); gr.addColorStop(1, rgba(k, .14));
      c.fillStyle = gr; c.fillRect(C.x, C.y, C.w, C.h);
      c.strokeStyle = rgba(k, .13); c.fillStyle = rgba(k, .10); c.lineWidth = 1;
      s = 11 + k * 31; const n = Math.round(C.rx * C.ry / 160), q = Math.max(9, Math.min(18, C.rx / 5));
      if (k === 0) for (let i = 0; i < n; i++) { c.beginPath(); c.arc(C.x + rr() * C.w, C.y + rr() * C.h, 1.5 + rr() * 4, 0, TAU); c.stroke(); }
      else if (k === 1) { c.beginPath(); for (let y = C.y; y < C.y + C.h + q; y += q) { for (let x = C.x - q; x < C.x + C.w + q; x += q) { const o = ((y - C.y) / q) % 2 ? q / 2 : 0; c.moveTo(x + o, y); c.lineTo(x + o + q / 2, y - q * .85); c.lineTo(x + o + q, y); } } c.stroke(); }
      else if (k === 2) { c.beginPath(); for (let x = C.x; x < C.x + C.w; x += q) { c.moveTo(x, C.y); c.lineTo(x, C.y + C.h); } for (let y = C.y; y < C.y + C.h; y += q) { c.moveTo(C.x, y); c.lineTo(C.x + C.w, y); } c.globalAlpha = .7; c.stroke(); c.globalAlpha = 1; }
      else { c.beginPath(); for (let i = -C.h; i < C.w + C.h; i += q) { c.moveTo(C.x + i, C.y); c.lineTo(C.x + i + C.h * .7, C.y + C.h); c.moveTo(C.x + i, C.y + C.h); c.lineTo(C.x + i + C.h * .7, C.y); } c.globalAlpha = .55; c.stroke(); c.globalAlpha = 1; }
      c.restore();
    });
  }

  // ---- motion: Brownian jitter, soft crowding, a membrane that keeps each ion in its chamber
  function physics(dt, t) {
    const NOISE = R * (RM ? 14 : 80), DAMP = Math.exp(-2.6 * dt);
    const ions = P.filter(Boolean);
    for (const p of ions) {
      if (p.v === held || (p.tr && t >= p.tr.t0)) continue;
      p.vx = p.vx * DAMP + (Math.random() - .5) * 2 * NOISE * dt;
      p.vy = p.vy * DAMP + (Math.random() - .5) * 2 * NOISE * dt;
    }
    const D = R * 2.5;
    for (let i = 0; i < ions.length; i++) {
      const a = ions[i]; if (a.tr && t >= a.tr.t0) continue;
      for (let j = i + 1; j < ions.length; j++) {
        const b = ions[j]; if (disp[a.v] !== disp[b.v] || (b.tr && t >= b.tr.t0)) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d < D && d > .01) { const f = (D - d) / D * R * 45 * dt, ux = dx / d, uy = dy / d; a.vx -= ux * f; a.vy -= uy * f; b.vx += ux * f; b.vy += uy * f; }
      }
      if (mol.phase === 'docked' && disp[a.v] === mol.F) {
        const dx = a.x - mol.x, dy = a.y - mol.y, d = Math.hypot(dx, dy), M = mol.R * 1.7 + R;
        if (d < M && d > .01) { const f = (M - d) / M * R * 60 * dt; a.vx += dx / d * f; a.vy += dy / d * f; }
      }
    }
    for (const p of ions) {
      if (p.v === held || (p.tr && t >= p.tr.t0)) continue;
      const C = L.ch[disp[p.v]], ax = Math.max(4, C.rx - R * 1.4), ay = Math.max(4, C.ry - R * 1.4);
      const ex = (p.x - C.cx) / ax, ey = (p.y - C.cy) / ay, e = Math.hypot(ex, ey);
      if (e > 1) { const tx = C.cx + ex / e * ax, ty = C.cy + ey / e * ay, k = Math.min(1, 14 * dt); p.vx += (tx - p.x) * k * 4; p.vy += (ty - p.y) * k * 4; }
      const sp = Math.hypot(p.vx, p.vy), cap = R * 40; if (sp > cap) { p.vx *= cap / sp; p.vy *= cap / sp; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }

  // ---- channel transits
  const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  function openChannel(A, B, t0, t1) {
    const key = Math.min(A, B) + '-' + Math.max(A, B), c = chan.get(key);
    if (c && c.t1 > now()) { c.t1 = Math.max(c.t1, t1); return; }
    chan.set(key, { A: Math.min(A, B), B: Math.max(A, B), t0, t1 });
  }
  function sendThrough(v, B, delay, dur, direct) {
    const p = P[v], A = disp[v], [pa, pb] = pores(L, A, B), C = L.ch[B];
    const f = .3 + Math.random() * .3, jx = (Math.random() - .5) * C.rx * .5, jy = (Math.random() - .5) * C.ry * .5;
    const d = [pb[0] + (C.cx - pb[0]) * f + jx * (1 - f), pb[1] + (C.cy - pb[1]) * f + jy * (1 - f)];
    p.tr = { t0: now() + delay, dur: RM ? Math.min(dur, 200) : dur, s: null, a: pa, b: pb, d, to: B, direct, flipped: false };
    openChannel(A, B, now() + delay - 200, now() + delay + dur + 250);
  }
  function transits(t) {
    P.forEach(p => {
      if (!p || !p.tr || t < p.tr.t0) return;
      const T = p.tr; if (!T.s) T.s = [p.x, p.y];
      const f = Math.min(1, (t - T.t0) / T.dur); p.px = p.x; p.py = p.y;
      if (T.direct) { const e = ease(f); p.x = T.s[0] + (T.d[0] - T.s[0]) * e; p.y = T.s[1] + (T.d[1] - T.s[1]) * e; if (!T.flipped) { T.flipped = true; disp[p.v] = T.to; } }
      else {
        let x, y;
        if (f < .36) { const e = ease(f / .36); x = T.s[0] + (T.a[0] - T.s[0]) * e; y = T.s[1] + (T.a[1] - T.s[1]) * e; }
        else if (f < .64) { const e = (f - .36) / .28; x = T.a[0] + (T.b[0] - T.a[0]) * e; y = T.a[1] + (T.b[1] - T.a[1]) * e; }
        else { const e = 1 - Math.pow(1 - (f - .64) / .36, 2); x = T.b[0] + (T.d[0] - T.b[0]) * e; y = T.b[1] + (T.d[1] - T.b[1]) * e; }
        p.x = x; p.y = y;
        if (f >= .5 && !T.flipped) { T.flipped = true; disp[p.v] = T.to; sfx.pass(T.to); }
      }
      if (f >= 1) {
        const dx = T.d[0] - T.b[0], dy = T.d[1] - T.b[1], d = Math.hypot(dx, dy) || 1;
        p.vx = dx / d * R * 3; p.vy = dy / d * R * 3; p.tr = null; p.px = undefined;
      }
    });
  }
