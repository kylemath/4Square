<title>Monster Ride 2</title>
<!--
  MONSTER RIDE 2: the same chunky googly-eyed monsters, now in an organised queue, and a car built for two couples.

  What the player sees: a purple boarding platform in the middle with the ride car on it, seen from above: a driver's
  seat at the nose, a middle bench (2) and a back bench (2). The five monsters at the gate already SIT in the car.
  Everybody else waits in ringed queue lanes around the platform, each monster on its own painted spot, and every
  hand-hold is drawn all the time as two linked arms with a clasp (arms of one lane run along the lane; arms between
  lanes reach across; an arm that skips people arches around them; passengers' arms reach out of the car to the crowd).
  Species: round red Blorb, tall blue Stretch, triangle yellow Spike, square green Boxo (shape, colour, eyes, mouth
  and topper all differ). Rules of the park: two of the same species never hold hands, and one species per bench.
  The matching couple sits on the middle bench and glows. The back bench holds two different monsters, sweating, with
  a red "!" badge. Sign: "Back bench must match, then we ride!" When the back bench matches too (2+2+1), the car
  flies a loop over the crowd.
  Mapping onto the puzzle (lab/core.js):
    monster u                    = region u (every region except the hole); species = g.col[u]
    linked arms (always drawn)   = the edges g.edges not touching the hole (legal colouring = no same-species arms)
    the ride car                 = the hole; the 5 passengers = g.rim (ring neighbours hold hands, so always differ)
    queue lane k                 = BFS distance k from the hole (lane 1 = platform). Order inside a lane comes from
                                   the planar drawing g.pos + a crossing-repair search (no two arms cross on level 4).
    seating (seatPlan)           = rim positions 0..4 in ring order. Not won (2+1+1+1): the couple {a, a+2} on the middle
                                   bench, back bench {a+1, a+3} or {a+1, a+4} (never ring-neighbours, so it cannot match
                                   yet), the last single drives; the option that moves fewest passengers is kept.
                                   Won (g.won(), 2+2+1): one couple per bench, the solo drives. After every swap the plan
                                   is recomputed and passengers who change seats hop over. The car leaves exactly when
                                   g.won(). (g.free() is the species not riding; not shown.)
    lane 1 spots on the platform = where each passenger's arms leave the car (its place in the ring)
    do-si-do                     = exactly one g.swap(K):
       tap monster A, then tap one of its hand-holding neighbours B  ->  K = g.chainAt(A, col[B])
       tap monster A, then one of the 3 costume bubbles (species b)  ->  K = g.chainAt(A, b)
       (costumes reach every chain through A, so every chain on the map is reachable, including single-monster
        chains). The spin travels monster by monster along the arms (BFS from A inside K); each arm it crosses flashes.
    K.web (the only couple-chain of that pair on the map) -> no swap; that crowd shrugs, "...same seats. Meh!"
    undo / restart (top corners) = g.undo() / g.reset(). Win: the back bench glows "Match!", the passengers let go of the
                                   crowd, the car flies a loop over the crowd; tap to ride again (g.reset()).
  The whole scene is fitted to the frame (and re-fitted on resize): if anything would poke out, the view box widens.
  Idle hint: after a few quiet seconds a monster from a g.good() chain waves "psst", and its right costume pulses.
-->

<script>
(function () {
  'use strict';
  const g = LAB.game();
  const NC = g.NC || 4;
  const INK = '#2b1d3a';
  const KIND = [
    { name: 'Blorb', col: '#ff5d73', dark: '#b8243f', light: '#ffd3da' },
    { name: 'Stretch', col: '#3d8bff', dark: '#1d4fb0', light: '#cfe1ff' },
    { name: 'Spike', col: '#ffc21a', dark: '#a87400', light: '#fff0b8' },
    { name: 'Boxo', col: '#2fbf71', dark: '#16764a', light: '#c8f3da' },
  ];
  // ---------- monster art (100-unit box centred on 0,0) ----------
  const BODY = [
    'M0,-40C24,-40 42,-22 42,4C42,28 24,42 0,42C-24,42 -42,28 -42,4C-42,-22 -24,-40 0,-40Z',
    'M-26,-22A26,26 0 0 1 26,-22L26,38Q19.5,48 13,38Q6.5,28 0,38Q-6.5,48 -13,38Q-19.5,28 -26,38Z',
    'M0,-46Q5,-46 8,-40L45,30Q49,40 38,40L-38,40Q-49,40 -45,30L-8,-40Q-5,-46 0,-46Z',
    'M-36,-28Q-36,-36 -28,-36L28,-36Q36,-36 36,-28L36,32Q36,40 28,40L-28,40Q-36,40 -36,32Z',
  ];
  const TOP = [-40, -48, -46, -36];
  const EYES = [[[0, -8, 15]], [[-11, -22, 9], [11, -22, 9]], [[-11, 10, 8.5], [11, 10, 8.5]], [[-18, -14, 7], [0, -20, 8.5], [18, -14, 7]]];
  const PRE = [
    `<path d="M0,-40Q-3,-50 5,-55" fill="none"/><circle cx="6" cy="-56" r="5" fill="#ffd23f"/>`,
    `<path d="M-6,-47q-4,-9 -1,-12M0,-48q0,-9 4,-12M6,-47q5,-7 9,-7" fill="none"/>`,
    `<path d="M-30,10l-14,-4l10,10M30,10l14,-4l-10,10" fill="#ffc21a"/>`,
    `<path d="M-30,-36L-24,-52L-16,-36ZM30,-36L24,-52L16,-36Z" fill="#fff4dc"/>`,
  ];
  const MOUTH = [
    `<path d="M-15,14Q0,32 15,14Z" fill="#5a1530" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M-6,15h6v5h-6z" fill="#fff"/>`,
    `<ellipse cx="0" cy="4" rx="6.5" ry="8.5" fill="#14295e" stroke="${INK}" stroke-width="3"/>`,
    `<path d="M-17,24Q0,36 17,24Z" fill="#5a3a00" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M-11,25l3,5l3,-4.5M11,25l-3,5l-3,-4.5" fill="#fff"/>`,
    `<rect x="-17" y="10" width="34" height="12" rx="4" fill="#0d4a2c" stroke="${INK}" stroke-width="3"/><path d="M-13,11.5h6v5h-6zM-3,11.5h6v5h-6zM7,11.5h6v5h-6z" fill="#fff"/>`,
  ];
  const SHINE = [[-18, -20], [-13, -30], [-8, -18], [-22, -24]];
  const CROWN = y => `<path d="M-18,${y}l4,-16l8,9l6,-14l6,14l8,-9l4,16z" fill="#ffd23f" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><circle cx="0" cy="${y - 6}" r="3" fill="#ff5d73"/>`;
  function art(k, vip) {
    const K = KIND[k];
    let s = `<g stroke="${INK}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">${PRE[k]}` +
      `<ellipse cx="-15" cy="43" rx="10" ry="6" fill="${K.dark}"/><ellipse cx="15" cy="43" rx="10" ry="6" fill="${K.dark}"/>` +
      `<path d="${BODY[k]}" fill="${K.col}"/></g>` +
      `<ellipse cx="${SHINE[k][0]}" cy="${SHINE[k][1]}" rx="8" ry="4.5" fill="#fff" opacity=".5" transform="rotate(-35 ${SHINE[k][0]} ${SHINE[k][1]})"/>`;
    EYES[k].forEach(([x, y, r]) => {
      s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="3"/>` +
        `<circle class="pu" data-r="${r}" cx="${x}" cy="${y}" r="${r * 0.5}" fill="${INK}"/>`;
    });
    s += MOUTH[k];
    if (vip) s += CROWN(TOP[k] - 2);
    return s;
  }
  const seatArt = (k, sc) => `<path d="${BODY[k]}" transform="scale(${sc})" fill="${KIND[k].light}" stroke="${INK}" stroke-width="${4 / sc}" stroke-linejoin="round"/>`;
  // ---------- queue layout (pure; testable in node) ----------
  // The queue stands in rings around the boarding platform: ring k = everybody k hand-holds away from the car (ring 1 =
  // the five on the platform, in g.rim order). Order inside a ring starts from the planar drawing g.pos (angle around
  // the car), is nudged towards evenly spaced "spots", and is then repaired by a small local search so that no two
  // hand-holds cross. Hand-holds inside one ring that skip people bend outwards or inwards around them. All of this
  // is done once in (ring, angle) space; on screen the rings become stretched ellipses that fill the frame, which
  // keeps every crossing-free picture crossing-free.
  const TAU = Math.PI * 2;
  const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
  function queueTopo(g, BACK, RELAX) {
    const n = g.n, hole = g.hole;
    const layer = Array(n).fill(-1); layer[hole] = 0;
    let fr = [hole];
    for (let k = 1; fr.length; k++) { const nx = []; fr.forEach(u => g.adj[u].forEach(w => { if (layer[w] < 0) { layer[w] = k; nx.push(w); } })); fr = nx; }
    // the far-side regions (g.border: the outer face of g.pos) stand in the back lane, so the arms between them
    // run along the back of the queue instead of looping around it
    const K = Math.max(...layer), hp = g.pos[hole];
    if (BACK) (g.border || []).forEach(u => { if (u !== hole && layer[u] > 1) layer[u] = K; });
    const raw = u => Math.atan2(g.pos[u][0] - hp[0], g.pos[u][1] - hp[1]);
    let sx = 0, sy = 0;
    for (let u = 0; u < n; u++) if (layer[u] === K) { sx += Math.sin(raw(u)); sy += Math.cos(raw(u)); }
    const rot = Math.atan2(sx, sy);                                  // back of the line at the bottom
    const rows = [], slots = [], th = Array(n).fill(0);
    for (let k = 1; k <= K; k++) {
      const row = []; for (let u = 0; u < n; u++) if (layer[u] === k) row.push(u);
      if (k === 1) { row.length = 0; g.rim.forEach(u => row.push(u)); }
      const a = u => wrapA(raw(u) - rot);
      if (k > 1) row.sort((p, q) => a(p) - a(q));
      rows[k] = row; slots[k] = row.map(a).sort((p, q) => p - q);
    }
    // ring 1 runs in the rim's order; flip the rim's direction if the drawing goes the other way round
    if (rows[1].length > 2) {
      const a = rows[1].map(u => wrapA(raw(u) - rot));
      let s = 0; for (let i = 0; i < a.length; i++) s += wrapA(a[(i + 1) % a.length] - a[i]);
      if (s < 0) rows[1] = rows[1].slice().reverse();
    }
    function angles(k) {
      const row = rows[k], m = row.length;
      const a0 = k === 1 ? row.map(u => wrapA(raw(u) - rot)) : slots[k];
      let cs = 0, cc = 0;
      a0.forEach((a, i) => { cs += Math.sin(a - i * TAU / m); cc += Math.cos(a - i * TAU / m); });
      const off = Math.atan2(cs, cc), blend = k === 1 ? 1 : m === 1 ? 0 : 0.6;
      row.forEach((u, i) => { th[u] = a0[i] + blend * wrapA(off + i * TAU / m - a0[i]); });
    }
    for (let k = 1; k <= K; k++) angles(k);
    // radius of each monster's spot: its lane, except a lone last-in-line monster stands just behind the back lane
    const rad = layer.slice();
    if (K > 2 && rows[K].length === 1) rad[rows[K][0]] = K - 0.45;
    const links = [];
    g.edges.forEach(([u, v]) => { if (u !== hole && v !== hole) links.push([u, v, 0]); });
    const isChord = l => {
      if (layer[l[0]] !== layer[l[1]]) return false;
      const row = rows[layer[l[0]]], m = row.length, d = Math.abs(row.indexOf(l[0]) - row.indexOf(l[1]));
      return d !== 1 && d !== m - 1;
    };
    const N = 8;
    const curve = (u, v, b) => {
      const ku = rad[u], kv = rad[v], d = wrapA(th[v] - th[u]), pts = [];
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let i = 0; i <= N; i++) {
        const t = i / N, r = 0.6 + ku + (kv - ku) * t + b * 4 * t * (1 - t), a = th[u] + d * t, x = r * Math.sin(a), y = r * Math.cos(a);
        pts.push([x, y]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      }
      pts.box = [x0, x1, y0, y1];
      return pts;
    };
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    const segX = (a, b, c, d) => o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
    const crossPts = (A, B) => {
      const a = A.box, b = B.box;
      if (a[1] < b[0] || b[1] < a[0] || a[3] < b[2] || b[3] < a[2]) return 0;
      let c = 0; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (segX(A[i], A[i + 1], B[j], B[j + 1])) c++; return c;
    };
    const share = (a, b) => a[0] === b[0] || a[0] === b[1] || a[1] === b[0] || a[1] === b[1];
    const spot = u => { const r = 0.6 + rad[u]; return [r * Math.sin(th[u]), r * Math.cos(th[u])]; };
    // an arm that brushes past somebody else's head reads as holding the wrong hand
    const brush = (A, l) => { let c = 0; for (let u = 0; u < n; u++) { if (u === hole || u === l[0] || u === l[1]) continue; const p = spot(u); if (A.some(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < 0.33)) c++; } return c; };
    const BENDS = [0.45, -0.45, 0.75, -0.75, 1.15, 1.6, 2.1];
    function score() {
      links.forEach(l => { l[2] = 0; });
      const paths = links.map(l => curve(l[0], l[1], 0));
      links.forEach((l, i) => {
        if (!isChord(l)) return;
        let best = null;
        BENDS.forEach(b => {
          if (layer[l[0]] + b < 0.7) return;
          const A = curve(l[0], l[1], b); let c = brush(A, l) * 0.3 + Math.abs(b) * 0.01;
          links.forEach((m, j) => { if (j !== i && !share(l, m)) c += crossPts(A, paths[j]); });
          if (!best || c < best.c) best = { b, c, A };
        });
        l[2] = best.b; paths[i] = best.A;
      });
      let c = 0;
      for (let i = 0; i < links.length; i++) {
        if (!isChord(links[i]) && layer[links[i][0]] !== layer[links[i][1]]) c += brush(paths[i], links[i]) * 0.3;
        for (let j = i + 1; j < links.length; j++) if (!share(links[i], links[j])) c += crossPts(paths[i], paths[j]);
      }
      return c;
    }
    let cur = score();
    const until = Date.now() + 600;                                  // big maps: stop searching after a moment
    for (let pass = 0; pass < 4 && cur > 0 && Date.now() < until; pass++) {
      let improved = false;
      for (let k = 2; k <= K && cur > 0; k++) {
        const row = rows[k], m = row.length;
        if (m < 2) continue;
        for (let i = 0; i < m && cur > 0 && Date.now() < until; i++) {
          const j = (i + 1) % m;
          [row[i], row[j]] = [row[j], row[i]]; angles(k);
          const c = score();
          if (c < cur) { cur = c; improved = true; } else { [row[i], row[j]] = [row[j], row[i]]; angles(k); }
        }
      }
      if (!improved) break;
    }
    // relax: slide each monster along its lane towards the partners it holds hands with (shorter arms), keeping
    // the lane order and a minimum gap; keep the result only if it adds no crossing
    if (RELAX) {
      const keep = th.slice();
      for (let it = 0; it < 80; it++) for (let k = 2; k <= K; k++) {
        const row = rows[k], m = row.length, gap = Math.min(TAU / m * 0.85, 1.05 / (0.6 + k));
        const a = [th[row[0]]];
        for (let i = 1; i < m; i++) { let d = th[row[i]] - th[row[i - 1]]; while (d <= 0) d += TAU; a.push(a[i - 1] + d); }
        row.forEach((u, i) => {
          let sum = 0, w = 0;
          g.adj[u].forEach(v => { if (v === hole) return; const wt = layer[v] === k ? 0.5 : 1; sum += wrapA(th[v] - th[u]) * wt; w += wt; });
          if (w) a[i] += 0.25 * sum / w;
        });
        for (let sweep = 0; sweep < 12; sweep++) for (let i = 0; i < m && m > 1; i++) {
          const j = i + 1, aj = j < m ? a[j] : a[0] + TAU, d = aj - a[i];
          if (d < gap) { const p = (gap - d) / 2; a[i] -= p; if (j < m) a[j] += p; else a[0] -= p; }
        }
        row.forEach((u, i) => { th[u] = wrapA(a[i]); });
      }
      const c = score();
            if (c > cur + 0.65) { th.splice(0, n, ...keep); score(); } else cur = c;
    } else score();
    return { layer, rad, K, rows, th, links, cross: cur };
  }
  // On screen each lane is a rounded-box ring (superellipse) around the car, and a monster's place along its lane is
  // its angle read as a fraction of the lane's length, so neighbours in a lane are evenly spread.
  const LANE_P = 2.8;
  const LANES = new Map();
  function laneTable(A, B) {
    const key = A.toFixed(1) + ',' + B.toFixed(1);
    if (LANES.has(key)) return LANES.get(key);
    if (LANES.size > 4000) LANES.clear();
    const M = 96, pts = [], cum = [0], e = 2 / LANE_P;
    for (let i = 0; i <= M; i++) {
      const f = i / M * TAU, s = Math.sin(f), c = Math.cos(f);
      pts.push([A * Math.sign(s) * Math.pow(Math.abs(s), e), B * Math.sign(c) * Math.pow(Math.abs(c), e)]);
      if (i) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const T = { pts, cum, total: cum[M] };
    LANES.set(key, T);
    return T;
  }
  function onLane(A, B, t) {
    const T = laneTable(A, B), L = (((t % 1) + 1) % 1) * T.total;
    let lo = 0, hi = T.cum.length - 1;

    [-1, 1].forEach(sx => [-1, 1].forEach(sy => el('rect', { x: sx * w / 2 - su * 0.16, y: sy * h * 0.3 - su * 0.36, width: su * 0.32, height: su * 0.72, rx: su * 0.12, fill: '#3a3a46', stroke: INK, 'stroke-width': 2.5 }, c)));
    el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: w * 0.45, fill: '#ff4d6d', stroke: INK, 'stroke-width': 3.5 }, c);
    el('rect', { x: -w / 2 + su * 0.14, y: -h / 2 + su * 0.14, width: w - su * 0.28, height: h - su * 0.28, rx: w * 0.38, fill: 'none', stroke: '#ffd23f', 'stroke-width': Math.max(2, su * 0.07) }, c);
    [-1, 1].forEach(sx => el('circle', { cx: sx * w * 0.26, cy: -h / 2 + su * 0.28, r: su * 0.13, fill: '#fff7b0', stroke: INK, 'stroke-width': 2 }, c));
    // seats: 0 = middle bench, 1 = back bench, 2 = driver
    const mk = (y, xs) => {
      const sg = el('g', {}, c);
      const bw = xs.length > 1 ? su * 2.0 : su * 0.95;
      const glow = el('rect', { class: 'halo', x: -bw / 2 - su * 0.12, y: y - su * 0.54, width: bw + su * 0.24, height: su * 1.12, rx: su * 0.42, fill: '#fff59a', stroke: '#fff', 'stroke-width': 2 }, sg);
      el('rect', { x: -bw / 2, y: y + su * 0.36, width: bw, height: su * 0.2, rx: su * 0.1, fill: '#7a3bd8', stroke: INK, 'stroke-width': 2 }, sg);
      el('rect', { x: -bw / 2, y: y - su * 0.42, width: bw, height: su * 0.8, rx: su * 0.32, fill: '#ffd23f', stroke: INK, 'stroke-width': 2.5 }, sg);
      xs.forEach(x => el('circle', { cx: x, cy: y, r: su * 0.34, fill: '#fff4e6', stroke: INK, 'stroke-width': 2 }, sg));
      const rider = el('g', {}, sg);
      return { g: sg, glow, y, bw, cush: xs.map(x => [x, y]), rider };
    };
    ride.seats = [mk(su * 0.12, [-su * 0.5, su * 0.5]), mk(su * 1.22, [-su * 0.5, su * 0.5]), mk(-su * 1.0, [0])];
    el('circle', { cx: 0, cy: -su * 1.52, r: su * 0.2, fill: 'none', stroke: INK, 'stroke-width': Math.max(2, su * 0.09) }, c);
    el('path', { d: `M${-su * 0.2},${-su * 1.52}H${su * 0.2}`, stroke: INK, 'stroke-width': Math.max(1.5, su * 0.06) }, c);
    // the back bench's grumble badge, drawn above the passengers
    const bs = ride.seats[1];
    ride.badge = el('g', { class: 'shake', 'pointer-events': 'none' }, L.fx);
    const bx = cx + bs.bw / 2 + su * 0.18, by = cy + bs.y - su * 0.45, r = Math.max(8, su * 0.26);
    ride.badge.innerHTML = `<circle cx="${bx}" cy="${by}" r="${r}" fill="#ff3b3b" stroke="${INK}" stroke-width="2"/>` +
      `<text x="${bx}" y="${by + r * 0.45}" text-anchor="middle" font-size="${r * 1.4}" font-weight="700" fill="#fff">!</text>`;
  }
  // where a passenger sits right now (screen coordinates)
  function seatSpot(u) {
    const r = g.rim.indexOf(u), i = plan.seat[r], st = ride.seats[i], c = st.cush[i === 2 ? 0 : plan.cush[r]];
    return [LY.cx + c[0], LY.cy + c[1] - LY.G.su * 0.18];
  }
  // passengers shuffle to their new seats (a short hop), their arms following
  function shuffle(animate) {
    const moving = [];
    g.rim.forEach(u => {
      const m = M[u], to = seatSpot(u);
      if (Math.hypot(to[0] - m.x, to[1] - m.y) < 0.5) return;
      moving.push([u, m.x, m.y, to[0], to[1]]);
    });
    if (!moving.length) return 0;
    const setPos = (u, x, y) => { const m = M[u]; m.x = x; m.y = y; m.g.setAttribute('transform', `translate(${x},${y})`); ARM.forEach(A => { if (A.u === u || A.v === u) drawArm(A); }); };
    if (!animate || RM) { moving.forEach(([u, , , x, y]) => setPos(u, x, y)); return 0; }
    const dur = 380, t0 = performance.now(), hop = LY.G.su * 0.7;
    moving.forEach(([u]) => L.crowd.appendChild(M[u].g));
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = t * t * (3 - 2 * t);
      moving.forEach(([u, x0, y0, x1, y1]) => setPos(u, x0 + (x1 - x0) * e, y0 + (y1 - y0) * e - Math.sin(Math.PI * t) * hop));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    tone(700, 0.08, 'triangle', 0.06, 0, 1.3); tone(900, 0.08, 'triangle', 0.06, 0.12, 1.3);
    return dur;
  }
  // seats: middle bench glows (its couple matches); the back bench glows when it matches, grumbles while it doesn't
  function drawSeats() {
    ride.seats[0].glow.style.opacity = winning || plan.midMatch ? 1 : 0;
    ride.seats[1].glow.style.opacity = plan.backMatch ? 1 : 0;
    ride.seats[2].glow.style.opacity = 0;
    ride.badge.style.display = plan.backMatch || winning ? 'none' : '';
  }
  function setArt(u, k) {
    const m = M[u]; if (!m) return;
    m.k = k; m.art.innerHTML = art(k);
    m.pupils = [...m.art.querySelectorAll('.pu')];
    m.halo.setAttribute('stroke', KIND[k].col); m.halo.setAttribute('fill', KIND[k].light);
  }
  function lookAt(x, y) {
    M.forEach((m, u) => {
      if (!m || !m.pupils) return;
      let dx = x - m.x, dy = y - m.y; const d = Math.hypot(dx, dy) || 1;
      dx /= d; dy /= d; if (u === sel) { dx = 0; dy = -0.6; }
      m.pupils.forEach(p => { const r = +p.dataset.r * 0.42; p.setAttribute('transform', `translate(${(dx * r).toFixed(1)},${(dy * r).toFixed(1)})`); });
    });
  }
  // returns { wait: ms of seat shuffling, newMid: the middle bench got a different couple }
  function render(fresh) {
    for (let u = 0; u < g.n; u++) {
      if (u === g.hole || !M[u]) continue;
      if (M[u].k !== show[u]) setArt(u, show[u]);
      M[u].g.classList.toggle('sel', u === sel);
      M[u].g.classList.toggle('nb', sel >= 0 && g.adj[sel].includes(u));
      M[u].g.classList.toggle('hint', sel < 0 && !!hintPick && hintPick.u === u);
      M[u].g.classList.remove('pv');
    }
    ARM.forEach(A => { armColour(A); A.g.classList.toggle('hot', sel >= 0 && (A.u === sel || A.v === sel)); });
    L.arms.classList.toggle('dim', sel >= 0); L.carArms.classList.toggle('dim', sel >= 0);
    // passengers' arms run under the car, except while a passenger is picked: then they show on top
    S.insertBefore(L.carArms, sel >= 0 && isRim(sel) ? L.crowd : L.carSlot);
    const prev = plan;
    plan = seatPlan(g, show, prev);
    const newMid = !fresh && !!prev && plan.mid.some(r => !prev.mid.includes(r));
    const wait = shuffle(!fresh);
    drawSeats();
    g.rim.forEach((u, r) => {
      const m = M[u]; if (!m) return;
      const s = plan.seat[r];
      m.g.classList.toggle('pair', s === 0 || (s === 1 && plan.backMatch));
      m.g.classList.toggle('solo', !winning && s === 1 && !plan.backMatch);
    });
    L.ui.innerHTML = '';
    if (sel >= 0) { costumes(sel); lookAt(M[sel].x, M[sel].y); } else lookAt(LY.cx, LY.cy);
    ride.undo.classList.toggle('off', !g.history.length || winning);
    ride.restart.classList.toggle('off', !g.history.length || winning);
    return { wait, newMid };
  }
  // costume bubbles: the 3 other species around the picked monster
  function costumes(u) {
    const m = M[u], s = LY.size, br = Math.max(16, s * 0.32), R = s * 0.52 + br * 1.05;
    const up = m.y - R - br > LY.top + br * 0.3;
    const ks = []; for (let b = 0; b < NC; b++) if (b !== show[u]) ks.push(b);
    ks.forEach((b, i) => {
      const ang = (up ? -1 : 1) * (Math.PI / 2 + (i - (ks.length - 1) / 2) * 0.95);
      let x = m.x + Math.cos(ang) * R, y = m.y + Math.sin(ang) * R;
      x = Math.min(W - br - 2, Math.max(br + 2, x)); y = Math.min(H - br - 2, Math.max(LY.top + br * 0.3, y));
      const cg = el('g', { class: 'cos' + (hintPick && hintPick.u === u && hintPick.b === b ? ' hint' : ''), transform: `translate(${x},${y})`, 'data-act': 'cos', 'data-b': b }, L.ui);
      const inner = el('g', { class: 'cb' }, cg);
      el('circle', { r: br, fill: '#fff', stroke: KIND[b].col, 'stroke-width': 3.5 }, inner);
      el('circle', { r: br + 2, fill: 'none', stroke: INK, 'stroke-width': 1.5 }, inner);
      el('g', { transform: `scale(${br * 1.45 / 100})` }, inner, art(b));
    });
  }
  function preview(K) {
    M.forEach((m, u) => { if (m) m.g.classList.toggle('pv', !!K && K.set.has(u)); });
  }
  function bubbleText(x, y, txt, size, col, cls, life) {
    const t = el('text', { class: cls || 'cheer', x, y, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 700, fill: col || '#fff',
      stroke: INK, 'stroke-width': size * 0.2, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, L.fx);
    t.textContent = txt;
    later(() => t.remove(), life || 900);
  }
  function hearts(x, y, sz, col) {
    for (let i = 0; i < 3; i++) later(() => {
      const h = el('g', { transform: `translate(${x + (i - 1) * sz * 0.9},${y - (i % 2) * sz * 0.4})` }, L.fx);
      el('path', { class: 'cheer', d: HEART, transform: `scale(${sz / 24})`, fill: col, stroke: INK, 'stroke-width': 2.4 * 24 / sz }, h);
      later(() => h.remove(), 900);
    }, i * 110);
  }
  function celebrate(bench) {
    g.rim.forEach((u, r) => { if (plan.seat[r] === bench) hearts(M[u].x, M[u].y - LY.size * 0.6, Math.max(10, LY.size * 0.26), '#ff5d73'); });
    const st = ride.seats[bench];
    bubbleText(LY.cx, LY.cy + st.y - LY.G.su * 0.75, bench ? 'Match!' : 'Pair!', Math.max(11, LY.size * 0.3), '#ffd23f');
    tone(988, 0.1, 'triangle', 0.08); tone(1319, 0.18, 'triangle', 0.08, 0.09);
  }
  function select(u) {
    sel = u; hintPick = hintPick && hintPick.u === u ? hintPick : null;
    tone(660 + show[u] * 90, 0.09, 'square', 0.05, 0, 1.4);
    render();
  }
  function spinMonster(u, k) {
    const m = M[u]; if (!m) return;
    m.spin.classList.remove('go'); m.spin.getBoundingClientRect();
    if (!RM) m.spin.classList.add('go');
    later(() => {
      show[u] = k; setArt(u, k); lookAt(LY.cx, LY.cy);
      ARM.forEach(A => { if (A.u === u || A.v === u) armColour(A); });
    }, RM ? 0 : 200);
  }
  function zapArm(a, b) {
    const A = armAt.get(Math.min(a, b) + '-' + Math.max(a, b)); if (!A) return;
    A.g.classList.remove('zap'); A.g.getBoundingClientRect(); if (!RM) A.g.classList.add('zap');
  }
  const CHEERS = ['Wheee!', 'Yay!', 'Hup!', 'Spin!', 'Ole!', 'Woo!'];
  function dance(u0, b) {
    const K = chainFor(g, u0, b);
    sel = -1; hintPick = null; render();
    if (!K) return;
    if (K.web) { dud(K, u0); return; }
    busy = true;
    const { order, par } = danceOrder(g, K, u0);
    g.swap(K);
    const step = RM ? 60 : Math.max(70, Math.min(150, 1200 / order.length));
    order.forEach((grp, d) => later(() => {
      grp.forEach(u => { if (par.has(u)) zapArm(par.get(u), u); spinMonster(u, g.col[u]); });
      tone(SCALE[Math.min(d, SCALE.length - 1)], 0.14, 'triangle', 0.09);
      if (d % 2 === 0 || grp.length > 2) { const u = grp[0]; bubbleText(M[u].x, M[u].y - LY.size * 0.6, CHEERS[(d + u) % CHEERS.length], Math.max(11, LY.size * 0.3)); }
    }, d * step));
    later(() => {
      show = g.col.slice();
      const r = render();
      later(() => {
        busy = false;
        if (g.won()) win(false);
        else if (r.newMid) celebrate(0);
        else { tone(1047, 0.08, 'sine', 0.05); tone(1319, 0.1, 'sine', 0.05, 0.07); }
      }, r.wait + 40);
    }, (order.length - 1) * step + 460);
  }
  function dud(K, u0) {
    busy = true;
    K.vs.forEach(u => { const m = M[u]; if (!m) return; m.spin.classList.remove('shrug'); m.spin.getBoundingClientRect(); if (!RM) m.spin.classList.add('shrug'); });
    const m = M[u0];
    const fz = Math.max(12, Math.min(20, LY.size * 0.3)), bx = Math.min(W - fz * 6, Math.max(fz * 6, m.x));
    const by = Math.max(LY.top + fz * 1.5, m.y - LY.size * 0.75);
    bubbleText(bx, by, 'Everybody swapped...', fz, '#ffe066', 'say', 1700);
    later(() => bubbleText(bx, by + fz * 1.25, '...same seats. Meh!', fz, '#ffe066', 'say', 1300), 450);
    tone(392, 0.22, 'sawtooth', 0.04, 0, 0.94); tone(370, 0.22, 'sawtooth', 0.04, 0.22, 0.94); tone(330, 0.4, 'sawtooth', 0.04, 0.44, 0.85);
    later(() => { K.vs.forEach(u => M[u] && M[u].spin.classList.remove('shrug')); busy = false; }, 900);
  }
  // ---------- win: the five hop into their seats, the car flies a loop ----------
  // ---------- win: the back bench matches, the car flies a loop ----------
  function board(u) {
    const r = g.rim.indexOf(u), i = plan.seat[r], st = ride.seats[i], c = st.cush[i === 2 ? 0 : plan.cush[r]], z = LY.G.su * 1.05;
    el('g', { transform: `translate(${c[0]},${c[1] - LY.G.su * 0.18}) scale(${z * 0.9 / 100})` }, st.rider, art(show[u]));
    M[u].g.classList.add('gone');
  }
  function win(instant) {
    winning = true; sel = -1; hintPick = null; render();
    say('All aboard!');
    ride.spot.setAttribute('opacity', 1);
    const letGo = () => { g.rim.forEach(board); L.carArms.style.opacity = 0; };
    if (instant) { letGo(); finish(); return; }
    celebrate(1);
    tone(523, 0.12, 'square', 0.06); tone(659, 0.12, 'square', 0.06, 0.1); tone(784, 0.12, 'square', 0.06, 0.2); tone(1047, 0.3, 'square', 0.06, 0.3);
    later(() => { letGo(); bubbleText(LY.cx, LY.cy + ride.seats[2].y - LY.G.su * 0.8, 'Let go, hold on!', Math.max(11, LY.size * 0.28), '#fff'); }, 900);
    later(whoosh, 1500);
  }
  function whoosh() {
    noise(1.8, 0.18, 300, 2400);
    tone(392, 1.4, 'sine', 0.05, 0, 2.2);
    S.appendChild(ride.wrap);
    const { cx, cy, G, top } = LY, ox = W / 2, oy = (top + H) / 2;
    const Rx = W / 2 - G.carH * 0.55, Ry = (H - top) / 2 - G.carH * 0.55;
    const dur = RM ? 1 : 3000, t0 = performance.now();
    let px = cx, py = cy, ang = 0;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const ramp = Math.min(1, t / 0.18, (1 - t) / 0.18), f = ramp * ramp * (3 - 2 * ramp);
      const ph = e * TAU * 1.5;
      const x = (1 - f) * cx + f * (ox + Rx * Math.sin(ph)), y = (1 - f) * cy + f * (oy + Ry * Math.cos(ph));
      if (Math.hypot(x - px, y - py) > 0.5) ang = Math.atan2(x - px, -(y - py)) * 180 / Math.PI;
      px = x; py = y;
      ride.wrap.setAttribute('transform', `translate(${x},${y}) rotate(${t < 1 ? ang : 0}) scale(${1 + 0.2 * f})`);
      if (t < 1) requestAnimationFrame(step);
      else { ride.wrap.setAttribute('transform', `translate(${cx},${cy})`); L.carSlot.appendChild(ride.wrap); finish(); }
    };
    requestAnimationFrame(step);
    later(confetti, 700);
  }
  function finish() {
    say('Wheee! Tap to ride again');
    waitReset = true;
    tone(784, 0.1, 'triangle', 0.07); tone(988, 0.1, 'triangle', 0.07, 0.09); tone(1175, 0.25, 'triangle', 0.07, 0.18);
  }
  function confetti() {
    if (RM) return;
    const bits = [], cols = ['#ff5d73', '#3d8bff', '#ffc21a', '#2fbf71', '#a05cff', '#fff'];
    for (let i = 0; i < 50; i++) {
      const r = el('rect', { width: 6 + (i % 3) * 2, height: 4 + (i % 2) * 3, fill: cols[i % cols.length], rx: 1 }, L.fx);
      bits.push({ r, x: W / 2, y: LY.top + 10, vx: (Math.random() - 0.5) * 10, vy: -2 - Math.random() * 6, a: Math.random() * 360, va: (Math.random() - 0.5) * 30 });
    }
    const t0 = performance.now();
    const step = now => {
      bits.forEach(b => { b.vy += 0.25; b.x += b.vx; b.y += b.vy; b.a += b.va; b.r.setAttribute('transform', `translate(${b.x},${b.y}) rotate(${b.a})`); });
      if (now - t0 < 2400) requestAnimationFrame(step); else bits.forEach(b => b.r.remove());
    };
    requestAnimationFrame(step);
  }
  // ---------- idle hint ----------
  function idle() {
    clearTimeout(idleT);
    if (hintPick && sel < 0) { hintPick = null; render(); }
    idleT = setTimeout(() => {
      if (busy || winning || sel >= 0) return idle();
      const K = g.good()[0]; if (!K) return;
      const u = K.vs.find(v => isRim(v)) ?? K.vs[0];
      hintPick = { u, b: K.pair[0] === g.col[u] ? K.pair[1] : K.pair[0] };
      render();
      bubbleText(M[u].x, Math.max(LY.top + 14, M[u].y - LY.size * 0.65), 'psst!', Math.max(11, LY.size * 0.26), '#fff');
    }, 9000);
  }
  // ---------- input ----------
  S.addEventListener('pointerdown', e => {
    ac();
    const keepHint = hintPick;
    idle();
    if (waitReset) { waitReset = false; g.reset(); return; }
    if (winning || busy) return;
    const t = e.target.closest && e.target.closest('[data-act]');
    if (!t) { if (sel >= 0) { sel = -1; render(); } return; }
    const act = t.getAttribute('data-act');
    if (act === 'undo') { if (g.history.length) { g.undo(); tone(500, 0.12, 'sine', 0.07, 0, 0.6); } return; }
    if (act === 'reset') { if (g.history.length) { g.reset(); tone(400, 0.2, 'sine', 0.07, 0, 0.5); } return; }
    if (act === 'cos') { dance(sel, +t.getAttribute('data-b')); return; }
    if (act === 'm') {
      const u = +t.getAttribute('data-u');
      if (sel < 0) { hintPick = keepHint && keepHint.u === u ? keepHint : null; select(u); }
      else if (u === sel) { sel = -1; tone(440, 0.06, 'sine', 0.04); render(); }
      else if (g.adj[sel].includes(u)) dance(sel, show[u]);
      else select(u);
    }
  });
  S.addEventListener('pointerover', e => {
    if (busy || winning || sel < 0) return;
    const t = e.target.closest && e.target.closest('[data-act]');
    let K = null;
    if (t && t.getAttribute('data-act') === 'cos') K = chainFor(g, sel, +t.getAttribute('data-b'));
    else if (t && t.getAttribute('data-act') === 'm') { const u = +t.getAttribute('data-u'); if (u !== sel && g.adj[sel].includes(u)) K = chainFor(g, sel, show[u]); }
    preview(K);
  });
  g.on((gg, info) => {
    if (info.type === 'reset') { build(); idle(); }
    else if (info.type === 'undo') { show = g.col.slice(); sel = -1; render(); }
  });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!busy && !winning) build(); }, 120); });
  build();
  idle();
})();
</script>
