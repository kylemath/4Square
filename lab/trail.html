<!doctype html>
<!--
  Paint Trail (lab/trail.html): Fill the Hole as an .io-style trail game through a living landscape.

  What the player sees: a dark, glowing, slowly breathing landscape (no lines, no map, no borders). Every region of the
  level is a soft-edged territory of one of four biomes, each with its own animated texture AND pattern so colour is
  never needed: LAVA (glowing crack veins, triangle glyph), SEA (rolling horizontal wave bands, wave glyph), DUNES
  (diagonal wind ridges, mound glyph), MEADOW (swaying dotted tufts, sprout glyph). The territory polygons g.cells are
  baked into a label texture and then sampled through an animated domain-warp, so territories meet in wobbly, living
  seams. The hole is a violet swirling "wishing well". Four biome runes float in it; each rune is fed by glowing
  wisps from every land that touches the well and is of that biome. Goal cue: "Wake the well: leave one rune unfed".

  What the player does, and how it maps onto the puzzle (all state changes through lab/core.js):
  - Press inside territory u and drag a glowing comet trail into a territory v of a different biome. The two biomes
    the trail has touched pick the zone K = g.chainAt(u, g.col[v]) (the connected run through u of just those two
    biomes). Following the zone keeps it; touching a third biome re-picks K = g.chainAt(u, that biome). While dragging,
    every territory of K shimmers (see how far it reaches), and runes that the trade would starve flicker
    (g.preview(K)).
  - Lift the finger, or close the loop back to where you started: g.swap(K). The two biomes trade places in every
    territory of K, captured paper.io style by a wave rippling outward from the trail.
  - Zones of a single territory (u surrounded only by other biomes) can't be reached by a trail, so: scribble a small
    circle inside one territory, or just tap it, and three tiny biome seeds pop out. Seed b = g.chainAt(u, b) (shimmers
    while held; release on it = g.swap). This reaches every chain through u, so every chain is reachable.
  - K.web (the only zone of that biome pair; trading it would just rename two biomes everywhere): the trail fizzles,
    nothing changes, a little "pfft".
  - Win: g.won() (the lands around the well show at most three biomes) = one rune has no wisps left. That rune
    (g.free()) glows free, the well erupts in that biome and its colour floods the screen. Tap to play again
    (g.reset()). Tiny undo (g.undo) and restart (g.reset) buttons sit in the bottom corners. When idle, a ghost comet
    demonstrates one helpful trail (g.good()[0]).

  Performance: the field is rendered per pixel into a ~30k pixel buffer and upscaled with smoothing; crisp glyphs,
  trail and runes are drawn on top at device resolution. prefers-reduced-motion freezes the warp and shortens effects.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Paint Trail</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05060a; overscroll-behavior: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #cue { position: fixed; left: 0; right: 0; top: max(8px, env(safe-area-inset-top)); text-align: center; pointer-events: none;
    color: rgba(240, 235, 255, .88); font-weight: 650; font-size: clamp(12px, 3.6vw, 17px); letter-spacing: .02em;
    text-shadow: 0 0 10px rgba(150, 90, 255, .8), 0 1px 2px #000; padding: 0 44px; transition: opacity .4s; }
  .bt { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .22); background: rgba(10, 8, 20, .45); color: rgba(255, 255, 255, .75);
    font-size: 18px; line-height: 34px; text-align: center; padding: 0; cursor: pointer; touch-action: manipulation;
    backdrop-filter: blur(3px); }
  .bt:active { transform: scale(.9); }
  #undo { left: 8px; } #again { right: 8px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cue">Wake the well: leave one rune unfed</div>
<button class="bt" id="undo" aria-label="undo">&#8630;</button>
<button class="bt" id="again" aria-label="restart">&#10227;</button>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>

const HOLE = g.hole;

// ---------- biomes (index = element index in g.col) ----------
const BI = [

  { name: 'dunes', base: [62, 42, 14], hi: [238, 196, 110], hot: [255, 244, 205], css: '#f0c66e' },
  { name: 'meadow', base: [6, 36, 16], hi: [74, 214, 96], hot: [210, 255, 170], css: '#5ddc70' },

// ---------- canvas / sizes ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

function resize() {

// ---------- state ----------

let drag = null, seeds = null, seedPress = -1, win = null, ghost = null;

const parts = [], floaters = [];

let CP = [], RUNE = { cx: 0, cy: 0, R: 20, s: 8, pos: [] };
function layoutRunes() {

// ---------- field render ----------
function renderField(now) {

          const fx = gx - cx - .3 - .4 * h, fy = gy - cy - .3 - .4 * NZ[((cx & 63) << 6) | (cy & 63)], d2 = fx * fx + fy * fy; v = Math.max(0, 1 - d2 / .06); m = .2 + .75 * v; }

// ---------- overlay drawing ----------
function drawGlyphs(now) {

function fedSet(now) { const f = [0, 0, 0, 0]; g.rim.forEach(x => { const b = shownAt(x, CP[x][0], CP[x][1], now); if (b >= 0) f[b]++; }); return f; }

    const b = shownAt(x, CP[x][0], CP[x][1], now); if (b < 0) return;

    const pulse = .5 + .5 * Math.sin(t * (starve ? 14 : 2) + b);

    ctx.lineWidth = 1.6; ctx.strokeStyle = BI[b].css; ctx.globalAlpha = fed[b] ? .95 : .5; ctx.stroke();

    }

    glyph(ctx, b, s * .8); ctx.stroke(); ctx.restore();

}
function drawTrail(T, now, alpha) {

  const c0 = BI[T.a].css, c1 = T.b >= 0 ? BI[T.b].css : c0;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

function drawSeeds(now) {

function drawParts(dt) {

function burst(x, y, c, n, sp, grav) { for (let i = 0; i < (RM ? n / 4 : n); i++) { const a = rnd() * 6.283, v = sp * (.3 + rnd()); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c, s: 1 + rnd() * 2.2, life: .5 + rnd() * .7, max: 1.2, grav }); } }

// ---------- audio (after first gesture) ----------
let AC = null;

const NOTE = [220, 262, 330, 392];

// ---------- gestures ----------

  tone(NOTE[K.pair[0]] * 2, NOTE[K.pair[1]] * 2, .5, 'triangle', .07); tone(110, 330, .7, 'sine', .05, .05);

  burst(p[0], p[1], '#999', 26, 120, 60); floaters.push({ x: p[0], y: p[1] - 14, s: FIZZ[(rnd() * FIZZ.length) | 0], life: 1.4 });
  tone(160, 60, .35, 'sawtooth', .03);
}

  const a = g.col[u], R = Math.max(26, Math.min(40, Math.min(CW, CH) * .08)), r = Math.max(15, R * .55);
  const items = [0, 1, 2, 3].filter(b => b !== a).map((b, q) => { const an = -Math.PI / 2 + (q - 1) * 2.1; let sx = x + Math.cos(an) * R, sy = y + Math.sin(an) * R; sx = Math.max(r + 4, Math.min(CW - r - 4, sx)); sy = Math.max(r + 4, Math.min(CH - r - 4, sy)); return { b, x: sx, y: sy, r }; });

function seedHit(x, y) { if (!seeds) return -1; return seeds.items.findIndex(S => Math.hypot(S.x - x, S.y - y) < S.r * 1.25); }
let trailFade = null;
function pt(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  audio(); const now = performance.now(); lastAct = now; ghost = null; if (zone && zone.mode === 3) zone = null;
  const [x, y] = pt(e);
  if (win) { if (now - win.t0 > 900) g.reset(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}

});
cv.addEventListener('pointermove', e => {
  const now = performance.now(), [x, y] = pt(e);
  if (seedPress >= 0) { if (seedHit(x, y) !== seedPress) { seedPress = -1; zone = null; pv = null; } return; }
  if (!drag) return; lastAct = now;
  const P = drag.pts, L = P[P.length - 1], dx = x - L[0], dy = y - L[1], d = Math.hypot(dx, dy); if (d < 3) return;
  drag.len += d;
  const r = regionAt(x, y, now);

  if (drag.web && rnd() < .5) parts.push({ x, y, vx: (rnd() - .5) * 80, vy: (rnd() - .5) * 80, c: '#888', s: 1.2, life: .4, max: .4 });
