<!doctype html>
<!--
  BLOCKS: "Cat Nap Blocks". A Meowdoku-style front end for Fill the Hole.

  What the player sees: a square board of chunky pastel blocks (a voxel-ish grid, 18x18 for level 4). Every map
  region is a pastel blob of blocks in its element's tint (fire = peach, water = sky, air = butter, earth = mint),
  with dark grout between blobs so the regions read at a glance, and the element icon stamped on one block. In the
  middle is the hole: a wicker cat basket with an empty cushion. The 5 rim regions around it each hold a sleeping
  cat, grumbling in its sleep: the basket can't be filled while the cats around it use all 4 colours. Four yarn balls
  in the top bar show which colours the cats are using; the goal cue reads "Free a colour for the basket".

  What the player does (fast taps):
    * Tap a region u: up to 3 paw chips pop up next to the finger, one per partner element b != col[u], tinted by b.
      Chip b  ==  g.chainAt(u, b)  (exactly the entries of g.chainsThrough(u)). Pressing a chip outlines its chain;
      releasing on it calls g.swap(K). Every block of the chain then flips over one by one in a cascade from the tap
      point (Minecraft block flip), coming up in its new colour.
    * Or drag from region u into a neighbouring region v: that picks the pair directly, K = g.chainAt(u, g.col[v])
      (the {col[u], col[v]} chain through u, which contains v). The chain is outlined while you hover; letting go swaps.
    * A web chain (K.web: the only {a,b} chain, swapping it just renames two colours) is a dud: its blocks wobble and
      nothing changes. Dragging onto a non-neighbour / the basket, or tapping the basket, gives a gentle wobble.
    * Win (g.won(): rim down to 3 colours): the free yarn ball rolls into the basket, the basket blocks flip to the
      colour g.free(), the cats wake up and celebrate. Tap anywhere to play again (g.reset()).
    * Small undo / restart paws in the top bar call g.undo() / g.reset().

  Rasterisation: each grid cell takes the region whose dual-map polygon (g.cells, exact adjacency, [-1,1]^2) contains
  the cell centre; then a repair pass (hill-climb on boundary cells, path carving for missing borders, dissolving
  stray pieces) makes every region non-empty and 4-connected and makes grid contact == graph adjacency exactly.
  The board size is the first of 18,16,20,... (28,32,... for 34-region maps) that repairs cleanly. All rules go through core.js (no re-implementation).
-->

<head>
<meta charset="utf-8">

    .grr { opacity: 1; }
  }

  const gOver = el('g', {}, svg), ha = anc[g.hole];
  const bk = el('g', { transform: `translate(${cx(ha)} ${cy(ha) + .05})` }, gOver), bki = el('g', { class: 'bk', filter: 'url(#soft)' }, bk);
  bki.innerHTML = `<ellipse cx="0" cy="-.06" rx=".86" ry=".32" fill="#b07a46" stroke="${INK}" stroke-width=".06"/>` +
    `<ellipse class="cush" cx="0" cy="-.02" rx=".66" ry=".21" fill="#f6eedf"/>` +
    `<g class="ball" opacity="0"><circle cx="0" cy="-.16" r=".27" stroke="${INK}" stroke-width=".05"/><path d="M-.2 -.3q.2 .1 .38 .02M-.25 -.12q.25 .1 .5 -.04M-.14 .03q.16 -.06 .3 -.1" fill="none" stroke="#fff" stroke-width=".04" opacity=".8"/></g>` +
    `<path d="M-.86 -.05Q-.78 .62 0 .62Q.78 .62 .86 -.05Q0 .34 -.86 -.05Z" fill="#dcae72" stroke="${INK}" stroke-width=".06"/>` +
    `<path d="M-.6 .2Q0 .44 .6 .2M-.5 .4Q0 .58 .5 .4" fill="none" stroke="#b07a46" stroke-width=".05"/>`;
  const cush = bki.querySelector('.cush'), ball = bki.querySelector('.ball'), ballC = ball.querySelector('circle');

  // cats on the rim
  const FUR = ['#fffaf2', '#f7b77e', '#cdc6d8', '#f2d7ae', '#a99db2'];
  const cats = g.rim.map((u, k) => {
    const a = anc[u], c = el('g', { class: 'cat', transform: `translate(${cx(a)} ${cy(a) - .05}) scale(.92)` }, gOver), b = el('g', { class: 'cb', filter: 'url(#soft)' }, c), fur = FUR[k % 5];
    const flip = cx(a) < N / 2 ? ' transform="scale(-1 1)"' : ''; // heads toward the basket
    b.style.animationDelay = (-k * .83) + 's';
    b.innerHTML = `<g${flip}>` +
      `<path d="M.74 .22C.95 .62 .42 .8 -.05 .68" fill="none" stroke="${INK}" stroke-width=".22" stroke-linecap="round"/><path d="M.74 .22C.95 .62 .42 .8 -.05 .68" fill="none" stroke="${fur}" stroke-width=".12" stroke-linecap="round"/>` +
      `<ellipse cx=".12" cy=".2" rx=".72" ry=".45" fill="${fur}" stroke="${INK}" stroke-width=".06"/>` +
      `<path d="M-.7 -.12L-.68 -.52L-.44 -.32ZM-.3 -.34L-.08 -.52L-.06 -.14Z" fill="${fur}" stroke="${INK}" stroke-width=".06" stroke-linejoin="round"/>` +
      `<path d="M-.64 -.2L-.63 -.42L-.5 -.31ZM-.24 -.32L-.11 -.43L-.1 -.22Z" fill="#f4a7b6"/>` +
      `<circle cx="-.38" cy="-.02" r=".37" fill="${fur}" stroke="${INK}" stroke-width=".06"/>` +
      `<ellipse cx="-.62" cy=".1" rx=".07" ry=".045" fill="#f4a7b6"/><ellipse cx="-.14" cy=".1" rx=".07" ry=".045" fill="#f4a7b6"/>` +
      `<path d="M-.41 .07h.06l-.03 .035z" fill="#e2808f"/>` +
      `<g class="sleep" fill="none" stroke="${INK}" stroke-width=".045" stroke-linecap="round"><path d="M-.57 0q.07 .06 .14 0M-.33 0q.07 .06 .14 0M-.6 -.12l.13 .04M-.16 -.12l-.13 .04M-.43 .19q.05 -.045 .1 0"/>` +
      `<path class="grr" d="M-.08 -.5c.07 -.1 .14 .1 .21 0s.14 .1 .21 0s.14 .1 .21 0" stroke-width=".05"/></g>` +
      `<g class="wake"><circle cx="-.5" cy="-.03" r=".065" fill="${INK}"/><circle cx="-.26" cy="-.03" r=".065" fill="${INK}"/><circle cx="-.48" cy="-.05" r=".022" fill="#fff"/><circle cx="-.24" cy="-.05" r=".022" fill="#fff"/>` +
      `<path d="M-.46 .14q.04 .05 .08 0q.04 .05 .08 0" fill="none" stroke="${INK}" stroke-width=".04" stroke-linecap="round"/>` +
      `<path class="heart" style="animation-delay:${k * .3}s" d="M.1 -.6c-.06 -.1 -.2 -.05 -.15 .06l.15 .14l.15 -.14c.05 -.11 -.09 -.16 -.15 -.06z" fill="#ff8fab"/></g>` +
      `<circle class="tag" cx="-.38" cy=".38" r=".15" stroke="#fff" stroke-width=".04"/></g>`;
    const tagG = b.querySelector('.tag').parentNode, tagI = iconEl(0, tagG, 'translate(-.38 .38) scale(.0085) translate(-12 -12)', '#fff');
    return { u, g: c, tag: b.querySelector('.tag'), tagI };
  });
  const gChips = el('g', {}, svg);

  // ---------------- colours ----------------
  let shown = g.col.slice(), basket = -1;
  function paintCell(i, e) {
    const u = lab[i];
    cellR[i].setAttribute('fill', u === g.hole ? (basket >= 0 ? E[basket].pastel : 'url(#wick)') : E[e].pastel);
    if (i === anc[u]) {
      if (blockIcon[u]) setIcon(blockIcon[u], e, E[e].dark);
      const k = rimIdx.get(u); if (k !== undefined) { cats[k].tag.setAttribute('fill', E[e].hex); setIcon(cats[k].tagI, e, '#fff'); }
    }
  }
  function paintAll() { for (let i = 0; i < M; i++) paintCell(i, shown[lab[i]]); }
  function yarnBar() {
    const used = new Set(g.rimColours()); let h = '';
    for (let e = 0; e < 4; e++) {
      const x = 13 + e * 26, free = !used.has(e);
      h += `<g class="yb${free ? ' free' : ''}" opacity="${free ? 1 : .42}"><circle cx="${x}" cy="15" r="11" fill="${E[e].pastel}" stroke="${free ? E[e].dark : INK}" stroke-width="2"/>` +
        `<path d="M${x - 7} ${11}q7 4 14 0M${x - 8} ${16}q8 4 16 -1M${x - 5} ${21}q5 -2 10 -4" fill="none" stroke="#fff" stroke-width="1.6" opacity=".8"/>` +
        (free ? '' : `<g fill="${INK}" opacity=".8"><ellipse cx="${x}" cy="17.5" rx="3.6" ry="2.8"/><circle cx="${x - 4}" cy="12.6" r="1.5"/><circle cx="${x - 1.4}" cy="10.6" r="1.5"/><circle cx="${x + 1.4}" cy="10.6" r="1.5"/><circle cx="${x + 4}" cy="12.6" r="1.5"/></g>`) + '</g>';
    }
    yarn.innerHTML = h;
  }

  // ---------------- juice: sound + animation ----------------
  let ac = null;
  const audio = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; };
  function tone(f, dur, type, vol, f2, delay) {
    if (!ac) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vol, t + .01); v.gain.exponentialRampToValueAtTime(.0005, t + dur);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  }
  const pop = () => tone(480 + Math.random() * 80, .09, 'sine', .14, 920);
  const tick = d => tone(520 + Math.min(d, 18) * 45, .05, 'triangle', .05, null);
  const boing = () => { tone(240, .28, 'sine', .14, 120); tone(250, .2, 'triangle', .05, 170, .05); };
  function meow(delay) {
    if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), fl = ac.createBiquadFilter(), v = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(480, t); o.frequency.linearRampToValueAtTime(820, t + .16); o.frequency.linearRampToValueAtTime(540, t + .45);
    fl.type = 'bandpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.linearRampToValueAtTime(1600, t + .18); fl.frequency.linearRampToValueAtTime(800, t + .45); fl.Q.value = 3;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.13, t + .05); v.gain.exponentialRampToValueAtTime(.0005, t + .5);
    o.connect(fl).connect(v).connect(ac.destination); o.start(t); o.stop(t + .52);
  }
  const chime = () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .35, 'sine', .1, null, .5 + k * .09));

  let jobs = [];
  const later = (fn, ms) => { const j = { fn, id: 0 }; j.id = setTimeout(() => { jobs = jobs.filter(x => x !== j); fn(); }, ms); jobs.push(j); };
  const flush = () => { const js = jobs; jobs = []; js.forEach(j => { clearTimeout(j.id); j.fn(); }); };
  const anim = (node, frames, opt) => { if (!reduce && node.animate) try { return node.animate(frames, opt); } catch (e) { } return null; };
  const wobble = (cellsList, strong) => cellsList.forEach((i, k) => anim(cellF[i], [{ transform: 'rotate(0)' }, { transform: `rotate(${strong ? 10 : 6}deg)` }, { transform: `rotate(${strong ? -9 : -5}deg)` }, { transform: 'rotate(3deg)' }, { transform: 'rotate(0)' }], { duration: 380, delay: Math.min(k * 6, 120), easing: 'ease-in-out' }));
  const regCells = set => { const o = []; for (let i = 0; i < M; i++) if (set.has(lab[i])) o.push(i); return o; };
  const boop = set => regCells(set).forEach(i => anim(cellF[i], [{ transform: 'scale(1)' }, { transform: 'scale(.86)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 200, easing: 'ease-out' }));

  // flip every block whose region colour differs between `shown` and the target colouring, cascading from `origin`
  function flipTo(target, origin, done) {
    flush();
    const regs = new Set(); for (let u = 0; u < g.n; u++) if (u !== g.hole && shown[u] !== target[u]) regs.add(u);
    const order = cascade(grid, regs, origin), maxD = order.length ? order[order.length - 1][1] : 0, step = reduce ? 0 : Math.min(55, 700 / (maxD + 1));
    shown = target.slice();
    let lastD = -1;
    order.forEach(([i, d]) => {
      const e = target[lab[i]], at = d * step;
      if (reduce) { paintCell(i, e); return; }
      anim(cellF[i], [{ transform: 'scaleY(1)' }, { transform: 'scaleY(0) scaleX(1.08)', offset: .5 }, { transform: 'scaleY(1.12) scaleX(.96)', offset: .78 }, { transform: 'scaleY(1)' }], { duration: 300, delay: at, easing: 'ease-in-out' });
      later(() => paintCell(i, e), at + 150);
      if (d !== lastD) { lastD = d; later(() => tick(d), at); }
    });
    later(() => { if (done) done(); }, (maxD + 1) * step + 320);
  }

  // ---------------- state views ----------------
  let sel = -1, selCell = -1, chips = [];
  function clearSel() { sel = -1; chips = []; gChips.textContent = ''; lineSel.setAttribute('opacity', 0); showChain(null); }
  function showChain(K) { if (!K) { lineK.setAttribute('opacity', 0); return; } lineK.setAttribute('d', outline(K.set)); lineK.setAttribute('opacity', 1); }
  function refresh() {
    yarnBar();
    svg.classList.toggle('won', basket >= 0);
    cue.textContent = basket >= 0 ? 'Nap time! Tap to play again' : g.won() ? 'A colour is free!' : 'Free a colour for the basket';
    if (basket >= 0) { cush.setAttribute('fill', E[basket].pastel); ball.setAttribute('opacity', 1); ballC.setAttribute('fill', E[basket].hex); }
    else { cush.setAttribute('fill', '#f6eedf'); ball.setAttribute('opacity', 0); }
  }
  const unit = () => { const m = svg.getScreenCTM(); return m ? m.a : 20; };
  function openChips(u, p) {
    clearSel(); sel = u;
    lineSel.setAttribute('d', outline(new Set([u]))); lineSel.setAttribute('opacity', .95);
    const Ks = chipChains(g, u), R = Math.max(.62, 21 / unit()), D = R * 2.15, spread = Ks.length === 3 ? [-52, 0, 52] : Ks.length === 2 ? [-30, 30] : [0];
    const below = p.y - D - R < -.4;
    Ks.forEach((K, k) => {
      const b = K.pair[0] === g.col[u] ? K.pair[1] : K.pair[0], ang = (below ? 90 : -90) + spread[k] * (below ? -1 : 1);
      let x = p.x + D * Math.cos(ang * Math.PI / 180), y = p.y + D * Math.sin(ang * Math.PI / 180);
      x = Math.max(R - .5, Math.min(N + .5 - R, x)); y = Math.max(R - .5, Math.min(N + .5 - R, y));
      const c = el('g', { class: 'chip', transform: `translate(${q(x)} ${q(y)})` }, gChips), ci = el('g', { filter: 'url(#soft)' }, c);
      el('circle', { r: R, fill: E[b].pastel, stroke: '#fff', 'stroke-width': R * .16 }, ci);
      el('circle', { r: R * 1.04, fill: 'none', stroke: E[b].dark, 'stroke-width': R * .07 }, ci);
      const pw = el('g', { transform: `scale(${R * .62})`, fill: E[b].dark }, ci);
      el('ellipse', { cx: 0, cy: .28, rx: .42, ry: .34 }, pw);
      [[-.5, -.14], [-.18, -.46], [.18, -.46], [.5, -.14]].forEach(([a, bb]) => el('ellipse', { cx: a, cy: bb, rx: .15, ry: .19 }, pw));
      anim(ci, [{ transform: 'scale(0)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 240, delay: k * 45, easing: 'ease-out', fill: 'backwards' });
      chips.push({ K, x, y, R, node: ci });
    });
  }

  // ---------------- moves ----------------
  function doSwap(K, originCell) {
    clearSel();
    if (!K || g.won()) return;
    if (K.web) { wobble(regCells(K.set), true); boing(); return; }
    pop();
    g.swap(K);
    refresh();
    const won = g.won();
    flipTo(g.col, originCell, won ? win : null);
  }
  function win() {
    basket = g.free();
    const hc = cascade(grid, new Set([g.hole]), anc[g.hole]), step = reduce ? 0 : 60;
    hc.forEach(([i, d]) => { anim(cellF[i], [{ transform: 'scaleY(1)' }, { transform: 'scaleY(0)', offset: .5 }, { transform: 'scaleY(1)' }], { duration: 320, delay: d * step }); later(() => paintCell(i, -1), d * step + 160); });
    anim(bki, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-.2px) scale(1.12, .9)' }, { transform: 'translateY(0) scale(1)' }], { duration: 420, delay: 120 });
    refresh();
    meow(.05); meow(.35); chime();
  }
  function restart() { flush(); basket = -1; g.reset(); clearSel(); refresh(); for (let i = 0; i < M; i++) if (lab[i] === g.hole) paintCell(i, -1); flipTo(g.col, anc[g.hole]); pop(); }
  function undo() {
    if (basket >= 0) { restart(); return; }
    if (!g.moves) { wobble(regCells(new Set([g.hole]))); boing(); return; }
    clearSel(); g.undo(); refresh(); flipTo(g.col, anc[g.hole]); pop();
  }
  document.getElementById('undo').addEventListener('click', () => { audio(); undo(); });
  document.getElementById('again').addEventListener('click', () => {
    audio(); if (!g.moves && basket < 0) { boop(new Set(g.rim)); pop(); return; }
    restart();
  });

  // ---------------- gestures ----------------
  const toBoard = ev => { const m = svg.getScreenCTM(); if (!m) return { x: -9, y: -9 }; const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const r = p.matrixTransform(m.inverse()); return { x: r.x, y: r.y }; };
  const cellAt = p => (p.x < 0 || p.y < 0 || p.x >= N || p.y >= N) ? -1 : Math.floor(p.y) * N + Math.floor(p.x);
  let press = null;
  svg.addEventListener('pointerdown', ev => {
    audio(); ev.preventDefault();
    if (basket >= 0) { press = { again: true }; return; }
    if (g.won()) { press = null; return; } // the win is landing
    const p = toBoard(ev);
    const hit = chips.find(c => Math.hypot(p.x - c.x, p.y - c.y) <= c.R * 1.15);
    if (hit) { press = { chip: hit }; showChain(hit.K); anim(hit.node, [{ transform: 'scale(1)' }, { transform: 'scale(.9)' }], { duration: 90, fill: 'forwards' }); return; }
    const i = cellAt(p);
    if (i < 0) { clearSel(); press = null; return; }
    press = { u: lab[i], cell: i, p, v: lab[i], drag: false };
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { }
  });
  svg.addEventListener('pointermove', ev => {
    if (!press || press.chip || press.again) return;
    const p = toBoard(ev), i = cellAt(p), v = i < 0 ? -1 : lab[i];
    if (v === press.v) return;
    press.v = v;
    if (v !== press.u) { press.drag = true; if (sel >= 0) { gChips.textContent = ''; chips = []; } }
    const K = v >= 0 ? dragChain(g, press.u, v) : null;
    press.K = K; showChain(K);
    lineSel.setAttribute('d', outline(new Set([press.u]))); lineSel.setAttribute('opacity', press.drag ? .95 : lineSel.getAttribute('opacity'));
  });
  const end = ev => {
    const pr = press; press = null; if (!pr) return;
    if (pr.again) { restart(); return; }
    const p = toBoard(ev);
    if (pr.chip) {
      const c = pr.chip;
      if (Math.hypot(p.x - c.x, p.y - c.y) <= c.R * 1.4) doSwap(c.K, selCell);
      else { anim(c.node, [{ transform: 'scale(.9)' }, { transform: 'scale(1)' }], { duration: 120, fill: 'forwards' }); showChain(null); }
      return;
    }
    if (pr.drag) {
      if (pr.v === pr.u) { clearSel(); return; } // dragged back home: cancel quietly
      if (pr.K) doSwap(pr.K, pr.cell);
      else { clearSel(); wobble(regCells(new Set([pr.u]))); boing(); }
      return;
    }
    // a tap
    if (pr.u === g.hole) { clearSel(); anim(bki, [{ transform: 'rotate(0)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(0)' }], { duration: 360 }); wobble(regCells(new Set([g.hole]))); tone(330, .14, 'sine', .1, 260); return; }
    if (sel === pr.u) { clearSel(); return; }
    boop(new Set([pr.u])); pop(); openChips(pr.u, pr.p); selCell = pr.cell;
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', () => { press = null; showChain(null); });
  addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z') undo(); });

  paintAll(); refresh();
  window.BLOCKS = { g, grid, anc };
})();
</script>
