<!doctype html>
<!--
  DOODLE MAP (Line Doodle's play page): a hand-drawn map (g.cells) on taped paper, coloured in with four felt-tip
  markers (the 4 elements, each with its own hatching). One piece, the hole (g.hole), is blank with a pulsing "?".
  No instruction text: the picture, glowing markers, a ghost finger and sound teach it.

  What the player does:
    1. tap a marker: picks pen b (it stays picked).
    2. press a coloured piece u (col[u] != b): it lifts at once and its chain K = g.chainAt(u, b) lights up, pulsing in
       its two pen colours with a rising tone per piece. Release on the same piece:
         - K.web -> the ink smudges in and fades back (no g.swap call), the marker shakes.
         - else  -> g.swap(K), exactly once: the pieces flip in a wave from the touch point (45 ms apart, a pop each)
                    and LAB.at() says where the coins fly from. Slide off the piece to cancel.
       A piece that already has pen b wobbles. Once the rim is down to 3 pens (g.won()) core refuses swaps.
    3. when g.won(): the free marker bobs and glows, the "?" turns its colour, a ghost finger taps the blank piece.
       Tap the blank piece with that pen: it fills, then the whole sheet is scribbled over in a celebratory wave with
       doodled stars (~3.5 s), then LAB.done(). A pen already on the rim sparks on the clashing borders instead.
  Progress: when an element leaves the rim, a blob of its ink flies from the blank piece back into its marker and the
  rim pieces bounce. Idle ~7 s: a pencil circle round a useful piece, its marker bobs, a ghost finger taps there.
  Margin (top left): undo (g.undo) and restart (g.reset), inert once won inside the app.
  Eggs (skins/doodle.js `eggs`): 'doodle-smiley' (idle 25 s: a smiley is sketched in the paper's margin; tap it) and
  'cap-click' (tap one marker 5 times quickly: it squeaks and spins).

  The logic block between LOGIC-START/END is DOM-free and is smoke-tested in node.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Doodle Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; background: #e6d2ad;
    background-image: radial-gradient(rgba(140,100,50,.13) 1.2px, transparent 1.6px); background-size: 15px 15px;
    font-family: Fredoka, 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #2b2d42; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* the marker tray: a chunky 3D pencil case behind the pens (a control: it wears the skin's --sk-ctl tokens) */
  #pal { position: fixed; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  #pal::after { content: ""; position: absolute; left: 50%; bottom: 0; width: var(--trayw, 70%); height: 44%; transform: translateX(-50%);
    background: var(--sk-ctl, #fffcf3); border: 2.5px solid var(--sk-ctl-edge, #2b2d42); border-bottom-width: 6px; border-radius: 18px 22px 17px 21px;
    box-shadow: 3px 4px 0 rgba(43,45,66,.3); z-index: -1; box-sizing: border-box; }
  .pen { pointer-events: auto; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; position: relative; z-index: 1;
    transition: transform .2s cubic-bezier(.3,1.7,.5,1), opacity .3s, filter .3s; transform-origin: 50% 100%; }
  .pen svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pen .cap { transition: transform .45s cubic-bezier(.3,1.6,.5,1), opacity .45s; transform-box: fill-box; transform-origin: 50% 100%; }
  .pen.open .cap { transform: translate(14px,-46px) rotate(38deg); opacity: 0; }
  .pen.sel { transform: translateY(-16%) rotate(-6deg); filter: drop-shadow(0 0 6px rgba(255,245,157,.95)); }
  .pen.glow { filter: drop-shadow(0 0 6px #fff59d) drop-shadow(0 0 3px #ffb300); }
  .pen.dim { opacity: .45; filter: saturate(.45); }
  .pen.shake { animation: shake .4s; }
  .pen.hop { animation: hop .45s cubic-bezier(.3,1.8,.5,1); }
  .pen.bob { animation: bob 1.1s ease-in-out infinite; }
  .pen.spin { animation: spin .9s cubic-bezier(.3,1.4,.5,1); }
  .pen.dance { animation: dance .7s ease-in-out infinite; }
  .pen.gulp { animation: gulp .4s cubic-bezier(.3,1.8,.5,1); }
  @keyframes shake { 20% { transform: translateY(-10%) rotate(-12deg); } 45% { transform: translateY(-4%) rotate(10deg); } 70% { transform: rotate(-5deg); } }
  @keyframes hop { 40% { transform: translateY(-14%); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14%) rotate(4deg); } }
  @keyframes spin { 0% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-30%) rotate(200deg); } 100% { transform: translateY(0) rotate(360deg); } }
  @keyframes dance { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-18%) rotate(8deg); } }
  @keyframes gulp { 40% { transform: scale(1.15, .9); } }
  #tools { position: fixed; left: 8px; top: 6px; display: flex; gap: 6px; }
  /* chunky 3D controls in the skin's control tokens (--sk-ctl*: lab/core.js) */
  #tools button { box-sizing: border-box; width: 40px; height: 38px; padding: 4px; border: 2.5px solid var(--sk-ctl-edge, #2b2d42); border-bottom-width: 5px;
    border-radius: 12px 14px 11px 13px; background: var(--sk-ctl, #fffcf3); cursor: pointer; box-shadow: 2px 3px 0 rgba(43,45,66,.28);
    transition: transform .08s, border-bottom-width .08s; }
  #tools svg { stroke: var(--sk-ctl-ink, #2b2d42); width: 100%; height: 100%; display: block; }
  #tools button:active { transform: translateY(3px); border-bottom-width: 2.5px; box-shadow: 1px 1px 0 rgba(43,45,66,.28); }
  .won.embed #tools button { opacity: .45; }
  #stamp { position: fixed; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.3) rotate(-25deg); transition: opacity .2s, transform .45s cubic-bezier(.3,1.8,.5,1); }
  #stamp.on { opacity: 1; transform: scale(1) rotate(-8deg); }
  #stamp .st { background: #fffdf5; border: 3px solid #2b2d42; border-radius: 18px; padding: .2em .6em; font-weight: 700; color: #1f8f45;
    box-shadow: 4px 5px 0 rgba(43,45,66,.85); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .pen, .pen .cap, #stamp { transition: none; } .pen.shake, .pen.hop, .pen.bob, .pen.spin, .pen.dance, .pen.gulp { animation: none; } }
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="a hand-drawn map to colour in; one piece is blank"></canvas>
<div id="tools">
  <button id="undo" aria-label="undo"><svg viewBox="0 0 30 30" fill="none" stroke="#2b2d42" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 11 C13 6.5 22 7 23.5 14 C25 21 17 24.5 12 22"/><path d="M8.5 5.5 L8.6 11.4 L14.3 11.2"/></svg></button>
  <button id="again" aria-label="start over"><svg viewBox="0 0 30 30" fill="none" stroke="#2b2d42" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 10.5 A9.2 9.2 0 1 0 24.5 17"/><path d="M24.2 4.8 L23.4 10.8 L17.6 9.6"/></svg></button>
</div>
<div id="pal" role="toolbar" aria-label="felt-tip markers"></div>
<div id="stamp" aria-hidden="true"><div class="st">Coloured!</div></div>

<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>
/*LOGIC-START*/
const DM = (() => {
  // map geometry in unit-square coords [0,1]^2 (cell x,y in [-1,1] -> (x+1)/2, (y+1)/2; y grows down the page)
  function prep(g) {
    const U = g.cells.map(c => c.map(p => [(p[0] + 1) / 2, (p[1] + 1) / 2]));
    const key = p => p[0].toFixed(5) + ',' + p[1].toFixed(5), E = new Map();
    U.forEach((c, i) => c.forEach((p, j) => {
      const q = c[(j + 1) % c.length], a = key(p), b = key(q), k = a < b ? a + '|' + b : b + '|' + a;
      if (!E.has(k)) E.set(k, { p, q, own: [] });
      const e = E.get(k); if (!e.own.includes(i)) e.own.push(i);
    }));
    const segs = [], frame = [], pairSegs = new Map();
    for (const e of E.values()) {
      if (e.own.length === 2) {
        const a = Math.min(...e.own), b = Math.max(...e.own), s = { a, b, p: e.p, q: e.q, len: Math.hypot(e.q[0] - e.p[0], e.q[1] - e.p[1]) };
        segs.push(s); const k = a + '_' + b; if (!pairSegs.has(k)) pairSegs.set(k, []); pairSegs.get(k).push(segs.length - 1);
      } else frame.push(e);
    }
    const info = U.map(P => {
      let a = 0, cx = 0, cy = 0, per = 0, x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let k = 0; k < P.length; k++) {
        const p = P[k], q = P[(k + 1) % P.length], c = p[0] * q[1] - q[0] * p[1];
        a += c; cx += (p[0] + q[0]) * c; cy += (p[1] + q[1]) * c; per += Math.hypot(q[0] - p[0], q[1] - p[1]);
        x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
      a /= 2; const P2 = pole(P, [x0, y0, x1, y1]);
      return { area: Math.abs(a), c: P2.c, inr: P2.r, box: [x0, y0, x1, y1] };
    });
    return { U, segs, frame, pairSegs, info };
  }
  // the roomiest interior point (pole of inaccessibility, by grid search + refinement) and its distance to the border
  function segD(x, y, p, q) { const dx = q[0] - p[0], dy = q[1] - p[1], L = dx * dx + dy * dy || 1e-12;
    const t = Math.max(0, Math.min(1, ((x - p[0]) * dx + (y - p[1]) * dy) / L)); return Math.hypot(x - p[0] - t * dx, y - p[1] - t * dy); }
  function edgeD(P, x, y) { let d = Infinity; for (let k = 0; k < P.length; k++) d = Math.min(d, segD(x, y, P[k], P[(k + 1) % P.length])); return d; }
  function pole(P, b) {
    let best = null, bd = -1, h = Math.max(b[2] - b[0], b[3] - b[1]) / 16;
    for (let x = b[0] + h / 2; x < b[2]; x += h) for (let y = b[1] + h / 2; y < b[3]; y += h)
      if (pip(P, x, y)) { const d = edgeD(P, x, y); if (d > bd) { bd = d; best = [x, y]; } }
    if (!best) { best = P[0].slice(); bd = 0; }
    for (let it = 0; it < 40; it++) { h *= 0.8; let moved = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [.7, .7], [-.7, .7], [.7, -.7], [-.7, -.7]]) {
        const x = best[0] + dx * h, y = best[1] + dy * h;
        if (pip(P, x, y)) { const d = edgeD(P, x, y); if (d > bd) { bd = d; best = [x, y]; moved = true; } } }
      if (!moved && h < 1e-4) break; }
    return { c: best, r: bd };
  }
  function pip(P, x, y) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const a = P[i], b = P[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function faceAt(M, x, y) { // a tap a hair outside the square still counts (clamped)
    if (x < -0.04 || x > 1.04 || y < -0.04 || y > 1.04) return -1;
    x = Math.min(1 - 1e-6, Math.max(1e-6, x)); y = Math.min(1 - 1e-6, Math.max(1e-6, y));
    for (let i = 0; i < M.U.length; i++) { const b = M.info[i].box;
      if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3] && pip(M.U[i], x, y)) return i; }
    return -1;
  }
  const sharedSeg = (M, u, v) => { const L = M.pairSegs.get(Math.min(u, v) + '_' + Math.max(u, v)); if (!L) return null;
    let best = L[0]; for (const s of L) if (M.segs[s].len > M.segs[best].len) best = s; return M.segs[best]; };
  // the gesture: pen b (0..3, or -1 for none) + tapped piece u -> what happens (the UI then does at most one g.swap)
  function move(g, b, u) {
    if (u < 0) return { kind: 'none' };
    if (b < 0) return { kind: 'nopen' };
    if (b >= g.NC) return { kind: 'none' };                // a pen outside this level's palette (the 2- and 3-element ponds)
    if (u === g.hole) {
      const hits = g.adj[g.hole].filter(v => g.col[v] === b);
      return hits.length ? { kind: 'blocked', hits } : { kind: 'fill', b };
    }
    if (g.col[u] === b) return { kind: 'same' };
    if (g.won()) return { kind: 'done' };
    const K = g.chainAt(u, b);
    if (!K) return { kind: 'none' };
    return { kind: K.web ? 'web' : 'swap', K };
  }
  // BFS through the chain from the tapped piece: depth and parent per piece (for the bloom order)
  function order(g, K, u) {
    const dep = new Map([[u, 0]]), par = new Map([[u, -1]]); let front = [u];
    while (front.length) { const nx = []; for (const v of front) for (const w of g.adj[v]) if (K.set.has(w) && !dep.has(w)) { dep.set(w, dep.get(v) + 1); par.set(w, v); nx.push(w); } front = nx; }
    return { dep, par };
  }
  // the hint: a piece of g.good()[0] (the roomiest one) and the pen that picks out that chain there
  function hint(g, M) {
    if (g.won()) return { u: g.hole, b: g.free() };
    const G = g.good(); if (!G.length) return null;
    const K = G[0]; let u = K.vs[0];
    for (const v of K.vs) if (M.info[v].inr > M.info[u].inr) u = v;
    return { u, b: g.col[u] === K.pair[0] ? K.pair[1] : K.pair[0], K };
  }
  return { prep, pip, faceAt, move, order, hint, sharedSeg };
})();
/*LOGIC-END*/
</script>
<script>
(() => {
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const g = LAB.game(), M = DM.prep(g);
  const HUD = new URLSearchParams(location.search).get('hud');
  document.documentElement.dataset.hud = HUD || '';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const palEl = document.getElementById('pal'), stamp = document.getElementById('stamp');
  const INK = '#2b2d42', PENCIL = 'rgba(80,82,96,', PAPER = '#fffcf3';
  const FONT = "Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif";
  // pen k = element k (fire, water, air, earth)
  const PENS = [
    { c: '#ff5d5d', d: '#c93636', a: Math.PI / 4 }, { c: '#3fa7f5', d: '#1f74b8', a: -Math.PI / 4 },
    { c: '#ffc928', d: '#c9900a', a: 0 }, { c: '#3ccf6e', d: '#1f8f45', a: Math.PI / 2 }];
  function rng(seed) { let a = seed >>> 0;
    return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const egg = (id, pts) => { try { window.LAB && LAB.egg && LAB.egg(id, pts); } catch (_) {} };
  const coinsAt = (x, y) => { try { window.LAB && LAB.at && LAB.at(x, y); } catch (_) {} };

  // ---------- state ----------
  let pen = -1, holeCol = -1, won = false, wonAt = 0, drawStart = 0, drawTotal = 0;
  let anim = [], wob = [], pops = [], smudges = [], sparks = [], confetti = [], flyers = [], stars = [], scrib = [];
  let qHop = 0, hintOn = null, hintT0 = 0, readyT = 0, press = null, lit = null, rimBounce = 0, holeDep = new Map(), smiley = null;

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, PX = 0, PY = 0, PS = 0, PH = 0, RX = 0, RY = 0, RS = 0, CH = 0, penW = 0, penH = 0, paper = null, paths = [];
  const ASP = 1.07, NP = Math.min(4, g.NC);
  function layout() {
    W = innerWidth; H = innerHeight; dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const land = W > H * 1.15, top = 46;
    if (land) {
      penH = Math.max(70, Math.min(170, H * 0.34)); penW = penH * 0.3;
      const palW = 4 * penW + 3 * penW * 0.35 + 24;
      PS = Math.max(120, Math.min(W - palW - 24, (H - top - 12) / ASP)); PH = PS * ASP;
      PX = Math.max(12, (W - palW - PS) / 2); PY = top + Math.max(0, (H - top - 12 - PH) / 2);
      Object.assign(palEl.style, { left: (PX + PS + 12) + 'px', top: '0px', width: palW + 'px', height: (H / 2 + penH / 2) + 'px' });
    } else {
      penH = Math.max(56, Math.min(130, H * 0.16)); penW = penH * 0.3;
      const palH = penH + 14;
      PS = Math.max(120, Math.min(W - 20, (H - top - palH - 14) / ASP)); PH = PS * ASP;
      PX = (W - PS) / 2; PY = top + Math.max(0, (H - top - palH - 14 - PH) / 2);
      Object.assign(palEl.style, { left: '0px', width: W + 'px', top: (H - palH - 4) + 'px', height: palH + 'px' });
    }
    palEl.style.gap = (penW * 0.35) + 'px';
    palEl.style.setProperty('--trayw', (NP * penW + (NP - 1) * penW * 0.35 + penW * 1.1) + 'px');
    [...palEl.children].forEach(b => { b.style.width = penW + 'px'; b.style.height = penH + 'px'; });
    const m = PS * 0.05; CH = PH - PS; RS = PS - 2 * m; RX = PX + m; RY = PY + CH + m;
    Object.assign(stamp.style, { left: RX + 'px', top: RY + 'px', width: RS + 'px', height: RS + 'px', fontSize: Math.max(22, PS * 0.11) + 'px' });
    makePaper(); makePaths(); makePatterns(); render();
  }
  const X = p => (RX + p[0] * RS) * dpr, Y = p => (RY + p[1] * RS) * dpr;
  function makePaper() {
    const c = document.createElement('canvas'), w = Math.round(PS * dpr), h = Math.round(PH * dpr); c.width = w; c.height = h;
    const q = c.getContext('2d'); q.fillStyle = PAPER; q.fillRect(0, 0, w, h);
    const R = rng(7);
    for (let i = 0; i < w * h / 260; i++) { q.fillStyle = `rgba(120,100,60,${0.025 + R() * 0.05})`; q.fillRect(R() * w, R() * h, 1.2 * dpr, 1.2 * dpr); }
    q.strokeStyle = 'rgba(80,140,200,.10)'; q.lineWidth = dpr;
    for (let y = w * 0.035; y < h; y += w * 0.07) { q.beginPath(); q.moveTo(0, y); q.lineTo(w, y); q.stroke(); }
    paper = c;
  }
  let pats = [];
  function makePatterns() {
    pats = PENS.map(P => {
      const s = Math.round(9 * dpr), c = document.createElement('canvas'); c.width = c.height = s;
      const q = c.getContext('2d'); q.strokeStyle = P.d; q.globalAlpha = 0.33; q.lineWidth = 1.6 * dpr; q.beginPath();
      if (P.a === 0) { q.moveTo(0, s / 2); q.lineTo(s, s / 2); }
      else if (P.a === Math.PI / 2) { q.moveTo(s / 2, 0); q.lineTo(s / 2, s); }
      else if (P.a > 0) { for (const o of [-s, 0, s]) { q.moveTo(o, 0); q.lineTo(o + s, s); } }
      else { for (const o of [-s, 0, s]) { q.moveTo(o, s); q.lineTo(o + s, 0); } }
      q.stroke(); return ctx.createPattern(c, 'repeat');
    });
  }
  function makePaths() {
    paths = M.U.map(P => { const p = new Path2D(); P.forEach((q, i) => i ? p.lineTo(X(q), Y(q)) : p.moveTo(X(q), Y(q))); p.closePath(); return p; });
  }
  const cen = i => [X(M.info[i].c), Y(M.info[i].c)];
  const reach = (i, x, y) => { let R = 0; for (const q of M.U[i]) R = Math.max(R, Math.hypot(X(q) - x, Y(q) - y)); return R + 2 * dpr; };

  // ---------- hand-drawn ink (felt-tip wobble, slight overshoot past the corners) ----------
  function inkify(a, b, R, over) {
    const out = [], L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-9, m = Math.max(2, Math.ceil(L / 0.006));
    const nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L, ph1 = R() * 9, ph2 = R() * 9, a1 = 0.0011 + R() * 0.0009;
    const bow = (R() - 0.5) * Math.min(0.006, L * 0.05);
    for (let k = 0; k <= m; k++) { const t = k / m, s = t * L;
      const w = (k === 0 || k === m ? 0 : a1 * Math.sin(s * 41 + ph1) + 0.0007 * Math.sin(s * 97 + ph2)) + bow * Math.sin(Math.PI * t);
      out.push([a[0] + t * (b[0] - a[0]) + nx * w, a[1] + t * (b[1] - a[1]) + ny * w]); }
    const o1 = over * (0.4 + R()), o2 = over * (0.4 + R()), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    out.unshift([a[0] - ux * o1, a[1] - uy * o1]); out.push([b[0] + ux * o2, b[1] + uy * o2]);
    let len = 0; for (let i = 1; i < out.length; i++) len += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]);
    return { pts: out, len };
  }
  let ink = [], frameInk = [];
  function prepInk(seed) {

      <g class="cap"><rect x="5" y="2" width="30" height="42" rx="9" fill="${P.d}" stroke="${INK}" stroke-width="2.5"/>
      <rect x="27" y="8" width="5" height="26" rx="2" fill="${P.c}" stroke="${INK}" stroke-width="1.5"/></g></svg>`;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); au(); touch(); pen = i; syncPens(); squeak(i);
      // egg 'cap-click': the same marker five times quickly squeaks and spins
      const now = performance.now(); if (capPen === i && now - capT < 450) capN++; else capN = 1; capPen = i; capT = now;
      if (capN >= 5) { capN = 0; jolt(b, 'spin'); [0, .08, .16].forEach((d, k) => squeak(i, d, 0.14, 600 + k * 400)); if (!capPaid) { capPaid = true; egg('cap-click', 0); } }
    });
    if (i >= g.NC) b.style.display = 'none';             // the ponds use only 2 or 3 elements: their extra pens stay in the box
    palEl.appendChild(b); return b;
  });
  function syncPens() {
    const ready = g.won() && holeCol < 0 && !won, fr = g.free();
    penBtns.forEach((b, k) => {
      b.classList.toggle('sel', k === pen);
      b.classList.toggle('glow', ready && k === fr);
      b.classList.toggle('bob', (ready && k === fr && k !== pen) || (!!hintOn && hintOn.b === k && k !== pen));
      b.classList.toggle('dim', ready && k !== fr);
    });
  }
  function jolt(b, cls) { b.classList.remove('shake', 'hop', 'spin', 'gulp'); void b.offsetWidth; b.classList.add(cls); }
  penBtns.forEach(b => b.addEventListener('animationend', ev => { if (/^(shake|hop|spin|gulp)$/.test(ev.animationName)) b.classList.remove('shake', 'hop', 'spin', 'gulp'); }));
  function uncap() { // all four pens come uncapped at the start of a sheet (a little pop each)
    penBtns.forEach(b => b.classList.remove('open'));
    penBtns.forEach((b, k) => setTimeout(() => b.classList.add('open'), RM ? 0 : 250 + k * 110));
  }
  const penTop = e => { const r = penBtns[e].getBoundingClientRect(); return [(r.left + r.width / 2) * dpr, (r.top + r.height * 0.25) * dpr]; };

  // ---------- idle hint and the margin smiley ----------
  let idleT = 0, smileT = 0, smilePaid = false;
  function touch() {
    if (hintOn) { hintOn = null; syncPens(); kick(); }
    clearTimeout(idleT); idleT = setTimeout(showHint, 7000);
    clearTimeout(smileT); smileT = setTimeout(showSmiley, 25000);
  }
  function showHint() {
    if (won) return; const h = DM.hint(g, M); if (!h || h.b < 0) return;
    hintOn = h; hintT0 = performance.now(); syncPens(); kick();
  }
  // egg 'doodle-smiley': left alone a while, a little smiley gets sketched in the top margin; tapping it pays a few points
  const SMILE = (() => { const c = []; for (let k = 0; k <= 40; k++) { const a = -Math.PI / 2 + k / 40 * Math.PI * 2.05; c.push([Math.cos(a), Math.sin(a)]); } return c; })();
  const MOUTH = (() => { const c = []; for (let k = 0; k <= 14; k++) { const a = Math.PI * (0.15 + 0.7 * k / 14); c.push([Math.cos(a) * .58, Math.sin(a) * .58]); } return c; })();
  function showSmiley() {
    if (won || smiley) return null;
    const r = Math.max(10, Math.min(PS * 0.045, (CH + PS * 0.05) * 0.4));
    smiley = { x: (PX + PS * 0.9) * dpr, y: (PY + (CH + PS * 0.05) * 0.52) * dpr, r: r * dpr, t0: performance.now(), hit: 0 }; kick();
    return [smiley.x / dpr, smiley.y / dpr];
  }
  function drawSmiley(now) {
    const S = smiley, t = (now - S.t0) / 1000, r = S.r;
    let jy = 0, wink = false;
    if (S.hit) { const s = (now - S.hit) / 700; if (s < 1) { jy = -Math.sin(Math.PI * s) * r * 0.9; wink = s < .6; } }
    const bob = RM ? 0 : Math.sin(now / 400) * r * 0.06;
    const map = p => [S.x + p[0] * r, S.y + jy + bob + p[1] * r];
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const k = RM ? 1 : clamp01(t / 1.1);
    if (k >= 1) { ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(S.x, S.y + jy + bob, r, 0, 7); ctx.fill(); }
    ctx.strokeStyle = PENCIL + '.85)'; ctx.lineWidth = Math.max(1.6 * dpr, r * 0.14);
    drawPoly(SMILE, 6.5 * k, map);
    if (k > .7) { ctx.fillStyle = PENCIL + '.9)';
      ctx.beginPath(); ctx.arc(S.x - r * .32, S.y + jy + bob - r * .2, r * .1, 0, 7); ctx.fill();
      if (wink) { ctx.beginPath(); ctx.moveTo(S.x + r * .2, S.y + jy + bob - r * .2); ctx.lineTo(S.x + r * .44, S.y + jy + bob - r * .2); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(S.x + r * .32, S.y + jy + bob - r * .2, r * .1, 0, 7); ctx.fill(); }
      drawPoly(MOUTH, 2.2 * clamp01((k - .7) / .3), p => map([p[0], p[1] + .02])); }
    ctx.restore();
  }
  function smileyHit(e) {
    if (!smiley || performance.now() - smiley.t0 < 1100) return false;
    const x = e.clientX * dpr, y = e.clientY * dpr; if (Math.hypot(x - smiley.x, y - smiley.y) > smiley.r * 1.7) return false;
    smiley.hit = performance.now(); pop(7); pop(12, 0.08);
    if (!smilePaid) { smilePaid = true; egg('doodle-smiley', 40); }
    kick(); return true;
  }

  // ---------- sheets ----------
  function fresh() {
    won = false; holeCol = -1; readyT = g.won() ? performance.now() : 0; stamp.classList.remove('on'); document.documentElement.classList.remove('won');
    confetti = []; sparks = []; smudges = []; wob = []; pops = []; flyers = []; stars = []; scrib = []; lit = null; press = null; smiley = null;
    penBtns.forEach(b => b.classList.remove('dance'));
    const seed = (Math.random() * 2 ** 31) | 0; prepInk(seed);
    drawStart = performance.now();
    // fills bloom in after the ink, outward from the blank piece
    const dep = new Map([[g.hole, 0]]); let front = [g.hole];
    while (front.length) { const nx = []; for (const v of front) for (const w of g.adj[v]) if (!dep.has(w)) { dep.set(w, dep.get(v) + 1); nx.push(w); } front = nx; }
    holeDep = dep; anim = [];
    if (!RM) for (let i = 0; i < g.n; i++) { const [x, y] = cen(i); anim[i] = { t0: drawStart + 350 + dep.get(i) * 110, x, y, R: reach(i, x, y), from: -2 }; }
    prevRim = new Set(g.rimColours()); syncPens();
    uncap(); touch(); kick();
  }

  // ---------- progress: an element leaving the rim flies back into its marker; the rim bounces ----------
  let prevRim = new Set(g.rimColours());
  g.on((_, info) => {
    const now = performance.now(), rim = new Set(g.rimColours()), [hx, hy] = cen(g.hole);
    const gone = [...prevRim].filter(c => !rim.has(c)), changed = rim.size !== prevRim.size || gone.length;
    if (info.type === 'swap' && changed && !RM) {
      gone.forEach((c, k) => { const [x1, y1] = penTop(c);
        flyers.push({ c, x0: hx, y0: hy, x1, y1, arc: 60 * dpr, r: Math.max(9, PS * 0.03) * dpr, t0: now + 180 + k * 120, dur: 720 });
        setTimeout(() => { jolt(penBtns[c], 'gulp'); pop(9); }, 180 + k * 120 + 700); });
      g.rim.forEach((v, k) => { pops[v] = { t0: now + 120 + k * 50, dur: 320, amp: 0.12, rot: 0.12 }; });
      qHop = now + 120; if (gone.length) whoosh();
    }
    prevRim = rim;
    if (g.won() && holeCol < 0) { if (!readyT) readyT = now; } else readyT = 0;
    if (info.type !== 'swap') { lit = null; press = null; }
    syncPens(); kick();
  });

  // ---------- play ----------
  // BFS through the chain from the tapped piece -> each piece's rank in the wave
  function waveOf(K, u) { const { dep } = DM.order(g, K, u); return [...dep.entries()].sort((a, b) => a[1] - b[1]); }
  function lightUp(u, mv, now) {
    let list = [];
    if (mv.kind === 'swap' || mv.kind === 'web') list = [{ pair: mv.K.pair, dep: waveOf(mv.K, u), alpha: mv.kind === 'web' ? 0.55 : 1 }];
    else if (mv.kind === 'nopen' && u !== g.hole) list = g.chainsThrough(u).map(K => ({ pair: K.pair, dep: waveOf(K, u), alpha: 0.45 }));
    if (!list.length) { lit = null; return; }
    lit = { t0: now, list };
    if (mv.kind === 'swap') list[0].dep.slice(0, 11).forEach(([, d], k) => note(k, RM ? 0 : d * 0.045));
  }
  function swapWave(K, u, ex, ey, now) {
    const order = waveOf(K, u), par = DM.order(g, K, u).par, step = Math.max(30, Math.min(60, 900 / order.length));
    order.forEach(([v, d], k) => {
      let x, y;
      if (v === u) { x = ex; y = ey; } else { const s = DM.sharedSeg(M, v, par.get(v)); const q = segMid(s); x = X(q); y = Y(q); }
      const from = g.col[v] === K.pair[0] ? K.pair[1] : K.pair[0], t0 = now + k * step;   // 'from' is the pen before the swap
      anim[v] = RM ? null : { t0, x, y, R: reach(v, x, y), from };
      if (!RM) pops[v] = { t0, dur: 300, amp: 0.13, rot: (k % 2 ? 1 : -1) * 0.14 };
      if (k < 12) pop(k, RM ? 0 : k * step / 1000);
    });
  }
  function tap(u, e) {
    const now = performance.now(), ex = e.clientX * dpr, ey = e.clientY * dpr;
    const mv = DM.move(g, pen, u);
    switch (mv.kind) {
      case 'none': return;
      case 'nopen': penBtns.forEach((b, k) => setTimeout(() => jolt(b, 'hop'), RM ? 0 : k * 60)); wob[u] = now; thud(); break;
      case 'same': wob[u] = now; thud(); break;
      case 'done': qHop = now; jolt(penBtns[pen], 'shake'); wob[u] = now; thud(); break;
      case 'web': smudges.push({ vs: mv.K.vs, pair: mv.K.pair, t0: now }); jolt(penBtns[pen], 'shake'); mv.K.vs.forEach(v => { wob[v] = now; }); smear(); break;
      case 'swap': {
        g.swap(mv.K);                                            // the one and only state change
        swapWave(mv.K, u, ex, ey, now);                          // the flip wave ('from' is the other pen of the pair)
        coinsAt(e.clientX, e.clientY);                           // the shell flies this swap's coins from the touch point
        break;
      }
      case 'blocked': sparks.push({ hits: mv.hits, t0: now }); qHop = now; jolt(penBtns[pen], 'shake'); mv.hits.forEach(v => { wob[v] = now; }); tink(); break;
      case 'fill': {
        holeCol = mv.b; anim[g.hole] = RM ? null : { t0: now, x: ex, y: ey, R: reach(g.hole, ex, ey), from: -1 };
        squeak(pen); win(); break;
      }
    }
    kick();
  }
  // the win: the blank fills with a burst, then the whole sheet is scribbled over in a wave with doodled stars (~3.6 s)
  function win() {
    won = true; wonAt = performance.now(); clearTimeout(idleT); clearTimeout(smileT); hintOn = null; lit = null; press = null;
    document.documentElement.classList.add('won'); syncPens();
    setTimeout(LAB.done, RM ? 900 : 3700);                 // inside the app: hand over to its win screen once the sheet is celebrated
    setTimeout(() => { stamp.classList.add('on'); pop(12); }, RM ? 0 : 200);
    const [cx, cy] = cen(g.hole), t0 = wonAt, R = rng(g.n * 977 + 3);
    if (RM) { fanfare(0); return; }
    pops[g.hole] = { t0: t0 + 60, dur: 420, amp: 0.3, rot: 0.2 };
    for (let k = 0; k < 40; k++) {
      const a = Math.random() * Math.PI * 2, v = (200 + Math.random() * 500) * dpr;
      confetti.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 300 * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, c: PENS[k % 4].c, t0: t0 + 120 });
    }
    // the scribble wave, ring by ring out from the blank piece
    const maxD = Math.max(...holeDep.values());
    for (let i = 0; i < g.n; i++) {
      const d = holeDep.get(i) || 0, b = M.info[i].box, c = colOf(i), at = t0 + 700 + d * Math.min(260, 1500 / Math.max(1, maxD));
      const pts = [], n = 7, ang = c >= 0 ? PENS[c].a + Math.PI / 2 : 0, ux = Math.cos(ang), uy = Math.sin(ang);
      const mx = (b[0] + b[2]) / 2, my = (b[1] + b[3]) / 2, L = Math.hypot(b[2] - b[0], b[3] - b[1]) * 0.55;
      for (let k = 0; k <= n; k++) { const s = (k / n - 0.5) * 2 * L, o = (k % 2 ? 1 : -1) * L * 0.9; pts.push([mx + ux * s - uy * o, my + uy * s + ux * o]); }
      let len = 0; for (let k = 1; k < pts.length; k++) len += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
      scrib.push({ i, t0: at, pts, len, c: c >= 0 ? PENS[c].d : INK });
      if (i !== g.hole) pops[i] = { t0: at, dur: 340, amp: 0.1, rot: (i % 2 ? 1 : -1) * 0.12 };
    }
    for (let d = 0; d <= Math.min(maxD, 8); d++) squeak(d % 4, (700 + d * Math.min(260, 1500 / Math.max(1, maxD))) / 1000, 0.08, d * 120);
    // stars drawn in round the sheet
    for (let k = 0; k < 9; k++) {
      const side = k % 4, f = R();
      const x = side === 0 ? PX + PS * f : side === 1 ? PX + PS + 8 - R() * 20 : side === 2 ? PX + PS * f : PX - 8 + R() * 20;
      const y = side === 0 ? PY + CH * 0.5 + 6 : side === 2 ? PY + PH - 4 : PY + PH * (0.15 + 0.7 * f);
      stars.push({ x: x * dpr, y: y * dpr, r: Math.max(9, PS * (0.03 + 0.02 * R())) * dpr, c: PENS[k % 4].c, rot: R() * 6, ph: R() * 9, t0: t0 + 1000 + k * 170 });
    }
    setTimeout(() => { penBtns.forEach((b, k) => setTimeout(() => b.classList.add('dance'), k * 90)); }, 900);
    setTimeout(() => fanfare(0), 2500);
    setTimeout(() => { for (let k = 0; k < 30; k++) { const x = (PX + PS * Math.random()) * dpr;
      confetti.push({ x, y: PY * dpr, vx: (Math.random() - .5) * 300 * dpr, vy: -400 * dpr * Math.random(), r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, c: PENS[k % 4].c, t0: performance.now() }); } kick(); }, 2500);
    setTimeout(() => { penBtns.forEach(b => b.classList.remove('dance')); kick(); }, 4300);
  }
  const faceOf = e => DM.faceAt(M, (e.clientX - RX) / RS, (e.clientY - RY) / RS);
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); au(); touch();
    if (won) { if (!LAB.embedded && performance.now() - wonAt > 4000) { g.reset(); fresh(); } return; }   // in the app the shell owns the next step
    if (smileyHit(e)) return;
    const u = faceOf(e); if (u < 0) return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const now = performance.now(), mv = DM.move(g, pen, u);
    press = { u, id: e.pointerId };                         // lifts at once (drawn on the next frame)
    lightUp(u, mv, now); kick();
  });
  cv.addEventListener('pointermove', e => {
    if (!press || e.pointerId !== press.id) return;
    if (faceOf(e) !== press.u && lit) { lit = null; kick(); }   // slid off: the preview goes out
  });
  cv.addEventListener('pointerup', e => {
    if (!press || e.pointerId !== press.id) return;
    const u = press.u; press = null; lit = null;
    if (won) { kick(); return; }
    if (faceOf(e) === u) tap(u, e);                         // release on the same piece commits
    kick();
  });
  cv.addEventListener('pointercancel', () => { press = null; lit = null; kick(); });
  document.getElementById('undo').addEventListener('pointerdown', e => {
    e.preventDefault(); au(); touch();
    if (won) { if (LAB.embedded) return; won = false; holeCol = -1; stamp.classList.remove('on'); document.documentElement.classList.remove('won'); confetti = []; scrib = []; stars = []; anim[g.hole] = null; readyT = performance.now(); syncPens(); thud(); kick(); return; }
    const before = g.col.slice(); g.undo(); const now = performance.now(); let k = 0;
    for (let i = 0; i < g.n; i++) if (before[i] !== g.col[i]) { const [x, y] = cen(i); anim[i] = RM ? null : { t0: now + 40 * k, x, y, R: reach(i, x, y), from: before[i] }; if (!RM) pops[i] = { t0: now + 40 * k, dur: 260, amp: 0.08, rot: 0 }; k++; }
    if (k) squeak(pen < 0 ? 0 : pen, 0, 0.1); else thud();
    kick();
  });
  document.getElementById('again').addEventListener('pointerdown', e => { e.preventDefault(); au(); if (LAB.embedded && won) return; g.reset(); fresh(); squeak(2, 0, 0.1); });
  addEventListener('resize', layout);
  document.addEventListener('contextmenu', e => e.preventDefault());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => kick());

  window.PLAYLAB = { cen: i => cen(i).map(v => v / dpr), pen: i => { pen = i; syncPens(); }, get won() { return won; }, smiley: showSmiley, hint: showHint, game: g };   // test hooks (tools/embed_win_check.js)
  layout(); fresh();
})();
</script>
</body>
</html>
