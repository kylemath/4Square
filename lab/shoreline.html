<!doctype html>
<!--
  SHORELINE (lab prototype; not on the skin reel, not in the tickets). Design note: lab/SHORELINE-DESIGN.md.

  The ordinary puzzle with one rule added: you may only swap a chain that touches the SHORE. The shore is the 3 outer
  tiles (g.border, "beach", the default) or, as the harder-to-read but roomier option, the outermost two BFS shells
  from the hole ("shells", ?shore=shells). Maps without a border (the onboarding ponds) always use shells.
  Every other tile is deep water: visible, coloured, but not touchable. The hole is a lagoon in the middle.

  Mapping (every action is exactly one g.swap(K) or nothing):
    tile u                 = region u (g.cells polygon), colour g.col[u]; shore tiles are raised sand-rimmed tiles
    tap shore tile u       = up to 3 partner chips (one per other element b); press lights g.chainAt(u, b), release swaps
    drag shore u -> v      = K = g.chainAt(u, g.col[v]) for a neighbour v of another element; release on v swaps
    tap deep tile          = nothing happens to the game; the shore tiles flash (where you can act)
    the swap               = a wave from the touched tile through the chain in BFS order, tile by tile; a chain that
                             never reaches the rim dies out before the lagoon
    lagoon reaction        = when the wave reaches the rim: splash (rim pattern unchanged up to renaming), shimmer
                             (pattern changed), fill + rings over the whole sea (win)
    hint (lighthouse)      = in-page BFS over shore-only swaps (lab/shoreline-core.js, depth 7 / 50k states): first
                             move of an optimal line; the HUD shows "shore par" = that distance from the level start
    K.web                  = no swap: the chain's tiles bob and settle
    win                    = lagoon fills, rings roll out to the shore, then LAB.done() (embedded: idle afterwards)
-->

    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>

<script src="shoreline-core.js"></script>
<script>

  // ---------------------------------------------------------------- shore BFS (shore par, hint)
  const solveNow = () => SHORE.solve(SPEC, g.col, SHSET);
  const START = (() => { const c = g.level.start.slice(); c[HOLE] = -1; return SHORE.solve(SPEC, c, SHSET); })();

  let cellPath = [], CS = [], chipR = 17;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    TOP = HUD === 'full' && LAB.embedded ? 46 : 56; BOT = 64;
    // the outer frame of the layout is the coastline: the border tiles' outer edges lie on it, so pushing the vertices
    // that sit on the frame outward by M px widens the beach strips into something a thumb can hit (no contact changes)
    const M = SPEC.border.length ? clamp(Math.min(W, H) * 0.055, 18, 34) : 0;
    const side = 8, aw = (W - 2 * side - 2 * M) / 2, ah = (H - TOP - BOT - 2 * M) / 2;

      cellPath.push(p);

      EXT[u] = Math.max(...P.map(q => Math.hypot(q[0] - S[u][0], q[1] - S[u][1])));
      BB[u] = [Math.min(...P.map(q => q[0])), Math.min(...P.map(q => q[1])), Math.max(...P.map(q => q[0])), Math.max(...P.map(q => q[1]))];   // anchor: the deepest point inside the tile
    }

  // the point inside polygon P farthest from its edges (grid search, then a finer one), and that distance
  function pole(P, guess) {
    const edge = q => { let m = Infinity; for (let i = 0; i < P.length; i++) m = Math.min(m, distSeg(q, P[i], P[(i + 1) % P.length])); return m; };
    let best = inPoly(guess[0], guess[1], P) ? guess : P[0], bd = inPoly(guess[0], guess[1], P) ? edge(guess) : 0;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity; for (const [x, y] of P) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    let sx = (x1 - x0) / 24, sy = (y1 - y0) / 24, cxp = (x0 + x1) / 2, cyp = (y0 + y1) / 2, span = 12;
    for (let pass = 0; pass < 3; pass++) {

  // ---------------------------------------------------------------- the wave
  function bfs(set, from) {

    return d;
  }
  function settle(u) { const a = anims.find(x => x.u === u); if (a) { shown[u] = a.to; anims = anims.filter(x => x !== a); } }
  function wave(K, old, at) {

    let maxD = 0; depth.forEach(d => { maxD = Math.max(maxD, d); });

  function spray(u, t0, k) {   // droplets from rim tile u into the lagoon edge

    for (let i = 0; i < k; i++) { const a = Math.random() * Math.PI * 2, v = 0.06 + Math.random() * 0.08; drops.push({ x: mx, y: my, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.08, t0, c: FOAM }); }

  cv.addEventListener('pointerdown', down); addEventListener('pointermove', move); addEventListener('pointerup', up);
  addEventListener('pointercancel', () => { drag = null; chipDown = null; lit = null; dirty(); });
  function hintMove() {
    if (!cur || !cur.line.length) return null;
