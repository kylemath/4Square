<!doctype html>
<!--
  Island map (lab/map.html): the flat "map" version of Fill the Hole, remade in the current game's cartoon look.

  What the player sees: one rounded island in a blue sea (surf, sand, grass), cut into countries. Every region of the
  level is a country filled with its element colour (fire, water, air, earth) with a thick dark cartoon outline and a
  small element icon on a dark plate at its heart. The hole is a grey "?" country in the middle; its five neighbours
  (the rim, g.rim) carry a marching gold dotted outline. The three far regions (g.border) are the coast lands that
  wrap around the island's edge. The goal is told as a flag story (no numbers or maths words on screen): the "?"
  country wants a flag, but it may only fly a flag that none of its neighbours (the gold-dotted rim countries) flies.
  A flag pole rack at the top (a mini "?" plate and the four element flags) shows it: every flag a rim country already
  flies is lowered and greyed; a flag no neighbour flies is raised and waves (that is g.free()). At the start all four
  are lowered.

  What the player does, and how it maps onto the puzzle:
  - Press in country S and drag across a border into another country T of a different element. That picks the chain
    K = g.chainAt(S, g.col[T]): the connected run of countries through S using only S's element and T's element. While
    dragging, K lights up (white edge, pulsing stripes of the element each country will become), everything else dims,
    and the flag rack shows g.preview(K): if the swap frees a flag, that flag rises and a green badge at the finger
    shows it (a raised flag and a tick; a dud shows "="). Release = g.swap(K); the colours ripple through the chain outward from S. A drag onto the
    same element, the hole, or the sea picks nothing.
  - A chain with K.web (the only {a,b} chain on the map) is a dud: it only renames two elements, so releasing it
    wobbles the map and nothing changes (no words on screen: pictures, motion and sound only).
  - Tap a country: its (up to) three chains, g.chainsThrough(S), light up one after another.
  - Idle hint: after a few quiet seconds (and at once when the "?" country is tapped) a ghost finger drags across a
    border along a chain of g.good() while that chain lights up (at most 3 times per quiet stretch; any touch stops it).
  - Juice: a touched country lifts and its other-coloured neighbours glow; a traced chain pulses in its two colours with
    a rising tone per piece; a swap flips the chain in a wave from the finger (45 ms apart, a pop each) after LAB.at();
    the flag rack shows pips (rim countries per element), bounces when they change and a leaving pip flies out.
  - Win (g.won()): the "?" floods with g.free() in a burst, a flag pops up on every country in a wave from the hole, a
    compass rose spins, a ship sails, the map dances; LAB.done() after ~3.5 s. Standalone only: a tap then resets.
  - Eggs: three taps on the compass rose in the sea dig up an X (LAB.egg('x-marks', 40)); after a long idle a sea
    serpent swims past (LAB.egg('sea-serpent', 0)).
  Small undo / restart buttons sit in the bottom corners. All state goes through lab/core.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Island Map</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2a9fd8; overscroll-behavior: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  /* countries: element body, neon inner rim, dark plate, neon icon (the game's tile palette) */
  .ct { --c: #aab4bf; --d: #5a636e; --n: #e6edf3; transition: filter .22s, opacity .22s; }
  .e0 { --c: #ef5a3c; --d: #8e1c17; --n: #ff7a52; } .e1 { --c: #3d8fe8; --d: #1b4f91; --n: #5ab4ff; }
  .e2 { --c: #e8c547; --d: #8a6510; --n: #ffe066; } .e3 { --c: #4caf50; --d: #1a6b2a; --n: #5cff8a; }
  .eq { --c: #aab4bf; --d: #5a636e; --n: #e6edf3; }
  .ct .bd { fill: var(--c); transition: fill .32s ease-out; }
  .ct .sh { fill: none; stroke: var(--d); opacity: .55; }
  .ct .gl { fill: none; stroke: var(--n); opacity: .55; transition: stroke .32s; }
  .ct .hx { opacity: 0; transition: opacity .18s; pointer-events: none; }
  .ct .lt { fill: none; stroke: #fff; opacity: 0; transition: opacity .18s; }
  .ct .rm { fill: none; stroke: #ffd84a; stroke-linecap: round; animation: march 1.6s linear infinite; filter: drop-shadow(0 0 3px #ffe98a); }
  @keyframes march { to { stroke-dashoffset: -24; } }

  .ct.dim { filter: saturate(.35) brightness(.58); }
  .ct.no { animation: no .32s ease-in-out; }

  .pl { --c: #aab4bf; --d: #5a636e; --n: #e6edf3; transition: filter .22s; }

  .pl.eq .tq { display: inline; }
  .pl.dim { filter: saturate(.35) brightness(.58); }

  .pl.hole .pt { animation: bob 1.6s ease-in-out infinite alternate; }

  .pl.lit .pt { filter: drop-shadow(0 0 5px #fff); }
  .wv { animation: wave 5s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: translateX(7px); } }
  .ring { fill: none; animation: ring .9s ease-out forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
  .cf { animation: cf 1.3s cubic-bezier(.15, .7, .4, 1) forwards; }
  @keyframes cf { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  .shake { animation: shake .45s ease-in-out; }
  @keyframes shake { 20% { transform: translate(-4px, 1px) rotate(-.4deg); } 50% { transform: translate(4px, -1px) rotate(.4deg); } 80% { transform: translate(-2px, 0); } }
  /* top cue: which elements the rim uses */
  #cue { position: fixed; left: 50%; top: max(6px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; align-items: center; gap: 5px;
    background: #fff; border: 3px solid #1c1640; border-radius: 999px; padding: 3px 10px 3px 5px; box-shadow: 0 4px 0 rgba(28,22,64,.35);
    font-weight: 900; color: #1c1640; font-size: 15px; white-space: nowrap; pointer-events: none; transition: transform .2s; }
  #cue svg { display: block; overflow: visible; }
  #cue .qm { width: 26px; height: 26px; margin-right: 2px; }
  #cue .fg { width: 27px; height: 38px; }
  /* a flag a neighbour already flies: lowered and greyed; a free flag: raised and waving */
  .fgf { transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), filter .3s, opacity .3s; transform: translateY(12px); filter: saturate(.45) brightness(1.05); opacity: .6; }
  .fg.up .fgf { transform: translateY(0); filter: none; opacity: 1; }
  .fg.up .wv2 { animation: flap .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0 50%; }
  @keyframes flap { to { transform: skewY(-7deg) scaleX(.9); } }
  #cue.prev { transform: translateX(-50%) scale(1.06); } #cue.good { background: #d9ffcf; }
  #cue.win { background: #ffd84a; }
  .ct.lit .hx { animation: peek 1s ease-in-out infinite alternate; }
  @keyframes peek { from { opacity: .45; } to { opacity: .85; } }
  .btn { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); width: 44px; height: 44px; border: 3px solid var(--sk-ctl-edge, #1c1640); border-radius: 14px; padding: 0;
    box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(28,22,64,.18), 0 5px 0 var(--sk-ctl-edge, #1c1640), 0 8px 12px rgba(28,22,64,.25);
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), 0 1px 0 var(--sk-ctl-edge, #1c1640); }
  .btn svg { width: 26px; height: 26px; }
  .btn svg path:first-child { stroke: var(--sk-ctl, #1c1640); } .btn svg path:last-child { stroke: var(--sk-ctl-ink, #fff); }   /* halo in the button colour, glyph in the ink colour */
  #bU { left: 10px; background: var(--sk-ctl, linear-gradient(180deg, #ffb35c, #ff7a1a)); } #bR { right: 10px; background: var(--sk-ctl, linear-gradient(180deg, #6cc8ff, #2a7fdc)); }
  .fl { position: fixed; pointer-events: none; font-weight: 900; color: #fff; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    text-shadow: 2px 0 #1c1640, -2px 0 #1c1640, 0 2px #1c1640, 0 -2px #1c1640, 2px 2px #1c1640, -2px 2px #1c1640, 2px -2px #1c1640, -2px -2px #1c1640, 0 4px 0 #1c1640; }
  .fl.rise { animation: rise 1.1s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } to { opacity: 0; transform: translate(-50%, -120%); } }
  /* juice: the touched country lifts (an overlay copy), its neighbours of other colours glow, a traced chain pulses in its two colours */
  .ct { transform-box: fill-box; transform-origin: center; }
  .lift { transition: transform .06s ease-out; transform-box: fill-box; transform-origin: center; }
  .lift.on { transform: translate(0, -4px) scale(1.035); }
  .pl.up .pt { translate: 0 -4px; transition: translate .06s; }
  .ct.cand .lt { opacity: .5; stroke: #fff; animation: cand .55s ease-in-out infinite alternate; }
  @keyframes cand { from { opacity: .45; } to { opacity: 1; } }
  .ct.lit .lt { stroke: var(--pa, #fff); animation: twin .42s ease-in-out infinite alternate; }
  @keyframes twin { to { stroke: var(--pb, #fff); } }
  .pl.tr .pt { animation: tr .3s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tr { 40% { transform: scale(1.22); } }
  .ct.flip { animation: flip .28s ease-in-out; }
  @keyframes flip { 45% { transform: scale(.86, .7); } 75% { transform: scale(1.04, 1.06); } }
  /* the rack: pips under each flag (how many rim countries fly it); it bounces when the rim changes, a leaving pip flies out */
  #cue.bump { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes bump { 35% { transform: translateX(-50%) scale(1.14, .9); } 70% { transform: translateX(-50%) scale(.96, 1.06); } }
  #cue.wob { animation: wob .42s ease-in-out; }
  @keyframes wob { 25% { transform: translateX(calc(-50% - 5px)) rotate(-2deg); } 75% { transform: translateX(calc(-50% + 5px)) rotate(2deg); } }
  .fg .pip { transition: opacity .2s; } .fg .pip.off { opacity: 0; }
  .fg.hop { animation: hop .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes hop { 40% { transform: translateY(-6px) scale(1.12); } }
  .pipfly { position: fixed; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #1c1640; pointer-events: none; z-index: 5; animation: pipfly .8s cubic-bezier(.2, .7, .4, 1) forwards; }
  @keyframes pipfly { 0% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + 70px)) scale(.4) rotate(200deg); opacity: 0; } }
  /* the win: a flag pops up on every country in a wave, the board dances, a compass spins, a ship sails */
  .wf { transform-box: fill-box; transform-origin: 50% 100%; animation: wf .5s cubic-bezier(.3, 1.7, .5, 1) backwards; }
  @keyframes wf { from { transform: scale(0) rotate(-30deg); } }
  .pl.dance .pt { animation: dance .36s ease-in-out 4 alternate; }
  @keyframes dance { to { transform: translateY(-5px) rotate(6deg) scale(1.08); } }
  .bigrose { transform-box: fill-box; transform-origin: center; animation: bigrose 2s cubic-bezier(.3, 1.2, .5, 1) forwards; }
  @keyframes bigrose { 0% { transform: scale(0) rotate(-200deg); opacity: 0; } 25% { opacity: 1; } 70% { transform: scale(1) rotate(540deg); opacity: 1; } 100% { transform: scale(1.1) rotate(720deg); opacity: 0; } }
  .sail { animation: sail 2.6s ease-in-out forwards; }
  @keyframes sail { from { transform: translateX(var(--x0)); } to { transform: translateX(var(--x1)); } }
  .bob2 { transform-box: fill-box; transform-origin: 50% 100%; animation: bob2 .6s ease-in-out infinite alternate; }
  @keyframes bob2 { from { transform: rotate(-6deg); } to { transform: rotate(6deg) translateY(-2px); } }
  /* easter eggs: the compass rose in the sea, the sea serpent */
  .rose { cursor: pointer; transform-box: fill-box; transform-origin: center; }
  .rose.tick { animation: tick .3s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes tick { 40% { transform: rotate(40deg) scale(1.15); } }
  .serp .hump { animation: hump .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes hump { to { transform: scaleY(.6); } }
  #win { position: fixed; left: 50%; top: 50%; font-size: clamp(30px, 9vw, 52px); display: none; }
  #win.on { display: block; animation: winIn .6s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes winIn { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>

<body>
<svg id="cv" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"></svg>
<div id="cue" aria-live="polite"></div>
<button class="btn" id="bU" aria-label="Undo" title="Undo"><svg viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11h9a6 6 0 0 1 0 12h-6M13 6l-5 5 5 5" stroke="#1c1640" stroke-width="7"/><path d="M9 11h9a6 6 0 0 1 0 12h-6M13 6l-5 5 5 5" stroke="#fff" stroke-width="3.6"/></g></svg></button>
<button class="btn" id="bR" aria-label="Restart" title="Restart"><svg viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 10.5A8.5 8.5 0 1 0 22.5 16M22 4.5v6h-6" stroke="#1c1640" stroke-width="7"/><path d="M21.5 10.5A8.5 8.5 0 1 0 22.5 16M22 4.5v6h-6" stroke="#fff" stroke-width="3.6"/></g></svg></button>
<div class="fl" id="win">Flag up!</div>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const g = LAB.game();
  const E = LAB.ELEM, IC = LAB.ICON, N = g.n, HOLE = g.hole;
  const RIM = new Set(g.rim);
  const q1 = v => Math.round(v * 10) / 10;
  const NC = g.NC || 4, ELS = Array.from({ length: NC }, (_, k) => k);   // ponds use only 2 or 3 elements
  const HUD = new URLSearchParams(location.search).get('hud');       // 'full' / 'compact': the app already shows the title and stars
  if (HUD === 'full' || HUD === 'compact' || LAB.embedded) document.body.classList.add('nohud');

  // ---------------- geometry (pure: no DOM) ----------------
  // the dual map lives in the square [-1,1]^2; warp it radially onto a rounded, slightly wobbly island so the
  // square's border (owned by the 3 coast lands) becomes the coastline. A homeomorphism: adjacency is untouched.
  const SEP = 4;
  const seR = th => Math.pow(Math.pow(Math.abs(Math.cos(th)), SEP) + Math.pow(Math.abs(Math.sin(th)), SEP), -1 / SEP);
  const wob = th => 1 + .03 * Math.sin(3 * th + .7) + .018 * Math.sin(5 * th + 2.1) + .01 * Math.sin(8 * th + 4);
  function warp(p, box) {
    const th = Math.atan2(p[1], p[0]), rSq = 1 / Math.max(Math.abs(Math.cos(th)), Math.abs(Math.sin(th)), 1e-9), k = seR(th) * wob(th) / rSq;
    return [box.cx + p[0] * k * box.a, box.cy - p[1] * k * box.b];
  }
  function subdivide(poly) {                          // split every edge so warped borders bend smoothly
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], m = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / .03));
      for (let j = 0; j < m; j++) out.push([a[0] + (b[0] - a[0]) * j / m, a[1] + (b[1] - a[1]) * j / m]);
    }
    return out;
  }
  const sqPerim = t => { t = ((t % 4) + 4) % 4; const q = Math.floor(t), f = t - q; return [[-1 + 2 * f, -1], [1, -1 + 2 * f], [1 - 2 * f, 1], [-1, 1 - 2 * f]][q]; };
  function coast(box, grow, k) { const b2 = { cx: box.cx, cy: box.cy, a: box.a + grow, b: box.b + grow }; const pts = []; for (let i = 0; i < k; i++) pts.push(warp(sqPerim(4 * i / k), b2)); return pts; }
  function inside(pt, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < (b[0] - a[0]) * (pt[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function edgeDist(pt, poly) {
    let m = Infinity;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1;
      let t = ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / L2; t = Math.max(0, Math.min(1, t));
      m = Math.min(m, Math.hypot(a[0] + dx * t - pt[0], a[1] + dy * t - pt[1]));
    }
    return m;
  }
  function pole(poly) {                               // roomiest interior point (where the icon plate goes)
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    poly.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
    let best = [(x0 + x1) / 2, (y0 + y1) / 2, -1], step = Math.max(x1 - x0, y1 - y0) / 18;
    const probe = (x, y) => { const p = [x, y]; if (!inside(p, poly)) return; const d = edgeDist(p, poly); if (d > best[2]) best = [x, y, d]; };
    for (let x = x0 + step / 2; x < x1; x += step) for (let y = y0 + step / 2; y < y1; y += step) probe(x, y);
    for (let r = 0; r < 2; r++) { const c = best.slice(); step /= 4; for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) probe(c[0] + i * step, c[1] + j * step); }
    return best;
  }
  function buildGeom(W, H) {
    const top = 46, bot = 54, avH = Math.max(120, H - top - bot), mg = Math.max(18, Math.min(W, H) * .05);
    let a = W / 2 - mg, b = avH / 2 - mg;
    if (b > a * 1.5) b = a * 1.5; if (a > b * 1.5) a = b * 1.5;
    const box = { cx: W / 2, cy: top + avH / 2, a, b };
    const polys = g.cells.map(c => subdivide(c).map(p => warp(p, box)));
    return { box, polys, poles: polys.map(pole), mg };
  }
  const hit = (G, pt) => { for (let u = 0; u < N; u++) if (inside(pt, G.polys[u])) return u; return -1; };
  // the gesture rule: start country S, country under the finger T -> the chain to swap (or null)
  function pick(S, T) {
    if (S < 0 || T < 0 || S === HOLE || T === HOLE || S === T || g.col[S] === g.col[T]) return null;
    return g.chainAt(S, g.col[T]);
  }
  window.MAPLAB = { warp, buildGeom, hit, pick, pole, g };
  if (typeof document === 'undefined' || !document.getElementById) return;

  // ---------------- sound (WebAudio, only after a gesture) ----------------
  let AC = null;
  function tone(f, dur, type, vol, slide) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * (slide || 1.3), t + dur);
      gn.gain.setValueAtTime(vol || .06, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const note = (i, v) => tone(392 * Math.pow(2, PENT[i % PENT.length] / 12), .16, 'triangle', v || .05, 1.02);
  const thud = () => tone(150, .18, 'sine', .08, .6);

  // ---------------- DOM ----------------
  const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('cv'), cue = document.getElementById('cue'), winEl = document.getElementById('win');
  const mk = (tag, at, par) => { const el = document.createElementNS(NS, tag); for (const k in at) el.setAttribute(k, at[k]); if (par) par.appendChild(el); return el; };
  const dOf = pts => 'M' + pts.map(p => q1(p[0]) + ' ' + q1(p[1])).join('L') + 'Z';
  const icons = size => { const sc = size / 24, off = q1(-12 * sc); return IC.map((d, k) => '<path class="ti ti' + k + '" d="' + d + '" transform="translate(' + off + ' ' + off + ') scale(' + (Math.round(sc * 100) / 100) + ')"/>').join(''); };

    const p = ptOf(ev); lastPt = p; if (Math.hypot(p[0] - drag.p0[0], p[1] - drag.p0[1]) > 8) drag.moved = true;
    if (!drag.moved) return;
    const t = hit(G, p), S = drag.s, c = T[S].c;
    // the arrow from the start country to the finger
    const ang = Math.atan2(p[1] - c[1], p[0] - c[0]), hl = OW * 4, hx = p[0], hy = p[1];
    const head = 'M' + q1(hx - hl * Math.cos(ang - .5)) + ' ' + q1(hy - hl * Math.sin(ang - .5)) + 'L' + q1(hx) + ' ' + q1(hy) + 'L' + q1(hx - hl * Math.cos(ang + .5)) + ' ' + q1(hy - hl * Math.sin(ang + .5));
    const d = 'M' + q1(c[0]) + ' ' + q1(c[1]) + 'L' + q1(hx) + ' ' + q1(hy) + head;
    arrow.querySelector('.a1').setAttribute('d', d); arrow.querySelector('.a2').setAttribute('d', d); arrow.setAttribute('opacity', 1);
    const bx = Math.max(36, Math.min(W - 36, p[0])), by = Math.max(60, p[1] - 50);
    badge.setAttribute('transform', 'translate(' + q1(bx) + ' ' + q1(by) + ')');
    if (t === drag.tgt) return;
    drag.tgt = t;
    const K = pick(S, t);
    if (t >= 0 && t !== S && !K) reanim(T[t].grp, 'no');
    drag.K = K; light(K);
    if (K) {
      liftOff();
      const pv = g.preview(K); setCue(K.web ? null : pv);
      // the finger badge only shows when it matters: this frees a flag (flag + tick), or this changes nothing (=)
      const fe = pv.won && !K.web ? ELS.find(e => !g.rim.some(x => pv.col[x] === e)) : -1;
      badge.querySelector('.bf').innerHTML = fe >= 0 ? flagSvg(fe).replace('class="fg"', 'class="fg up" width="24" height="34"') : '';
      badge.querySelector('.ok').style.display = fe >= 0 ? '' : 'none';
      badge.querySelector('.eq').style.display = K.web ? '' : 'none';
      badge.querySelector('.bk').setAttribute('fill', K.web ? '#d6d9e6' : '#8af574');
      badge.setAttribute('opacity', K.web || fe >= 0 ? 1 : 0);
      traceWave(K, S);
    } else { badge.setAttribute('opacity', 0); setCue(); traceGen++; }
  });
  function endDrag(ev, cancel) {
    if (!drag || ev.pointerId !== drag.id) return;
    const D = drag; drag = null; arrow.setAttribute('opacity', 0); badge.setAttribute('opacity', 0); liftOff(); traceGen++;
    armHint(7000);
    if (!D.moved && !cancel) { if (performance.now() - D.t0 < 600) showChains(D.s); return; }
    const K = D.K; light(null);
    if (cancel || !K) { if (D.tgt >= 0 && D.tgt !== D.s && !cancel) wobble(); return; }
    if (K.web) {                                      // the only {a,b} chain: swapping just renames two elements
      reanim(svg, 'shake'); K.vs.forEach(u => reanim(T[u].grp, 'no')); wobble(); return;
    }
    swapFrom(K, D.s, lastPt);
  }
  svg.addEventListener('pointerup', ev => endDrag(ev, false));
  svg.addEventListener('pointercancel', ev => endDrag(ev, true));
  function showChains(u) {                            // tap: flash the country's three chains one after another
    const Ks = g.chainsThrough(u); let i = 0;
    const step = () => {
      if (i >= Ks.length) { showTimer = null; light(null); return; }
      const K = Ks[i++]; light(K); setCue(g.preview(K)); traceWave(K, u);
      showTimer = setTimeout(step, 650);
    };
    step();
  }

  // ---------------- easter eggs ----------------
  // x-marks: three taps on the compass rose in the sea dig up a treasure X (pays a few points, once)
  function roseTap() {
    if (eggDone || !roseG || celebrated) return;
    roseTaps++; const r = roseG.querySelector('.rose'); r && reanim(r, 'tick'); pop(roseTaps * 3, .04);
    if (roseTaps < 3) return;
    eggDone = true; roseG.innerHTML = xMark(roseAt[2]);
    
    if (!RMQ()) { ring(roseAt[0], roseAt[1], roseAt[2], '#ffd84a', 0); ring(roseAt[0], roseAt[1], roseAt[2] * 1.4, '#fff', 120); }
    [0, 4, 7, 12, 16].forEach((s, i) => setTimeout(() => tone(660 * Math.pow(2, s / 12), .18, 'triangle', .05, 1.01), i * 70));
    egg('x-marks', 40);
  }
  // sea-serpent: after a long quiet spell a sea serpent swims along the sea below the island (once in a while)
  let idleT = 0, serpLast = -1e9;
  function poke() { clearTimeout(idleT); idleT = setTimeout(serpent, 28000); }
  function serpent() {
    if (celebrated || drag || !gSea || RMQ() || performance.now() - serpLast < 80000) { poke(); return; }
    serpLast = performance.now();
    const s = mk('g', { class: 'serp' }, gSea), y = serpY, k = Math.max(.6, Math.min(1, W / 420));
    let body = '';
    for (let i = 0; i < 3; i++) body += '<g transform="translate(' + (-26 - i * 22) + ' 0)"><path class="hump" style="animation-delay:' + (i * 160) + 'ms" d="M-9 2Q0 -16 9 2Z" fill="#2fa58a" stroke="#1c1640" stroke-width="2.4" stroke-linejoin="round"/></g>';
    s.innerHTML = '<g transform="scale(' + q1(k) + ')">' + body + '<path d="M-14 2Q-8 -18 6 -16Q16 -15 15 -8L22 -6L14 -2Q10 2 2 2Z" fill="#2fa58a" stroke="#1c1640" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6" cy="-10" r="2.2" fill="#fff" stroke="#1c1640" stroke-width="1"/><circle cx="6.6" cy="-10" r="1" fill="#1c1640"/>' +
      '<path d="M-90 4q6 -5 12 0t12 0t12 0t12 0t12 0t12 0t12 0t12 0" stroke="#fff" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/></g>';
    const t0 = performance.now(), DUR = 7000;
    const step = () => { const f = (performance.now() - t0) / DUR; if (f >= 1 || !s.isConnected) { s.remove(); poke(); return; }
      s.setAttribute('transform', 'translate(' + q1(-60 + (W + 160) * f) + ' ' + q1(y + Math.sin(f * 20) * 2) + ')'); requestAnimationFrame(step); };
    step(); egg('sea-serpent', 0);
  }

  // ---------------- the swap wave and the win ----------------
  let rippleFrom = -1;
  function swapFrom(K, s, p) {
    rippleFrom = s;
    const q = pagePt(p || T[s].c);
    try { window.LAB && LAB.at && LAB.at(q[0], q[1]); } catch (e) {}   // the shell flies this swap's coins from the finger
    g.swap(K);
  }
  g.on((gg, info) => {
    const before = lastCount ? lastCount.join() : '';
    winEl.classList.remove('on');
    stopHint(); liftOff();
    if (info.type !== 'swap') {
      winGen++; gWin && (gWin.innerHTML = ''); gFx && [...gFx.querySelectorAll('.pl')].forEach(n => n.remove());
      celebrated = false; doneAt = 0; busy = false; light(null); T.forEach(t => t.pl.classList.remove('dance')); lastCount = null; paint(); armHint(5000); return;
    }
    const K = info.chain, ord = waveOrder(K, rippleFrom);
    const RM = RMQ(), gap = RM ? 0 : 45;
    busy = true;
    ord.forEach((u, i) => setTimeout(() => {   // each piece flips in turn from the touch point, with a pop
      setEl(u, g.col[u]); reanim(T[u].pl, 'pop');
      if (!RM) { reanim(T[u].grp, 'flip'); ring(T[u].c[0], T[u].c[1], T[u].r, E[g.col[u]].neon, 0); }
      pop(i + 2, .04);
    }, i * gap));
    setTimeout(() => {
      busy = false; setCue();
      if (g.won()) celebrate();
      else { if (lastCount && lastCount.join() === before) wobble(); armHint(6000); }   // the rim did not change: a soft wobble
    }, (ord.length - 1) * gap + 360);
  });
  function winPaint(fx) {
    const e = g.free(), c = T[HOLE].c, r = T[HOLE].r;
    setEl(HOLE, e); T[HOLE].pl.classList.remove('hole');
    // plant the free flag on the "?" country's plate
    const fs = Math.max(.9, r / 11), fl = mk('g', { class: 'pl', transform: 'translate(' + q1(c[0] + r * .35) + ' ' + q1(c[1] - r * .55 - 27 * fs) + ') scale(' + q1(fs) + ')' }, gFx);
    fl.innerHTML = flagSvg(e).replace('<svg class="fg"', '<svg class="fg up" width="24" height="34"');
    setCue(); const sr = svg.getBoundingClientRect(); winEl.style.top = (sr.top + Math.min(H - 110, c[1] + r * 1.4 + 44)) + 'px'; winEl.classList.add('on');
    if (!fx) { winFlags(false); return; }
    reanim(T[HOLE].pl, 'pop'); reanim(T[HOLE].grp, 'flip');
    if (!RMQ()) {
      [0, 140, 300].forEach((dl, k) => ring(c[0], c[1], r * (1 + k * .5), k === 1 ? '#fff' : E[e].neon, dl));
      for (let k = 0; k < 30; k++) {
        const a = 2 * Math.PI * k / 30 + hash(k, 2), dist = 60 + hash(k, 9) * Math.min(W, H) * .38, cc = k % 3 ? E[e].hex : E[k % NC].neon;
        const p = mk('rect', { x: q1(c[0] - 4), y: q1(c[1] - 3), width: 8, height: 6, rx: 1.5, fill: cc, stroke: '#1c1640', 'stroke-width': 1.4, class: 'cf' }, gFx);
        p.style.setProperty('--x', q1(Math.cos(a) * dist) + 'px'); p.style.setProperty('--y', q1(Math.sin(a) * dist) + 'px'); p.style.setProperty('--r', (hash(k, 4) * 720 - 360) + 'deg');
        p.style.transformBox = 'fill-box'; p.style.transformOrigin = 'center';
        setTimeout(() => p.remove(), 1400);
      }
    }
    [0, 4, 7, 12].forEach((s, i) => setTimeout(() => tone(523 * Math.pow(2, s / 12), .3, 'triangle', .07, 1.01), i * 110));
  }
  // a little flag pops up on every country, in a wave out from the filled hole (anim: false = all at once, no sound)
  function winFlags(anim) {
    if (!gWin) return;
    const depth = new Map([[HOLE, 0]]); let front = [HOLE];
    while (front.length) { const nx = []; front.forEach(u => g.adj[u].forEach(w => { if (!depth.has(w)) { depth.set(w, depth.get(u) + 1); nx.push(w); } })); front = nx; }
    let s = '', maxD = 0;
    for (let u = 0; u < N; u++) {
      if (u === HOLE) continue;
      const d = depth.get(u) || 1, t = T[u], fs = Math.max(.55, Math.min(1, t.r / 13)); maxD = Math.max(maxD, d);
      s += '<g transform="translate(' + q1(t.c[0] + t.r * .3) + ' ' + q1(t.c[1] - t.r * .4 - 27 * fs) + ') scale(' + q1(fs) + ')"><g class="wf" style="animation-delay:' + (anim ? d * 150 + hash(u, 3) * 60 | 0 : 0) + 'ms">' +
        '<path d="M5 29V3" stroke="#1c1640" stroke-width="2.8" stroke-linecap="round"/><path d="M5.5 4H22L18.6 9.2L22 14.4H5.5Z" fill="' + E[g.col[u]].hex + '" stroke="#1c1640" stroke-width="1.8" stroke-linejoin="round"/><circle cx="5" cy="2.6" r="2.2" fill="#ffd84a" stroke="#1c1640" stroke-width="1.2"/></g></g>';
    }
    gWin.insertAdjacentHTML('beforeend', s);
    if (!anim) return maxD;
    for (let d = 1; d <= maxD; d++) setTimeout(() => celebrated && tone(392 * Math.pow(2, PENT[(d + 2) % PENT.length] / 12), .14, 'triangle', .045, 1.02), d * 150);
    return maxD;
  }
  function celebrate() {
    if (celebrated) return;                           // the win hook and the swap wave may both call this
    celebrated = true; light(null); liftOff(); stopHint();
    const my = ++winGen, RM = RMQ(), later = (ms, fn) => setTimeout(() => { if (my === winGen && celebrated) fn(); }, ms);
    winPaint(true);
    if (RM) { winFlags(false); later(1200, finish); return; }
    // 1. flags pop up on every country in a wave from the hole
    later(350, () => winFlags(true));
    // 2. a big compass rose spins over the hole, a ship sails past below
    later(900, () => {
      const c = T[HOLE].c, R = Math.min(W, H) * .16;
      gWin.insertAdjacentHTML('beforeend', '<g transform="translate(' + q1(c[0]) + ' ' + q1(c[1]) + ')"><g class="bigrose" opacity=".95">' + roseArt(R) + '</g></g>');
      tone(330, .5, 'sine', .04, 2.2);
      const y = Math.min(H - 14, serpY + 6), sh = mk('g', { transform: 'translate(0 ' + q1(y) + ')' }, gWin), in2 = mk('g', { class: 'sail' }, sh);
      in2.style.setProperty('--x0', '-50px'); in2.style.setProperty('--x1', (W + 50) + 'px');
      in2.innerHTML = '<g transform="scale(' + q1(Math.max(.6, Math.min(1, W / 420))) + ')">' + shipArt + '</g>';
    });
    // 3. the whole map dances in a wave, left to right
    later(1500, () => {
      const xs = T.map(t => t.c[0]), x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
      T.forEach((t, u) => { t.pl.querySelector('.pt').style.animationDelay = q1((t.c[0] - x0) / (x1 - x0 || 1) * 500) + 'ms'; reanim(t.pl, 'dance'); });
      [0, 4, 7, 12, 16, 19].forEach((s, i) => setTimeout(() => celebrated && tone(523 * Math.pow(2, s / 12), .22, 'triangle', .05, 1.01), i * 120));
    });
    later(3500, finish);
  }
  function finish() {
    doneAt = performance.now();
    T.forEach(t => { t.pl.classList.remove('dance'); const pt = t.pl.querySelector('.pt'); pt && (pt.style.animationDelay = ''); });
    LAB.done();
  }

  document.getElementById('bU').addEventListener('click', () => { poke(); if (!busy && !(celebrated && LAB.embedded)) { stopShow(); g.undo(); } });
  document.getElementById('bR').addEventListener('click', () => { poke(); if (!busy && !(celebrated && LAB.embedded)) { stopShow(); g.reset(); } });
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(build, 80); });
  Object.assign(window.MAPLAB, { light, setCue, celebrate, swapFrom, showHint, serpent, roseTap });   // for debugging in the console
  build(); armHint(4000); poke();
})();
</script>
</body>
