<!doctype html>
<!--
  BONUS SWIPE: the game's bonus round (index.html, "bonus round": cartoon hex tiles on a spaced hex grid, coin pancakes,
  one long swipe through tiles of two alternating kinds, cha-ching per tile, the 5-4-3-2-1 countdown) turned into a
  front end for the real puzzle. Same tile art, coins, sounds and dotted path line; the board is the level's map.

  What the player sees: a purple bonus card, a spaced hex grid of cartoon tiles (fire, water, air, earth: colour AND
  icon), each with a little coin stack. Every region sits on a site of a triangular lattice (pointy-top hexes, like the
  bonus grid). A short chunky BRIDGE in the gap joins two tiles only when the two regions really are neighbours; two
  tiles that sit side by side but are not neighbours just show the dark gap, so a swipe can never use a fake link. A few
  links cannot be lattice steps (the map is not a flat grid: 6 of its regions have 5 neighbours), so they are longer
  bridges; the three far regions of the map (g.border) are drawn as three long RAILS that wrap round the board's sides,
  each bridged to exactly the tiles it touches and to the other two rails at the corners. The drawing is checked for
  honesty on load (no crossings, no bridge or rail under a tile it does not belong to, rim tiles touch the golden tile);
  the level-4 placement is precomputed (keyed by the graph's fingerprint, as in dots.html) and re-checked, other levels
  are placed live by the same beam search. The hole is the GOLDEN TILE (a big coin) in the middle; its 5 neighbours
  (g.rim) wear gold halos and gold bridges: the JACKPOT RING. The header shows the ring's 5 kinds grouped (a pair is
  drawn as a joined capsule): it pays out on TWO PAIRS AND A SINGLE.

  What the player does (exactly the bonus gesture):
    press tile u, drag across a bridge to tile v           -> K = g.chainAt(u, g.col[v])   (the first two fix the pair)
    the rest of K (K.vs) shimmers ahead; everything else dims. Each further step must cross a bridge from the last
      tile to a tile of K (alternating the two kinds); stepping back onto the previous tile takes the last step back;
      anything else shakes + buzzes and is ignored (a gap: "no bridge there"). Each tile passed cha-chings its coins.
    lift with >= 2 tiles on the line                       -> g.swap(K): the WHOLE group flips, tile by tile from where
      the swipe started, coin pancakes flipping with it (not just the traced tiles).
    press and HOLD a tile (about 0.4 s without leaving it)  -> 3 kind bubbles pop up (the 3 other kinds b); hovering a
      bubble shimmers g.chainAt(u, b); release on / tap a bubble -> g.swap(g.chainAt(u, b)). This is how lone tiles
      (single-region chains, no neighbour of either partner kind) are reached; it works on any tile.
    K.web (the only chain of that pair: flipping it renames two kinds everywhere, nothing changes) -> no swap: the coins
      spill off the traced tiles and slide back, the ring readout wobbles (no copy on screen).
  Every action is exactly one g.swap(K) or nothing. Win: g.won() (the ring is 2 + 2 + 1) -> JACKPOT: the golden tile
  turns into g.free(); the marquee races, every tile spins like a reel and lands in a wave, chips rain (about 3.6 s), then LAB.done() (standalone: the countdown and g.reset()).
  Idle hint: after a quiet spell a little snake of a g.good() chain bobs, like the bonus demo. Tiny undo / restart in
  the header (g.undo / g.reset). Coins are just juice: no score.
-->

<script>
'use strict';
// <layout>  (pure: lattice placement, rails, honesty check; also run by the node smoke test)
const R3 = Math.sqrt(3) / 2;
const site = (i, j) => [i + j / 2, j * R3];
const hyp = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const orient = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
const segX = (a, b, c, d) => orient(a, b, c) * orient(a, b, d) < 0 && orient(c, d, a) * orient(c, d, b) < 0;
function psd(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L));
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
// a graph's fingerprint (same as dots.html), so a cached placement is only used for exactly the graph it was made for
function graphSig(g) { let h = 7; const s = g.n + ':' + g.hole + ':' + g.rim + ':' + g.edges.join(';'); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h.toString(36); }
const CLR = 0.52, CLH = 0.45, RAILD = 1.0;     // a long bridge keeps this far from every other tile centre (the golden tile: CLH)
// Beam search: hole at the origin, the rim on 5 of its 6 lattice neighbours, then every other region on the lattice site
// that makes the most of its links unit steps, keeping the drawing honest (no crossings, no bridge under a tile).
// skip: regions left out (the 3 border regions when they become rails).
function beamLayout(g, skip, BW) {
  const n = g.n, H = g.hole, S = new Set(skip || []);
  const adj = g.adj.map((a, u) => S.has(u) ? [] : a.filter(w => !S.has(w)));
  const order = [H, ...g.rim.filter(u => !S.has(u))], inO = new Set(order);
  const left = () => [...Array(n).keys()].filter(u => !inO.has(u) && !S.has(u));
  while (order.length < n - S.size) {
    let best = -1, bc = -1; for (const u of left()) { const c = adj[u].filter(w => inO.has(w)).length; if (c > bc) { bc = c; best = u; } }
    order.push(best); inO.add(best);
  }
  function place(St, u, ij) {
    const key = ij[0] + ',' + ij[1]; if (St.occ.has(key)) return null;
    const p = site(ij[0], ij[1]), Q = St.Q; let unit = 0, len = 0; const nE = [];
    for (const [a, b] of St.E) if (hyp(Q[a], Q[b]) > 1.001 && psd(p, Q[a], Q[b]) < CLR) return null;
    for (const w of adj[u]) {
      if (!Q[w]) continue;
      const d = hyp(p, Q[w]);
      if (d < 1.001) unit++;
      else { if (w === H || u === H) return null; len += d - 1; for (const x of St.ids) if (x !== w && psd(Q[x], p, Q[w]) < (x === H ? CLH : CLR)) return null; }
      for (const [a, b] of St.E) { if (a === w || b === w) continue; if (segX(p, Q[w], Q[a], Q[b])) return null; }
      nE.push([u, w]);
    }
    const Q2 = Q.slice(); Q2[u] = p; const A2 = St.A.slice(); A2[u] = ij;
    const occ = new Set(St.occ); occ.add(key);
    return { Q: Q2, A: A2, occ, ids: St.ids.concat([u]), E: St.E.concat(nE), unit: St.unit + unit, len: St.len + len };
  }
  const A0 = []; A0[H] = [0, 0]; const Q0 = []; Q0[H] = [0, 0];
  let beam = [{ Q: Q0, A: A0, occ: new Set(['0,0']), ids: [H], E: [], unit: 0, len: 0 }];
  const D6 = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]], nr = g.rim.filter(u => !S.has(u)).length;
  for (let k = 1; k < order.length; k++) {
    const u = order[k];
    for (let R = 3; R <= 12; R += 3) {
      const next = [], seen = new Set();
      for (const St of beam) {
        const cand = new Set();
        if (k <= nr) D6.forEach(d => cand.add(d.join()));
        else for (const w of adj[u]) if (St.A[w]) { const [wi, wj] = St.A[w]; for (let di = -R; di <= R; di++) for (let dj = -R; dj <= R; dj++) if (Math.abs(di) + Math.abs(dj) + Math.abs(di + dj) <= 2 * R) cand.add((wi + di) + ',' + (wj + dj)); }
        for (const c of cand) {
          const T = place(St, u, c.split(',').map(Number)); if (!T) continue;
          const sig = T.ids.map(x => T.A[x].join(':')).join('|'); if (seen.has(sig)) continue; seen.add(sig); next.push(T);
        }
      }
      if (next.length) { next.sort((a, b) => (b.unit * 10 - b.len * 2) - (a.unit * 10 - a.len * 2)); beam = next.slice(0, BW || 30); break; }
      if (R >= 12) return null;
    }
  }
  return beam[0].A.map(a => a || null);
}
// Rails: each border region is drawn as one long rail hugging the side of the board it touches. A rail is a polyline:
// one attach point per tile it touches (1 unit out from the tile), in the order they go round, plus a cap at each end.
function makeRails(g, Q) {
  const B = g.border, isB = new Set(B), out = [];
  if (B.length !== 3) return null;
  for (const b of B) {
    const r = g.rot[b], k = r.length;
    let s = r.findIndex((w, i) => isB.has(w) && !isB.has(r[(i + 1) % k]));
    if (s < 0) return null;
    const tiles = []; for (let i = 1; i < k; i++) { const w = r[(s + i) % k]; if (isB.has(w)) break; tiles.push(w); }
    if (!tiles.length) return null;
    // offset the chain of tile centres by D to the outside (away from the golden tile), going round each tile
    const C = tiles.map(t => Q[t]), D = RAILD, m = C.length;
    let side = 1;
    if (m > 1) { let sv = 0; for (let i = 0; i + 1 < m; i++) { const dx = C[i + 1][0] - C[i][0], dy = C[i + 1][1] - C[i][1]; sv += Math.sign(-dy * (C[i][0] - Q[g.hole][0]) + dx * (C[i][1] - Q[g.hole][1])); } side = sv >= 0 ? 1 : -1; }
    const nrm = i => { const dx = C[i + 1][0] - C[i][0], dy = C[i + 1][1] - C[i][1], L = Math.hypot(dx, dy) || 1; return [-dy / L * side, dx / L * side]; };
    const full = [], at = new Map(), add = (c, nv, k) => full.push([c[0] + nv[0] * k, c[1] + nv[1] * k]);
    if (m === 1) { let nx = C[0][0] - Q[g.hole][0], ny = C[0][1] - Q[g.hole][1], L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L; const tx = -ny * .4, ty = nx * .4;
      full.push([C[0][0] + nx * D - tx, C[0][1] + ny * D - ty], [C[0][0] + nx * D, C[0][1] + ny * D], [C[0][0] + nx * D + tx, C[0][1] + ny * D + ty]); at.set(tiles[0], 1); }
    else for (let i = 0; i < m; i++) {
      const n0 = i > 0 ? nrm(i - 1) : null, n1 = i < m - 1 ? nrm(i) : null;
      if (!n0) { const dx = C[0][0] - C[1][0], dy = C[0][1] - C[1][1], L = Math.hypot(dx, dy); add(C[0], [n1[0] + dx / L * .3 / D, n1[1] + dy / L * .3 / D], D); add(C[0], n1, D); at.set(tiles[0], full.length - 1); continue; }
      if (!n1) { add(C[i], n0, D); at.set(tiles[i], full.length - 1); const dx = C[i][0] - C[i - 1][0], dy = C[i][1] - C[i - 1][1], L = Math.hypot(dx, dy); add(C[i], [n0[0] + dx / L * .3 / D, n0[1] + dy / L * .3 / D], D); continue; }
      let bx = n0[0] + n1[0], by = n0[1] + n1[1]; const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;

    if (hold) kf.push(at(pts[0], .95, .9), at(pts[0], .95, .9), at(pts[0], .95, .9), at(pts[0], 0, 1));
    else { kf.push(at(pts[0], .95, .92)); pts.slice(1).forEach(p => kf.push(at(p, .95, .92))); kf.push(at(pts[pts.length - 1], 0, 1)); }
    const dur = hold ? 2000 : 700 + pts.length * 420;
    GF.animate(kf.map((k, i) => Object.assign(k, { offset: i / (kf.length - 1) })), { duration: dur, easing: 'ease-in-out', fill: 'forwards' }).onfinish = hideFinger;
    if (hold) { const rg = GF.querySelector('.gr'); rg.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 0, transform: 'scale(.6)', offset: .3 }, { opacity: .9, transform: 'scale(1)', offset: .45 }, { opacity: 0, transform: 'scale(1.7)', offset: .8 }, { opacity: 0 }], { duration: dur, fill: 'forwards' }); }
  }
  function walk(K) {               // a short traceable line through the group: each step crosses a bridge
    const s0 = K.vs.find(u => ANCH[u] && !isRail(u)) ?? K.vs[0], out = [s0], seen = new Set(out);
    while (out.length < 4) { const last = out[out.length - 1], nx = g.adj[last].find(w => K.set.has(w) && !seen.has(w) && ANCH[w]); if (nx == null) break; out.push(nx); seen.add(nx); }
    return out;
  }
  function poke() { clearTimeout(idleT); hints = 0; idleT = setTimeout(hint, 7000); }
  function hint() {
    if (busy || won || dr || bub) { idleT = setTimeout(hint, 3000); return; }
    const G = g.good(); if (!G.length || hints >= 3) return; hints++;
    const K = G.find(k => k.size > 1) || G[0], line = K.size > 1 ? walk(K) : [K.vs[0]];
    if (line.length < 2 && K.size > 1) line.push(...K.vs.filter(u => u !== line[0]).slice(0, 1));
    const lone = line.length < 2;
    ghost(line.map(u => ANCH[u]).filter(Boolean), lone);
    line.forEach((u, i) => later(350 + i * 420, () => { if (!dr && !bub && !busy && !won) { pop(u, 1.25); EL[u] && EL[u].classList.add('glow'); later(400, () => EL[u] && !(dr && dr.path.includes(u)) && EL[u].classList.remove('glow')); } }));
    idleT = setTimeout(hint, 7000);
  }
  // the golden tile, tapped seven times in a row: the marquee spins (a quiet little bonus)
  let goldTaps = 0, goldT = 0, eggPaid = false;
  function goldTap() {
    pop(H, 1.4); g.rim.forEach((r, i) => setTimeout(() => pop(r, 1.25), 120 + i * 70)); blip(1320 + goldTaps * 90, .1, 'triangle', .03);
    clearTimeout(goldT); goldT = setTimeout(() => { goldTaps = 0; }, 1600);
    if (++goldTaps < 7) return;
    goldTaps = 0; const w = $('wrap'); w.classList.add('spin'); setTimeout(() => w.classList.remove('spin'), 2600);
    jingle(); const c = P[H]; burst(c[0], c[1], '#ff3fd0', 14); coinFly(c[0], c[1], 7, 2.4, 60);
    if (!eggPaid) { eggPaid = true; try { window.LAB && LAB.egg && LAB.egg('lucky-seven', 77); } catch (e) {} }
  }
  svg.addEventListener('pointerdown', e => {
    audio(); e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    if (won) { if (!LAB.embedded) doReset(); return; }   // in the app the shell owns the next step
    poke(); hideFinger();
    if (busy) return;
    const p = pt(e);
    if (bub) { const i = bubAt(p); if (i >= 0) { pickBubble(i); return; } closeBubbles(); }
    if (dr) cancelDrag();
    const u = hit(p); if (u < 0) return;
    if (u === H) { goldTap(); say('The golden tile'); return; }
    dr = { path: [], K: null, bad: -1, p0: p, at0: isRail(u) ? nearIdx(u, p) : 0 };
    addStep(u); armSay();
    dr.hold = setTimeout(() => { if (dr && dr.path.length === 1) { const w = dr.path[0]; cancelDrag(); openBubbles(w); } }, 420);
  });
  svg.addEventListener('pointermove', e => {
    if (dr) { const p = pt(e); if (dr.hold && p && Math.hypot(p.x - dr.p0.x, p.y - dr.p0.y) > h * .6) { clearTimeout(dr.hold); dr.hold = 0; } const v = hit(p); if (v >= 0) step(v); }
    else if (bub && bub.down) bubHover(bubAt(pt(e)));
  });
  const up = e => {
    if (dr) {
      clearTimeout(dr.hold);
      if (dr.path.length >= 2 && dr.K) { const K = dr.K, path = dr.path.slice(); cancelDrag(); if (K.web) spill(path, K); else doSwap(K, path[0]); }
      else { const u = dr.path[0]; cancelDrag(); if (u != null) shake(u); }
    } else if (bub && bub.down) { bub.down = false; const i = bubAt(pt(e)); if (i >= 0) pickBubble(i); else { bubHover(-1); } }
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', () => { if (dr) cancelDrag(); if (bub) bub.down = false; });
  $('bUndo').onclick = () => { audio(); if (busy || won) return; cancelDrag(); closeBubbles(); hideFinger(); g.undo(); blip(500, .08, 'triangle', .03); ringSay(); poke(); };
  $('bReset').onclick = () => { audio(); if (won) return; hideFinger(); doReset(); };
  addEventListener('resize', () => { clearTimeout(fit.t); fit.t = setTimeout(() => { fit(); marquee(); }, 80); });
  fit(); marquee(); ringSay(); poke();
  clearTimeout(idleT); idleT = setTimeout(hint, 1800);      // the first cue comes early
  window.SWIPE = { g, LAY, hit: (x, y) => hit({ x, y }), get P() { return P; }, get ANCH() { return ANCH; }, get dr() { return dr; }, get bub() { return bub; }, get won() { return won; }, jackpot };   // test hook
})();
