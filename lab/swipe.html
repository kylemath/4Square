<!--
  BONUS SWIPE: the game's bonus round (index.html, "bonus round": cartoon hex tiles on a spaced hex grid, coin pancakes,
  one long swipe through tiles of two alternating kinds, cha-ching per tile, the 5-4-3-2-1 countdown) turned into a
  front end for the real puzzle. Same tile art, coins, sounds and dotted path line; the board is the level's map.

  What the player sees: a purple bonus card, a spaced hex grid of cartoon tiles (fire, water, air, earth: colour AND
  icon), each with a little coin stack. Every region sits on a site of a triangular lattice (pointy-top hexes, like the
  bonus grid). A short chunky BRIDGE in the gap joins two tiles only when the two regions really are neighbours; two
  tiles that sit side by side but are not neighbours just show the dark gap, so a swipe can never use a fake link. A few
  links cannot be lattice steps (the map is not a flat grid: 6 of its regions have 5 neighbours), so they are longer
  bridges; the three far regions of the map (g.border) are drawn as three long RAILS that wrap round the board's sides,
  each bridged to exactly the tiles it touches and to the other two rails at the corners. The drawing is checked for
  honesty on load (no crossings, no bridge or rail under a tile it does not belong to, rim tiles touch the golden tile);
  the level-4 placement is precomputed (keyed by the graph's fingerprint, as in dots.html) and re-checked, other levels
  are placed live by the same beam search. The hole is the GOLDEN TILE (a big coin) in the middle; its 5 neighbours
  (g.rim) wear gold halos and gold bridges: the JACKPOT RING. The header shows the ring's 5 kinds grouped (a pair is
  drawn as a joined capsule): it pays out on TWO PAIRS AND A SINGLE.

  What the player does (exactly the bonus gesture):
    press tile u, drag across a bridge to tile v           -> K = g.chainAt(u, g.col[v])   (the first two fix the pair)
    the rest of K (K.vs) shimmers ahead; everything else dims. Each further step must cross a bridge from the last
      tile to a tile of K (alternating the two kinds); stepping back onto the previous tile takes the last step back;
      anything else shakes + buzzes and is ignored (a gap: "no bridge there"). Each tile passed cha-chings its coins.
    lift with >= 2 tiles on the line                       -> g.swap(K): the WHOLE group flips, tile by tile from where
      the swipe started, coin pancakes flipping with it (not just the traced tiles).
    press and HOLD a tile (about 0.4 s without leaving it)  -> 3 kind bubbles pop up (the 3 other kinds b); hovering a
      bubble shimmers g.chainAt(u, b); release on / tap a bubble -> g.swap(g.chainAt(u, b)). This is how lone tiles
      (single-region chains, no neighbour of either partner kind) are reached; it works on any tile.
    K.web (the only chain of that pair: flipping it renames two kinds everywhere, nothing changes) -> no swap: the coins
      spill off the traced tiles and slide back, with a "nothing changes" line.
  Every action is exactly one g.swap(K) or nothing. Win: g.won() (the ring is 2 + 2 + 1) -> JACKPOT: the golden tile
  turns into g.free(), a coin fountain, the happy jingle, then the 5-4-3-2-1 countdown and g.reset() (tap to skip).
  Idle hint: after a quiet spell a little snake of a g.good() chain bobs, like the bonus demo. Tiny undo / restart in
  the header (g.undo / g.reset). Coins are just juice: no score.
-->

  function shimmer(K, keep) {

    if (EL[H]) EL[H].classList.toggle('hot', !!K && g.preview(K).won);
  }
  function addStep(u) {
    const p = dr.path; p.push(u); dr.bad = -1;
    EL.forEach(e => e && e.classList.remove('glow'));
    EL[u].classList.add('lit', 'glow'); pop(u, 1.35); line();
    note(p.length - 1); chaching(p.length);
    const a = ANCH[u]; coinFly(a[0] + h * .48, a[1] + h * .3, COINS[u], 1.6, 30);
    if (CO[u] && !reduced) CO[u].animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-6px) scale(1.15)' }, { transform: 'translateY(0)' }], { duration: 260, easing: 'ease-out' });
  }
  function armSay() {
    const K = dr.K;
    if (!K) { say('Drag across a <b>bridge</b> to another kind, or <b>hold</b>.'); return; }
    if (K.web) say('Every ' + kindB(K.pair[0]) + ' and ' + kindB(K.pair[1]) + ' on the board? Flipping them all changes nothing…');
    else if (g.preview(K).won) say('Let go: <b>JACKPOT!</b>');

  }
  function cancelDrag() {
    if (!dr) return; clearTimeout(dr.hold);
    dr.path.forEach(u => EL[u] && EL[u].classList.remove('lit', 'glow'));
    dr = null; if (svg.querySelector('.bline')) line(); shimmer(null);
  }
  function step(v) {
    const r = swipeStep(g, dr.path, dr.K, v);

    if (r.type === 'back') {

    if (r.type === 'start') { clearTimeout(dr.hold); dr.K = r.K; addStep(v); shimmer(dr.K); armSay(); return; }

    shake(v); buzz();

    else if (r.why === 'gold') say('The golden tile pays out when its ring shows ' + GOALTXT + '.');
    else if (dr.K) say('Only ' + kindB(dr.K.pair[0]) + ' and ' + kindB(dr.K.pair[1]) + ', across a bridge from the end!');
    else say('Two <b>different</b> kinds: hop to a tile that is not ' + kindB(g.col[dr.path[0]]) + '.');
  }
  // press and hold: three kind bubbles
  function openBubbles(u) {
    const kinds = [0, 1, 2, 3].filter(e => e !== g.col[u] && e < g.NC), c = ANCH[u];
    const up = c[1] - S * 1.5 > VB[1], els = [];
    kinds.forEach((e, i) => {
      const a = (up ? -90 : 90) + (i - 1) * 52, x = c[0] + Math.cos(a * Math.PI / 180) * S * 1.05, y = c[1] + Math.sin(a * Math.PI / 180) * S * 1.05;
      const b = mk('g', { class: 'tl bub e' + e, transform: 'translate(' + q1(x) + ' ' + q1(y) + ')' }, FX), tin = mk('g', { class: 'tin' }, b);
      tin.innerHTML = '<circle r="' + q1(h * 1.02) + '" fill="rgba(18,22,70,.7)" stroke="#fff" stroke-width="2"/>' + tileSvg(h * .78);
      if (!reduced && tin.animate) tin.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.15)', offset: .7 }, { transform: 'scale(1)' }], { duration: 260, delay: i * 50, easing: 'ease-out', fill: 'backwards' });
      els.push({ e, x, y, el: b });
    });
    bub = { u, els, down: true, hov: -1 };
    EL[u].classList.add('lit'); blip(880, .06, 'triangle', .03); blip(1320, .08, 'triangle', .02);
    say('Pick a kind: the glowing group flips to it.');
  }
  function bubAt(p) { if (!bub || !p) return -1; return bub.els.findIndex(b => Math.hypot(b.x - p.x, b.y - p.y) < h * 1.1); }
  function bubHover(i) {
    if (!bub || i === bub.hov) return; bub.hov = i;
    bub.els.forEach((b, j) => b.el.classList.toggle('hov', j === i));
    shimmer(i >= 0 ? g.chainAt(bub.u, bub.els[i].e) : null, [bub.u]);
    if (i >= 0) { blip(1200, .04, 'triangle', .02); const K = g.chainAt(bub.u, bub.els[i].e); say(K.web ? 'Every ' + kindB(K.pair[0]) + ' and ' + kindB(K.pair[1]) + ' on the board? That changes nothing…' : g.preview(K).won ? 'Pick it: <b>JACKPOT!</b>' : 'Flip ' + (K.size === 1 ? 'this tile' : 'all <b>' + K.size + '</b> glowing tiles') + ' to ' + kindB(bub.els[i].e) + '?'); }
  }
  function closeBubbles() { if (!bub) return; bub.els.forEach(b => b.el.remove()); if (EL[bub.u]) EL[bub.u].classList.remove('lit'); bub = null; shimmer(null); }
  function pickBubble(i) {
    const u = bub.u, K = g.chainAt(u, bub.els[i].e); closeBubbles();
    if (!K) return;
    if (K.web) spill([u], K); else doSwap(K, u);
  }
  // ---------------- moves ----------------
  function bfsOrder(K, from) {
    const seen = new Set([from]), out = [from]; let f = [from];
    while (f.length) { const nx = []; for (const u of f) for (const w of g.adj[u]) if (K.set.has(w) && !seen.has(w)) { seen.add(w); out.push(w); nx.push(w); } f = nx; }
    K.vs.forEach(u => { if (!seen.has(u)) out.push(u); });
    return out;
  }
  function doSwap(K, from) {
    busy = true;
    const order = bfsOrder(K, K.set.has(from) ? from : K.vs[0]);
    g.swap(K);
    const dt = reduced ? 0 : Math.max(45, Math.min(90, 900 / order.length));
    order.forEach((u, i) => later(i * dt, () => flip(u, g.col[u], i)));
    later(order.length * dt + (reduced ? 0 : 260), () => {
      busy = false; paintAll();
      if (g.won()) jackpot(); else { ringSay(); poke(); }
    });
  }
  function flip(u, c, i) {
    const e = EL[u]; if (!e) return;
    note(i);
    if (reduced) { style(e, c); return; }
    const t = e.querySelector('.tin'), rail = isRail(u);
    const k1 = rail ? [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.2)' }] : [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }];
    const a = t.animate(k1, { duration: 110, easing: 'ease-in', fill: 'forwards' });
    a.onfinish = () => { style(e, c); const b = t.animate(rail ? [{ transform: 'scaleY(.2)' }, { transform: 'scaleY(1.15)' }, { transform: 'scaleY(1)' }] : [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1.15)' }, { transform: 'scaleX(1)' }], { duration: 220, easing: 'ease-out' }); a.cancel(); };
    if (CO[u]) CO[u].animate([{ transform: 'translateY(0) scaleY(1)' }, { transform: 'translateY(-10px) scaleY(-1)', offset: .5 }, { transform: 'translateY(0) scaleY(1)' }], { duration: 380, easing: 'ease-in-out' });   // pancakes flip
  }
  function spill(path, K) {                          // a web: coins spill off and slide back, nothing changes
    blip(220, .22, 'sawtooth', .03); setTimeout(() => blip(160, .3, 'sawtooth', .025), 160);
    say('Every ' + kindB(K.pair[0]) + ' and ' + kindB(K.pair[1]) + ' would flip: nothing changes! Try another pair.');
    if (reduced) return;
    path.forEach((u, i) => {
      if (!CO[u]) return; const a = Math.random() * Math.PI * 2, d = 14 + Math.random() * 10;
      CO[u].animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(' + q1(Math.cos(a) * d) + 'px,' + q1(Math.sin(a) * d + 8) + 'px) rotate(' + (Math.random() > .5 ? 70 : -70) + 'deg)', offset: .35 }, { transform: 'translate(' + q1(Math.cos(a) * d) + 'px,' + q1(Math.sin(a) * d + 8) + 'px) rotate(0deg)', offset: .6 }, { transform: 'translate(0,0) rotate(0)' }], { duration: 1100, delay: i * 40, easing: 'ease-in-out' });
      shake(u);
    });
  }
  function jackpot() {
    won = true; paintAll(); const f = g.free(), c = P[H];
    pop(H, 1.7); burst(c[0], c[1], '#ffd84a', 16); coinFly(c[0], c[1], 26, 2.6, 70); jingle();
    g.rim.forEach((u, i) => later(i * 70, () => pop(u, 1.3)));
    const el = $('cd'); el.className = 'bcd burst'; el.textContent = 'JACKPOT!';
    if (!reduced && el.animate) el.animate([{ transform: 'scale(.2) rotate(-8deg)', opacity: 0 }, { transform: 'scale(1.25) rotate(4deg)', opacity: 1, offset: .5 }, { transform: 'scale(1)', opacity: 1 }], { duration: 600, easing: 'cubic-bezier(.3,1.6,.5,1)', fill: 'forwards' });
    say('<b>' + (FULL4 ? 'Two pairs + one!' : 'Jackpot ring!') + '</b> The golden tile turns ' + kindB(f) + (LAB.embedded ? '.' : '. Tap to replay.'));
    let cdn = 5;
    const tick = () => {
      if (!won) return;
      if (cdn === 0) { doReset(); return; }
      el.className = 'bcd'; el.textContent = cdn;
      if (!reduced && el.animate) el.animate([{ transform: 'scale(2.2)', opacity: 0 }, { transform: 'scale(.9)', opacity: 1, offset: .25 }, { transform: 'scale(1)', opacity: .85, offset: .4 }, { transform: 'scale(1)', opacity: .35 }], { duration: 1000, easing: 'ease-out', fill: 'forwards' });
      blip(cdn === 1 ? 1046 : 784, .08, 'square', .035); blip(cdn === 1 ? 523 : 392, .05, 'sine', .03);
      cdn--; later(1000, tick);
    };
    if (LAB.embedded) later(reduced ? 900 : 1800, () => LAB.done());       // the app shows its win screen; no replay countdown
    else later(reduced ? 1500 : 2200, tick);
  }
  function doReset() {
    timers.forEach(clearTimeout); timers = []; won = false; busy = false; cancelDrag(); closeBubbles();
    const el = $('cd'); el.className = 'bcd'; el.textContent = ''; el.getAnimations && el.getAnimations().forEach(a => a.cancel());
    g.reset(); g.rim.forEach((u, i) => setTimeout(() => pop(u, 1.25), i * 60)); ringSay(); poke();
  }
  g.on((gg, info) => { if (info.type !== 'swap') paintAll(); });
  // idle hint: a little snake of a helpful group bobs, like the bonus demo
  function poke() { clearTimeout(idleT); hints = 0; idleT = setTimeout(hint, 7000); }
  function hint() {
    if (busy || won || dr || bub) { idleT = setTimeout(hint, 3000); return; }
    const G = g.good(); if (!G.length || hints >= 3) return; hints++;
    const K = G.find(k => k.size > 1) || G[0], snake = bfsOrder(K, K.vs[0]);
    snake.forEach((u, i) => setTimeout(() => { if (!dr && !bub && !busy) pop(u, 1.25); }, i * 90));
    if (K.size === 1) setTimeout(() => say('Psst: <b>hold</b> a tile to pick its kind.'), 300);
    idleT = setTimeout(hint, 7000);
  }
  svg.addEventListener('pointerdown', e => {
    audio(); e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    poke();
    if (won) { if (!LAB.embedded) doReset(); return; }   // in the app the shell owns the next step
    if (busy) return;
    const p = pt(e);
    if (bub) { const i = bubAt(p); if (i >= 0) { pickBubble(i); return; } closeBubbles(); }
    if (dr) cancelDrag();
    const u = hit(p); if (u < 0) return;
    if (u === H) { pop(H, 1.4); g.rim.forEach((r, i) => setTimeout(() => pop(r, 1.25), 120 + i * 70)); blip(1320, .1, 'triangle', .03); say('The golden tile pays out when its gold ring shows ' + GOALTXT + '.'); return; }
    dr = { path: [], K: null, bad: -1, p0: p, at0: isRail(u) ? nearIdx(u, p) : 0 };
    addStep(u); armSay();
    dr.hold = setTimeout(() => { if (dr && dr.path.length === 1) { const w = dr.path[0]; cancelDrag(); openBubbles(w); } }, 420);
  });
  svg.addEventListener('pointermove', e => {
    if (dr) { const p = pt(e); if (dr.hold && p && Math.hypot(p.x - dr.p0.x, p.y - dr.p0.y) > h * .6) { clearTimeout(dr.hold); dr.hold = 0; } const v = hit(p); if (v >= 0) step(v); }

    if (dr) {

      else { cancelDrag(); say('Swipe across bridges through <b>two kinds</b>, or <b>hold</b> a tile.'); }

  };

})();
