<!doctype html>
<!--
  CANDY KEMPE (lab front end: a Candy-Crush-style candy board)

  What the player sees: a glossy candy board on a sugary sky. Every map region is a jelly tile (its exact region
  shape, from g.cells, faintly tinted by the candy it holds) with one candy on it. Four flavours, each with its own
  colour AND shape: a round red jelly, a blue wrapped sweet, a yellow star and a green drop. In the middle of the
  board sits an empty chocolate-frosted tile (the hole) holding an empty sweet wrapper, ringed by sockets: one per
  neighbouring candy, each showing that neighbour's flavour. No instruction copy: until the first touch a ghost finger
  drags one candy onto a neighbour while that pair bobs and glows. When the sockets show one flavour fewer, that
  missing candy drops into the wrapper. The only HUD text is a candy-jar move counter ("0/2").

  Why the classic Candy Crush gesture is exactly a Kempe move: two neighbouring candies of flavours a and b always
  lie in the same {a, b} chain (the connected run of a- and b-candies through them). "Swap two neighbours" therefore
  names one chain, K = g.chainAt(u, g.col[v]), and swapping a <-> b along K is the one move that keeps the board
  legal (no two touching candies alike). There is no match-3 here: matching is the opposite of colouring. The payoff
  is the chain reaction along K and the crush at the hole.

  Mapping (faithful; every gesture is exactly one g.swap(K) or nothing):
    tile + candy u            = region u, its flavour = g.col[u] (flavour k is element k: fire, water, air, earth)
    chocolate tile + wrapper  = the hole g.hole; its sockets = g.rim (one socket per rim region, showing g.col[x])
    DRAG candy u toward a     = K = g.chainAt(u, g.col[v]) where v is the neighbour under the finger, else the
    neighbouring candy v        neighbour nearest the drag direction (forgiving angle snap). While dragging, every
                                candy of K glows and the chain's links light up; if K.rimHits >= 2 the rim sockets
                                it would flip both show a lock (that swap cannot empty a flavour from the sockets).
                                On release, u and v slide past each other (the Candy Crush swap; it is literal:
                                afterwards u holds v's flavour and v holds u's), then the swap ripples through the
                                rest of K in BFS order, one candy every 45 ms, each flipping with a pop overshoot and
                                a rising pentatonic tone; "Sweet! / Tasty! / Delicious! / Divine!" by chain size.
                                LAB.at(x, y) gets the swap point. A rim candy that changes sends its old flavour
                                popping out of its socket; when a flavour leaves the rim the whole socket ring bounces.
    TAP candy u               = a radial picker of the other flavours (g.NC - 1 of them). Picking b swaps
                                K = g.chainAt(u, b), rippling out from u. This reaches the one-candy chains (a candy
                                with no b-neighbour just turns into b), as on every other page.
    K.web === true            = g.swap is NOT called (that chain is every a and b on the board, so swapping it only
                                renames two flavours): the candies start to swap, jelly-wobble and spring back, boing.
    g.won()                   = the sockets show g.goal flavours (3 on a 4-flavour board); the missing flavour
                                g.free() drops into the wrapper, sugar-crush burst, two candy waves, sprinkle rain,
                                "Sugar Crush!" (standalone also stars by moves vs par), then LAB.done() at 3.7 s.
    undo / restart buttons    = g.undo() / g.reset() (also driven by the app's { fth, cmd } messages via core.js);
                                inert once won inside the app. They wear the --sk-ctl tokens.
    easter egg golden-wrapper = on ~1 load in 12 one candy wears shimmering gold foil; a swap whose chain includes it
                                bursts the foil in gold sparkles and calls LAB.egg('golden-wrapper', 150) once.
  ?lvl= picks the level, ?embed=1 runs inside the app, &hud=full|compact hides this page's level title and stars.
  Sound starts only after the first gesture; prefers-reduced-motion drops slides, ripples, particles and wobbles.
  Test hook: window.CRUSH = { g, play(u, b, v), center(u), busy(), won(), hint(), gold(u) }.
-->

<script>
(function () {

    const rr = poles.map(p => Math.max(8, Math.min(Rcap, p[2] * .84)));

      const q = Math.min(carry, 1) * .6, e = shown[HINT.u];
      drawCandy(ctx, e, lerp(a[0], b[0], q), lerp(a[1], b[1], q) - G.rr[HINT.u] * .12, G.rr[HINT.u] * 1.1, { a: .75, glow: .6, gc: rgb(FL[e].hi) });
    }
    if (k >= .14 && k < .4) { const q = (k - .14) / .26; ctx.save(); ctx.globalAlpha = .7 * (1 - q); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(a[0], a[1], G.rr[HINT.u] * (.6 + .8 * q), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    drawHand(x, y, s, al, pr);
  }
  function candyText(txt, x, y, size, a, tilt) {
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); if (tilt) ctx.rotate(tilt);
    ctx.font = '400 ' + size + "px 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = size * .26; ctx.strokeStyle = '#5a1470'; ctx.strokeText(txt, 0, size * .06);
    ctx.lineWidth = size * .12; ctx.strokeStyle = '#fff'; ctx.strokeText(txt, 0, 0);
    const gr = ctx.createLinearGradient(0, -size * .5, 0, size * .5); gr.addColorStop(0, '#fff3a0'); gr.addColorStop(.45, '#ffb21e'); gr.addColorStop(.55, '#ff6aa8'); gr.addColorStop(1, '#d21f7a');
    ctx.fillStyle = gr; ctx.fillText(txt, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.save(); ctx.beginPath(); ctx.rect(-size * 8, -size * .5, size * 16, size * .32); ctx.clip(); ctx.fillText(txt, 0, 0); ctx.restore();
    ctx.restore();
  }

  // ---------------------------------------------------------------- input
  function hitCandy(x, y) {
    for (let u = 0; u < N; u++) if (u !== HOLE && Math.hypot(x - G.poles[u][0], y - G.poles[u][1]) < G.rr[u] * 1.05) return u;
    for (let u = 0; u < N; u++) if (inside([x, y], G.polys[u])) return u;
    return -1;
  }
  function targetOf(u, x, y) {
    const p = G.poles[u], dx = x - p[0], dy = y - p[1], d = Math.hypot(dx, dy);
    if (d < Math.max(12, G.rr[u] * .4)) return -1;
    const under = hitCandy(x, y);
    if (under >= 0 && under !== u && under !== HOLE && g.adj[u].includes(under)) return under;
    let best = -1, ba = 1.25;
    for (const w of g.adj[u]) { if (w === HOLE) continue; const q = G.poles[w], a = Math.abs(Math.atan2(Math.sin(Math.atan2(q[1] - p[1], q[0] - p[0]) - Math.atan2(dy, dx)), Math.cos(Math.atan2(q[1] - p[1], q[0] - p[0]) - Math.atan2(dy, dx)))); if (a < ba) { ba = a; best = w; } }
    return best;
  }
  function openPicker(u) {
    const p = G.poles[u], opts = []; for (let b = 0; b < NC; b++) if (b !== g.col[u]) opts.push(b);
    const r = clamp(G.Rcap * .72, 18, 28), D = Math.max(G.rr[u] + r + 8, r * 2.6), n = opts.length;
    let base = -Math.PI / 2; if (p[1] - D - r < TOP + 4) base = Math.PI / 2;
    const spread = n > 1 ? Math.min(1.1, 2.4 / (n - 1) * .55) : 0;
    const items = opts.map((b, i) => { let a = base + (i - (n - 1) / 2) * spread; return { b, r, x: clamp(p[0] + D * Math.cos(a), r + 4, W - r - 4), y: clamp(p[1] + D * Math.sin(a), TOP + r, H - r - 4) }; });
    picker = { u, items, t0: now(), hover: -1 }; sfx.pick();
  }
  const pt = ev => [ev.clientX, ev.clientY];
  cv.addEventListener('pointerdown', ev => {
    ev.preventDefault(); audio();
    const [x, y] = pt(ev);
    if (win || g.won()) return;
    touched = true;
    if (picker) {
      const it = picker.items.find(it => Math.hypot(x - it.x, y - it.y) < it.r * 1.25);
      if (it) { picker.hover = it.b; picker.pressing = it.b; try { cv.setPointerCapture(ev.pointerId); } catch (_) {} return; }
      picker = null;
    }
    const u = hitCandy(x, y);
    if (u < 0) return;
    if (u === HOLE) { holeWob = now(); sfx.boing(); return; }
    finalize();
    drag = { u, x0: x, y0: y, x, y, v: -1, moved: false, id: ev.pointerId, t0: now() }; sfx.pick();
    try { cv.setPointerCapture(ev.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', ev => {
    const [x, y] = pt(ev);
    if (picker && picker.pressing !== undefined) { const it = picker.items.find(it => Math.hypot(x - it.x, y - it.y) < it.r * 1.4); const h = it ? it.b : -1; if (h !== picker.hover && h >= 0) { const K = g.chainAt(picker.u, h); if (K) sfx.trace(K.size, K.web); } picker.hover = h; return; }
    if (!drag || ev.pointerId !== drag.id) return;
    drag.x = x; drag.y = y;
    if (Math.hypot(x - drag.x0, y - drag.y0) > 8) drag.moved = true;
    const v = drag.moved ? targetOf(drag.u, x, y) : -1;
    if (v !== drag.v) { drag.v = v; if (v >= 0) { const K = g.chainAt(drag.u, g.col[v]); if (K) sfx.trace(K.size, K.web); } }
  });
  function up(ev, cancel) {
    if (picker && picker.pressing !== undefined) {
      const b = picker.hover, u = picker.u; picker.pressing = undefined;
      if (!cancel && b >= 0) { picker = null; play(u, b, -1); } else picker.hover = -1;
      return;
    }
    if (!drag || ev.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (cancel || win) return;
    if (d.v >= 0) play(d.u, g.col[d.v], d.v);
    else if (!d.moved) openPicker(d.u);
  }
  cv.addEventListener('pointerup', ev => up(ev, false));
  cv.addEventListener('pointercancel', ev => up(ev, true));
  // once won inside the app, the page's own undo / start over are inert (the shell owns what happens next)
  const locked = () => !!LAB.embedded && (!!win || g.won());
  function doUndo() { if (win || locked() || !g.history.length) return; picker = null; drag = null; finalize(); g.undo(); sfx.undo(); }
  function doReset() { if (locked()) return; picker = null; drag = null; finalize(); if (!g.moves && !win) return; g.reset(); sfx.undo(); }
  ['undo', 'again', 'again2'].forEach(id => $(id).addEventListener('pointerdown', ev => { ev.stopPropagation(); audio(); touched = true; }));
  $('undo').addEventListener('click', doUndo);
  $('again').addEventListener('click', doReset);
  $('again2').addEventListener('click', () => { if (locked()) return; endWin(); g.reset(); });
  addEventListener('keydown', ev => { if (locked()) return; if ((ev.ctrlKey || ev.metaKey) && ev.key === 'z') doUndo(); else if (ev.key === 'Escape') picker = null; });
  addEventListener('resize', () => { finalize(); layout(); });

  layout(); hud();
  if (document.fonts && document.fonts.load) document.fonts.load("40px 'Lilita One'").catch(() => {});
  requestAnimationFrame(frame);
  window.CRUSH = { g, play, center: u => G.poles[u].slice(0, 2), busy, won: () => !!win, hint: () => HINT && [HINT.u, HINT.v], gold: u => { GOLD = u; eggDone = false; } };
})();
</script>
