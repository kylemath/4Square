<!doctype html>
<!--
  CANDY KEMPE (lab front end: a Candy-Crush-style candy board)

  What the player sees: a glossy candy board on a sugary sky. Every map region is a jelly tile (its exact region
  shape, from g.cells, faintly tinted by the candy it holds) with one candy on it. Four flavours, each with its own
  colour AND shape: a round red jelly, a blue wrapped sweet, a yellow star and a green drop. In the middle of the
  board sits an empty chocolate-frosted tile (the hole) holding an empty sweet wrapper, ringed by sockets: one per
  neighbouring candy, each showing that neighbour's flavour. Goal cue (bottom panel): "Fill the wrapper: clear a
  flavour from the sockets". When the sockets show one flavour fewer, that missing candy drops into the wrapper.

  Why the classic Candy Crush gesture is exactly a Kempe move: two neighbouring candies of flavours a and b always
  lie in the same {a, b} chain (the connected run of a- and b-candies through them). "Swap two neighbours" therefore
  names one chain, K = g.chainAt(u, g.col[v]), and swapping a <-> b along K is the one move that keeps the board
  legal (no two touching candies alike). There is no match-3 here: matching is the opposite of colouring. The payoff
  is the chain reaction along K and the crush at the hole.

  Mapping (faithful; every gesture is exactly one g.swap(K) or nothing):
    tile + candy u            = region u, its flavour = g.col[u] (flavour k is element k: fire, water, air, earth)
    chocolate tile + wrapper  = the hole g.hole; its sockets = g.rim (one socket per rim region, showing g.col[x])
    DRAG candy u toward a     = K = g.chainAt(u, g.col[v]) where v is the neighbour under the finger, else the
    neighbouring candy v        neighbour nearest the drag direction (forgiving angle snap). While dragging, every
                                candy of K glows and the chain's links light up; if K.rimHits >= 2 the rim sockets
                                it would flip both show a lock (that swap cannot empty a flavour from the sockets).
                                On release, u and v slide past each other (the Candy Crush swap; it is literal:
                                afterwards u holds v's flavour and v holds u's), then the swap ripples through the
                                rest of K one BFS layer per beat, each candy flipping to its new flavour with a
                                rising combo pitch and "Sweet! / Tasty! / Delicious! / Divine!" by chain size.
    TAP candy u               = a radial picker of the other flavours (g.NC - 1 of them). Picking b swaps
                                K = g.chainAt(u, b), rippling out from u. This reaches the one-candy chains (a candy
                                with no b-neighbour just turns into b), as on every other page.
    K.web === true            = g.swap is NOT called (that chain is every a and b on the board, so swapping it only
                                renames two flavours): the candies start to swap, wobble and spring back, "no change".
    g.won()                   = the sockets show g.goal flavours (3 on a 4-flavour board); the missing flavour
                                g.free() drops into the wrapper, sugar-crush burst, "Sugar Crush!", stars by moves
                                vs g.level.par (3 at par, 2 within par + 2, else 1, as in the app), then LAB.done().
    undo / restart buttons    = g.undo() / g.reset() (also driven by the app's { fth, cmd } messages via core.js).
  ?lvl= picks the level, ?embed=1 runs inside the app, &hud=full|compact hides this page's level title and stars.
  Sound starts only after the first gesture; prefers-reduced-motion drops slides, ripples, particles and wobbles.
  Test hook: window.CRUSH = { g, play(u, b, v), center(u), busy() }.
-->

      const p = P[picker.u];
      ctx.save(); ctx.fillStyle = 'rgba(40,10,60,.35)'; ctx.beginPath(); ctx.arc(p[0], p[1], R[picker.u] * 1.15, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      picker.items.forEach(it => {
        const ap = RM ? 1 : easeOut(clamp((t - picker.t0) / 180, 0, 1)), x = lerp(p[0], it.x, ap), y = lerp(p[1], it.y, ap);
        ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.shadowColor = 'rgba(40,0,60,.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
        ctx.beginPath(); ctx.arc(x, y, it.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();

    }

    const dt = 1 / 60;

    parts.forEach(q => {
      q.vy += 420 * dt; q.vx *= .985; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += .2;

      if (q.k === 0) { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); }
      else if (q.k === 1) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.r, -q.r * .4, q.r * 2, q.r * .8); ctx.restore(); }
      else { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? q.r * .4 : q.r * 1.4; ctx.lineTo(rr * Math.cos(a), rr * Math.sin(a)); } ctx.fill(); ctx.restore(); }

  function drawOne(u, t, PK, pulse) {

    if (fl) { const k = (t - fl.t0) / fl.dur; if (k >= 1) delete flips[u]; else if (k >= 0) { sx = Math.max(.04, Math.abs(Math.cos(Math.PI * k))); sy = 1 + .18 * Math.sin(Math.PI * k); y -= r * .25 * Math.sin(Math.PI * k); if (k < .5) e = fl.from; } else e = fl.from; }

    if (drag && drag.v === u) { const q = G.poles[drag.u], d = Math.hypot(q[0] - x, q[1] - y) || 1; x += (q[0] - x) / d * r * .12; y += (q[1] - y) / d * r * .12; }

    ctx.font = '400 ' + size + "px 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // ---------------------------------------------------------------- input
