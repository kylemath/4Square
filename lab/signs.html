<!doctype html>
<!--
  SIGNS (a skin; spec skins/signs.js, design note lab/SIGNS-DESIGN.md, maths lab/signs-model.js).

  What the player sees: Flip's picture of the level. Every region is a corner on one ring (a Hamiltonian cycle through
  every region, the hole at the top); the map's borders are the ring's sides, straight chords inside it and arcs outside
  it, so the sphere is cut into two triangulated polygons glued along the ring. Every triangle (a map corner where three
  regions meet) is sun (+) or sea (-): the orientation of its three elements (Eliahou's sign). Triangles at the hole are
  open (no sign). Rim corners wear their element; the other corners are plain pearls (the eye button colours them all).

  Mapping (lab/core.js game g; every swap is exactly one g.swap(K)):
    corner u               = region u; ring place C.at[u]; drawn at ring point C.at[u]
    sun / sea triangle     = FTH_SIGNS.signs(C, g.col) (+1 / -1), open = a face at the hole
    tap a corner           = choose it; three chips = its three chains g.chainsThrough(u) (partner element, flip count)
    tap a chip             = preview: the chain's corners light in its two elements, the triangles it will flip glow
    tap it again / SWAP    = g.swap(K): exactly the glowing triangles flip sign, in a wave from the corner (the theorem)
    drag corner -> corner  = the chain {col u, col v} through u; release swaps
    web chain              = refused with a wobble (it only renames two elements everywhere)
    win                    = g.won(): the hole takes the free element, its open triangles close with signs, a sweep of
                             light runs round the ring, then LAB.done()
  Views: ring (the sphere: inside chords, outside arcs) or pair (Flip's two polygons; the outside one seen from behind).
  Keys: arrows choose a corner, 1-3 a chain, Enter swaps, U undo, R reset, C colours, V view. ?lvl=<id or number>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg0: #241d5c; --bg1: #120f33; --ink: #15112e; --sun: #ffc23d; --sun-hi: #ffe08a; --sun-ink: #6e3d00; --sea: #3f95ff; --sea-hi: #8cc4ff; --sea-ink: #0b2a66;
    --open: #2c2660; --open2: #3a3378; --pearl: #fff6e6; --accent: #ff5fa2; --glow: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 30% 18%, var(--bg0) 0%, #1a1545 45%, var(--bg1) 100%); color: #fff;
    font: 600 15px/1.2 Fredoka, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: none; -webkit-user-select: none; user-select: none; }
  #bd { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  /* faces */
  .tf { stroke: var(--ink); stroke-linejoin: round; transition: fill .18s; }
  .tf.p { fill: var(--sun); } .tf.m { fill: var(--sea); } .tf.o { fill: url(#sg-open); }
  .tf.pre { stroke: var(--glow); animation: pre .9s ease-in-out infinite; }
  .tf.p.pre { fill: var(--sun-hi); } .tf.m.pre { fill: var(--sea-hi); }
  @keyframes pre { 50% { stroke-opacity: .35; } }
  .tf.fl { animation: fl .34s ease-in-out; transform-box: fill-box; transform-origin: center; }
  @keyframes fl { 0% { transform: scale(1); } 45% { transform: scale(.78) rotate(8deg); fill: #fff; } 100% { transform: scale(1); } }
  .tf.flash { animation: flash .5s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes flash { 0% { fill: #fff; } 100% { } }
  .tf.wv { animation: wv .5s ease-out; } @keyframes wv { 0% { fill: #fff; } }
  .gl { font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .gl.p { fill: var(--sun-ink); } .gl.m { fill: var(--sea-ink); } .gl.o { display: none; }
  .gl.fl { animation: glp .34s ease-in-out; transform-box: fill-box; transform-origin: center; } @keyframes glp { 50% { transform: scale(0); } }
  .ring { fill: none; stroke: #fff3d6; stroke-linejoin: round; pointer-events: none; }
  .ringU { fill: none; stroke: var(--ink); stroke-linejoin: round; pointer-events: none; }
  /* corners */
  .cv { transition: transform .12s; }
  .cv .bd { stroke: var(--ink); }
  .cv.sel { animation: lift .9s ease-in-out infinite; } @keyframes lift { 50% { transform: translate(var(--x), var(--y)) scale(1.18); } }
  .cv.ch .halo { opacity: .9; animation: hal .8s ease-in-out infinite; } @keyframes hal { 50% { opacity: .25; } }
  .cv.pop { animation: cpop .36s ease-out; } @keyframes cpop { 40% { transform: translate(var(--x), var(--y)) scale(1.45); } }
  .cv.hint .halo { opacity: 1; animation: hal .6s ease-in-out 3; }
  .halo { opacity: 0; fill: none; stroke-width: 3; }
  .hole .well { fill: #090720; stroke: var(--ink); }
  .hole .dash { fill: none; stroke: #c9c3ff; stroke-opacity: .7; stroke-dasharray: 3 4; animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hole.wob { animation: wob .4s; } @keyframes wob { 25% { transform: translate(calc(var(--x) + 3px), var(--y)); } 75% { transform: translate(calc(var(--x) - 3px), var(--y)); } }
  .rub { stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 7; pointer-events: none; }
  .burst { pointer-events: none; }
  /* bars */
  #top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #ttl { font-weight: 700; font-size: 1.05rem; text-shadow: 0 2px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--sk-chip, #2b2466); color: var(--sk-chip-ink, #fff);
    border: 2px solid var(--sk-edge, var(--ink)); font-weight: 700; white-space: nowrap; }
  #tally .d { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink); display: inline-block; }
  #tally .d.p { background: var(--sun); } #tally .d.m { background: var(--sea); }
  #tally b { min-width: 1.2em; text-align: left; } #tally.bump { animation: bump .35s; } @keyframes bump { 40% { transform: scale(1.15); } }
  #rimG .g { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); display: inline-block; margin-right: -3px; }
  #rimG.bump { animation: bump .4s; }
  #bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  #bot > * { pointer-events: auto; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .btn { width: 46px; height: 46px; border-radius: 16px; border: 2.5px solid var(--sk-ctl-edge, var(--ink)); background: var(--sk-ctl, #2f2770); color: var(--sk-ctl-ink, #fff);
    box-shadow: 0 4px 0 var(--sk-ctl-edge, var(--ink)); display: grid; place-items: center; padding: 0; cursor: pointer; font: inherit; transition: transform .08s, box-shadow .08s, opacity .15s; }
  .btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--sk-ctl-edge, var(--ink)); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn[aria-pressed="true"] { background: var(--sk-accent, #ffd84a); color: var(--ink); }
  .sp { width: 14px; }
  #chips { min-height: 54px; }
  .kc { height: 50px; min-width: 76px; border-radius: 18px; border: 2.5px solid var(--sk-ctl-edge, var(--ink)); background: var(--sk-ctl, #2f2770); color: var(--sk-ctl-ink, #fff);
    box-shadow: 0 4px 0 var(--sk-ctl-edge, var(--ink)); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font: 700 1.05rem Fredoka, system-ui, sans-serif; cursor: pointer;
    animation: kin .22s ease-out both; }
  @keyframes kin { 0% { transform: translateY(14px) scale(.7); opacity: 0; } }
  .kc .gm { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--ink); margin-right: -10px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.22), inset 3px 3px 0 rgba(255,255,255,.35); }
  .kc .gm + .gm { margin-right: 2px; }
  .kc.on { background: #fff; color: var(--ink); transform: translateY(-4px); box-shadow: 0 8px 0 var(--ink), 0 0 0 4px var(--sk-accent, #ffd84a); }
  .kc.web { opacity: .5; }
  .kc.no { animation: no .4s; } @keyframes no { 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
  #go { height: 50px; padding: 0 18px; border-radius: 18px; border: 2.5px solid var(--ink); background: linear-gradient(180deg, #ff8cc0, #ff4f97); color: #fff; font: 700 1.1rem Fredoka, system-ui, sans-serif;
    box-shadow: 0 5px 0 #8a1d4f; letter-spacing: .04em; text-shadow: 0 2px 0 rgba(0,0,0,.25); cursor: pointer; animation: kin .22s ease-out both, gob 1s ease-in-out .3s infinite; }
  @keyframes gob { 50% { transform: scale(1.06); } }
  #go:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a1d4f; }
  .embed #top .nav { display: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg id="bd" role="application" aria-label="Signs board"></svg>
<div id="top">
  <button class="btn nav" id="bPrev" aria-label="Previous level"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="ttl" class="grow"></div>
  <span class="chip" id="rimG" aria-label="rim elements"></span>
  <span class="chip" id="tally" aria-live="polite"></span>
  <button class="btn nav" id="bNext" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div id="bot">
  <div class="row" id="chips"></div>
  <div class="row">
    <button class="btn" id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn" id="bReset" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></svg></button>
    <span class="sp"></span>
    <button class="btn" id="bCol" aria-label="Show every element" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.4"/><circle cx="16" cy="9" r="3.4"/><circle cx="8" cy="16.5" r="3.4"/><circle cx="16" cy="16.5" r="3.4"/></svg></button>
    <button class="btn" id="bView" aria-label="Two polygons" aria-pressed="false"><svg viewBox="0 0 24 24" id="vIc"></svg></button>
  </div>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script src="signs-model.js"></script>
<script>
(function () {
  'use strict';
  const g = LAB.game(), SG = window.FTH_SIGNS, NS = 'http://www.w3.org/2000/svg';
  const QS = new URLSearchParams(location.search), HUD = QS.get('hud') || '';
  const ELEM = LAB.ELEM, COL = ELEM.map(e => e.hex), DARK = ELEM.map(e => e.dark), NEON = ELEM.map(e => e.neon);
  const n = g.n, HOLE = g.hole, RIMSET = new Set(g.rim);
  const C = SG.cut(g);
  if (!C.ok) throw new Error('signs: this map cannot be cut');   // the app plays it on the island board instead
  const $ = id => document.getElementById(id), svg = $('bd');
  const now = () => performance.now(), reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = (() => { try { return JSON.parse(localStorage.getItem('fth-signs') || '{}'); } catch (e) { return {}; } })();
  const persist = () => { try { localStorage.setItem('fth-signs', JSON.stringify(store)); } catch (e) { /* private mode */ } };
  let view = C.tri && (store.view || (innerWidth > innerHeight * 1.15 ? 'pair' : 'ring')) === 'pair' ? 'pair' : 'ring', showCol = !!store.col;
  if (!C.tri) document.getElementById('bView').style.display = document.getElementById('tally').style.display = 'none';
  const F = C.faces, NF = F.length;
  let shown = Array.from(SG.signs(C, g.col));          // the sign each face shows now (animations lag the game a little)
  let sel = -1, pick = null, busyUntil = 0, win = null, lastTouch = now(), drag = null, hintT = 0;

  // ---------------------------------------------------------------- sound (synthesised; silent until the first touch)
  let AC = null, MG = null;
  function audio() { if (AC) { if (AC.state === 'suspended') AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = 0.2; MG.connect(AC.destination); } catch (e) { AC = null; } }
  function tone(f, dur, vol, type, when, f2) {
    if (!AC) return; const t = AC.currentTime + (when || 0), o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.006); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(MG); o.start(t); o.stop(t + dur + 0.03);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  const pop = (i, s, when) => { const f = (s > 0 ? 660 : 440) * Math.pow(2, PENTA[Math.min(i, 12)] / 12); tone(f, 0.07, 0.12, 'triangle', when); tone(f * 1.5, 0.04, 0.04, 'sine', when); };
  const thud = () => { tone(150, 0.16, 0.18, 'triangle', 0, 70); };

  // ---------------------------------------------------------------- geometry
  let W = 0, H = 0, TOP = 0, BOT = 0, geo = null;
  const ang = p => -Math.PI / 2 + 2 * Math.PI * p / n;
  const f1 = x => Math.round(x * 10) / 10;
  const hOut = new Map(); C.chords.out.forEach(([i, j, h]) => hOut.set(i * n + j, h));
  const easeOut = x => x * (2 - x);
  function layout() {
    W = innerWidth; H = innerHeight;
    TOP = LAB.embedded && (HUD === 'full' || HUD === 'compact') ? 8 : 54; BOT = 128;
    const aw = W - 20, ah = H - TOP - BOT, G = { view };
    if (view === 'ring') {
      const Hm = Math.max(1, C.H), k = Math.min(0.16, 0.5 / Hm) * Hm;      // the outside band, as a fraction of R
      // a tall screen stretches the ring into an upright oval (an affine map: same drawing, same orientation)
      const sy = Math.max(1, Math.min(1.32, (ah - 20) / aw));
      const R = Math.max(40, Math.min(aw / 2 / (1 + k) - 6, (ah / 2 - 14) / (1 + k) / sy));
      Object.assign(G, { R, step: R * k / Hm, discs: [{ cx: W / 2, cy: TOP + ah / 2 + 6, R, sy }] });
    } else {
      const wide = aw > ah * 1.15, R = wide ? Math.min(aw / 4 - 10, ah / 2 - 24) : Math.min(aw / 2 - 8, ah / 4 - 22);
      const cy = TOP + ah / 2 + 8, cx = W / 2;
      G.discs = wide ? [{ cx: cx - aw / 4, cy, R }, { cx: cx + aw / 4, cy, R }] : [{ cx, cy: cy - ah / 4 + 2, R }, { cx, cy: cy + ah / 4 + 6, R }];
      G.R = R;
    }
    G.sp = 2 * Math.PI * G.R * (1 + (G.discs[0].sy || 1)) / 2 / n;                                   // ring spacing
    G.cr = Math.max(5.5, Math.min(15, G.sp * 0.34));               // corner radius
    G.lw = Math.max(1.2, Math.min(3, G.sp * 0.09));                // border width
    geo = G;
  }
  const at = (d, p, r) => [d.cx + (r == null ? d.R : r) * Math.cos(ang(p)), d.cy + (r == null ? d.R : r) * Math.sin(ang(p)) * (d.sy || 1)];
  // an outside arc between ring places i < j: rises (scaled by its nesting height) and runs above every arc it holds
  const TAU = 0.9;
  function arcR(i, j, p) { if (j === i + 1) return null; const h = hOut.get(i * n + j) || 1, d = Math.min(p - i, j - p); return geo.R + geo.step * h * easeOut(Math.min(1, d / TAU)); }
  function arcPts(i, j, rev) {
    const d = geo.discs[0], pts = [];
    if (j === i + 1) { pts.push(at(d, i), at(d, j)); }
    else { const N = Math.max(8, Math.ceil((j - i) * 5)); for (let k = 0; k <= N; k++) { const p = i + (j - i) * k / N; pts.push(at(d, p, arcR(i, j, p))); } }
    return rev ? pts.reverse() : pts;
  }
  const dPts = pts => 'M' + pts.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z';
  // a face's outline and its glyph spot ([x, y, size] or null) in a disc
  function facePath(f, di) {
    const d = geo.discs[di], [a, b, c] = f.r;
    if (geo.view === 'pair' || f.side === 'in') {
      const P = [at(d, a), at(d, b), at(d, c)];
      return { d: dPts(P), g: inGlyph(P) };
    }
    if (a === 0 && c === n - 1) return null;                     // the face round the gap (at the hole): the open sky above the ring
    const pts = arcPts(a, c).concat(arcPts(b, c, true).slice(1), arcPts(a, b, true).slice(1));
    // glyph: where the band between the outer arc and the inner ones is thickest
    let best = null;
    for (let k = 1; k < 24; k++) {
      const p = a + (c - a) * k / 24, ro = arcR(a, c, p), ri = p < b ? (arcR(a, b, p) || geo.R) : (arcR(b, c, p) || geo.R), t = ro - ri;
      if (!best || t > best.t) best = { p, t, r: (ro + ri) / 2 };
    }
    const sz = Math.min(best.t * 0.8, geo.sp * 0.9, 20);
    return { d: dPts(pts), g: sz >= 7.5 ? at(d, best.p, best.r).concat([sz]) : null };
  }
  function inGlyph(P) {
    const L = [0, 1, 2].map(i => Math.hypot(P[(i + 1) % 3][0] - P[(i + 2) % 3][0], P[(i + 1) % 3][1] - P[(i + 2) % 3][1])), S = L[0] + L[1] + L[2];
    const A = Math.abs((P[1][0] - P[0][0]) * (P[2][1] - P[0][1]) - (P[2][0] - P[0][0]) * (P[1][1] - P[0][1])) / 2, r = 2 * A / S;
    const x = (L[0] * P[0][0] + L[1] * P[1][0] + L[2] * P[2][0]) / S, y = (L[0] * P[0][1] + L[1] * P[1][1] + L[2] * P[2][1]) / S;
    const sz = Math.min(r * 1.25, 22);
    if (sz < 7.5 || P.some(q => Math.hypot(q[0] - x, q[1] - y) < geo.cr + sz * 0.45)) return null;
    return [x, y, sz];
  }

  // ---------------------------------------------------------------- build the board (on load, resize, view change)
  const el = (tag, a, par) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (par) par.appendChild(e); return e; };
  let faceEls = [], glyEls = [], cvEls = [], holeEls = [], gRub = null, gFx = null;
  const sgCls = s => s > 0 ? 'p' : s < 0 ? 'm' : 'o';
  function icon(e, s, par, ink) {
    const p = el('path', { d: LAB.ICON[e], transform: 'scale(' + f1(s * 100) / 100 + ') translate(-12 -12)' }, par);
    if (e < 2) p.setAttribute('fill', ink || '#fff'); else { p.setAttribute('fill', 'none'); p.setAttribute('stroke', ink || '#fff'); p.setAttribute('stroke-width', '3'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); }
    return p;
  }
  function build() {
    layout(); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.innerHTML = '';
    const defs = el('defs', {}, svg);
    defs.innerHTML = '<pattern id="sg-open" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2c2660"/><rect width="3" height="8" fill="#3a3378"/></pattern>' +
      '<radialGradient id="sg-light" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>' +
      '<radialGradient id="sg-pearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#fff2dc"/><stop offset="1" stop-color="#d9c7ae"/></radialGradient>';
    const gShadow = el('g', {}, svg), gF = el('g', {}, svg), gL = el('g', {}, svg), gR = el('g', {}, svg), gV = el('g', {}, svg);
    gRub = el('g', {}, svg); gFx = el('g', { class: 'burst' }, svg);
    faceEls = new Array(NF).fill(null); glyEls = new Array(NF).fill(null); cvEls = []; holeEls = [];
    geo.discs.forEach((d, di) => {
      // drop shadow and light over each disc (one light from the top left)
      const ext = geo.view === 'ring' ? d.R + geo.step * Math.max(1, C.H) : d.R;
      el('ellipse', { cx: f1(d.cx + 4), cy: f1(d.cy + 7), rx: f1(ext + 3), ry: f1((ext + 3) * (d.sy || 1)), fill: '#000', opacity: '.28' }, gShadow);
      F.forEach((f, i) => {
        if (geo.view === 'pair' && (f.side === 'in') !== (di === 0)) return;
        const P = facePath(f, di); if (!P) return;
        const e = el('path', { class: 'tf ' + sgCls(shown[i]), d: P.d, 'stroke-width': f1(geo.lw), 'data-f': i }, gF);
        (faceEls[i] = faceEls[i] || []).push(e);
