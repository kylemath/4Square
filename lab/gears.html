<!doctype html>
<!--
  GEARS: the play page of the Gears skin (skins/gears.js). Design note: lab/GEARS-DESIGN.md.

  What the player sees: a dark machined steel backplate and one gear per region in its element's colour (icon on the
  boss), every pair of neighbours meshing tooth into gap: the map's circle packing (gearpack.js). In the middle, the
  hole: a steel drive hub toothed against the 5 rim gears. Big frame gears run off the screen (icon on a medallion).

  Mapping (every action is exactly one g.swap(K) or nothing):
    gear u                 = region u, its colour = g.col[u]; it meshes with exactly its neighbours (g.adj)
    drive hub              = g.hole; it meshes with the 5 rim gears g.rim
    drag gear u -> v       = K = g.chainAt(u, g.col[v]) for a neighbour v of another element; release on v swaps
    tap gear u             = up to 3 partner chips (one per other element b); pressing a chip lights g.chainAt(u, b),
                             releasing on it swaps (this is how one-region chains are reached)
    the swap               = the {a, b} chain is bipartite, so it is a gear train: all its gears turn together by the
                             same whole number of teeth (about half a turn of its median gear), a-gears clockwise,
                             b-gears anticlockwise; each face changes element as a wave from the touched gear reaches it
    hub response           = from the rules only (GearPolarity F1/F2): chain meets no rim cell -> hub still; rim cells
                             of one element -> hub turns (fills iff an element left the rim); rim cells of BOTH
                             elements -> odd ring through the hole, the two rim gears spin opposite ways, the hub JAMS
                             (shudder, sparks, clunk, slips back). The swap still happens: a jam means "cannot fill on
                             this turn", not "wasted".
    K.web                  = no swap: the chain's gears nudge and spring back
    win                    = hub gear drops in, a wave of turns, then LAB.done()
    die counter            = FTH_DEGREE.counts(g, g.col).N (../degree.js): a tetrahedral die in the hub, sitting on the
                             face the rim wraps (m), turned N x 120 degrees; it clicks round when a swap changes N, with a
                             "+k" / "-k" float. Shown whenever it is defined (4-element triangulations), never as a hint.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gears</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16191f; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* the die counter: an SVG over the hub, drawn by the script (a 3D tetrahedron, faces in the element colours) */
  #die { position: fixed; left: 0; top: 0; width: 60px; height: 60px; pointer-events: none; transform-origin: 50% 50%; display: none; }
  #die svg { width: 100%; height: 100%; overflow: visible; display: block; }
  #die.on { display: block; }
  #die.out { opacity: 0; transition: opacity .5s; }
  .dk { position: fixed; pointer-events: none; font: 900 20px/1 'Russo One', 'Arial Black', system-ui, sans-serif; color: #ffd24a; transform: translate(-50%, -50%); white-space: nowrap;
    text-shadow: 2px 0 0 #1a1328, -2px 0 0 #1a1328, 0 2px 0 #1a1328, 0 -2px 0 #1a1328, 1.5px 1.5px 0 #1a1328, -1.5px 1.5px 0 #1a1328, 1.5px -1.5px 0 #1a1328, -1.5px -1.5px 0 #1a1328, 0 4px 0 #1a1328; }
  .dk.dn { color: #c9bde6; }
  @media (prefers-reduced-motion: no-preference) { .dk { animation: dk 1.1s ease-out forwards; } }
  @media (prefers-reduced-motion: reduce) { .dk { animation: dkr 1.1s linear forwards; } }
  @keyframes dk { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
  @keyframes dkr { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="cv" aria-label="Gears board"></canvas>
<div id="die" role="img" aria-label="Die counter"><svg viewBox="-50 -50 100 100" aria-hidden="true"></svg></div>
<div id="dieLive" class="sr" aria-live="polite"></div>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script src="../degree.js"></script>
<script src="gearpack.js"></script>
<script>
(function () {
  'use strict';
  const g = LAB.game();
  const n = g.n, HOLE = g.hole, RIM = g.rim, RIMSET = new Set(RIM);
  const QS = new URLSearchParams(location.search), HUD = QS.get('hud') || '';
  const ELEM = LAB.ELEM, COL = ELEM.map(e => e.hex), DARK = ELEM.map(e => e.dark), NEON = ELEM.map(e => e.neon);
  const ICON = LAB.ICON.map(d => new Path2D(d)), ICON_FILL = [true, true, false, false];
  const INK = '#1a1328', STEEL = '#8d96a8', STEEL_D = '#4b5263';
  const RM = matchMedia('(prefers-reduced-motion: reduce)'), reduce = () => RM.matches;
  const now = () => performance.now();
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const inout = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const back = t => { if (t <= 0) return 0; if (t >= 1) return 1; const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const cv = document.getElementById('cv'), cx = cv.getContext('2d');

  // ---------------------------------------------------------------- geometry (../lab/gearpack.js; GEARS-DESIGN "Layout")
  // A circle packing: every pair of neighbours tangent, nothing else touching, the hub in the middle of the box. Big frame
  // gears may run off the box (drawn tooth by tooth in screen space, their icon on a medallion where they show). One tooth
  // pitch for every gear; rest phases from GEARPACK.teeth, so neighbours mesh tooth into gap.
  const C0 = g.centre || g.pos, PK = GEARPACK.pack(g, C0);
  let W = 0, H = 0, TOP = 52, BOX = { x0: 0, y0: 0, x1: 1, y1: 1 };
  const S = Array.from({ length: n }, () => [0, 0]), R = new Array(n).fill(10), NT = new Array(n).fill(12), PH = new Array(n).fill(0);
  let gearPath = [], chipPath = null, chipR = 14, PITCH = 10, MOD = 3, HUGE = [], BADGE = [], BOLTS = [], plate = null, FRAME = [];
  // the tooth: half widths (fractions of the tooth angle) at the root, on the pitch circle and at the tip; addendum 0.9 m,
  // dedendum 1.12 m (a little stubbier than the standard 1 m / 1.25 m, so small pinions stay chunky)
  const TW = [0.285, 0.21, 0.13], ADD = 0.9, DED = 1.12;
  const capR = r => Math.min(r * 0.4, 13 + r * 0.12);   // the boss: 0.4 r, growing slower on big gears
  function toothPts(r, N, m, i0, i1, ang, ox, oy, out) {   // teeth i0..i1 (centre ox, oy, turned by ang) as one polyline
    const tau = 2 * Math.PI / N, rr = r - DED * m, ra = r + ADD * m, pt = (q, a) => out.push([ox + q * Math.cos(a), oy + q * Math.sin(a)]);
    for (let i = i0; i <= i1; i++) {
      const a = ang + i * tau;
      pt(rr, a - 0.5 * tau); pt(rr, a - TW[0] * tau); pt(r, a - TW[1] * tau); pt(ra, a - TW[2] * tau);
      pt(ra, a + TW[2] * tau); pt(r, a + TW[1] * tau); pt(rr, a + TW[0] * tau);
    }
    return out;
  }
  function makeGear(r, N, m, holes) {                      // a whole gear in its own frame; lightening holes cut out (evenodd)
    const p = new Path2D();
    toothPts(r, N, m, 0, N - 1, 0, 0, 0, []).forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath();
    const rr = r - DED * m, hub = capR(r), room = rr - 1.1 * m - hub;
    if (holes && room > 12) {
      const k = r > 90 ? 6 : 5, rc = hub + room / 2, rad = Math.min(room * 0.3, rc * Math.sin(Math.PI / k) * 0.5, 16);
      for (let i = 0; i < k; i++) { const a = (i + 0.5) * 2 * Math.PI / k, x = rc * Math.cos(a), y = rc * Math.sin(a); p.moveTo(x + rad, y); p.arc(x, y, rad, 0, 2 * Math.PI, true); }
    }
    return p;
  }
  // a frame gear (radius up to ~1e9 px: nearly a rack): only the teeth over the screen, in screen space, closed deep inside it
  function hugeArc(u) {
    const [ox, oy] = S[u], mg = 60, mid = Math.atan2(H / 2 - oy, W / 2 - ox);
    const rel = [[-mg, -mg], [W + mg, -mg], [W + mg, H + mg], [-mg, H + mg]].map(([x, y]) => { let d = Math.atan2(y - oy, x - ox) - mid; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; });
    return [mid + Math.min(...rel), mid + Math.max(...rel)];
  }
  function hugePath(u, ang) {
    const [ox, oy] = S[u], r = R[u], tau = 2 * Math.PI / NT[u], [a0, a1] = hugeArc(u);
    const i0 = Math.floor((a0 - ang) / tau) - 1, i1 = Math.min(Math.ceil((a1 - ang) / tau) + 1, i0 + 3000), deep = Math.min(r, Math.hypot(W, H) * 1.6);
    const p = new Path2D();
    toothPts(r, NT[u], MOD, i0, i1, ang, ox, oy, []).forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
    const e1 = ang + (i1 + 0.5) * tau, e0 = ang + (i0 - 0.5) * tau;
    p.lineTo(ox + (r - deep) * Math.cos(e1), oy + (r - deep) * Math.sin(e1)); p.lineTo(ox + (r - deep) * Math.cos(e0), oy + (r - deep) * Math.sin(e0)); p.closePath();
    return p;
  }
  function hugeRing(u, q) {                                // a circle of radius q about a frame gear's centre, as a polyline over the screen
    const [ox, oy] = S[u], [a0, a1] = hugeArc(u), k = Math.min(400, Math.max(8, Math.ceil((a1 - a0) * q / 10))), p = new Path2D();
    for (let i = 0; i <= k; i++) { const a = a0 + (a1 - a0) * i / k, x = ox + q * Math.cos(a), y = oy + q * Math.sin(a); if (i) p.lineTo(x, y); else p.moveTo(x, y); }
    return p;
  }
  const inBox = (x, y, m) => x > BOX.x0 + m && x < BOX.x1 - m && y > BOX.y0 + m && y < BOX.y1 - m;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    TOP = HUD === 'full' && LAB.embedded ? 46 : 54;
    BOX = { x0: 10, y0: TOP, x1: W - 10, y1: H - 10 };
    const V = GEARPACK.view(PK, BOX), T = GEARPACK.teeth(PK, V, BOX);
    for (let u = 0; u < n; u++) { S[u] = V.S[u]; R[u] = V.R[u]; NT[u] = T.N[u]; PH[u] = T.ph[u]; }
    base.fill(0); hub.ang = hub.from = hub.to = 0; anims.forEach(a => { shown[a.u] = a.to; }); anims = [];
    PITCH = T.pitch; MOD = PITCH / Math.PI; FRAME = V.frame;
    HUGE = R.map(r => r > 1200);
    // a gear whose middle is off the box wears its icon on a medallion: inside both it and the box, up to 34 px in from its rim
    BADGE = R.map((r, u) => {
      if (u === HOLE || inBox(S[u][0], S[u][1], 14)) return null;
      const qx = clamp(S[u][0], BOX.x0 + 26, BOX.x1 - 26), qy = clamp(S[u][1], BOX.y0 + 26, BOX.y1 - 26), d = Math.hypot(qx - S[u][0], qy - S[u][1]) || 1;
      const k = d > r - Math.min(34, r * 0.6) ? (r - Math.min(34, r * 0.6)) / d : 1;
      return [S[u][0] + (qx - S[u][0]) * k, S[u][1] + (qy - S[u][1]) * k];
    });
    gearPath = R.map((r, u) => HUGE[u] ? null : makeGear(r, NT[u], MOD, u !== HOLE && !BADGE[u]));
    // bolts in the wider gaps between three gears (the circle inscribed in a gap: Descartes' theorem, complex form)
    BOLTS = [];
    const mul = (p, q) => [p[0] * q[0] - p[1] * q[1], p[0] * q[1] + p[1] * q[0]];
    for (const T3 of PK.tris) {
      if (T3.some(v => v >= n)) continue;
      const k = T3.map(v => 1 / R[v]), z = T3.map(v => S[v]), k4 = k[0] + k[1] + k[2] + 2 * Math.sqrt(k[0] * k[1] + k[1] * k[2] + k[0] * k[2]), r4 = 1 / k4;
      const rb = Math.min(7, r4 - MOD * 1.35); if (rb < 3) continue;
      const sum = [0, 1, 2].reduce((s, i) => [s[0] + k[i] * z[i][0], s[1] + k[i] * z[i][1]], [0, 0]);
      const pr = [[0, 1], [1, 2], [0, 2]].reduce((s, [i, j]) => { const q = mul(z[i], z[j]); return [s[0] + k[i] * k[j] * q[0], s[1] + k[i] * k[j] * q[1]]; }, [0, 0]);
      const m = Math.sqrt(Math.hypot(pr[0], pr[1])), h = Math.atan2(pr[1], pr[0]) / 2, rt = [m * Math.cos(h), m * Math.sin(h)];
      for (const sg of [1, -1]) {
        const p = [(sum[0] + sg * 2 * rt[0]) / k4, (sum[1] + sg * 2 * rt[1]) / k4];
        if (T3.every(v => Math.abs(Math.hypot(p[0] - S[v][0], p[1] - S[v][1]) - R[v] - r4) < 0.02 * r4 + 0.05)) { if (inBox(p[0], p[1], 8)) BOLTS.push([p[0], p[1], rb]); break; }
      }
    }
    const med = R.filter((r, u) => !HUGE[u]).sort((a, b) => a - b)[n >> 2] || 20;
    chipR = clamp(med * 0.8, 15, 20); chipPath = makeGear(chipR, 9, chipR * 0.2, false);
    plate = null;
    if (typeof DIE !== 'undefined') DIE.place();
    dirty();
  }

  // ---------------------------------------------------------------- state shown on screen
  const shown = g.col.slice(); let prev = g.col.slice();
  const base = new Array(n).fill(0);              // each gear's turn away from its rest phase PH (whole teeth, so it still meshes)
  let anims = [];                                 // { u, t0, t1, ang, from, to, flip }: turn by ang over t0..t1, face changes at flip
  let wobbles = [];                               // { u, t0, amp } (amp in teeth)
  let glints = [];                                // { x, y, t0, red }
  let hub = { ang: 0, from: 0, to: 0, t0: 0, t1: 0, jamT: 0, jam: false, col: -1, drop: 0 };
  let sel = null, chipDown = null, lit = null, drag = null, origin = -1, busyUntil = 0, win = null, lastTouch = now();
  let hintT = 0;
  const rimShown = () => RIM.map(x => shown[x]);
  const rimBounce = new Array(RIM.length).fill(-1e9);
  const tooth = u => 2 * Math.PI / NT[u];
  // how far a train turns: a whole number of teeth (every gear lands on a tooth, so rest phases still mesh), about half a
  // turn of its median gear; each gear turns k / N_u of a turn, so pitch-line speeds match as in real meshing gears
  const teethFor = vs => { const L = vs.filter(u => !HUGE[u]).map(u => NT[u]).sort((a, b) => a - b); return L.length ? Math.max(2, Math.round(L[L.length >> 1] / 2)) : 6; };

  // ---------------------------------------------------------------- sound (synthesised; silent until the first touch)
  let AC = null, MG = null;
  function audio() { if (AC) { if (AC.state === 'suspended') AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = 0.22; MG.connect(AC.destination); } catch (e) { AC = null; } }
  function tone(f, dur, vol, type, when, f2) {
    if (!AC) return; const t = AC.currentTime + (when || 0), o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.006); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(MG); o.start(t); o.stop(t + dur + 0.03);
  }
  const tick = (i, when) => { const f = 520 * Math.pow(2, Math.min(i, 18) / 12); tone(f, 0.05, 0.16, 'square', when); tone(f * 2, 0.03, 0.05, 'triangle', when); };
  const clunk = when => { tone(120, 0.28, 0.32, 'sawtooth', when, 55); tone(68, 0.32, 0.28, 'square', when + 0.02, 50); };
  const ratchet = (k, when) => { for (let i = 0; i < k; i++) tone(1400 - i * 60, 0.025, 0.08, 'square', when + i * 0.045); };
  const thud = () => tone(150, 0.16, 0.18, 'triangle', 0, 70);
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

  // ---------------------------------------------------------------- the cascade
  function bfs(set, from) {
    const d = new Map([[from, 0]]); let fr = [from];
    while (fr.length) { const nx = []; for (const u of fr) for (const w of g.adj[u]) if (set.has(w) && !d.has(w)) { d.set(w, d.get(u) + 1); nx.push(w); } fr = nx; }
    return d;
  }
  function settle(u) { const a = anims.find(x => x.u === u); if (a) { base[u] += a.ang; if (HUGE[u]) base[u] %= tooth(u); shown[u] = a.to; anims = anims.filter(x => x !== a); } }
  const contact = (u, w) => { const k = R[u] / (R[u] + R[w]); return [S[u][0] + (S[w][0] - S[u][0]) * k, S[u][1] + (S[w][1] - S[u][1]) * k]; };
  function cascade(K, old, at) {
    const t0 = now() + 30, red = reduce();
    const o = K.set.has(at) ? at : K.vs[0], depth = bfs(K.set, o);
    let maxD = 0; depth.forEach(d => { maxD = Math.max(maxD, d); });
    const STEP = red ? 18 : clamp(620 / Math.max(1, maxD), 34, 78), TURN = red ? 160 : 340;
    // the train is meshed, so all its gears turn together (t0..t1); the faces change breadth-first from the touched gear
    const t1 = t0 + maxD * STEP + TURN, k = teethFor(K.vs);
    const cw = old[o];                            // the touched gear's element turns clockwise; its partners anticlockwise
    const startOf = u => t0 + depth.get(u) * STEP;
    for (const u of K.vs) {
      settle(u);
      const to = old[u] === K.pair[0] ? K.pair[1] : K.pair[0];
      anims.push({ u, t0, t1, ang: (old[u] === cw ? 1 : -1) * k * tooth(u), from: old[u], to, flip: startOf(u) + TURN / 2 });
    }
    for (const u of K.vs) for (const w of g.adj[u]) if (K.set.has(w) && depth.get(w) === depth.get(u) + 1) { const [x, y] = contact(u, w); glints.push({ x, y, t0: startOf(w), red: false }); }
    for (let d = 0; d <= maxD; d++) tick(d, (d * STEP + 30) / 1000);
    let end = t1;
    // the hub: driven by the rim gears of the chain (GearPolarity F1/F2)
    const rimK = K.vs.filter(u => RIMSET.has(u)).sort((a, b) => startOf(a) - startOf(b));
    if (rimK.length) {
      const first = rimK[0], spin = old[first] === cw ? 1 : -1;
      const opp = rimK.find(u => old[u] !== old[first]);
      if (!opp) {                                 // one polarity: the hub turns with the train, opposite to the rim gears, k teeth
        hub = Object.assign(hub, { from: hub.ang, to: hub.ang - spin * k * tooth(HOLE), t0, t1, jam: false, jamT: 0 });
        ratchet(4, (t0 - now()) / 1000);
      } else {                                    // both polarities: an odd ring through the hole, the hub jams
        const tj = Math.max(startOf(opp) + TURN * 0.15, t0 + 90);
        hub = Object.assign(hub, { from: hub.ang, to: hub.ang - spin * 0.6 * tooth(HOLE), t0, t1: tj, jam: true, jamT: tj });
        [first, opp].forEach(u => { const [x, y] = contact(HOLE, u); for (let i = 0; i < 3; i++) glints.push({ x, y, t0: hub.jamT + i * 70, red: true }); });
        clunk((hub.jamT - now()) / 1000);
        end = Math.max(end, hub.jamT + 700);
      }
    }
    for (let i = 0; i < RIM.length; i++) if (K.set.has(RIM[i])) rimBounce[i] = startOf(RIM[i]) + TURN / 2;
    busyUntil = end;
    if (g.won()) win = { t0: end + 120, free: g.free(), done: false };
    dirty(end - now() + 200);
  }
  function snapTo(col, slow) {                    // undo / reset / a change from outside: the changed gears turn back, no wave
    const t0 = now(), dur = slow ? 300 : 220; anims.forEach(a => settle(a.u));
    const ch = []; for (let u = 0; u < n; u++) if (u !== HOLE && col[u] !== shown[u]) ch.push(u);
    const k = teethFor(ch);                       // one undone chain {a, b}: its a->b and b->a gears turn opposite ways, as a train
    for (const u of ch) anims.push({ u, t0, t1: t0 + dur, ang: (col[u] > shown[u] ? 1 : -1) * k * tooth(u), from: shown[u], to: col[u], flip: t0 + dur / 2 });
    hub = Object.assign(hub, { from: hub.ang, to: hub.ang, t0, t1: t0, jam: false, jamT: 0 });
    busyUntil = t0 + 300; dirty(400);
  }
  g.on((_, info) => {
    const old = prev; prev = g.col.slice();
    if (info.type === 'swap' && info.chain) { cascade(info.chain, old, origin); DIE.later(Math.max(0, busyUntil - now() - 120)); }
    else { win = null; hub.col = -1; hub.drop = 0; snapTo(g.col, info.type === 'reset'); DIE.show(true); DIE.later(0); }
    origin = -1; sel = null; lit = null; lastTouch = now();
  });

  // ---------------------------------------------------------------- the die counter (../degree.js; GEARS-DESIGN "The die")
  // A regular tetrahedron in the hub. Vertex k is element k; face F_k (opposite vertex k) wears element k's colour: a corner
  // of the map that misses element k lands on F_k. The die sits on the face the rim wraps (m) and is turned N x 120 degrees
  // about the vertical, so a swap that changes N clicks it round (one notch per unit, in the direction of the change) and a
  // swap that changes m tumbles it onto another face. Static at rest; an SVG with an accessible label (no canvas text).
