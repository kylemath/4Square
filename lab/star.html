<!doctype html>
<!--
  STAR: the play page of the Star skin (skins/star.js). Design note: lab/STAR-DESIGN.md. Model: star-rules.js (FTH_STAR).

  No map is drawn. The game is the level's state tree in star coordinates:
    the big star            = the current colouring, read through rim.js's frame: the 5 rim elements are its points (gems,
                              rim order clockwise from the top), the trouble spot (one element on two rim tiles one apart)
                              is the star edge t..t+2 in gold with its two gems ringed; Kempe's two rim chains are the star
                              edges x1..x3 and x1..x4 (t+1..t+3, t+1..t+4), each a chain of its two elements' colours with
                              a padlock on it: shut when the chain loops back onto the rim (blocked), open and glowing when
                              that swap would fill. At a double lock a dashed arc marks π's hop (t -> t+3). The hole in the
                              middle shows Fisk's degree N x eps (degree.js, label-free).
    the branches            = every Kempe move (non-web chain), merged by the star it leads to (star-rules.js), each to a
                              smaller child star drawn the same way: one step of lookahead, in star terms only. The tag on
                              a branch: the pair (two gems), the chain size, quiet (touches no rim tile) or loud; the child's
                              gems that the swap repaints are ringed; the forced move at a double lock wears a π badge.
                              A child that fills is a broken-open star; a child already on the path wears a loop ring ↻.
    tap a child             = exactly one g.swap(K) (K = that move's chain in g.chains); the child grows into the centre,
                              the old star flies into the trail.
    the trail (top)         = the path so far as mini stars; π steps joined in gold; a star met again wears its loop
                              colour and count (a cycle). Tap a trail star to backtrack to it (g.undo() back to there).
    bar (bottom)            = undo, start over, swaps / par (par = dF of the start, levels.js), π-run, and the flask: the
                              heuristic lab (a rule built from star features, run on every level; star-rules.js).
    win                     = the star breaks open, the free element drops into the hole, ~3.4 s, then LAB.done().
  Watching a rule (the lab) runs in a sandbox on any level and never touches g, so the app never sees it.
  Keys: 1-9 take a branch, Backspace / U undo, R start over, L the lab. ?tut=0 skips the first-time tutorial.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>

  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(ellipse at 30% 18%, #3b2a86 0%, #1d1452 42%, #0a0626 100%); color: #fff6d6; font-family: var(--font); }

  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  #sky svg { width: 100%; height: 100%; display: block; }
  @media (prefers-reduced-motion: no-preference) { #sky .tw { animation: tw 3.2s ease-in-out infinite; } }
  @keyframes tw { 50% { opacity: .15; } }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; transition: right .3s; }
  /* the trail: the path so far */
  #trail { flex: none; height: 62px; display: flex; align-items: center; gap: 0; padding: 6px 12px 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-behavior: smooth; }
  #trail::-webkit-scrollbar { display: none; }

  #trail .tb svg { width: 44px; height: 44px; display: block; overflow: visible; }
  #trail .tb.cur svg { filter: drop-shadow(0 0 6px rgba(255,216,74,.8)); }
  #trail .tb .vn { position: absolute; right: -2px; top: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; font-size: 11px; line-height: 14px; color: #fff; border: 2px solid var(--ink); }
  #trail .tj { flex: none; width: 14px; height: 4px; border-radius: 2px; background: rgba(255,246,214,.35); position: relative; }
  #trail .tj.pi { background: var(--gold); height: 6px; }

  @media (prefers-reduced-motion: no-preference) {

  }
  @keyframes bob { 50% { transform: translateY(-4px) scale(1.04); } }

  /* bar */
  #bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px max(12px, env(safe-area-inset-bottom)); }
  .ctl { width: 50px; height: 50px; flex: none; border-radius: 50%; border: 3px solid var(--ctl-edge); background: var(--ctl); color: var(--ctl-ink); box-shadow: 0 4px 0 var(--ctl-edge);
    display: grid; place-items: center; padding: 0; position: relative; }
  .ctl svg { width: 26px; height: 26px; display: block; }
  .ctl:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ctl-edge); }
  .ctl[disabled] { opacity: .45; }
  .ctl.go { background: linear-gradient(#ffe979, #ffbf1f); color: var(--ink); width: 58px; height: 58px; }
  #chips { flex: 1; display: flex; gap: 8px; justify-content: center; align-items: center; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 11px; border-radius: 17px; background: rgba(11,7,34,.6); border: 2px solid rgba(255,246,214,.25); font-size: 17px; white-space: nowrap; }
  .chip svg { width: 18px; height: 18px; }
  .chip.pi { color: var(--ink); background: var(--gold); border-color: var(--ink); }
  .chip.loop { color: #fff; background: var(--loop); border-color: var(--ink); }
  .chip.over { color: #ffb0a0; }
  .chip.hide { display: none; }
  @media (prefers-reduced-motion: no-preference) { .chip.bump { animation: cb .45s cubic-bezier(.3,1.7,.5,1); } }

  /* the watch banner (a rule playing itself in the sandbox) */

    border: 2px solid var(--gold); color: var(--gold); font-size: 15px; z-index: 3; max-width: calc(100% - 24px); white-space: nowrap; }

  /* the heuristic lab */

  #lab[hidden] { display: none; }
  @media (min-width: 900px) { #lab { left: auto; width: 440px; border-left: 4px solid var(--ink); box-shadow: -8px 0 30px rgba(0,0,0,.4); } body.labon #app { right: 440px; } }
  .lb-head { flex: none; display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 12px; border-bottom: 2px solid rgba(255,246,214,.15); font-size: 22px; }
  .lb-head svg { width: 30px; height: 30px; }

  .lb-body { flex: 1; overflow-y: auto; padding: 10px 12px 30px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }

  .cd .bd { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

  .cd select[data-r=pick] { max-width: 170px; }

  .cd select, .cd input { height: 30px; border-radius: 8px; border: 2px solid rgba(255,246,214,.25); background: #1b1350; color: #fff; font: 600 13px system-ui, sans-serif; padding: 0 4px; }
  .cd input { width: 46px; }

  .seg { display: inline-flex; border-radius: 18px; border: 2px solid rgba(255,246,214,.3); overflow: hidden; }

  table.board td { text-align: right; padding: 5px 4px; border-top: 1px solid rgba(255,246,214,.1); vertical-align: top; }
  table.board td small { display: block; color: rgba(255,246,214,.55); font-size: 11px; word-break: break-word; }
  table.board tr.me td { background: rgba(255,216,74,.12); }

  #tut { position: fixed; inset: 0; z-index: 20; background: rgba(8,5,26,.62); }
  #tut[hidden] { display: none; }
  #tut .say { position: absolute; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 20px; background: #fff6d6; color: var(--ink); border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
    font-size: 24px; white-space: nowrap; }
  #tut .ring { position: absolute; border-radius: 50%; border: 4px dashed var(--gold); box-shadow: 0 0 0 9999px rgba(8,5,26,.0); pointer-events: none; }
  #tut .fing { position: absolute; width: 56px; height: 70px; pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) { #tut .ring { animation: spn 12s linear infinite; } #tut .fing { animation: tap 1.4s ease-in-out infinite; } }
  @keyframes tap { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-6px, -10px); } }
  #tut .dots { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px; }
  #tut .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,246,214,.35); border: 2px solid var(--ink); }
  #tut .dots i.on { background: var(--gold); }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fly { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; }
  .embed #bNext, .embed #bPrev { display: none; }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="app">
  <div id="trail" aria-label="Path"></div>
  <div id="stage">
    <svg id="sv" role="group" aria-label="Star tree"><defs id="defs"></defs><g id="gB"></g><g id="gK"></g><g id="gM"></g><g id="gFx"></g></svg>
    <div id="watch" hidden><span aria-hidden="true">▶</span><b id="wName"></b><button id="wPlay" aria-label="Pause">❚❚</button><button id="wX" aria-label="Back to my game">✕</button></div>
  </div>
  <div id="bar">
    <button class="ctl" id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7H4V2M4 7a9 9 0 1 1 1.6 8.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ctl" id="bReset" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M5 4v16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M19.5 5.2v13.6L9 12z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <div id="chips">
      <span class="chip" id="cSteps" role="status"></span>
      <span class="chip pi hide" id="cRun"></span>
      <span class="chip loop hide" id="cLoop"></span>
    </div>
    <button class="ctl go" id="bNext" aria-label="Next level" hidden><svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button class="ctl" id="bLab" aria-label="Rules"><svg viewBox="0 0 24 24"><path d="M9 2.5h6M10 2.5v6.2L4.6 18.4A2 2 0 0 0 6.4 21.5h11.2a2 2 0 0 0 1.8-3.1L14 8.7V2.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M7.2 15h9.6l2 3.6a1 1 0 0 1-.9 1.4H6.1a1 1 0 0 1-.9-1.4z" fill="currentColor"/></svg></button>

</div>

    <button class="ctl" id="lbX" aria-label="Close" style="width:42px;height:42px">✕</button></div>
  <div class="lb-body">

<script>
(function () {
  'use strict';
  const clampN = x => Math.max(.05, Math.min(4, x));
  const g = LAB.game(), ST = window.FTH_STAR, RIM = window.FTH_RIM, GAME = window.GAME;
  const QS = new URLSearchParams(location.search), HUD = QS.get('hud') || '', EMB = LAB.embedded, DEMO = LAB.demo, WSP = clampN(+QS.get('wsp') || 1);
  const ELEM = LAB.ELEM, COL = ELEM.map(e => e.hex), DK = ELEM.map(e => e.dark), NEON = ELEM.map(e => e.neon);
  const INK = '#140d33', GOLD = '#ffd84a', LOOPC = ['#ff5fc8', '#5fe3ff', '#b78cff', '#ff9a52', '#7dff8a'];
  const RM = matchMedia('(prefers-reduced-motion: reduce)'), reduce = () => RM.matches;
  const $ = id => document.getElementById(id), f1 = v => Math.round(v * 10) / 10, P = (x, y) => f1(x) + ' ' + f1(y);
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const sv = $('sv'), gB = $('gB'), gK = $('gK'), gM = $('gM'), gFx = $('gFx');
  const hashHue = s => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return LOOPC[h % LOOPC.length]; };

  // ---------------------------------------------------------------- sound (tiny synth; silent until a gesture)
  let AC = null;
  const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume().catch(() => 0); return AC; };
  function tone(f, d, type, vol, f2, delay) {
    const a = AC; if (!a || a.state !== 'running') return;
    const t = a.currentTime + (delay || 0), o = a.createOscillator(), v = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vol || .08, t + .01); v.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + .05);
  }
  addEventListener('pointerdown', ac, { capture: true, passive: true });
  const pop = (k, d) => tone(520 * Math.pow(1.122, k), .09, 'triangle', .07, 0, d);

  // ---------------------------------------------------------------- art: gems, padlocks, stars
  const ICON = LAB.ICON, FILLED = [true, true, false, false];
  function gem(e, x, y, r, cls) {
    if (e < 0) return '';
    const sw = f1(Math.max(1.2, r * .16)), s = f1(r * .058 * 100) / 100;
    return '<g transform="translate(' + P(x, y) + ')"><g class="gi' + (cls ? ' ' + cls : '') + '">' +
      '<circle cy="' + f1(r * .16) + '" r="' + f1(r) + '" fill="' + INK + '" opacity=".55"/>' +
      '<circle r="' + f1(r) + '" fill="' + DK[e] + '"/><circle cy="' + f1(-r * .07) + '" r="' + f1(r * .86) + '" fill="' + COL[e] + '"/>' +

        '<span class="mv"><button class="sm" data-a="up" aria-label="Move up">▲</button><button class="sm" data-a="dn" aria-label="Move down">▼</button><button class="sm" data-a="del" aria-label="Delete card">✕</button></span></li>';
    }).join('');
    lsSet(RKEY, rule);
  }
  $('lbCards').addEventListener('change', e => {
    const li = e.target.closest('.cd'), i = +li.dataset.i, c = rule.cards[i], r = e.target.dataset.r, ts = e.target.closest('.tst');
    if (ts) { const w = c.when[+ts.dataset.j]; if (r === 'v') w.v = Math.round(+e.target.value || 0); else w[r] = e.target.value; }
    else if (r === 'pick') { c.pick = e.target.value; delete c.arg; if (c.pick === 'hop') c.arg = 3; if (c.pick === 'pair') c.arg = 'αγ'; }
    else if (r === 'arg') c.arg = c.pick === 'hop' ? +e.target.value : e.target.value;
    rule.id = ''; cardsRender();
  });
  $('lbCards').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const li = b.closest('.cd'), i = +li.dataset.i, C = rule.cards, a = b.dataset.a;
    if (a === 'test') C[i].when.push({ f: 'lock', op: '=', v: 2 });

  $('lbName').oninput = e => { rule.name = e.target.value.slice(0, 32); lsSet(RKEY, rule); };
  $('lbAdd').onclick = () => { rule.cards.push({ pick: 'new', when: [] }); rule.id = ''; cardsRender(); };
  $('lbPre').innerHTML = ST.BUILTIN.map(r => '<button class="pre" data-id="' + r.id + '">' + r.name + '</button>').join('');
  $('lbPre').onclick = e => { const b = e.target.closest('.pre'); if (!b) return; const r = ST.BUILTIN.find(x => x.id === b.dataset.id); rule = clone(r); cardsRender(); };
  $('lbScope').onclick = e => { const b = e.target.closest('button'); if (!b) return; scope = b.dataset.sc; $('lbScope').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  const pct = x => Math.round(x * 1000) / 10 + '%';
  const sig = r => JSON.stringify(r.cards);
  function ensureGraphs() {                     // every level's state tree, built a level at a time (a few seconds once)
    if (LGs) return Promise.resolve(LGs);
    if (building) return building;
    const out = [], cache = new Map(), Ls = GAME.levels;
    building = new Promise(res => {
      let i = 0;
      const step = () => { const t = performance.now(); while (i < Ls.length && performance.now() - t < 40) { out.push(ST.graph(GAME, Ls[i], cache)); i++; } bar(i / Ls.length * .6); if (i < Ls.length) setTimeout(step, 0); else { LGs = out; res(out); } };
      setTimeout(step, 30);
    });
    return building;
  }
  const bar = x => { $('lbBar').firstChild.style.width = Math.round(x * 100) + '%'; };
  function scoreAsync(r, sc) {                   // the evaluator, level by level so the page stays live
    return ensureGraphs().then(Ls => new Promise(res => {
      const parts = [], seen = new Set(); let i = 0;
      const step = () => {
        const t = performance.now();
        while (i < Ls.length && performance.now() - t < 30) { const LG = Ls[i++]; if (sc === 'class' && seen.has(LG.key)) continue; seen.add(LG.key); parts.push(ST.score(r, [LG], sc)); }
        bar(.6 + .4 * i / Ls.length);
        if (i < Ls.length) return setTimeout(step, 0);
        const out = { scope: sc, n: 0, solved: 0, steps: 0, par: 0, loops: 0, stuck: 0, fails: [], per: [], ms: 0 };
        parts.forEach(p => { ['n', 'solved', 'steps', 'par', 'loops', 'stuck', 'ms'].forEach(k => { out[k] += p[k]; }); out.fails.push(...p.fails); out.per.push(...p.per); });
        out.rate = out.n ? out.solved / out.n : 0; out.excess = out.solved ? (out.steps - out.par) / out.solved : 0;
        res(out);
      };
      step();
    }));
  }
  function test(r, sc, quiet) {
    r = clone(r);
    return scoreAsync(r, sc).then(res => {
      const row = board.find(b => sig(b.rule) === sig(r)) || (board.push({ rule: r, sc: {} }), board[board.length - 1]);
      row.rule.name = r.name || row.rule.name; row.sc[sc] = { n: res.n, solved: res.solved, rate: res.rate, excess: +res.excess.toFixed(3), loops: res.loops, stuck: res.stuck, fails: res.fails.map(f => f.num) };
      lsSet(BKEY, board);
      const ev = { v: 1, skin: 'star', rule: { name: r.name || '', cards: r.cards }, builtin: r.id || '', scope: sc, n: res.n, solved: res.solved, rate: +res.rate.toFixed(4), excess: +res.excess.toFixed(3),
        loops: res.loops, stuck: res.stuck, fails: res.fails.map(f => f.num + ':' + f.why), lvl: drv ? drv.L.id : '', ms: res.ms };
      ev.sink = logEv('heuristic_test', ev); window.__starLog.push(ev);
      if (!quiet) { lastRes = { rule: r, res }; resRender(); }
      boardRender();
      return res;
    });
  }
  function resRender() {
    if (!lastRes) { $('lbRes').innerHTML = ''; return; }
    const R = lastRes.res, cls = R.scope === 'class';
    $('lbRes').innerHTML = '<div class="res"><div><b>' + pct(R.rate) + '</b>' + R.solved + '/' + R.n + (cls ? ' hard' : ' levels') + '</div><div><b>+' + R.excess.toFixed(2) + '</b>swaps over par</div><div><b>' + R.loops + '</b>↻ loops met</div><div><b>' + R.stuck + '</b>stuck</div></div>' +
      '<div class="fails">' + (R.fails.length ? R.fails.map(f => '<button data-l="' + f.lvl + '" class="' + (/cap/.test(f.why) ? 'cap' : '') + '" aria-label="Watch level ' + f.num + ' fail">' + f.num + (cls ? ' · ' + f.why : f.why === 'loop' ? ' ↻' : ' ⌛') + '</button>').join('') : '<span class="ok">✓ every one filled</span>') + '</div>';
  }
  function boardRender() {
    const rows = board.slice().sort((a, b) => ((b.sc.start || {}).rate || 0) - ((a.sc.start || {}).rate || 0) || ((a.sc.start || {}).excess || 0) - ((b.sc.start || {}).excess || 0));
    $('lbBoard').innerHTML = '<tr><th>#</th><th>rule</th><th>starts</th><th>+swaps</th><th>hard</th></tr>' + rows.map((b, i) => {
      const s = b.sc.start, c = b.sc.class;
      return '<tr data-s="' + encodeURIComponent(sig(b.rule)) + '" class="' + (sig(b.rule) === sig(rule) ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + (b.rule.name || '·') + '<small>' + b.rule.cards.map(ST.label).join(' · ') + '</small></td><td>' + (s ? pct(s.rate) : '–') + '</td><td>' + (s ? '+' + s.excess.toFixed(2) : '–') + '</td><td>' + (c ? pct(c.rate) : '–') + '</td></tr>';
    }).join('');
  }
  $('lbBoard').onclick = e => { const tr = e.target.closest('tr[data-s]'); if (!tr) return; const b = board.find(x => sig(x.rule) === decodeURIComponent(tr.dataset.s)); if (b) { rule = clone(b.rule); cardsRender(); boardRender(); } };
  $('lbGo').onclick = () => { if (!rule.cards.length) return; $('lbGo').disabled = true; test(rule, scope).then(() => { $('lbGo').disabled = false; tone(880, .15, 'triangle', .06); }); };
  $('lbRes').onclick = e => { const b = e.target.closest('button[data-l]'); if (b) watchStart(lastRes.rule, b.dataset.l); };
  $('lbHere').onclick = () => watchStart(rule, drv.L.id);
  const copy = (txt) => { const done = () => { $('lbCopied').textContent = '✓'; setTimeout(() => { $('lbCopied').textContent = ''; }, 1500); };
    try { navigator.clipboard.writeText(txt).then(done, () => fallback()); } catch (e) { fallback(); }
    function fallback() { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) { /* no clipboard */ } t.remove(); done(); }
    window.__starCopied = txt; };
  const exp = b => ({ kind: 'fth-star-rule', v: 1, rule: { name: b.rule.name || '', cards: b.rule.cards }, scores: b.sc, language: 'lab/STAR-DESIGN.md' });
  $('lbCopy').onclick = () => { const b = board.find(x => sig(x.rule) === sig(rule)) || { rule, sc: {} }; copy(JSON.stringify(exp(b), null, 1)); };
  $('lbCopyAll').onclick = () => copy(JSON.stringify(board.map(exp), null, 1));
  function openLab() {
    if (EMB && drv.kind === 'real' && g.won()) return;
    $('lab').hidden = false; document.body.classList.add('labon'); cardsRender(); boardRender(); resRender(); if (cur) setTimeout(() => render({ how: 'resize' }), 320);
    // the baselines: every built-in rule on the 40 starts, once (they fill the board)
    const todo = ST.BUILTIN.filter(r => !board.some(b => sig(b.rule) === sig(r) && b.sc.start));
    todo.reduce((p, r) => p.then(() => test(r, 'start', true)), Promise.resolve()).then(() => bar(1));
  }
  function closeLab() { $('lab').hidden = true; document.body.classList.remove('labon'); if (cur) setTimeout(() => render({ how: 'resize' }), 320); }
  $('bLab').onclick = openLab; $('lbX').onclick = closeLab;
  // watching a rule: a sandbox on that level plays the rule's walk (from the level's start), a step every 0.75 s
  function watchStart(r, lvl) {
    const L = GAME.levels.find(l => l.id === lvl); if (!L) return;
    if (innerWidth < 900) closeLab();
    ensureGraphs().then(Ls => {
      const LG = Ls.find(x => x.L.id === lvl), w = ST.run(r, LG, LG.start);

  }
  function watchStep() {
    const W = watch; if (!W || !W.auto) return;
    clearTimeout(W.t);
    W.t = setTimeout(() => {
      if (watch !== W || !W.auto) return;
      const next = W.w.path[W.j + 1];
      if (next == null) { W.auto = false; $('wPlay').textContent = '▶'; if (!W.w.solved) { wobble(); tone(196, .4, 'sawtooth', .04, 150); } return; }
      const key = W.LG.S[next].key, i = kids.findIndex(k => k.m.key === key);
      if (i < 0) { W.auto = false; return; }
      const el = gK.children[i]; if (el) el.classList.add('press');
      setTimeout(() => { if (watch !== W) return; W.j++; drv.apply(kids[i].m); watchStep(); }, 260 * WSP);
    }, (W.j ? 620 : 900) * WSP);
  }
  function watchEnd() { if (watch) { watch.auto = false; $('wPlay').textContent = '▶'; } }
  $('wPlay').onclick = () => { if (!watch) return; if (watch.auto) { watch.auto = false; $('wPlay').textContent = '▶'; } else { if (watch.j >= watch.w.path.length - 1) { watch.j = 0; drv.reset(); } watch.auto = true; $('wPlay').textContent = '❚❚'; watchStep(); } sv.classList.toggle('inert', !interactive()); };
  $('wX').onclick = () => { if (watch) clearTimeout(watch.t); watch = null; $('watch').hidden = true; $('stage').classList.remove('watching'); enter(REAL); };

  // ---------------------------------------------------------------- the first-time tutorial: three pictures, a few words
  const TKEY = 'fth-star-tut';
  function tutorial() {
    let seen = null; try { seen = localStorage.getItem(TKEY); } catch (e) { seen = '1'; }
    if (seen || DEMO || QS.get('tut') === '0') return;
    const T = $('tut'), finger = '<svg class="fing" viewBox="0 0 56 70"><g transform="rotate(-18 28 35)"><rect x="12" y="34" width="30" height="32" rx="12" fill="#fff" stroke="' + INK + '" stroke-width="4"/><rect x="18" y="6" width="14" height="40" rx="7" fill="#fff" stroke="' + INK + '" stroke-width="4"/></g></svg>';
    let step = 0;
    const show = () => {
      const r = sv.getBoundingClientRect(), L = lay, k0 = L.kids[0];
      const spot = [[L.cx, L.cy, L.R * 1.5, 'Your rim star'], k0 ? [k0.x, k0.y, L.rc * 1.6, 'Tap a branch'] : [L.cx, L.cy, L.R * 1.5, 'Tap a branch'], [L.cx, L.cy, L.R * 1.5, 'Break it open!']][step];
      const x = r.left + spot[0], y = r.top + spot[1], rr = spot[2];
      T.innerHTML = '<div class="ring" style="left:' + (x - rr) + 'px;top:' + (y - rr) + 'px;width:' + 2 * rr + 'px;height:' + 2 * rr + 'px"></div>' +
        (step === 1 ? '<div style="position:absolute;left:' + (x + 4) + 'px;top:' + (y + 4) + 'px">' + finger + '</div>' : '') +
        (step === 2 ? '<svg viewBox="-60 -60 120 120" style="position:absolute;left:' + (x - 60) + 'px;top:' + (y - 60) + 'px;width:120px;height:120px"><defs>' + $('defs').innerHTML.replace(/id="st/g, 'id="tt') + '</defs>' +
          starSVG({ rim: [0, 1, 0, 2, 1], filled: true, ok: true }, 34, { nc: 4 }).replace(/url\(#st/g, 'url(#tt') + '</svg>' : '') +
        '<div class="say" style="top:' + Math.max(12, Math.min(innerHeight - 160, step === 1 ? y - rr - 70 : y + rr + 16)) + 'px">' + spot[3] + '</div>' +
        '<div class="dots">' + [0, 1, 2].map(i => '<i class="' + (i === step ? 'on' : '') + '"></i>').join('') + '</div>';

    T.onclick = () => { step++; tone(700 + step * 120, .08, 'triangle', .05); if (step > 2) { T.hidden = true; try { localStorage.setItem(TKEY, '1'); } catch (e) { /* private */ } } else show(); };

  window.STAR = { g, get lay() { return lay; }, get kids() { return kids.map(k => ({ key: k.m.key, pair: k.m.pair, size: k.m.size, quiet: k.m.quiet, pi: k.m.pi, hits: k.m.hits, fills: k.f.filled, lock: k.f.lock, t: k.f.t, seen: k.seen, deg: k.f.deg })); },

    openLab, closeLab, test: (r, sc) => test(r || rule, sc || 'start'), setRule: r => { rule = clone(r); cardsRender(); }, watchStart, get watch() { return watch && { j: watch.j, auto: watch.auto, solved: watch.w.solved, why: watch.w.why, len: watch.w.path.length }; },
    get drv() { return drv.kind; }, get celebrating() { return !!celebrating; } };
})();
