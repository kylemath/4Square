<!doctype html>
<!--
  BLANK DOODLE (lab front end; a sister of doodle.html "Doodle Map" and lines.html "Line Doodle")

  What the player sees: a taped sheet of paper with a hand-inked map (g.cells of the level from ?lvl=, so it follows
  the lab's level selector), but the sheet starts BLANK: every piece is unpainted, the hole included (here the hole is
  just another piece; the whole map is the puzzle). Four tubes of glossy poster paint at the bottom, each with its own
  hatch on the label (so the paints differ without colour too). No instructions on screen: a paint-drop chip counts the
  pieces still blank, a ghost finger shows the next tap (a tube first, then a piece), and the tubes glow until one is picked.

  What the player does (Line-Doodle style, with Kempe swaps on the PARTIAL colouring):
    - pick a paint b (tap a tube; it stays picked, a dab of paint sits on its nozzle).
    - tap (or tap-drag across) BLANK pieces: they fill with b (a bloom from the finger, a splat of drops, a pop and a
      tone that rises as the sheet fills; a drop flies into the counter). If a neighbour already has b, the piece
      wobbles and the shared border glows red with a spark: a clash. It is allowed; it is the feedback.
    - press a PAINTED piece u (paint a != b): it lifts and glows, and the group of painted pieces connected through
      paints {a, b} that contains u (BFS over painted pieces only; blank pieces are gaps) lights up, pulsing in its two
      paints, with a rising arpeggio. Release on the group: a <-> b throughout it, re-painted in a wave from the finger
      through the group in BFS order (45 ms a step, each piece pops with a sound); LAB.at(x, y) says where the coins
      fly from. Slide off before releasing to cancel. With a mouse, hovering shows the group.
      A swap never creates or removes a clash (the group is maximal), so a clean colouring stays clean.
    - tap a painted piece with its OWN paint: wipe it (drag to wipe more pieces of that paint).
  A blank piece whose neighbours already use all 4 paints gets a "?": it can't be painted as things stand.
  That is the teaching moment: about 1.5 s later a circle goes round a piece whose swap frees a paint for it and
  that tube bobs (found by trying every neighbour u and paint b, swapping the partial group and checking the "?" piece;
  if no single swap does it, the first step of the shortest 2- or 3-swap fix; if none, a neighbour to wipe).
  Otherwise, idle 10 s: the paint that fits the most constrained blank piece bobs and the piece is circled (or a
  clashing piece is circled, with its own paint, for wiping).
  Goal: every piece painted and no clashes -> a 3.6 s celebration (the pieces bounce in two waves, four big paint
  splashes sweep the sheet, a "Coloured!" sticker, drops burst), then LAB.finish(swaps). Standalone, a tap after that
  starts a fresh blank sheet; inside the app nothing restarts (the shell owns what happens next).
  Egg 'clean-sheet': painting the whole map without ever making a clash calls LAB.egg('clean-sheet', 120).
  Margin: undo (own history of colourings: one entry per stroke, swap or wipe) and clear (blank sheet, undoable).

  The partial-colouring logic lives in this page (BD.group / BD.swapped / BD.clashes / BD.rescue / BD.hint).
  core.js is used only for geometry and adjacency (g.n, g.adj, g.cells, g.hole); g.col and g.swap are not used.
  The logic block between LOGIC-START/END is DOM-free and is smoke-tested in node (including a greedy + swap solver).
-->
<html lang="en">

<style>

  #cnt { position: fixed; pointer-events: none; display: flex; align-items: center; gap: .2em; transform: translate(-50%, -50%);
    background: #fff; border: 3px solid #1b1b2f; border-radius: 999px; padding: .08em .55em .08em .3em; box-shadow: 3px 3px 0 #1b1b2f;
    font-weight: 700; line-height: 1; white-space: nowrap; }
  #cnt svg { width: 1.15em; height: 1.15em; display: block; overflow: visible; }
  #cnt b { min-width: 1.1em; text-align: center; }
  #cnt.bump { animation: bump .42s cubic-bezier(.3,1.9,.5,1); }

  @keyframes bump { 35% { transform: translate(-50%, -50%) scale(1.3) rotate(-5deg); } }
  /* the ghost finger */
  #gf { position: fixed; left: 0; top: 0; width: 44px; height: 52px; pointer-events: none; opacity: 0; transition: opacity .3s, left .45s cubic-bezier(.4,1.3,.5,1), top .45s cubic-bezier(.4,1.3,.5,1); z-index: 3; }
  #gf.on { opacity: .95; }
  #gf svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #gf.on .hand { animation: gft 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 25% 8%; }
  #gf.on .rip { animation: gfr 1.5s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes gft { 0%, 100% { transform: translate(9px, 12px); } 40% { transform: translate(0, 0) scale(.92); } 55% { transform: translate(2px, 3px); } }
  @keyframes gfr { 0%, 36% { transform: scale(.2); opacity: 0; } 42% { opacity: .9; } 80%, 100% { transform: scale(1.8); opacity: 0; } }
  #stamp { position: fixed; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.3) rotate(-25deg); transition: opacity .2s, transform .5s cubic-bezier(.3,1.8,.5,1); z-index: 2; }
  #stamp.on { opacity: 1; transform: scale(1) rotate(-8deg); }
  #stamp .st { background: #fff59d; border: 4px solid #1b1b2f; border-radius: 20px; padding: .12em .55em .2em; font-weight: 700;
    box-shadow: 5px 6px 0 #1b1b2f; white-space: nowrap; letter-spacing: .02em; }
  #stamp .st span { -webkit-text-stroke: .09em #1b1b2f; paint-order: stroke fill; display: inline-block; }
  #stamp.on .st span { animation: hopl .6s cubic-bezier(.3,1.8,.5,1) both; }
  @keyframes hopl { 0% { transform: translateY(.5em) scale(.4); } 60% { transform: translateY(-.15em); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .pen, .pen .cap, .pen .dab, #stamp, #gf { transition: none; }
    .pen.shake, .pen.hop, .pen.bob, #pal.pick .pen svg, #cnt.bump, #gf.on .hand, #gf.on .rip, #stamp.on .st span, #tools button.no { animation: none; }
  }

<div id="tools">
  <button id="undo" aria-label="undo"><svg viewBox="0 0 30 30" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">

    <path d="M10 24V9a5 5 0 0 1 10 0V21a4.5 4.5 0 0 1 8 1.5a4.5 4.5 0 0 1 8 2.5a4 4 0 0 1 7 3V38c0 7-5 11-12 11h-5c-5 0-8-2.5-11-6.5l-7-9a4.2 4.2 0 0 1 6.5-5.2Z" transform="translate(3 4)" fill="#1b1b2f" opacity=".3"/>

<script>
// inside the app the shell's HUD (hud=full|compact) already shows the level title and stars; this page keeps only its counter, undo and clear
const HUD = new URLSearchParams(location.search).get('hud'), IN_HUD = HUD === 'full' || HUD === 'compact';
document.documentElement.dataset.hud = IN_HUD ? HUD : '';

<script>
/*LOGIC-START*/
const BD = (() => {
  // map geometry in unit-square coords [0,1]^2 (cell x,y in [-1,1] -> (x+1)/2, (y+1)/2; y grows down the page)
  function prep(g) {
    const U = g.cells.map(c => c.map(p => [(p[0] + 1) / 2, (p[1] + 1) / 2]));
    const key = p => p[0].toFixed(5) + ',' + p[1].toFixed(5), E = new Map();
    U.forEach((c, i) => c.forEach((p, j) => {
      const q = c[(j + 1) % c.length], a = key(p), b = key(q), k = a < b ? a + '|' + b : b + '|' + a;
      if (!E.has(k)) E.set(k, { p, q, own: [] });
      const e = E.get(k); if (!e.own.includes(i)) e.own.push(i);
    }));
    const segs = [], frame = [], pairSegs = new Map();
    for (const e of E.values()) {
      if (e.own.length === 2) {
        const a = Math.min(...e.own), b = Math.max(...e.own), s = { a, b, p: e.p, q: e.q, len: Math.hypot(e.q[0] - e.p[0], e.q[1] - e.p[1]) };
        segs.push(s); const k = a + '_' + b; if (!pairSegs.has(k)) pairSegs.set(k, []); pairSegs.get(k).push(segs.length - 1);
      } else frame.push(e);
    }
    const info = U.map(P => {
      let a = 0, cx = 0, cy = 0, per = 0, x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let k = 0; k < P.length; k++) {
        const p = P[k], q = P[(k + 1) % P.length], c = p[0] * q[1] - q[0] * p[1];
        a += c; cx += (p[0] + q[0]) * c; cy += (p[1] + q[1]) * c; per += Math.hypot(q[0] - p[0], q[1] - p[1]);
        x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
      a /= 2; const P2 = pole(P, [x0, y0, x1, y1]);
      return { area: Math.abs(a), c: P2.c, inr: P2.r, box: [x0, y0, x1, y1] };
    });
    return { U, segs, frame, pairSegs, info };
  }
  // the roomiest interior point (pole of inaccessibility, by grid search + refinement) and its distance to the border
  function segD(x, y, p, q) { const dx = q[0] - p[0], dy = q[1] - p[1], L = dx * dx + dy * dy || 1e-12;
    const t = Math.max(0, Math.min(1, ((x - p[0]) * dx + (y - p[1]) * dy) / L)); return Math.hypot(x - p[0] - t * dx, y - p[1] - t * dy); }
  function edgeD(P, x, y) { let d = Infinity; for (let k = 0; k < P.length; k++) d = Math.min(d, segD(x, y, P[k], P[(k + 1) % P.length])); return d; }
  function pole(P, b) {
    let best = null, bd = -1, h = Math.max(b[2] - b[0], b[3] - b[1]) / 16;
    for (let x = b[0] + h / 2; x < b[2]; x += h) for (let y = b[1] + h / 2; y < b[3]; y += h)
      if (pip(P, x, y)) { const d = edgeD(P, x, y); if (d > bd) { bd = d; best = [x, y]; } }
    if (!best) { best = P[0].slice(); bd = 0; }
    for (let it = 0; it < 40; it++) { h *= 0.8; let moved = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [.7, .7], [-.7, .7], [.7, -.7], [-.7, -.7]]) {
        const x = best[0] + dx * h, y = best[1] + dy * h;
        if (pip(P, x, y)) { const d = edgeD(P, x, y); if (d > bd) { bd = d; best = [x, y]; moved = true; } } }
      if (!moved && h < 1e-4) break; }
    return { c: best, r: bd };
  }
  function pip(P, x, y) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const a = P[i], b = P[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function faceAt(M, x, y) { // a tap a hair outside the square still counts (clamped)
    if (x < -0.04 || x > 1.04 || y < -0.04 || y > 1.04) return -1;
    x = Math.min(1 - 1e-6, Math.max(1e-6, x)); y = Math.min(1 - 1e-6, Math.max(1e-6, y));
    for (let i = 0; i < M.U.length; i++) { const b = M.info[i].box;
      if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3] && pip(M.U[i], x, y)) return i; }
    return -1;
  }
  const sharedSeg = (M, u, v) => { const L = M.pairSegs.get(Math.min(u, v) + '_' + Math.max(u, v)); if (!L) return null;
    let best = L[0]; for (const s of L) if (M.segs[s].len > M.segs[best].len) best = s; return M.segs[best]; };
  // ---- partial colourings: col[v] in 0..3, or -1 for a blank piece ----
  const NP = 4;
  function clashes(adj, col) {
    const out = [];
    for (let u = 0; u < col.length; u++) if (col[u] >= 0) for (const v of adj[u]) if (u < v && col[v] === col[u]) out.push([u, v]);
    return out;
  }
  // the group a press on u with pen b picks out: coloured pieces connected through pens {col[u], b}, blanks are gaps
  function group(adj, col, u, b) {
    const a = col[u]; if (a < 0 || b < 0 || b === a) return null;
    const dep = new Map([[u, 0]]), par = new Map([[u, -1]]), vs = [u]; let front = [u];
    while (front.length) { const nx = [];
      for (const v of front) for (const w of adj[v]) if (!dep.has(w) && (col[w] === a || col[w] === b)) { dep.set(w, dep.get(v) + 1); par.set(w, v); vs.push(w); nx.push(w); }
      front = nx; }
    return { a, b, u, vs, set: new Set(vs), dep, par };
  }
  function swapped(col, G) { const c = col.slice(); for (const v of G.vs) c[v] = c[v] === G.a ? G.b : G.a; return c; }
  function freePens(adj, col, v) { const used = new Set(); for (const w of adj[v]) used.add(col[w]); const f = []; for (let p = 0; p < NP; p++) if (!used.has(p)) f.push(p); return f; }
  const boxed = (adj, col) => { const out = []; for (let v = 0; v < col.length; v++) if (col[v] < 0 && !freePens(adj, col, v).length) out.push(v); return out; };
  function movesOf(col, among) { const out = []; for (const u of among) if (col[u] >= 0) for (let b = 0; b < NP; b++) if (b !== col[u]) out.push({ u, b }); return out; }
  // the first swap of the shortest sequence (up to 3 swaps) that frees a pen for the blank piece v; the last swap is on
  // a neighbour of v. Renaming groups (all coloured {a, b} pieces at once) can't help and are skipped.
  function groupsOf(adj, col, among) {
    const out = [], seen = new Set(), cnt = [0, 0, 0, 0]; col.forEach(c => { if (c >= 0) cnt[c]++; });
    for (const m of movesOf(col, among)) {
      const G = group(adj, col, m.u, m.b), key = Math.min(G.a, G.b) + ':' + [...G.vs].sort((x, y) => x - y).join('.');
      if (seen.has(key) || G.vs.length === cnt[G.a] + cnt[G.b]) continue; seen.add(key); out.push(G);
    }
    return out;
  }
  function rescue(adj, col, v, maxD) {
    const all = col.map((_, i) => i);
    const go = (c, d) => {
      if (d === 1) { for (const G of groupsOf(adj, c, adj[v])) if (freePens(adj, swapped(c, G), v).length) return G; return null; }
      for (const G of groupsOf(adj, c, all)) if (go(swapped(c, G), d - 1)) return G;
      return null;
    };
    for (let d = 1; d <= (maxD || 3); d++) { const G = go(col, d); if (G) return { u: G.u, b: G.b, G, steps: d }; }
    return null;
  }
  // last resort for a boxed piece: rub out a neighbour whose pen nobody else around v uses (then v can take it)
  function kick(adj, col, v) {
    const n = [0, 0, 0, 0]; for (const w of adj[v]) if (col[w] >= 0) n[col[w]]++;
    for (const w of adj[v]) if (col[w] >= 0 && n[col[w]] === 1) return w;
    return -1;
  }
  function hint(adj, col) {
    for (const v of boxed(adj, col)) { const r = rescue(adj, col, v); if (r) return { kind: 'swap', v, u: r.u, b: r.b, steps: r.steps }; }
    for (const v of boxed(adj, col)) { const w = kick(adj, col, v); if (w >= 0) return { kind: 'erase', v, u: w, b: col[w] }; }
    let best = -1, bf = null;
    for (let v = 0; v < col.length; v++) if (col[v] < 0) { const f = freePens(adj, col, v); if (f.length && (!bf || f.length < bf.length)) { best = v; bf = f; } }
    if (best >= 0) return { kind: 'fill', u: best, b: bf[0] };
    const cl = clashes(adj, col); if (cl.length) return { kind: 'erase', u: cl[0][0], b: col[cl[0][0]] };
    return null;
  }
  const done = (adj, col) => col.every(c => c >= 0) && !clashes(adj, col).length;
  // test solver: colour pieces in the given order with a free pen; when a piece is boxed, use the hint search
  // (swaps), and only if that finds nothing, rub out a neighbour and queue it again
  function solve(adj, order, pick) {
    let col = new Array(adj.length).fill(-1), swaps = 0, kicks = 0, guard = 0; const Q = order.slice();
    while (Q.length) {
      if (++guard > 50 * adj.length) return { ok: false, col };
      const v = Q.shift(); if (col[v] >= 0) continue;
      let f = freePens(adj, col, v);
      if (!f.length) { const r = rescue(adj, col, v);
        if (r) { col = swapped(col, r.G); swaps++; Q.unshift(v); continue; }

        if (Math.random() < 0.7) drops.push({ x, y: y + (Math.random() - 0.5) * R, vx: -S.dir * (60 + Math.random() * 120) * dpr, vy: (-120 + Math.random() * 160) * dpr, r: (2.5 + Math.random() * 4) * dpr, c: S.c, t0: now, life: 0.9, gr: 700 });
        return true;
      });

    }

    if (drops.length) {
      drops = drops.filter(d => {
        const t = (now - d.t0) / 1000; if (t > d.life) return false; if (t < 0) return true;

  }
  function spark(x, y, lw, now, seed) {

  }
  let looping = false;
  function busy(now) {

      || BD.clashes(ADJ, col).length > 0 || BD.boxed(ADJ, col).length > 0 || (hintOn && now - hintT0 < 700);

  function bump() { if (RM) return; cntEl.classList.remove('bump'); void cntEl.offsetWidth; cntEl.classList.add('bump'); }
  cntEl.addEventListener('animationend', () => cntEl.classList.remove('bump'));

  // ---------- sound (synthesised, quiet; the AudioContext starts on the first touch) ----------

  function env(q, t, a, peak, d) { q.gain.setValueAtTime(0.0001, t); q.gain.exponentialRampToValueAtTime(peak, t + a); q.gain.exponentialRampToValueAtTime(0.0001, t + d); }

    const A = AC; if (!A) return; const t = A.currentTime + (delay || 0), n = Math.floor(A.sampleRate * dur), b = A.createBuffer(1, n, A.sampleRate), d = b.getChannelData(0);

  const PENT = [0, 2, 4, 7, 9];
  const note = (k, delay, vol) => { const f = 392 * Math.pow(2, (PENT[k % 5] + 12 * Math.floor(k / 5)) / 12); tone('triangle', f, f * 1.01, 0.18, vol || 0.06, delay); tone('sine', f * 2, f * 2, 0.1, (vol || 0.06) * 0.4, delay); };
  const squeak = i => noise(0.09, 'bandpass', 1500 + i * 300, 2400 + i * 300, 0.12, 0, 4);      // a tube squeezed
  const splatS = delay => noise(0.11, 'lowpass', 2400, 300, 0.16, delay);                         // wet paint landing
  const popS = (k, delay) => { const r = Math.pow(2, Math.min(k, 14) / 12); tone('triangle', 240 * r, 820 * r, 0.1, 0.12, delay); };
  const boing = () => { tone('sine', 330, 190, 0.22, 0.09); tone('sine', 495, 280, 0.18, 0.04, 0.03); };

  const fanfare = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f * 1.01, 0.26, 0.12, i * 0.09));

  // ---------- paint tubes ----------
  function hatchIcon(a) {

  const penBtns = PENS.map((P, i) => {
    const b = document.createElement('button'); b.className = 'pen'; b.setAttribute('aria-label', LAB.ELEM[i].name + ' paint');
    b.style.setProperty('--pc', P.c);
    b.innerHTML = `<svg viewBox="0 0 40 130" preserveAspectRatio="xMidYMax meet">
      <g transform="translate(3 3)" fill="${INK}" opacity=".28"><path d="${TUBE}"/><rect x="4" y="110" width="32" height="15" rx="3"/></g>
      <path class="dab" d="M13.5 23Q12 13 20 8Q28 13 26.5 23Z" fill="${P.c}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="15" y="21" width="10" height="13" rx="2" fill="#e3e7f2" stroke="${INK}" stroke-width="2.4"/>
      <path d="${TUBE}" fill="${P.c}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M27.5 42L30 106" stroke="#000" stroke-opacity=".16" stroke-width="3.4" stroke-linecap="round"/>
      <rect x="10" y="58" width="20" height="38" rx="4" fill="#fffaf0" stroke="${INK}" stroke-width="2"/>
      <g stroke="${P.d}" stroke-width="2.4" stroke-linecap="round" opacity=".8">${hatchIcon(P.a)}</g>
      <path d="M12.5 43V53M10.5 100V106" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <rect x="4" y="110" width="32" height="15" rx="3" fill="#e3e7f2" stroke="${INK}" stroke-width="2.4"/>
      <path d="M8 115.5H32M8 119.5H32" stroke="${INK}" stroke-width="1.4" opacity=".45"/>
      <g class="cap"><rect x="11" y="4" width="18" height="22" rx="4" fill="${P.d}" stroke="${INK}" stroke-width="2.4"/>
      <path d="M16 8v14M20 8v14M24 8v14" stroke="#000" stroke-opacity=".22" stroke-width="1.6"/><path d="M14 8v7" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/></g></svg>`;
    b.addEventListener('pointerdown', e => { e.preventDefault(); if (won) return; au(); touch(); pen = i; syncPens(); squeak(i); jolt(b, 'hop'); cue(); });

  });
  function syncPens() { penBtns.forEach((b, k) => b.classList.toggle('sel', k === pen)); palEl.classList.toggle('pick', pen < 0 && !won); }
  function jolt(b, cls) { b.classList.remove('shake', 'hop'); void b.offsetWidth; b.classList.add(cls); }
  penBtns.forEach(b => b.addEventListener('animationend', () => b.classList.remove('shake', 'hop')));
  function uncap() {
    penBtns.forEach(b => b.classList.remove('open'));
    penBtns.forEach((b, k) => setTimeout(() => b.classList.add('open'), RM ? 0 : 250 + k * 110));
  }

  // ---------- the ghost finger: a tube first, then a piece; later it points at the hint ----------
  function cue() {
    let x = -1, y = -1;
    if (!won) {
      if (pen < 0) { const r = penBtns[0].getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height * 0.42; }
      else if (hintOn) { const c = cen(hintOn.u); x = c[0] / dpr; y = c[1] / dpr; }
      else if (blanks() === N) { let best = 0; for (let i = 1; i < N; i++) if (M.info[i].inr > M.info[best].inr) best = i; const c = cen(best); x = c[0] / dpr; y = c[1] / dpr; }
    }
    if (x < 0) { gf.classList.remove('on'); return; }
    gf.style.left = (x - 12) + 'px'; gf.style.top = (y - 3.2) + 'px'; gf.classList.add('on');
  }

  // ---------- hints ----------
  let idleT = 0;
  function clearHint() { if (hintOn) { penBtns[hintOn.b].classList.remove('bob'); hintOn = null; cue(); } }
  function touch() { clearHint(); clearTimeout(idleT); idleT = setTimeout(showHint, 10000); kick(); }
  function showHint() {
    if (won) return; const h = BD.hint(ADJ, col); if (!h) return;
    clearHint(); hintOn = h; hintT0 = performance.now(); penBtns[h.b].classList.add('bob'); cue(); kick();
  }
  function teach() { // a blank piece just got boxed in: show the swap that frees it, soon
    clearTimeout(idleT); idleT = setTimeout(showHint, BD.boxed(ADJ, col).length ? 1500 : 10000);
  }

  // ---------- sheets ----------
  function fresh() {
    won = false; col = new Array(N).fill(-1); hist = []; stamp.classList.remove('on'); anim = []; wob = []; pops = []; drops = []; flies = []; sweeps = []; qHop = []; nSwaps = 0;
    press = null; hoverG = null; lastClash = 0; everClash = false;
    prepInk((Math.random() * 2 ** 31) | 0); drawStart = performance.now(); uncap(); syncPens(); count(false); touch(); cue(); kick();
  }
  function save() { hist.push(col.slice()); if (hist.length > 300) hist.shift(); }
  function splash(x, y, c, n, sp) {   // drops flung from a paint point

      drops.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120 * dpr, r: (2 + Math.random() * 3.5) * dpr, c, t0: now, life: 0.45 + Math.random() * 0.3, gr: 900 }); }
  }

  let mode = null, dirty = false, last = -1;
  const pieceAt = e => BD.faceAt(M, (e.clientX - RX) / RS, (e.clientY - RY) / RS);
  function fillAt(f, e) {

    save(); const G = P.G, now = performance.now();

  cv.addEventListener('pointerdown', e => {

    const u = pieceAt(e); if (u < 0) return;

    const now = performance.now();

  $('undo').addEventListener('pointerdown', e => {
    e.preventDefault(); au();
    if (won) { if (LAB.embedded) return; won = false; stamp.classList.remove('on'); drops = []; sweeps = []; syncPens(); }
    touch();
    if (!hist.length) { nope($('undo')); return; }
    const before = col; col = hist.pop(); const now = performance.now(); let k = 0;
    for (let i = 0; i < N; i++) if (before[i] !== col[i]) { const [x, y] = cen(i);
      anim[i] = RM ? null : col[i] < 0 ? { t0: now + 30 * k++, x, y, R: reach(i, x, y), from: before[i], rub: true } : { t0: now + 30 * k++, x, y, R: reach(i, x, y), from: before[i] }; }
    lastClash = BD.clashes(ADJ, col).length; squeak(pen < 0 ? 0 : pen); count(true); teach(); cue(); kick();
  });
  $('again').addEventListener('pointerdown', e => {
    e.preventDefault(); au();
    if (won) { if (!LAB.embedded) fresh(); return; }
    touch();
    if (col.some(c => c >= 0)) { save(); const now = performance.now();
      col.forEach((c, i) => { if (c >= 0) { const [x, y] = cen(i); anim[i] = RM ? null : { t0: now + 15 * i, x, y, R: reach(i, x, y), from: c, rub: true }; } });

  });

  document.addEventListener('contextmenu', e => e.preventDefault());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); kick(); });

  window.PLAYLAB = { cen: i => cen(i).map(v => v / dpr), pen: i => { pen = i; syncPens(); }, get won() { return won; } };   // test hook (tools/embed_win_check.js)
  layout(); fresh();
})();
