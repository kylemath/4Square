<!doctype html>
<!--
  BLANK DOODLE (lab front end; a sister of doodle.html "Doodle Map" and lines.html "Line Doodle")

  What the player sees: the same taped sketchbook page and the same hand-drawn map (g.cells of the level from ?lvl=,
  so it follows the lab's level selector), but the sheet starts BLANK: every piece is uncoloured, the hole included
  (here the hole is just another piece; the whole map is the puzzle). Four uncapped markers, each with its own hatch.
  A pencilled cue says "colour every piece".

  What the player does (Line-Doodle style, with Kempe swaps on the PARTIAL colouring):
    - pick a pen b (tap a marker; it stays picked).
    - tap (or tap-drag across) UNCOLOURED pieces: they fill with b (bloom from the finger). If a neighbour already has
      b, the shared border glows red with a spark: a clash. It is allowed; it is the feedback.
    - press a COLOURED piece u (pen a != b): the group of COLOURED pieces connected through pens {a, b} that contains
      u (BFS over coloured pieces only; blank pieces are gaps) lights up with a dashed outline and a wash of the pen
      each piece would get. Release on the group: a <-> b throughout it, with the re-bloom wave from the finger
      through the group in BFS order. Slide off before releasing to cancel. With a mouse, hovering shows the group.
      A swap never creates or removes a clash (the group is maximal), so a clean colouring stays clean.
    - tap a coloured piece with its OWN pen: rub it out (drag to rub out more pieces of that pen).
  A blank piece whose neighbours already use all 4 pens gets a pencilled "?": it can't be coloured as things stand.
  That is the teaching moment: about 1.5 s later a pencil circle goes round a piece whose swap frees a pen for it and
  that pen bobs (found by trying every neighbour u and pen b, swapping the partial group and checking the "?" piece;
  if no single swap does it, the first step of the shortest 2- or 3-swap fix; if none, a neighbour to rub out).
  Otherwise, idle 10 s: the pen that fits the most constrained blank piece bobs and the piece is circled (or a
  clashing piece is circled, with its own pen, for rubbing out).
  Goal: every piece coloured and no clashes -> "Coloured!" sticker + confetti; tap for a fresh blank sheet.
  Margin: undo (own history of colourings: one entry per stroke, swap or rub-out) and restart (blank sheet, undoable).

  The partial-colouring logic lives in this page (BD.group / BD.swapped / BD.clashes / BD.rescue / BD.hint).
  core.js is used only for geometry and adjacency (g.n, g.adj, g.cells, g.hole); g.col and g.swap are not used.
  The logic block between LOGIC-START/END is DOM-free and is smoke-tested in node (including a greedy + swap solver).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Blank Doodle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; background: #e6d2ad;
    background-image: radial-gradient(rgba(140,100,50,.13) 1.2px, transparent 1.6px); background-size: 15px 15px;
    font-family: Fredoka, 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #2b2d42; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #pal { position: fixed; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  .pen { pointer-events: auto; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; position: relative;
    transition: transform .2s cubic-bezier(.3,1.7,.5,1), opacity .3s, filter .3s; transform-origin: 50% 100%; }
  .pen svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pen .cap { transition: transform .45s cubic-bezier(.3,1.6,.5,1), opacity .45s; transform-box: fill-box; transform-origin: 50% 100%; }
  .pen.open .cap { transform: translate(14px,-46px) rotate(38deg); opacity: 0; }
  .pen.sel { transform: translateY(-16%) rotate(-6deg); }
  .pen.shake { animation: shake .4s; }
  .pen.hop { animation: hop .45s cubic-bezier(.3,1.8,.5,1); }
  .pen.bob { animation: bob 1.1s ease-in-out infinite; }
  @keyframes shake { 20% { transform: translateY(-10%) rotate(-12deg); } 45% { transform: translateY(-4%) rotate(10deg); } 70% { transform: rotate(-5deg); } }
  @keyframes hop { 40% { transform: translateY(-14%); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12%) rotate(4deg); } }
  #tools { position: fixed; left: 6px; top: 4px; display: flex; gap: 4px; }
  #tools button { width: 36px; height: 34px; padding: 3px; border: 0; background: none; cursor: pointer; opacity: .75; }
  #tools button:active { transform: scale(.9); }
  #tools svg { width: 100%; height: 100%; display: block; }
  #stamp { position: fixed; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.3) rotate(-25deg); transition: opacity .2s, transform .45s cubic-bezier(.3,1.8,.5,1); }
  #stamp.on { opacity: 1; transform: scale(1) rotate(-8deg); }
  #stamp .st { background: #fffdf5; border: 3px solid #2b2d42; border-radius: 18px; padding: .2em .6em; font-weight: 700;
    box-shadow: 4px 5px 0 rgba(43,45,66,.85); white-space: nowrap; }
  #stamp .nx { margin-top: .5em; font-size: .45em; font-weight: 500; background: #fff59d; padding: .25em .7em;
    transform: rotate(5deg); box-shadow: 2px 3px 0 rgba(0,0,0,.15); }
  @media (prefers-reduced-motion: reduce) { .pen, .pen .cap, #stamp { transition: none; } .pen.shake, .pen.hop, .pen.bob { animation: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tools">
  <button id="undo" aria-label="undo"><svg viewBox="0 0 30 30" fill="none" stroke="#2b2d42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

<script src="core.js"></script>
<script>
/*LOGIC-START*/
const BD = (() => {
  // map geometry in unit-square coords [0,1]^2 (cell x,y in [-1,1] -> (x+1)/2, (y+1)/2; y grows down the page)
  function prep(g) {
    const U = g.cells.map(c => c.map(p => [(p[0] + 1) / 2, (p[1] + 1) / 2]));
    const key = p => p[0].toFixed(5) + ',' + p[1].toFixed(5), E = new Map();
    U.forEach((c, i) => c.forEach((p, j) => {
      const q = c[(j + 1) % c.length], a = key(p), b = key(q), k = a < b ? a + '|' + b : b + '|' + a;
      if (!E.has(k)) E.set(k, { p, q, own: [] });
      const e = E.get(k); if (!e.own.includes(i)) e.own.push(i);
    }));
    const segs = [], frame = [], pairSegs = new Map();
    for (const e of E.values()) {
      if (e.own.length === 2) {
        const a = Math.min(...e.own), b = Math.max(...e.own), s = { a, b, p: e.p, q: e.q, len: Math.hypot(e.q[0] - e.p[0], e.q[1] - e.p[1]) };
        segs.push(s); const k = a + '_' + b; if (!pairSegs.has(k)) pairSegs.set(k, []); pairSegs.get(k).push(segs.length - 1);
      } else frame.push(e);
    }
    const info = U.map(P => {
      let a = 0, cx = 0, cy = 0, per = 0, x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let k = 0; k < P.length; k++) {
        const p = P[k], q = P[(k + 1) % P.length], c = p[0] * q[1] - q[0] * p[1];
        a += c; cx += (p[0] + q[0]) * c; cy += (p[1] + q[1]) * c; per += Math.hypot(q[0] - p[0], q[1] - p[1]);
        x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
      a /= 2; const P2 = pole(P, [x0, y0, x1, y1]);
      return { area: Math.abs(a), c: P2.c, inr: P2.r, box: [x0, y0, x1, y1] };
    });
    return { U, segs, frame, pairSegs, info };
  }
  // the roomiest interior point (pole of inaccessibility, by grid search + refinement) and its distance to the border
  function segD(x, y, p, q) { const dx = q[0] - p[0], dy = q[1] - p[1], L = dx * dx + dy * dy || 1e-12;
    const t = Math.max(0, Math.min(1, ((x - p[0]) * dx + (y - p[1]) * dy) / L)); return Math.hypot(x - p[0] - t * dx, y - p[1] - t * dy); }
  function edgeD(P, x, y) { let d = Infinity; for (let k = 0; k < P.length; k++) d = Math.min(d, segD(x, y, P[k], P[(k + 1) % P.length])); return d; }
  function pole(P, b) {
    let best = null, bd = -1, h = Math.max(b[2] - b[0], b[3] - b[1]) / 16;
    for (let x = b[0] + h / 2; x < b[2]; x += h) for (let y = b[1] + h / 2; y < b[3]; y += h)
      if (pip(P, x, y)) { const d = edgeD(P, x, y); if (d > bd) { bd = d; best = [x, y]; } }
    if (!best) { best = P[0].slice(); bd = 0; }
    for (let it = 0; it < 40; it++) { h *= 0.8; let moved = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1], [.7, .7], [-.7, .7], [.7, -.7], [-.7, -.7]]) {
        const x = best[0] + dx * h, y = best[1] + dy * h;
        if (pip(P, x, y)) { const d = edgeD(P, x, y); if (d > bd) { bd = d; best = [x, y]; moved = true; } } }
      if (!moved && h < 1e-4) break; }
    return { c: best, r: bd };
  }
  function pip(P, x, y) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const a = P[i], b = P[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function faceAt(M, x, y) { // a tap a hair outside the square still counts (clamped)
    if (x < -0.04 || x > 1.04 || y < -0.04 || y > 1.04) return -1;
    x = Math.min(1 - 1e-6, Math.max(1e-6, x)); y = Math.min(1 - 1e-6, Math.max(1e-6, y));
    for (let i = 0; i < M.U.length; i++) { const b = M.info[i].box;
      if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3] && pip(M.U[i], x, y)) return i; }
    return -1;
  }
  const sharedSeg = (M, u, v) => { const L = M.pairSegs.get(Math.min(u, v) + '_' + Math.max(u, v)); if (!L) return null;
    let best = L[0]; for (const s of L) if (M.segs[s].len > M.segs[best].len) best = s; return M.segs[best]; };
  // ---- partial colourings: col[v] in 0..3, or -1 for a blank piece ----
  const NP = 4;
  function clashes(adj, col) {
    const out = [];
    for (let u = 0; u < col.length; u++) if (col[u] >= 0) for (const v of adj[u]) if (u < v && col[v] === col[u]) out.push([u, v]);
    return out;
  }
  // the group a press on u with pen b picks out: coloured pieces connected through pens {col[u], b}, blanks are gaps
  function group(adj, col, u, b) {
    const a = col[u]; if (a < 0 || b < 0 || b === a) return null;
    const dep = new Map([[u, 0]]), par = new Map([[u, -1]]), vs = [u]; let front = [u];
    while (front.length) { const nx = [];
      for (const v of front) for (const w of adj[v]) if (!dep.has(w) && (col[w] === a || col[w] === b)) { dep.set(w, dep.get(v) + 1); par.set(w, v); vs.push(w); nx.push(w); }
      front = nx; }
    return { a, b, u, vs, set: new Set(vs), dep, par };
  }
  function swapped(col, G) { const c = col.slice(); for (const v of G.vs) c[v] = c[v] === G.a ? G.b : G.a; return c; }
  function freePens(adj, col, v) { const used = new Set(); for (const w of adj[v]) used.add(col[w]); const f = []; for (let p = 0; p < NP; p++) if (!used.has(p)) f.push(p); return f; }
  const boxed = (adj, col) => { const out = []; for (let v = 0; v < col.length; v++) if (col[v] < 0 && !freePens(adj, col, v).length) out.push(v); return out; };
  function movesOf(col, among) { const out = []; for (const u of among) if (col[u] >= 0) for (let b = 0; b < NP; b++) if (b !== col[u]) out.push({ u, b }); return out; }
  // the first swap of the shortest sequence (up to 3 swaps) that frees a pen for the blank piece v; the last swap is on
  // a neighbour of v. Renaming groups (all coloured {a, b} pieces at once) can't help and are skipped.
  function groupsOf(adj, col, among) {
    const out = [], seen = new Set(), cnt = [0, 0, 0, 0]; col.forEach(c => { if (c >= 0) cnt[c]++; });
    for (const m of movesOf(col, among)) {
      const G = group(adj, col, m.u, m.b), key = Math.min(G.a, G.b) + ':' + [...G.vs].sort((x, y) => x - y).join('.');
      if (seen.has(key) || G.vs.length === cnt[G.a] + cnt[G.b]) continue; seen.add(key); out.push(G);
    }
    return out;
  }
  function rescue(adj, col, v, maxD) {
    const all = col.map((_, i) => i);
    const go = (c, d) => {
      if (d === 1) { for (const G of groupsOf(adj, c, adj[v])) if (freePens(adj, swapped(c, G), v).length) return G; return null; }
      for (const G of groupsOf(adj, c, all)) if (go(swapped(c, G), d - 1)) return G;
      return null;
    };
    for (let d = 1; d <= (maxD || 3); d++) { const G = go(col, d); if (G) return { u: G.u, b: G.b, G, steps: d }; }
    return null;
  }
  // last resort for a boxed piece: rub out a neighbour whose pen nobody else around v uses (then v can take it)
  function kick(adj, col, v) {
    const n = [0, 0, 0, 0]; for (const w of adj[v]) if (col[w] >= 0) n[col[w]]++;
    for (const w of adj[v]) if (col[w] >= 0 && n[col[w]] === 1) return w;
    return -1;
  }
  function hint(adj, col) {
    for (const v of boxed(adj, col)) { const r = rescue(adj, col, v); if (r) return { kind: 'swap', v, u: r.u, b: r.b, steps: r.steps }; }
    for (const v of boxed(adj, col)) { const w = kick(adj, col, v); if (w >= 0) return { kind: 'erase', v, u: w, b: col[w] }; }
    let best = -1, bf = null;
    for (let v = 0; v < col.length; v++) if (col[v] < 0) { const f = freePens(adj, col, v); if (f.length && (!bf || f.length < bf.length)) { best = v; bf = f; } }
    if (best >= 0) return { kind: 'fill', u: best, b: bf[0] };
    const cl = clashes(adj, col); if (cl.length) return { kind: 'erase', u: cl[0][0], b: col[cl[0][0]] };
    return null;
  }
  const done = (adj, col) => col.every(c => c >= 0) && !clashes(adj, col).length;
  // test solver: colour pieces in the given order with a free pen; when a piece is boxed, use the hint search
  // (swaps), and only if that finds nothing, rub out a neighbour and queue it again
  function solve(adj, order, pick) {
    let col = new Array(adj.length).fill(-1), swaps = 0, kicks = 0, guard = 0; const Q = order.slice();
    while (Q.length) {
      if (++guard > 50 * adj.length) return { ok: false, col };
      const v = Q.shift(); if (col[v] >= 0) continue;
      let f = freePens(adj, col, v);
      if (!f.length) { const r = rescue(adj, col, v);
        if (r) { col = swapped(col, r.G); swaps++; Q.unshift(v); continue; }
        const w = kick(adj, col, v); if (w < 0) return { ok: false, v, col };
        col[w] = -1; kicks++; Q.push(w); f = freePens(adj, col, v); }
      col[v] = f[pick ? pick(f.length) : 0];
      if (clashes(adj, col).length) return { ok: false, clash: true, col };
    }
    return { ok: done(adj, col), swaps, kicks, col };
  }
  return { prep, pip, faceAt, sharedSeg, clashes, group, swapped, freePens, boxed, rescue, kick, hint, done, solve };
})();
/*LOGIC-END*/
</script>
<script>
(() => {
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let g = LAB.game(); if (!g.cells) g = LAB.game('4');
  const M = BD.prep(g), N = g.n, ADJ = g.adj;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const palEl = document.getElementById('pal'), stamp = document.getElementById('stamp');
  const INK = '#2b2d42', PENCIL = 'rgba(80,82,96,', PAPER = '#fffcf3';
  const PENS = [
    { c: '#ff5d5d', d: '#c93636', a: Math.PI / 4 }, { c: '#3fa7f5', d: '#1f74b8', a: -Math.PI / 4 },
    { c: '#ffc928', d: '#c9900a', a: 0 }, { c: '#3ccf6e', d: '#1f8f45', a: Math.PI / 2 }];
  function rng(seed) { let a = seed >>> 0;
    return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- state ----------
  let col = new Array(N).fill(-1), hist = [], pen = -1, won = false, wonAt = 0, drawStart = 0, drawTotal = 0;
  let nSwaps = 0;                                          // swaps used on this sheet (reported to the app)
  let anim = [], wob = [], confetti = [], hintOn = null, hintT0 = 0, lastClash = 0, qHop = [];
  let press = null, hoverG = null; // press: { u, G, over } while a coloured piece is held

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, PX = 0, PY = 0, PS = 0, PH = 0, RX = 0, RY = 0, RS = 0, CH = 0, penW = 0, penH = 0, paper = null, paths = [];
  const ASP = 1.07;
  function layout() {
    W = innerWidth; H = innerHeight; dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const land = W > H * 1.15, top = 40;
    if (land) {
      penH = Math.max(70, Math.min(170, H * 0.34)); penW = penH * 0.3;
      const palW = 4 * penW + 3 * penW * 0.35 + 24;
      PS = Math.max(120, Math.min(W - palW - 24, (H - top - 12) / ASP)); PH = PS * ASP;
      PX = Math.max(12, (W - palW - PS) / 2); PY = top + Math.max(0, (H - top - 12 - PH) / 2);
      Object.assign(palEl.style, { left: (PX + PS + 12) + 'px', top: '0px', width: palW + 'px', height: (H / 2 + penH / 2) + 'px' });
    } else {
      penH = Math.max(56, Math.min(130, H * 0.16)); penW = penH * 0.3;
      const palH = penH + 14;
      PS = Math.max(120, Math.min(W - 20, (H - top - palH - 14) / ASP)); PH = PS * ASP;
      PX = (W - PS) / 2; PY = top + Math.max(0, (H - top - palH - 14 - PH) / 2);
      Object.assign(palEl.style, { left: '0px', width: W + 'px', top: (H - palH - 4) + 'px', height: palH + 'px' });
    }
    palEl.style.gap = (penW * 0.35) + 'px';
    [...palEl.children].forEach(b => { b.style.width = penW + 'px'; b.style.height = penH + 'px'; });
    const m = PS * 0.05; CH = PH - PS; RS = PS - 2 * m; RX = PX + m; RY = PY + CH + m;
    Object.assign(stamp.style, { left: RX + 'px', top: RY + 'px', width: RS + 'px', height: RS + 'px', fontSize: Math.max(22, PS * 0.11) + 'px' });
    makePaper(); makePaths(); makePatterns(); render();
  }
  const X = p => (RX + p[0] * RS) * dpr, Y = p => (RY + p[1] * RS) * dpr;
  function makePaper() {
    const c = document.createElement('canvas'), w = Math.round(PS * dpr), h = Math.round(PH * dpr); c.width = w; c.height = h;
    const q = c.getContext('2d'); q.fillStyle = PAPER; q.fillRect(0, 0, w, h);
    const R = rng(7);
    for (let i = 0; i < w * h / 260; i++) { q.fillStyle = `rgba(120,100,60,${0.025 + R() * 0.05})`; q.fillRect(R() * w, R() * h, 1.2 * dpr, 1.2 * dpr); }
    q.strokeStyle = 'rgba(80,140,200,.10)'; q.lineWidth = dpr;
    for (let y = w * 0.035; y < h; y += w * 0.07) { q.beginPath(); q.moveTo(0, y); q.lineTo(w, y); q.stroke(); }
    paper = c;
  }
  let pats = [];
  function makePatterns() {
    pats = PENS.map(P => {
      const s = Math.round(9 * dpr), c = document.createElement('canvas'); c.width = c.height = s;
      const q = c.getContext('2d'); q.strokeStyle = P.d; q.globalAlpha = 0.33; q.lineWidth = 1.6 * dpr; q.beginPath();
      if (P.a === 0) { q.moveTo(0, s / 2); q.lineTo(s, s / 2); }
      else if (P.a === Math.PI / 2) { q.moveTo(s / 2, 0); q.lineTo(s / 2, s); }
      else if (P.a > 0) { for (const o of [-s, 0, s]) { q.moveTo(o, 0); q.lineTo(o + s, s); } }
      else { for (const o of [-s, 0, s]) { q.moveTo(o, s); q.lineTo(o + s, 0); } }
      q.stroke(); return ctx.createPattern(c, 'repeat');
    });
  }
  function makePaths() {
    paths = M.U.map(P => { const p = new Path2D(); P.forEach((q, i) => i ? p.lineTo(X(q), Y(q)) : p.moveTo(X(q), Y(q))); p.closePath(); return p; });

    if (mode === 'swap') { press.over = f >= 0 && press.G.set.has(f); return; }
    if (f < 0 || f === last) return; last = f;
    if (mode === 'paint' && col[f] < 0) fillAt(f, e);
    else if (mode === 'erase' && col[f] === pen) eraseAt(f, e);
  });
  function up(e, cancel) {
    if (mode === 'swap' && press) { const P = press; press = null; if (!cancel && P.over) doSwap(P, e); else { thud(); kick(); } }
    mode = null; last = -1;
  }
  cv.addEventListener('pointerup', e => up(e, false));
  cv.addEventListener('pointercancel', e => up(e, true));
  cv.addEventListener('pointerleave', () => { if (hoverG) { hoverG = null; kick(); } });
  document.getElementById('undo').addEventListener('pointerdown', e => {
    e.preventDefault(); au(); touch();
    if (won) { won = false; stamp.classList.remove('on'); confetti = []; }
    if (!hist.length) { thud(); return; }
    const before = col; col = hist.pop(); const now = performance.now(); let k = 0;
    for (let i = 0; i < N; i++) if (before[i] !== col[i]) { const [x, y] = cen(i);
      anim[i] = RM ? null : col[i] < 0 ? { t0: now + 30 * k++, x, y, R: reach(i, x, y), from: before[i], rub: true } : { t0: now + 30 * k++, x, y, R: reach(i, x, y), from: before[i] }; }
    lastClash = BD.clashes(ADJ, col).length; squeak(pen < 0 ? 0 : pen, 0, 0.12); teach(); kick();
  });
  document.getElementById('again').addEventListener('pointerdown', e => {
    e.preventDefault(); au(); touch();
    if (won) { fresh(); return; }
    if (col.some(c => c >= 0)) { save(); const now = performance.now();
      col.forEach((c, i) => { if (c >= 0) { const [x, y] = cen(i); anim[i] = RM ? null : { t0: now + 15 * i, x, y, R: reach(i, x, y), from: c, rub: true }; } });
      col = new Array(N).fill(-1); lastClash = 0; rub(); }
    kick();
  });
  addEventListener('resize', layout);
  document.addEventListener('contextmenu', e => e.preventDefault());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => kick());

  layout(); fresh();
})();
</script>
