<!doctype html>
<!--
  WEDDING TABLES (lab front end, round 3: a sibling of zoo.html, same "pens" mechanic, a wedding reception)

  What the player sees: an evening reception under string lights. Four round tables, each with its own tablecloth
  colour, hem pattern and centrepiece: Roses (blush cloth, scalloped hem, red rose), Bluebells (blue cloth, dotted
  hem, drooping bells), Sunflowers (gold cloth, striped hem, sunflower), Ferns (sage cloth, leafy hem, fern sprig).
  Every map region except the hole is a named guest with a little portrait on a gold chair; the table a guest sits
  at is its element. The map itself is never drawn. The hidden relation: guests who are neighbours on the map have a
  FEUD and never share a table (the legal colouring). Feuds only show when you pick a guest up: crackling red sparks
  run to each of their rivals (who scowl), the guests who would get bumped light up, and a gossip line names the
  feud ("Kev vs Doris: the potato salad recipe").

  The bride's grandmother (the hole) arrives late. She feuds with five guests (g.rim, wearing a red pin); the banner
  shows Gran and the five portraits she won't sit with, each on a disc of the table they sit at now. Each table has a
  little place card with Gran and a tick (none of her five sit there) or a cross. Goal: make one table tick.
  g.won() is exactly "some table holds none of the five" (her five are always 2+1+1+1 over the tables; a win is
  2+2+1), and g.free() is that table: Gran walks over, sits, glasses clink, confetti.

  The move (one gesture = exactly one g.swap(K), or nothing): drag/flick guest u from table A to table B (or tap u,
  then tap table B). K = g.chainAt(u, B), the {A, B} chain through u. u sits at B; every rival of u already at B
  storms off to A ("Well!"); every rival of those at A storms over to B; and so on: the members of K scrape their
  chairs between A and B one BFS layer at a time from u. A guest with no rival at B just moves (a single-region
  chain), so every chain on the map is reachable by moving any one of its members. If K.web is true (both whole
  tables would trade seats, which changes nothing) g.swap is NOT called: both tables stand up, shuffle, sit back
  down, and the wedding planner facepalms. Undo (g.undo) and start over (g.reset) are the two small buttons.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241c38; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  svg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    font-family: Nunito, 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif; }
  .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
  #ui { position: fixed; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 7px; z-index: 2; }
  #ui button { width: 36px; height: 36px; border-radius: 12px; border: 2.5px solid #1c1640; border-bottom-width: 2.5px;
    background: var(--sk-ctl, #fbf3e2); color: var(--sk-ctl-ink, #5b3a4f); font: 900 19px/1 system-ui, sans-serif; padding: 0; cursor: pointer;
    box-shadow: 0 4px 0 var(--sk-ctl-edge, #b48a2c), 0 5px 0 #1c1640, inset 0 2px 0 rgba(255,255,255,.7); transition: transform .06s, box-shadow .06s; }
  #ui button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--sk-ctl-edge, #b48a2c), 0 1px 0 #1c1640, inset 0 2px 0 rgba(255,255,255,.7); }
  .won #ui button { opacity: .45; }
  .gst .nm { display: none; } .gst.held .nm, .gst.sel .nm { display: inline; }
  .gst .fl { display: none; } .gst.toast .fl { display: inline; }
  .fli, .pt, .cdi, .tbl, .boom, .flyo, .bunt, .cat .cb, .cat .ct, #gran .tea { transform-box: fill-box; transform-origin: 50% 50%; }
  .fli { transform-origin: 50% 100%; }
  .toast .fli { animation: raise .45s cubic-bezier(.3,1.6,.5,1) both, clinkS .38s ease-in-out .45s 4 alternate; }
  .tbl.cand .hi { opacity: .9; animation: pulse .55s ease-in-out infinite alternate; }
  .tbl.wob { animation: wob .5s ease-in-out; }
  .pt.bnc { animation: bnc .5s cubic-bezier(.3,1.7,.5,1); }
  .cdi.ok { animation: cardpop .55s cubic-bezier(.3,1.8,.5,1); } .cdi.bad { animation: wob .45s ease-in-out; }
  .flyo { animation: flyo .7s ease-in forwards; }
  .boom { animation: boom .9s ease-out forwards; }
  .bunt { animation: bunt .8s cubic-bezier(.3,1.5,.5,1) both; }
  .cat .ct { transform-origin: 0% 100%; animation: tail .7s ease-in-out infinite alternate; }
  .cat .cb { animation: catbob .32s ease-in-out infinite alternate; }
  #gran .tea { animation: pour 2.4s ease-in-out forwards; }
  .nosign { transform-box: fill-box; transform-origin: 50% 50%; animation: nos 2.4s ease-in-out infinite; }
  .gst { cursor: grab; }
  .mo, .mg, .brow, .gst .ring, .gst .halo { display: none; }
  .grump .ms, .bump .ms, .party .ms, .hope .ms { display: none; }
  .grump .mg, .grump .brow { display: inline; }
  .grump.bump .mg, .hope .mg, .hope .brow { display: none; }
  .bump .mo, .party .mo, .hope .mo { display: inline; }
  .gst.lit .ring { display: inline; animation: pulse .6s ease-in-out infinite alternate; }
  .gst.held .halo, .gst.sel .halo { display: inline; }
  .bob { transform-box: fill-box; transform-origin: 50% 95%; animation: breathe 3s ease-in-out infinite; }
  .gst.lit .bob, .gst.grump .bob, #gran.grump .bob { animation: huff .2s ease-in-out infinite alternate; }
  .gst.party .bob, #gran.party .bob, #gran.hope .bob { animation: jump .4s ease-in-out infinite alternate; }
  #gran .gchair { display: none; } #gran.seated .gchair { display: inline; }
  .tbl .hi { opacity: 0; transition: opacity .15s; }
  .tbl.hover .hi { opacity: 1; }
  .bulb { animation: twinkle 2.4s ease-in-out infinite alternate; }
  .glowing .bulb { animation-duration: .5s; }
  .flL, .flR { transform-box: fill-box; transform-origin: 50% 100%; }
  .flL { animation: clinkL .45s ease-in-out 4 alternate; }
  .flR { animation: clinkR .45s ease-in-out 4 alternate; }
  .palm { animation: fadeio 1.9s ease-in-out forwards; }
  @keyframes breathe { from { transform: scale(1, 1); } to { transform: scale(1.025, .975); } }
  @keyframes huff { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes jump { from { transform: translateY(0); } to { transform: translateY(-.3px); } }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
  @keyframes clinkL { from { transform: rotate(-4deg); } to { transform: rotate(14deg); } }
  @keyframes clinkR { from { transform: rotate(4deg); } to { transform: rotate(-14deg); } }
  @keyframes fadeio { 0% { opacity: 0; } 15%, 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes raise { from { transform: translateY(.5px) rotate(30deg) scale(.4); } to { transform: none; } }
  @keyframes clinkS { from { transform: rotate(0); } to { transform: rotate(-22deg); } }
  @keyframes wob { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 60% { transform: rotate(3deg); } 85% { transform: rotate(-1.5deg); } }
  @keyframes bnc { 0% { transform: scale(1); } 35% { transform: scale(1.35) translateY(-3px); } 100% { transform: scale(1); } }
  @keyframes cardpop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes flyo { from { transform: none; opacity: 1; } to { transform: translate(0, -46px) scale(1.6) rotate(40deg); opacity: 0; } }
  @keyframes boom { from { transform: scale(.2); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  @keyframes bunt { from { transform: translateY(-80px); } to { transform: none; } }
  @keyframes tail { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  @keyframes catbob { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
  @keyframes pour { 0% { transform: rotate(0) scale(.2); opacity: 0; } 15% { transform: rotate(0) scale(1); opacity: 1; } 35%, 75% { transform: rotate(-35deg); opacity: 1; } 100% { transform: rotate(0); opacity: 0; } }
  @keyframes nos { 0%, 80%, 100% { transform: scale(1); } 88% { transform: scale(1.18); } }
  @media (prefers-reduced-motion: reduce) {
    .bob, .gst.lit .bob, .gst.grump .bob, .gst.party .bob, #gran .bob, .bulb, .flL, .flR { animation: none !important; }
    .gst.lit .ring, .toast .fli, .tbl.cand .hi, .tbl.wob, .pt.bnc, .cdi.ok, .cdi.bad, .flyo, .boom, .bunt, .cat .ct, .cat .cb, .nosign { animation: none !important; }
    .boom, .flyo { display: none; }
  }

<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" aria-label="Wedding reception seating"></svg>
<div id="ui"><button id="undo" title="Undo" aria-label="Undo">&#8630;</button><button id="again" title="Start over" aria-label="Start over">&#8634;</button></div>
<script src="../levels.js"></script>
<script src="../layout.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- pure helpers (also used by the node smoke test)
  const TABLE = [
    { name: 'Roses', cloth: '#f7d3d3', shade: '#e9b3b6', hem: '#c93a55', dark: '#7d1a30' },
    { name: 'Bluebells', cloth: '#d3e3f7', shade: '#aec8ea', hem: '#2f69c4', dark: '#173d7a' },
    { name: 'Sunflowers', cloth: '#f9eab4', shade: '#ecd27d', hem: '#d69a10', dark: '#7a5406' },
    { name: 'Ferns', cloth: '#d6ebcc', shade: '#b3d6a3', hem: '#3f8a3a', dark: '#1f5a22' },
  ];

  // the hall: a banner strip on top, then the tables on the best grid (2x2 on a phone, 4x1 when wide, ...)
  function layoutHall(W, H, NC, counts) {
    const wide = W > H * 1.25;
    const gh = Math.round(Math.max(66, Math.min(118, wide ? H * 0.2 : H * 0.16)));
    const pad = Math.max(4, Math.min(12, W * 0.02)), top = gh + 10, aw = W - 2 * pad, ah = H - top - pad;
    let best = null;
    for (let cols = 1; cols <= NC; cols++) {
      const rows = Math.ceil(NC / cols), S = Math.min(aw / cols, ah / rows) / 2;
      if (!best || S > best.S * 1.04 || (cols === 2 && S > best.S * .96)) best = { cols, rows, S };
    }
    // a staggered "zigzag" (tables alternate sides along the long axis) uses a tall phone or a wide strip better
    const tall = ah >= aw, P = tall ? ah : aw, Q = tall ? aw : ah, gap = S => (P - 2 * S) / Math.max(1, NC - 1);
    let lo = 0, hi = Math.min(Q / 2, P / 2);
    for (let i = 0; i < 30; i++) {
      const S = (lo + hi) / 2, d = gap(S);
      if (d >= S && Math.hypot(Q - 2 * S, d) >= 2 * S) lo = S; else hi = S;
    }
    const zig = NC >= 3 && lo > best.S * 1.06;
    const tables = [];
    let cols = best.cols, rows = best.rows, swags = [];
    if (zig) {
      cols = 1; rows = 1;
      for (let k = 0; k < NC; k++) {
        const a = lo + k * gap(lo), b = k % 2 ? Q - lo : lo;
        tables.push(tall ? { k, cx: pad + b, cy: top + a, S: lo } : { k, cx: pad + a, cy: top + b, S: lo });
      }
    } else {
      const cw = aw / cols, ch = ah / rows;
      for (let k = 0; k < NC; k++) {
        const r = Math.floor(k / cols), inRow = Math.min(cols, NC - r * cols), c = k - r * cols;
        const off = (aw - inRow * cw) / 2;
        tables.push({ k, cx: pad + off + (c + .5) * cw, cy: top + (r + .5) * ch, S: Math.min(cw, ch) / 2 });
      }
      for (let r = 1; r < rows; r++) swags.push(top + r * ch - 6);
    }
    // one guest size for the whole hall, so that the fullest table still seats everyone in a ring
    const S = Math.min(...tables.map(t => t.S)), m = Math.max(3, ...counts);
    let r = Math.min(S * .25, 44);
    for (let i = 0; i < 8; i++) { const Rc = S - r * 1.35; r = Math.min(S * .25, 44, Math.PI * Rc / (1.08 * m)); }
    r = Math.max(7, r);
    tables.forEach(t => { t.Rc = t.S - r * 1.35; t.Rt = Math.max(t.Rc - r * .5, t.S * .3); });
    return { W, H, gh, tables, r, cols, rows, swags, zig };
  }

  // seat angle i of m around a table (top first; even counts straddle the top)
  function seatAngle(i, m) { return -Math.PI / 2 + 2 * Math.PI * i / m + (m % 2 ? 0 : Math.PI / m); }
  function seatXY(t, i, m) { const a = seatAngle(i, m); return [t.cx + t.Rc * Math.cos(a), t.cy + t.Rc * Math.sin(a)]; }
  // where a newcomer arriving from angle th takes a chair (so the rest of the table shuffles by one chair at most)
  function seatIndexFor(th, m) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < m; i++) { let d = Math.abs(seatAngle(i, m) - th) % (2 * Math.PI); d = Math.min(d, 2 * Math.PI - d); if (d < bd) { bd = d; bi = i; } }
    return bi;
  }

  // the cascade: the members of chain K in BFS layers from the guest who was moved
  function cascade(g, K, u) {
    const seen = new Set([u]), layers = [[u]];
    let front = [u];
    while (front.length) {
      const nx = [];
      for (const v of front) for (const w of g.adj[v]) if (K.set.has(w) && !seen.has(w)) { seen.add(w); nx.push(w); }
      if (nx.length) layers.push(nx);
      front = nx;
    }
    return layers;
  }

  // gesture -> chain: moving guest u to table B means chain g.chainAt(u, B); nothing when B is its own table
  function moveFor(g, u, B) {
    if (u === g.hole || B == null || B < 0 || B >= g.NC || B === g.col[u]) return null;
    const K = g.chainAt(u, B);
    if (!K) return null;
    return { K, web: K.web, from: g.col[u], to: B, layers: cascade(g, K, u) };
  }

  // which table does a release at (x, y) mean? The table whose seating circle it is in, or the nearest; a clear
  // swipe that stays at its own table but points at another one counts for that one (forgiving flicks on a phone).
  function tableFor(L, x, y, from, dx, dy) {
    if (y < L.gh - 4) return null;
    let best = null, bd = Infinity;
    L.tables.forEach(t => { const d = Math.hypot(x - t.cx, y - t.cy) - t.S; if (d < bd) { bd = d; best = t.k; } });
    const len = Math.hypot(dx || 0, dy || 0);
    if (best === from && from != null && len > Math.max(28, L.r * 1.2)) {
      const P = L.tables[from]; let bc = 0.5, alt = null;
      L.tables.forEach(q => {
        if (q.k === from) return;
        const vx = q.cx - P.cx, vy = q.cy - P.cy, c = (vx * dx + vy * dy) / (Math.hypot(vx, vy) * len);
        if (c > bc) { bc = c; alt = q.k; }
      });
      if (alt != null) return alt;
    }
    return best;
  }

  const REASONS = ['the karaoke incident', 'who caught the bouquet in 2019', 'a borrowed lawnmower, never returned',
    'the potato salad recipe', 'an ex. Obviously.', 'pineapple on pizza', 'a parking space, 1998', 'the family group chat',
    'a Monopoly game. Never again.', 'one massive spoiler', 'the garden fence', 'a reply-all email',
    'who is the favourite grandchild', 'a casserole dish, still missing', 'the Great Fondue Spill', 'an unfollow',
    'a bridesmaid demotion', 'the last slice of cake', 'naming a dog after the other one', 'a very loud speech, 2016',
    'a timeshare', 'the Christmas cracker joke', 'a wedding cake tasting, uninvited', 'the inflatable flamingo'];
  const reasonFor = (u, w) => REASONS[(Math.min(u, w) * 31 + Math.max(u, w) * 17) % REASONS.length];

  window.TABLES = { TABLE, layoutHall, seatAngle, seatXY, seatIndexFor, cascade, moveFor, tableFor, reasonFor, REASONS };
  if (window.TABLES_TEST) return;

  // ---------------------------------------------------------------- the reception
  const g = LAB.game();
  const NC = g.NC, hole = g.hole, rimSet = new Set(g.rim);
  // ponds: g.NC is 2, 3 or 4, so only g.NC tables are laid out (layoutHall, order, cards) and g.won()/g.free() decide the win.
  // hud=full|compact: the app already shows the level title and stars, so this page repeats neither (it shows neither anyway).
  const HUD = new URLSearchParams(location.search).get('hud'), IN_APP = HUD === 'full' || HUD === 'compact' || !!LAB.embedded;
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('s');
  const el = (tag, attrs, parent, html) => {
    const e = document.createElementNS(NS, tag);
    for (const a in attrs) e.setAttribute(a, (a === 'width' || a === 'height' || a === 'r') && attrs[a] < 0 ? 0 : attrs[a]);
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  };
  const f2 = x => (+x).toFixed(2);

  // centrepieces, unit size (about -1..1); four different shapes as well as colours
  function flower(k) {
    const G = '#3f8a3a', GD = '#1f5a22';
    if (k === 0) return `<g fill="${G}" stroke="${GD}" stroke-width=".05"><path d="M-.2 .45Q-.85 .35-.95 .85Q-.4 .95-.2 .45Z"/><path d="M.2 .45Q.85 .35 .95 .85Q.4 .95 .2 .45Z"/></g>` +
      `<circle r=".66" fill="#d8455e" stroke="#7d1a30" stroke-width=".07"/><path d="M.05 0A.1 .1 0 1 1 .02-.14A.24 .24 0 0 1 .2 .16A.38 .38 0 0 1-.36 .1A.5 .5 0 0 1 .3-.42" fill="none" stroke="#7d1a30" stroke-width=".07" stroke-linecap="round"/>`;
    if (k === 1) {
      const bell = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M-.2-.38Q0-.48 .2-.38Q.24-.1 .26 .08L.13 .02L0 .12L-.13 .02L-.26 .08Q-.24-.1-.2-.38Z" fill="#3f7fe0" stroke="#173d7a" stroke-width=".07" stroke-linejoin="round"/>`;
      return `<path d="M-.75 .9Q-.6-.55 .55-.75" fill="none" stroke="${G}" stroke-width=".1" stroke-linecap="round"/><ellipse cx="-.35" cy=".75" rx=".32" ry=".1" fill="${G}" transform="rotate(-50 -.35 .75)"/>` +
        bell(-.52, .1, 1.05) + bell(-.2, -.38, 1.15) + bell(.25, -.42, 1.1) + bell(.62, -.38, .95);
    }
    if (k === 2) {
      let d = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, b = a + .2, c = a - .2;
        d += `M${f2(.45 * Math.cos(b))} ${f2(.45 * Math.sin(b))}L${f2(.95 * Math.cos(a))} ${f2(.95 * Math.sin(a))}L${f2(.45 * Math.cos(c))} ${f2(.45 * Math.sin(c))}Z`; }
      let s = ''; for (let i = 0; i < 7; i++) { const a = i * 2.4; s += `<circle cx="${f2(.22 * Math.cos(a) * Math.sqrt(i / 7))}" cy="${f2(.22 * Math.sin(a) * Math.sqrt(i / 7))}" r=".045"/>`; }
      return `<path d="${d}" fill="#f6c21c" stroke="#8a5d06" stroke-width=".06" stroke-linejoin="round"/><circle r=".44" fill="#7a4a18" stroke="#4a2a0a" stroke-width=".06"/><g fill="#c48a3a">${s}</g>`;
    }
    let lv = ''; for (let i = 0; i < 4; i++) { const y = .55 - i * .38, s = 1 - i * .18;
      lv += `<ellipse cx="${f2(-.32 * s)}" cy="${f2(y)}" rx="${f2(.34 * s)}" ry=".13" transform="rotate(${-28} ${f2(-.32 * s)} ${f2(y)})"/><ellipse cx="${f2(.32 * s)}" cy="${f2(y)}" rx="${f2(.34 * s)}" ry=".13" transform="rotate(${28} ${f2(.32 * s)} ${f2(y)})"/>`; }
    return `<path d="M0 .95V-.95" stroke="${GD}" stroke-width=".09" stroke-linecap="round"/><g fill="#4fa64a" stroke="${GD}" stroke-width=".05">${lv}<ellipse cy="-.9" rx=".12" ry=".2"/></g>`;
  }

  // ---- the guests: one per region (the hole is Gran)
  const NAMES = ['Bob', 'Mabel', 'Priya', 'Kev', 'Doris', 'Tariq', 'Fiona', 'Lou', 'Gus', 'Rosa', 'Nigel', 'Jade', 'Omar',
    'Bea', 'Marco', 'Wendy', 'Derek', 'Suki', 'Pip', 'Hank', 'Lena', 'Raj', 'Cleo', 'Vince', 'Ada', 'Theo', 'Nell', 'Ivan',
    'Joy', 'Sven', 'Mo', 'Greta', 'Felix', 'Kat'];
  const SKIN = ['#f6d3b3', '#e8b48a', '#c98b5e', '#9c6440', '#6e4428', '#f2c6a0'];
  const HAIRC = ['#2b1d16', '#6b3f1f', '#c8873a', '#e6c46a', '#8e8a92', '#a33b20', '#1d1d24'];
  const OUTFIT = ['#3a4a7a', '#7a2f4f', '#2f6b5a', '#5b3a7a', '#c25a3a', '#2b2b35', '#b0466e', '#3f7a9a'];
  const HAIR = ['short', 'long', 'bun', 'curly', 'bald', 'pony', 'quiff', 'bob'];
  const INK = '#2e2230';

  function faceMarkup() {
    return `<circle cx="-.3" cy="-.08" r=".09" fill="#ff8fa3" opacity=".55"/><circle cx=".3" cy="-.08" r=".09" fill="#ff8fa3" opacity=".55"/>` +
      `<g fill="${INK}"><circle cx="-.18" cy="-.24" r=".065"/><circle cx=".18" cy="-.24" r=".065"/></g>` +
      `<path class="brow" d="M-.3-.42L-.08-.34M.3-.42L.08-.34" stroke="${INK}" stroke-width=".07" stroke-linecap="round" fill="none"/>` +
      `<g stroke="${INK}" stroke-width=".06" stroke-linecap="round" fill="none"><path class="ms" d="M-.12-.04Q0 .06 .12-.04"/><path class="mg" d="M-.12 .03Q0-.07 .12 .03"/></g>` +
      `<ellipse class="mo" cy="-.0" rx=".08" ry=".09" fill="#8a2a3a" stroke="${INK}" stroke-width=".04"/>`;
  }

  const CHAIR = `<g stroke="#b48a2c" stroke-width=".1" fill="none"><rect x="-.74" y="-1.02" width="1.48" height="1.95" rx=".55" fill="#fbf3e2" fill-opacity=".14"/><path d="M-.36-.98V.9M0-1.02V.9M.36-.98V.9" stroke-width=".05" opacity=".7"/></g>`; // a gold chiavari chair
  // spec: { skin, hair, hc, outfit, suit, glasses, beard, gran }
  function personMarkup(P, chair) {

    catN++; const dir = catN % 2 ? 1 : -1, z = Math.max(.9, L.r / 14), y = L.gh + 40 + Math.random() * Math.max(20, L.H - L.gh - 90);
    gCat.innerHTML = `<g><ellipse cx="2" cy="15" rx="22" ry="4" fill="#0b0716" opacity=".35"/>` +
      `<g class="ct"><path d="M-17 2Q-30 -4 -27 -20Q-26 -26 -21 -24Q-22 -10 -13 -4Z" fill="#f39a3d" stroke="#1c1640" stroke-width="2.2" stroke-linejoin="round"/></g>` +
      `<g class="cb"><path d="M-12 6V15M-5 7V15M6 7V15M13 6V15" stroke="#1c1640" stroke-width="6" stroke-linecap="round"/><path d="M-12 6V14M-5 7V14M6 7V14M13 6V14" stroke="#f39a3d" stroke-width="3.4" stroke-linecap="round"/>` +
      `<ellipse rx="19" ry="11" fill="#f39a3d" stroke="#1c1640" stroke-width="2.4"/><path d="M-6-10Q-4-2-7 4M1-11Q3-2 0 6M8-10Q10-3 7 3" stroke="#c96a1c" stroke-width="2.4" fill="none" stroke-linecap="round"/>` +
      `<ellipse cx="-6" cy="-6" rx="8" ry="3" fill="#ffd2a0" opacity=".8"/>` +
      `<g transform="translate(19 -8)"><path d="M-9-6L-8-17L-2-9ZM9-6L8-17L2-9Z" fill="#f39a3d" stroke="#1c1640" stroke-width="2" stroke-linejoin="round"/><circle r="10" fill="#f39a3d" stroke="#1c1640" stroke-width="2.4"/>` +
      `<ellipse cx="0" cy="4" rx="5" ry="3.4" fill="#fff2df"/><circle cx="-3.6" cy="-1.4" r="1.6" fill="#1c1640"/><circle cx="3.6" cy="-1.4" r="1.6" fill="#1c1640"/><path d="M-1.2 2H1.2L0 3.4Z" fill="#e8587a"/>` +
      `<path d="M3 3H11M3 5L10 7M-3 3H-11M-3 5L-10 7" stroke="#1c1640" stroke-width=".8"/><circle cx="-4.4" cy="-6" r="2" fill="#fff" opacity=".7"/></g></g></g>`;
    cat = { t0: now(), dir, z, y, x0: dir > 0 ? -40 * z : L.W + 40 * z, sp: (L.W + 80 * z) / (RM ? 6000 : 9000), jump: 0 };
  }
  function catStep(t) {
    if (!cat) return;
    const c = cat, node = gCat.firstChild; if (!node) { cat = null; return; }
    const x = c.x0 + c.dir * (t - c.t0) * c.sp;
    let y = c.y; if (c.jump) { const p = (t - c.jump) / 450; if (p < 1) y -= Math.sin(Math.PI * p) * 26 * c.z; else c.jump = 0; }
    c.x = x; c.cy = y;
    node.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(c.dir * c.z).toFixed(2)} ${c.z.toFixed(2)})`);
    if ((c.dir > 0 && x > L.W + 50 * c.z) || (c.dir < 0 && x < -50 * c.z)) { gCat.innerHTML = ''; cat = null; lastTouch = now(); }
  }
  function catHit(x, y) {
    if (!cat || cat.x == null || Math.hypot(x - cat.x, y - cat.cy) > 30 * cat.z) return false;
    const t = now(); cat.x0 = cat.x; cat.t0 = t; cat.sp *= 2.2; cat.jump = t;   // a happy hop, then off at a trot
    sfx.purr();
    for (let i = 0; i < 6; i++) setTimeout(() => { if (cat) burst(cat.x, cat.cy - 20 * cat.z, 1, ['#ff6f91']); }, i * 90);
    if (!catPaid) { catPaid = true; egg('gran-cat', 40); }
    return true;
  }
  // gran-tea: tap Gran five times and the kettle whistles; she pours herself a cuppa
  let teaTaps = [], teaDone = false;
  function granHit(x, y) {
    if (!granPos || won || granTw || Math.hypot(x - granPos.x, y - granPos.y) > granPos.r * 1.35) return false;
    const t = now(); teaTaps = teaTaps.filter(s => t - s < 2500); teaTaps.push(t);
    sfx.pick(); gGran.classList.add('hope'); setTimeout(() => gGran.classList.remove('hope'), 300);
    if (teaTaps.length >= 5) {
      teaTaps = []; sfx.whistle();
      const T = el('g', { transform: 'translate(1 .1) scale(.55)' }, gGran.firstChild,
        `<g class="tea"><path d="M-.62-.5Q-.9 .1-.4 .45H.4Q.9 .1 .62-.5Z" fill="#fbf5ea" stroke="#1c1640" stroke-width=".09"/><path d="M.6-.3Q1.15-.55 1.05-.95" fill="none" stroke="#1c1640" stroke-width=".22" stroke-linecap="round"/><path d="M.6-.3Q1.15-.55 1.05-.95" fill="none" stroke="#fbf5ea" stroke-width=".1" stroke-linecap="round"/>` +
        `<path d="M-.62-.15Q-1.05-.25-.95.15Q-.85.35-.55.25" fill="none" stroke="#1c1640" stroke-width=".1"/><ellipse cy="-.52" rx=".5" ry=".12" fill="#e8587a" stroke="#1c1640" stroke-width=".07"/><circle cy="-.68" r=".1" fill="#e8587a" stroke="#1c1640" stroke-width=".06"/>` +
        `<circle cx="-.2" cy="0" r=".14" fill="#e8587a"/><circle cx=".18" cy=".05" r=".1" fill="#3f8a3a"/><path d="M1.05-1.1q.15-.3 0-.5q-.15-.25 0-.5" fill="none" stroke="#fff" stroke-width=".08" stroke-linecap="round" opacity=".85"/></g>`);
      setTimeout(() => T.remove(), 2500);
      if (!teaDone) { teaDone = true; egg('gran-tea', 0); }
    }
    return true;
  }

  // undo / reset (and any other outside change): everyone walks back to where they really sit
  g.on((_, info) => { if (info.type !== 'swap') resync(); });
  function resync() {
    const moved = new Set();
    for (let v = 0; v < g.n; v++) if (v !== hole && disp[v] !== g.col[v]) { seatMove(v, disp[v], g.col[v]); disp[v] = g.col[v]; moved.add(v); }
    clearMarks(); held = sel = null;
    place(false, moved); drawCards();
    if (moved.size) sfx.sit();
  }

  // ---- input (pointer events: drag, swipe or flick; or tap a guest then tap a table)
  let down = null;
  function pt(e) { const b = svg.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  function guestAt(x, y) {
    let best = null, bd = Math.max(L.r * 1.2, 22);
    A.forEach(a => { if (!a) return; const d = Math.hypot(a.x - x, a.y - y); if (d < bd) { bd = d; best = a.v; } });
    return best;
  }
  svg.addEventListener('pointerdown', e => {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; } }
    else if (ac.state === 'suspended') ac.resume();
    lastTouch = now();
    if (won && !busy) { if (!LAB.embedded) restart(); return; }   // in the app the shell owns the next step
    if (busy) return;
    const [x, y] = pt(e);
    if (catHit(x, y)) return;
    if (held == null && granHit(x, y)) { sel = null; clearMarks(); return; }
    const u = guestAt(x, y);
    if (u == null) {
      if (sel != null) { const B = tableFor(L, x, y, null, 0, 0); if (B != null && B !== disp[sel]) { doMove(sel, B, x, y); return; } }
      sel = null; clearMarks(); return;
    }
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    down = { u, x0: x, y0: y, moved: false, hist: [[x, y, now()]], wasSel: sel === u };
    held = u; sel = null; A[u].tw = null; sfx.pick(); gGst.appendChild(A[u].g);
    mark(u, null);
  });
  svg.addEventListener('pointermove', e => {
    if (!down) return;
    const [x, y] = pt(e), a = A[down.u];
    if (!down.moved && Math.hypot(x - down.x0, y - down.y0) > 8) down.moved = true;
    if (!down.moved) return;
    a.x = x; a.y = y - L.r * .4;
    down.hist.push([x, y, now()]); if (down.hist.length > 6) down.hist.shift();
    const B = tableFor(L, x, y, disp[down.u], x - down.x0, y - down.y0);
    if (B !== hoverTable) { hoverTable = B; mark(down.u, B); }
  });
  function release(e, cancel) {
    if (!down) return;
    const d = down; down = null; hoverTable = null;
    const [x, y] = pt(e);
    if (cancel) { held = null; clearMarks(); place(false); return; }
    if (!d.moved) { // a tap: select (show the feuds), then tap a table to send them there
      held = null;
      if (d.wasSel) { sel = null; clearMarks(); } else { sel = d.u; mark(d.u, null); }
      return;
    }
    const from = disp[d.u];
    let B = tableFor(L, x, y, from, x - d.x0, y - d.y0);
    if (B === from) { // a flick: project a little along its speed
      const h = d.hist, h0 = h[0], dt = Math.max(30, h[h.length - 1][2] - h0[2]);
      let px = (x - h0[0]) / dt * 140, py = (y - h0[1]) / dt * 140; const pl = Math.hypot(px, py), cap = Math.max(60, L.r * 3);
      if (pl > cap) { px *= cap / pl; py *= cap / pl; }
      B = tableFor(L, x + px, y + py, from, x - d.x0 + px, y - d.y0 + py);
    }
    doMove(d.u, B, x, y);
  }
  svg.addEventListener('pointerup', e => release(e, false));
  svg.addEventListener('pointercancel', e => release(e, true));

  document.getElementById('undo').onclick = () => { if (!busy && !won) g.undo(); };
  document.getElementById('again').onclick = () => { if (won && LAB.embedded) return; if (!busy || won) restart(); };
  window.PLAYLAB = { win, get won() { return won; } };   // test hook (tools/embed_win_check.js)

  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawStatic, 60); });
  drawStatic();
  requestAnimationFrame(frame);
})();
</script>
</body>
