<!doctype html>
<!--
  ISLANDS 3D: the Islands art as a three.js scene you can tilt and spin (lab/islands3d.html, skin "islands-3d").

  What the player sees: a hexagonal island in a blue sea. Every region of the level is a chunky element tile (the game's
  fire / water / air / earth colours, a dark plate with a neon rim and the element icon), standing on the grass or floating
  on levels above it, joined by wooden ladder bridges. The goal is a grey "?" platform floating inside the ring of five rim
  tiles, which float highest. Every level works: the layout is derived from the level's own graph (lab/core.js,
  layout.js), and stored per map in islands3d-plans.js (tools/islands3d_check.js writes it); a map without a stored plan
  is laid out live, which takes a moment.

  What the player does, and how it maps onto the puzzle:
  - Press a tile and drag along neighbouring tiles. The first two tiles fix the pair {a, b}: K = g.chainAt(u, g.col[v]).
    From then on K lights up and pulses ahead of the finger, everything else dims; stepping back undoes a step. Let go
    after two or more tiles, or trace the whole chain, and the whole chain swaps (g.swap(K)). A chain with K.web only
    renames two elements: the tiles wobble and nothing changes.
  - Tap a tile: its chains g.chainsThrough(u) light up one after another (each tap on the same tile shows the next);
    the SWAP button under the board swaps the one lit. This is the way to swap a chain of one tile.
  - Tap the "?" platform: a chain of g.good() lights up (a hint).
  - Drag empty space (or drag with the right button) to turn and tilt the island; pinch or scroll to zoom; two fingers (or
    the middle button) pan. The round button at the bottom turns the view back.
  - Win (g.won()): the platform takes g.free() with a burst, the island celebrates (tiles bounce in a wave out from the
    goal, a light show, confetti, a slow victory spin), then LAB.done() (the app shows its win screen). Inside the app
    nothing restarts after the win: taps, keys, undo and restart do nothing.
  Juice (SKIN-SPEC 14): a touched tile lifts and glows at once and its candidate chains light; a traced chain pulses in
  its two element colours with a rising tone per tile; a swap flips its tiles in a wave from the touched tile (45 ms
  apart, a pop each) and calls LAB.at with that tile's screen point; rim tiles that change hop, the goal bounces, an
  element leaving the rim flies out; a web swap or a dead tap wobbles. No instruction text: a ghost finger shows the
  first drag until the first touch, and a glowing SWAP button (--sk-ctl tokens) appears when a chain is lit.
  Easter egg 'barrel-roll': spin the island a full turn in one drag: it hops with a sparkle ring, LAB.egg('barrel-roll', 80).
  Undo and restart sit in the bottom corners. If WebGL or three.js is not available the page tells the app (an error message),
  which then plays the level on the island board.
-->

  // ---------- input ----------

  ov.addEventListener('pointerdown', e => {
    audio(); const b = rect(), x = e.clientX - b.left, y = e.clientY - b.top;

      cand = new Set([u]); g.chainsThrough(u).forEach(K => { if (!K.web) K.vs.forEach(w => cand.add(w)); });   // its candidate chains light
      T[u].light = 1.75; T[u].lift = Math.max(T[u].lift, .14); pluck(pitch(0), 0, .04); dirty(400); paintNow();

  ov.addEventListener('pointermove', e => {

    if (tapPt && Math.hypot(x - tapPt.x, y - tapPt.y) > 9) tapPt = null;     // moved: no longer a tap
