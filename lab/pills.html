<!doctype html>
<!--
  PILLS (lab front end, round 3: a retro capsule-flipper in the spirit of Dr. Mario / Puyo Puyo)

  What the player sees: a dark glass bottle (the playfield). Inside, chunky glossy junction blocks, each one kind
  (red circle, blue square, yellow triangle, green diamond: colour AND shape), sit on a tidy grid-ish layout. Every
  junction has one stubby arm per link, and every link carries a two-tone CAPSULE (a Dr. Mario pill) whose two
  halves show the kinds of the junctions at its ends. The three bottle walls are themselves junctions (long bars with
  arms reaching in); where two walls meet, a small pill sits in the corner. In the middle lives a purple virus with 5
  ports, each port a half-capsule plugged into a neighbouring junction. Goal cue: "Cure the virus: ports = 2 pairs + 1".
  Matching ports are bonded by a glowing line through the virus; the 5 ports always hold one pair (2+1+1+1), and the
  virus is cured when they make TWO pairs and a single (2+2+1). Then a cure capsule of the one kind that touches no
  port drops into the bottle, the virus pops, and that junction is born in its place. Tap to play again.

  Mapping (faithful; every action is exactly one g.swap(K) or nothing):
    junction / wall bar    = region u (the 3 walls are g.border), its kind = g.col[u]
    capsule between u, v   = graph edge (u, v); its halves show g.col[u], g.col[v]
    virus, its 5 ports     = the hole g.hole and its edges to g.rim; "2 pairs + 1" = g.won(); cure kind = g.free()
    TAP A CAPSULE (u, v)   = K = g.chainAt(u, g.col[v]): the {kind u, kind v} chain through both ends. The capsule
                             flips polarity (rotates 180 degrees, its halves trade places), which would clash with
                             every touching capsule of the same two kinds, so they flip too: a chain reaction that runs
                             through exactly the internal edges of K, one BFS layer per beat, with a rising combo
                             pitch and an xN combo pop. The junction blocks of K change kind as the wave passes.
    TAP A JUNCTION / WALL  = a little 3-way picker pops out (the 3 other kinds). Picking kind b does
                             K = g.chainAt(u, b): a lone junction (no b-arms touching it, a one-region chain) just spins
                             to b; otherwise it is the same chain reaction as tapping a u-b capsule. This is how the
                             single-region chains are reached.
    K.web === true         = g.swap is NOT called: the capsules start to flip, wobble, and spring back ("BOING").
    tap the virus/ports    = nothing (the virus giggles). Undo (g.undo) and restart (g.reset) are the two tiny buttons.
  Layout: the 3 walls are the outer face; their interior neighbours sit on a rounded-rectangle convex curve, the rest
  by a Tutte embedding relaxed with planarity checks and snapped to a lattice, so every capsule is a straight segment.
-->

    });
    if (!walls.has(p.u)) block(L.X[p.u][0], L.X[p.u][1], g.col[p.u], r, 0, 1.12 + 0.05 * Math.sin(t / 120));
    else { ctx.save(); ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t / 120); wallStroke(wallOf[p.u], '#ffffff', tw + 6); ctx.restore(); wallStroke(wallOf[p.u], KC[g.col[p.u]].c, tw); }
  }

  // ---------- input ----------
  function segDist(P, A, B) { const dx = B[0] - A[0], dy = B[1] - A[1], l2 = dx * dx + dy * dy || 1; const s = clamp(((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / l2, 0, 1); return Math.hypot(P[0] - A[0] - s * dx, P[1] - A[1] - s * dy); }
  function polyDist(P, pts) { let m = Infinity, q = null; for (let i = 1; i < pts.length; i++) { const d = segDist(P, pts[i - 1], pts[i]); if (d < m) { m = d; } } return m; }
  function hit(P) {
    let best = null, bd = 13;
    const consider = (d, o) => { if (d < bd) { bd = d; best = o; } };
    consider(Math.hypot(P[0] - L.X[g.hole][0], P[1] - L.X[g.hole][1]) - rv, { type: 'virus' });
    for (let u = 0; u < g.n; u++) if (!walls.has(u) && u !== g.hole) consider(Math.hypot(P[0] - L.X[u][0], P[1] - L.X[u][1]) - r - 3, { type: 'junction', u });
    E.forEach(e => consider(segDist(P, e.p0, e.p1) - pw / 2, { type: e.type === 'port' ? 'virus' : 'pill', e }));
    L.walls.forEach(b => consider(polyDist(P, wallOf[b]) - tw / 2, { type: 'wall', u: b }));
    return best;
  }
  function openPicker(u, at) { picker = { u, at, t0: now(), chips: chipsFor(u, at) }; sfx.click(); }
  function onDown(ev) {
    ev.preventDefault(); audio(); lastInput = now(); hintK = null;
    const P = [ev.clientX, ev.clientY];
    if (win) { if (win.phase === 'done') restart(); return; }
    if (picker) {
      const p = picker; picker = null;
      const ch = p.chips.find(c => Math.hypot(P[0] - c.x, P[1] - c.y) < c.cr * 1.35);
      if (ch) doMove(g.chainAt(p.u, ch.k), [p.u]);
      return;
    }
    const h = hit(P);
    if (!h) return;
    if (h.type === 'virus') { jwob[g.hole] = { t0: now(), dur: 600 }; sfx.giggle(); return; }
    if (h.type === 'pill') { sfx.click(); doMove(chainForPill(g, h.e.u, h.e.v), [h.e.u, h.e.v]); return; }
    if (h.type === 'junction') { openPicker(h.u, L.X[h.u]); return; }
    if (h.type === 'wall') {
      const C = [W / 2, H / 2], d = Math.hypot(C[0] - P[0], C[1] - P[1]) || 1;
      openPicker(h.u, [P[0] + (C[0] - P[0]) / d * tw, P[1] + (C[1] - P[1]) / d * tw]);
    }
  }
  function restart() {
    finalize(); const old = g.col.slice(); win = null; holeFilled = false; picker = null; undoB.disabled = false;
    g.reset(); transition(old, [], 'reset'); sfx.click();
  }
  cv.addEventListener('pointerdown', onDown);
  undoB.addEventListener('pointerdown', ev => { ev.stopPropagation(); audio(); lastInput = now(); });
  undoB.addEventListener('click', () => {
    if (win) return; picker = null;
    if (!g.history.length) { sfx.nope(); shake = RM ? 0 : 3; return; }
    finalize(); const old = g.col.slice(); g.undo(); transition(old, [], 'undo');
  });
  againB.addEventListener('pointerdown', ev => { ev.stopPropagation(); audio(); lastInput = now(); });
  againB.addEventListener('click', () => { if (!win && !g.history.length) { sfx.nope(); return; } restart(); });
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { picker = null; layout(); }, 80); });
  layout();
  if (document.fonts && document.fonts.load) document.fonts.load(`12px ${PIX}`).catch(() => {});
  window.__pills = { g, hit: P => hit(P), layout: () => L, E: () => E, tap: (x, y) => onDown({ preventDefault() {}, clientX: x, clientY: y }), state: () => ({ win: win && win.phase, holeFilled, won: g.won(), free: g.free(), moves: g.moves }) };
  requestAnimationFrame(draw);
})();
